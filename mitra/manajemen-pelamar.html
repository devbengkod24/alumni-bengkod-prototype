<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Pelamar | Mitra Bengkel Koding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/store.js"></script>
  <script src="assets/js/mitra.js"></script>
  <script src="../assets/js/page-skeleton.js"></script>
  <script src="../assets/js/main.js"></script>
</head>
<body class="bg-white text-neutral1 antialiased font-sans">
<main data-title="Manajemen Pelamar">

  <div>
    <h2 class="text-2xl font-semibold text-neutral1">Manajemen Pelamar</h2>
    <p class="text-sm text-neutral2 mt-1">Tinjau lamaran alumni untuk lowongan perusahaan Anda, evaluasi kandidat, dan kelola proses seleksinya.</p>
  </div>

  <section id="stats" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3" aria-label="Ringkasan statistik pelamar"></section>

  <section class="card p-4 sm:p-5">
    <div class="flex flex-col lg:flex-row gap-3">
      <div class="relative flex-1">
        <i data-lucide="search" class="w-4 h-4 text-neutral3 absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input id="q" type="search" class="input !pl-9" placeholder="Cari nama alumni atau NIM" aria-label="Cari pelamar">
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-3 lg:flex gap-2.5">
        <select id="f-lowongan" class="input lg:w-72" aria-label="Filter lowongan"><option value="">Semua lowongan</option></select>
        <select id="f-status" class="input lg:w-44" aria-label="Filter status"><option value="">Semua status</option></select>
        <button id="btn-reset" type="button" class="btn-outline whitespace-nowrap"><i data-lucide="rotate-ccw" class="w-4 h-4"></i> Reset Filter</button>
      </div>
    </div>
  </section>

  <section class="bg-white rounded-xl border border-neutral4 elevation2 overflow-hidden">
    <div class="p-4 sm:p-5 border-b border-neutral4">
      <h3 class="font-semibold text-neutral1 flex items-center gap-2">Daftar Pelamar <span id="badge-total" class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-primary5 text-primary1"></span></h3>
      <p id="company-subtext" class="text-xs text-neutral3 mt-0.5">Lamaran alumni untuk lowongan kerja dan magang di perusahaan Anda.</p>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full min-w-[760px]">
        <thead><tr>
          <th class="th">Alumni / Kandidat</th>
          <th class="th">Posisi Dilamar</th>
          <th class="th">Tanggal Melamar</th>
          <th class="th">Status</th>
          <th class="th text-right">Aksi</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="flex flex-col sm:flex-row items-center justify-between gap-3 px-4 sm:px-5 py-4 border-t border-neutral4">
      <p id="page-info" class="text-xs text-neutral3"></p>
      <nav id="pagination" class="flex flex-wrap items-center justify-center gap-1.5" aria-label="Halaman daftar pelamar"></nav>
    </div>
  </section>

</main>

<script>
  const PER_PAGE = 6;
  const semua = gabungPelamar(getPelamar());
  let page = 1;

  if (document.getElementById('company-subtext') && MITRA.profil && MITRA.profil.nama_perusahaan) {
    document.getElementById('company-subtext').textContent = `Lamaran alumni untuk lowongan kerja dan magang di ${MITRA.profil.nama_perusahaan}.`;
  }

  const jumlah = s => semua.filter(p => p.status === s).length;
  document.getElementById('stats').innerHTML = [
    { label: 'Total Pelamar', value: semua.length, icon: 'users', bg: 'linear-gradient(135deg,#1e3a8a 0%,#2563eb 100%)', accent: '#BFDBFE', subtext: 'Total kandidat', statusKey: '', span: 'col-span-2 sm:col-span-1' },
    { label: 'Pelamar Baru', value: jumlah('applied'), icon: 'user-plus', bg: 'linear-gradient(135deg,#9a3412 0%,#ea580c 100%)', accent: '#FED7AA', subtext: 'Lamaran baru', statusKey: 'applied', span: '' },
    { label: 'Menunggu Review', value: jumlah('review'), icon: 'clock', bg: 'linear-gradient(135deg,#9f1239 0%,#e11d48 100%)', accent: '#FECDD3', subtext: 'Sedang ditinjau', statusKey: 'review', span: '' },
    { label: 'Tahap Interview', value: jumlah('interview'), icon: 'calendar-clock', bg: 'linear-gradient(135deg,#5b21b6 0%,#7c3aed 100%)', accent: '#C4B5FD', subtext: 'Wawancara', statusKey: 'interview', span: '' },
    { label: 'Diterima', value: jumlah('diterima'), icon: 'circle-check', bg: 'linear-gradient(135deg,#0f766e 0%,#0d9488 100%)', accent: '#99F6E4', subtext: 'Lolos seleksi', statusKey: 'diterima', span: '' },
  ].map(s => `
    <div role="button" tabindex="0" onclick="filterByStatus('${s.statusKey}')" onkeydown="if(event.key==='Enter'||event.key===' ')filterByStatus('${s.statusKey}')" class="relative rounded-2xl overflow-hidden p-3 sm:p-3.5 transition-all duration-200 hover:-translate-y-1 hover:shadow-xl flex items-center gap-2.5 sm:gap-3.5 group cursor-pointer ${s.span}" style="background: ${s.bg};" title="Klik untuk memfilter: ${s.label}">
      <span class="absolute -top-6 -right-6 w-20 h-20 rounded-full pointer-events-none" style="background: rgba(255,255,255,0.08);"></span>
      <span class="absolute top-6 -right-1 w-12 h-12 rounded-full pointer-events-none" style="background: rgba(255,255,255,0.05);"></span>
      <div class="relative z-10 w-9 h-9 sm:w-10 sm:h-10 rounded-xl flex-shrink-0 flex items-center justify-center text-white" style="background: rgba(255,255,255,0.18);">
        <i data-lucide="${s.icon}" class="w-4 h-4 sm:w-5 sm:h-5"></i>
      </div>
      <div class="relative z-10 flex-1 min-w-0">
        <p class="text-[9.5px] sm:text-[10px] font-semibold uppercase tracking-wider mb-0.5 truncate" style="color: ${s.accent};">${s.label}</p>
        <p class="text-[20px] sm:text-[22px] font-bold text-white leading-none">${s.value}</p>
        <p class="text-[9.5px] sm:text-[10px] mt-1 truncate" style="color: ${s.accent};">${s.subtext}</p>
      </div>
    </div>`).join('');

  function render() {
    const q = document.getElementById('q').value.trim().toLowerCase();
    const low = document.getElementById('f-lowongan').value;
    const st = document.getElementById('f-status').value;
    const list = semua.filter(p => {
      const matchLow = !low || String(p.lowongan_id) === String(low) || (p.lowongan && String(p.lowongan.id) === String(low));
      const matchSt = !st || p.status === st;
      const matchQ = `${p.alumni.nama} ${p.alumni.nim} ${p.lowongan.posisi}`.toLowerCase().includes(q);
      return matchLow && matchSt && matchQ;
    });

    const pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
    page = Math.min(page, pages);
    const start = (page - 1) * PER_PAGE;
    const shown = list.slice(start, start + PER_PAGE);

    document.getElementById('badge-total').textContent = `${list.length} Kandidat`;
    document.getElementById('rows').innerHTML = shown.map(rowHTML).join('')
      || '<tr><td colspan="5" class="td text-center text-neutral3 py-8">Tidak ada pelamar yang cocok.</td></tr>';
    document.getElementById('page-info').innerHTML = list.length
      ? `Menampilkan <strong class="text-neutral1">${start + 1}&ndash;${start + shown.length}</strong> dari <strong class="text-neutral1">${list.length}</strong> pelamar`
      : 'Menampilkan 0 pelamar';
    document.getElementById('pagination').innerHTML = paginationHTML(pages);
    refreshIcons();
  }

  function rowHTML(p) {
    const a = p.alumni;
    const isVerifiedAlumni = a.status_pekerjaan || a.izin_bagikan;
    return `<tr class="tr">
      <td class="td">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-primary5 text-primary1 flex items-center justify-center font-bold text-xs shrink-0">${esc(inisial(a.nama))}</div>
          <div class="min-w-0">
            <div class="font-medium flex items-center gap-1">${esc(a.nama)}${isVerifiedAlumni ? '<i data-lucide="badge-check" class="w-4 h-4 text-primary3 shrink-0" aria-label="Alumni Bengkel Koding terverifikasi"></i>' : ''}</div>
            <div class="text-xs text-neutral3">Alumni ${esc(a.tahun_lulus)} &bull; ${esc(a.divisi || 'Informatika')}</div>
          </div>
        </div>
      </td>
      <td class="td">
        <div class="font-medium">${esc(p.lowongan.posisi)}</div>
        <div class="text-xs text-neutral3">${esc(p.lowongan.kategori || 'Kerja')} &bull; ${esc(p.lowongan.tipe_kerja || 'Full Time')}</div>
      </td>
      <td class="td whitespace-nowrap">${fmtWaktu(p.tanggal)}</td>
      <td class="td">${badge(STATUS_PELAMAR[p.status])}</td>
      <td class="td">
        <div class="flex justify-end">
          <a href="detail-pelamar.html?id=${p.id}" class="btn-outline !py-1.5 flex items-center gap-1.5 text-xs font-semibold">
            <i data-lucide="eye" class="w-4 h-4"></i> Detail
          </a>
        </div>
      </td>
    </tr>`;
  }

  function paginationHTML(pages) {
    const btn = (label, target, active, disabled) => `<button type="button" ${disabled ? 'disabled' : `onclick="goPage(${target})"`}
      ${active ? 'aria-current="page"' : ''} ${typeof label === 'number' ? `aria-label="Halaman ${label}"` : ''}
      class="min-w-[2.25rem] h-9 px-3 rounded-lg border text-xs font-semibold transition-colors disabled:opacity-40 disabled:cursor-not-allowed ${active ? 'bg-primary1 border-primary1 text-white' : 'bg-white border-neutral4 text-neutral2 hover:bg-neutral5'}">${label}</button>`;
    return btn('Sebelumnya', page - 1, false, page === 1)
      + Array.from({ length: pages }, (_, i) => btn(i + 1, i + 1, i + 1 === page, false)).join('')
      + btn('Selanjutnya', page + 1, false, page === pages);
  }

  function goPage(n) {
    page = n;
    render();
  }

  const selLowongan = document.getElementById('f-lowongan');
  const selStatus = document.getElementById('f-status');

  lowonganPelamarMitra().forEach(l => {
    const count = semua.filter(p => p.lowongan_id === l.id || (p.lowongan && p.lowongan.id === l.id)).length;
    selLowongan.add(new Option(`${l.posisi} (${count})`, l.id));
  });

  Object.entries(STATUS_PELAMAR).forEach(([value, label]) => selStatus.add(new Option(label, value)));

  const filterBerubah = () => { page = 1; render(); };
  function filterByStatus(st) {
    if (selStatus) {
      selStatus.value = st;
      filterBerubah();
    }
  }
  document.getElementById('q').addEventListener('input', filterBerubah);
  selLowongan.addEventListener('change', filterBerubah);
  selStatus.addEventListener('change', filterBerubah);
  document.getElementById('btn-reset').addEventListener('click', () => {
    document.getElementById('q').value = '';
    selLowongan.value = '';
    selStatus.value = '';
    filterBerubah();
  });

  render();
</script>
</body>
</html>
