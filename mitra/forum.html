<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forum Diskusi | Portal Mitra Bengkel Koding</title>
  <meta name="description" content="Forum diskusi mitra dan alumni Bengkel Koding UDINUS.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="assets/js/mitra.js"></script>
  <script src="../assets/js/main.js"></script>
</head>
<body class="bg-neutral5 text-neutral1 antialiased font-sans">
<main data-title="Forum Diskusi">

  <div class="flex items-center justify-between">
    <p class="text-sm text-neutral2">Diskusi, berbagi pengalaman, dan berinteraksi dengan alumni dan mitra Bengkel Koding.</p>
    <button onclick="openModal('modal-buat-diskusi')" class="btn-primary">
      <i data-lucide="plus" class="w-4 h-4"></i> Buat Diskusi
    </button>
  </div>

  <!-- Search & Filter -->
  <section class="card">
    <div class="flex flex-col sm:flex-row gap-3">
      <div class="relative flex-1">
        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-neutral3"></i>
        <input id="search-forum" type="search" placeholder="Cari diskusi..." class="input pl-9">
      </div>
      <select id="filter-peran" class="input sm:w-40">
        <option value="">Semua Peran</option>
        <option>Mitra</option>
        <option>Alumni</option>
      </select>
    </div>
  </section>

  <!-- Forum List -->
  <section class="space-y-3" id="forum-list"></section>

  <div id="empty-state" class="hidden py-16 text-center card">
    <i data-lucide="message-square-off" class="w-12 h-12 mx-auto text-neutral4 mb-3"></i>
    <div class="text-neutral2 font-medium">Tidak ada diskusi ditemukan</div>
    <button onclick="openModal('modal-buat-diskusi')" class="btn-primary mt-4">Buat Diskusi Pertama</button>
  </div>

</main>

<!-- Modal Buat Diskusi -->
<div id="modal-buat-diskusi" data-modal-backdrop class="fixed inset-0 z-50 bg-neutral1/60 backdrop-blur-sm hidden items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-lg w-full p-6 elevation5">
    <div class="flex items-center justify-between mb-5">
      <h3 class="font-semibold text-lg text-neutral1">Buat Diskusi Baru</h3>
      <button onclick="closeModal('modal-buat-diskusi')" class="btn-icon"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <form id="form-diskusi" class="space-y-4" onsubmit="submitDiskusi(event)">
      <div>
        <label for="diskusi-judul" class="label">Judul Diskusi <span class="text-red2">*</span></label>
        <input type="text" id="diskusi-judul" class="input" placeholder="Topik yang ingin didiskusikan..." required>
      </div>
      <div>
        <label for="diskusi-isi" class="label">Isi Diskusi <span class="text-red2">*</span></label>
        <textarea id="diskusi-isi" class="input min-h-[120px] resize-none" placeholder="Jelaskan topik diskusi Anda secara detail..." rows="5" required></textarea>
      </div>
      <div>
        <label for="diskusi-tags" class="label">Tags</label>
        <input type="text" id="diskusi-tags" class="input" placeholder="Pisahkan dengan koma, contoh: Rekrutmen, Tips">
        <div class="text-xs text-neutral3 mt-1">Maksimal 3 tag</div>
      </div>
      <div class="flex gap-3 pt-2">
        <button type="button" onclick="closeModal('modal-buat-diskusi')" class="btn-outline flex-1">Batal</button>
        <button type="submit" class="btn-primary flex-1">
          <i data-lucide="send" class="w-4 h-4"></i> Kirim Diskusi
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Modal Detail Diskusi -->
<div id="modal-detail-diskusi" data-modal-backdrop class="fixed inset-0 z-50 bg-neutral1/60 backdrop-blur-sm hidden items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-2xl w-full elevation5 max-h-[90vh] overflow-y-auto">
    <div id="modal-detail-content" class="p-6"></div>
  </div>
</div>

<script>
const PERAN_COLORS = {
  'Mitra': 'bg-secondary3 text-yellow1 border-yellow2/30',
  'Alumni': 'bg-green3 text-green1 border-green2/30',
};

function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 60) return `${mins} menit lalu`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs} jam lalu`;
  return fmtDate(iso);
}

function renderForum(list) {
  const container = document.getElementById('forum-list');
  const empty = document.getElementById('empty-state');
  empty.classList.toggle('hidden', list.length > 0);
  container.innerHTML = list.map(f => `
    <article class="card hover:border-primary3 hover:elevation3 transition-all cursor-pointer group" onclick="openDetail(${f.id})">
      <div class="flex items-start gap-4">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-primary1 to-primary3 text-white flex items-center justify-center font-semibold text-sm shrink-0">
          ${f.penulis.split(' ').map(w=>w[0]).slice(0,2).join('')}
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex flex-wrap items-center gap-2 mb-1">
            <span class="text-sm font-semibold text-neutral1">${esc(f.penulis)}</span>
            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold border ${PERAN_COLORS[f.peran] || 'bg-neutral5 text-neutral2 border-neutral4'}">${esc(f.peran)}</span>
            <span class="text-xs text-neutral3">${timeAgo(f.waktu)}</span>
          </div>
          <h3 class="font-semibold text-neutral1 mb-1 group-hover:text-primary1 transition-colors">${esc(f.judul)}</h3>
          <p class="text-sm text-neutral2 line-clamp-2">${esc(f.isi)}</p>
          <div class="flex items-center gap-4 mt-3">
            <div class="flex flex-wrap gap-1">
              ${f.tags.map(t=>`<span class="px-2 py-0.5 bg-primary5 text-primary1 text-xs rounded-md">${esc(t)}</span>`).join('')}
            </div>
            <div class="flex items-center gap-1 text-xs text-neutral3 ml-auto shrink-0">
              <i data-lucide="message-circle" class="w-3.5 h-3.5"></i>
              <span>${f.komentar} komentar</span>
            </div>
          </div>
        </div>
      </div>
    </article>`).join('');
  refreshIcons();
}

function openDetail(id) {
  const f = MITRA.forum.find(x => x.id === id);
  if (!f) return;
  document.getElementById('modal-detail-content').innerHTML = `
    <div class="flex items-start justify-between gap-4 mb-5">
      <div>
        <div class="flex flex-wrap items-center gap-2 mb-2">
          <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold border ${PERAN_COLORS[f.peran] || 'bg-neutral5 text-neutral2 border-neutral4'}">${esc(f.peran)}</span>
          <span class="text-xs text-neutral3">${fmtDateTime(f.waktu)}</span>
        </div>
        <h3 class="font-bold text-lg text-neutral1">${esc(f.judul)}</h3>
      </div>
      <button onclick="closeModal('modal-detail-diskusi')" class="btn-icon shrink-0"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div class="flex items-center gap-3 mb-4 pb-4 border-b border-neutral4">
      <div class="w-10 h-10 rounded-full bg-gradient-to-br from-primary1 to-primary3 text-white flex items-center justify-center font-semibold text-sm shrink-0">
        ${f.penulis.split(' ').map(w=>w[0]).slice(0,2).join('')}
      </div>
      <div>
        <div class="text-sm font-semibold text-neutral1">${esc(f.penulis)}</div>
        <div class="text-xs text-neutral3">${esc(f.peran)}</div>
      </div>
    </div>
    <p class="text-sm text-neutral2 leading-relaxed mb-4">${esc(f.isi)}</p>
    <div class="flex flex-wrap gap-1 mb-5">
      ${f.tags.map(t=>`<span class="px-2.5 py-1 bg-primary5 text-primary1 text-xs rounded-lg font-medium">${esc(t)}</span>`).join('')}
    </div>
    <div class="border-t border-neutral4 pt-4">
      <div class="text-sm font-semibold text-neutral1 mb-3">${f.komentar} Komentar</div>
      <div class="bg-neutral5 rounded-xl p-4 text-sm text-neutral3 text-center">Komentar tersedia di versi lengkap aplikasi.</div>
      <div class="mt-3">
        <textarea placeholder="Tulis komentar Anda..." class="input resize-none" rows="3"></textarea>
        <button class="btn-primary mt-2 w-full" onclick="event.preventDefault();showToast('Komentar berhasil dikirim!','success')">
          <i data-lucide="send" class="w-4 h-4"></i> Kirim Komentar
        </button>
      </div>
    </div>`;
  openModal('modal-detail-diskusi');
  refreshIcons();
}

function submitDiskusi(e) {
  e.preventDefault();
  const judul = document.getElementById('diskusi-judul').value.trim();
  const isi = document.getElementById('diskusi-isi').value.trim();
  const tagsRaw = document.getElementById('diskusi-tags').value;
  if (!judul || !isi) return;
  const tags = tagsRaw.split(',').map(t=>t.trim()).filter(Boolean).slice(0,3);
  const newThread = {
    id: nextForumId(),
    judul, isi, tags,
    penulis: MITRA.profil.pic_nama || MITRA.profil.nama_perusahaan,
    peran: 'Mitra',
    waktu: new Date().toISOString(),
    komentar: 0,
  };
  MITRA.forum.unshift(newThread);
  saveForum();
  closeModal('modal-buat-diskusi');
  document.getElementById('form-diskusi').reset();
  showToast('Diskusi berhasil dibuat!', 'success');
  applyFilter();
}

let currentList = [...MITRA.forum];

function applyFilter() {
  const q = document.getElementById('search-forum').value.toLowerCase();
  const peran = document.getElementById('filter-peran').value;
  currentList = MITRA.forum.filter(f => {
    const matchQ = !q || f.judul.toLowerCase().includes(q) || f.isi.toLowerCase().includes(q) || f.penulis.toLowerCase().includes(q);
    const matchPeran = !peran || f.peran === peran;
    return matchQ && matchPeran;
  });
  renderForum(currentList);
}

document.addEventListener('DOMContentLoaded', () => {
  renderForum(MITRA.forum);
  document.getElementById('search-forum').addEventListener('input', applyFilter);
  document.getElementById('filter-peran').addEventListener('change', applyFilter);
});
</script>
</body>
</html>
