<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Pelamar | Mitra Bengkel Koding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/store.js"></script>
  <script src="assets/js/mitra.js"></script>
  <script src="../assets/js/main.js"></script>
</head>
<body class="bg-white text-neutral1 antialiased font-sans">
<main data-title="Detail Pelamar" data-nav="manajemen-pelamar.html">

  <a href="manajemen-pelamar.html" class="inline-flex items-center gap-1.5 text-sm font-medium text-neutral2 hover:text-primary1 transition-colors">
    <i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali ke Manajemen Pelamar
  </a>

  <div id="detail" class="space-y-6"></div>

</main>

<!-- Pratinjau dokumen lamaran -->
<div id="dokumen-modal" data-modal-backdrop class="modal-backdrop">
  <div class="modal max-w-2xl" role="dialog" aria-modal="true" aria-labelledby="dok-title">
    <div class="flex items-start justify-between gap-3 mb-4">
      <h3 id="dok-title" class="font-semibold text-base text-neutral1"></h3>
      <button type="button" onclick="closeModal('dokumen-modal')" class="btn-icon" aria-label="Tutup"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div id="dok-body"></div>
  </div>
</div>

<script>
  const TAHAP = ['applied', 'review', 'interview'];
  const CATATAN_DEFAULT = {
    applied: 'Status dikembalikan ke Applied.',
    review: 'Berkas lamaran sedang ditinjau oleh tim recruiter perusahaan.',
    interview: 'Kandidat dijadwalkan masuk ke tahap interview teknis dan user.',
    diterima: 'Selamat! Kandidat dinyatakan diterima untuk posisi ini.',
    ditolak: 'Kandidat belum memenuhi kualifikasi yang dibutuhkan perusahaan.'
  };

  const DOKUMEN = [
    { jenis: 'CV', ket: 'CV bawaan dari profil alumni Bengkel Koding', icon: 'file-text' },
    { jenis: 'Foto', ket: 'Foto profil resmi alumni', icon: 'image' },
  ];

  const id = Number(new URLSearchParams(location.search).get('id'));
  const pelamar = getPelamar();

  const cari = () => gabungPelamar(pelamar).find(p => p.id === id);
  const chips = skills => (skills || []).map(s => `<span class="px-2 py-0.5 rounded-full bg-primary5 text-primary1 text-xs font-medium">${esc(s)}</span>`).join(' ');
  const row = (label, value) => `<div><dt class="text-xs text-neutral3">${label}</dt><dd class="text-sm text-neutral1 font-medium break-words">${value || '-'}</dd></div>`;
  const kartu = (icon, title, body) => `<section class="card">
    <h3 class="flex items-center gap-2 font-semibold text-neutral1 mb-4"><i data-lucide="${icon}" class="w-4 h-4 text-primary1"></i>${title}</h3>${body}</section>`;

  function render() {
    const p = cari();
    const box = document.getElementById('detail');
    if (!p) {
      box.innerHTML = `<section class="card text-center py-12">
        <i data-lucide="user-x" class="w-10 h-10 mx-auto text-neutral3"></i>
        <h2 class="text-lg font-semibold text-neutral1 mt-3">Pelamar tidak ditemukan</h2>
        <p class="text-sm text-neutral3 mt-1">Data lamaran tidak ditemukan atau lowongan telah diperbarui.</p>
        <div class="mt-4">
          <a href="manajemen-pelamar.html" class="btn-primary inline-flex items-center gap-1.5 text-xs">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali ke Daftar
          </a>
        </div>
      </section>`;
      return refreshIcons();
    }

    const a = p.alumni;
    const l = p.lowongan;
    const final = !TAHAP.includes(p.status);
    const karir = esc(a.status_karir || a.status_pekerjaan || '-') + (a.nama_perusahaan && a.nama_perusahaan !== '-' ? ` Â· ${esc(a.nama_perusahaan)}` : '');

    const dokumen = DOKUMEN.map((d, i) => `
      <li class="flex items-center gap-3 p-3 rounded-lg border border-neutral4">
        <div class="w-9 h-9 rounded-lg bg-primary5 text-primary1 flex items-center justify-center shrink-0"><i data-lucide="${d.icon}" class="w-4 h-4"></i></div>
        <div class="min-w-0 flex-1">
          <div class="text-sm font-medium text-neutral1">${d.jenis}</div>
          <div class="text-xs text-neutral3 truncate">${d.ket}</div>
        </div>
        <button type="button" onclick="lihatDokumen(${i})" class="btn-outline !px-3 !py-1.5 shrink-0 text-xs font-semibold flex items-center gap-1.5">
          <i data-lucide="eye" class="w-4 h-4"></i> Lihat
        </button>
      </li>`).join('');

    const riwayat = [...(p.riwayat || [])].reverse().map(r => `
      <li class="relative pl-5">
        <span class="absolute -left-[7px] top-1.5 w-3 h-3 rounded-full bg-white border-2 border-primary3"></span>
        <div class="flex flex-wrap items-center gap-2">${badge(STATUS_PELAMAR[r.status] || r.status)}<span class="text-xs text-neutral3">${fmtWaktu(r.waktu)}</span></div>
        ${r.catatan ? `<p class="text-sm text-neutral2 mt-1 leading-relaxed">${esc(r.catatan)}</p>` : ''}
      </li>`).join('');

    box.innerHTML = `
      <section class="card flex flex-col sm:flex-row sm:items-center gap-4">
        <div class="w-14 h-14 rounded-full bg-primary5 text-primary1 flex items-center justify-center font-bold text-lg shrink-0">${esc(inisial(a.nama))}</div>
        <div class="min-w-0 flex-1">
          <h2 class="text-2xl font-semibold text-neutral1 flex flex-wrap items-center gap-2">${esc(a.nama)} ${badge(STATUS_PELAMAR[p.status])}</h2>
          <p class="text-sm text-neutral2 mt-1">NIM ${esc(a.nim)} Â· Alumni ${esc(a.tahun_lulus)} Â· ${esc(a.divisi || 'Informatika')}</p>
        </div>
        <div class="sm:text-right">
          <div class="text-sm font-semibold text-neutral1">${esc(l.posisi)}</div>
          <div class="text-xs text-neutral3 mt-0.5">Melamar ${fmtWaktu(p.tanggal)}</div>
        </div>
      </section>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
        <div class="lg:col-span-2 space-y-6">
          ${kartu('briefcase', 'Lowongan Dilamar', `<dl class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            ${row('Posisi', esc(l.posisi))}${row('Perusahaan', esc(l.nama_perusahaan || MITRA.profil.nama_perusahaan))}
            ${row('Kategori Lowongan', esc(l.kategori || 'Kerja'))}${row('Tipe Kerja', esc(l.tipe_kerja || 'Full Time'))}
            ${row('Tingkat Pengalaman', esc(l.pengalaman || 'Tidak Ditentukan'))}${row('Masa Berlaku', fmtDate(l.masa_berlaku))}
            ${row('Lokasi Penempatan', esc(l.lokasi || 'Semarang'))}${row('Tanggal Melamar', fmtWaktu(p.tanggal))}
          </dl>`)}

          ${kartu('user', 'Profil Pelamar', `<dl class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            ${row('NIM', esc(a.nim))}${row('Tahun Lulus', esc(a.tahun_lulus))}
            ${row('Divisi / Keahlian Utama', esc(a.divisi || 'Informatika'))}${row('IPK', a.ipk ? a.ipk.toFixed(2) : '-')}
            <div class="sm:col-span-2">${row('Status Karir Saat Ini', karir)}</div>
          </dl>
          <div class="mt-4"><div class="text-xs text-neutral3 mb-1.5 font-medium">Keahlian &amp; Kompetensi</div><div class="flex flex-wrap gap-1.5">${chips(a.skill)}</div></div>`)}

          ${kartu('contact', 'Kontak Pelamar', `<dl class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            ${row('Email', `<a href="mailto:${esc(a.email)}" class="text-primary2 hover:underline">${esc(a.email)}</a>`)}
            ${row('Telepon / WhatsApp', p.telepon ? `<a href="tel:${esc(p.telepon)}" class="text-primary2 hover:underline">${esc(p.telepon)}</a>` : '')}
            ${row('Kota Domisili', esc(a.kota_domisili || 'Semarang'))}
          </dl>`)}

          ${kartu('folder-open', 'Dokumen Lamaran', `<ul class="space-y-2">${dokumen}</ul>`)}
        </div>

        <div class="space-y-6 lg:sticky lg:top-20">
          ${kartu('history', 'Riwayat Status Seleksi', `<ol class="relative border-l-2 border-neutral4 ml-1.5 space-y-4">${riwayat}</ol>`)}

          ${kartu('sliders-horizontal', 'Ubah Status Pelamar', `<div class="space-y-3">
            <div>
              <label for="d-status" class="label">Tahap Seleksi</label>
              <select id="d-status" class="input">
                ${final ? `<option value="" selected disabled>${STATUS_PELAMAR[p.status]} (Hasil Akhir)</option>` : ''}
                ${TAHAP.map(s => `<option value="${s}" ${s === p.status ? 'selected' : ''}>${STATUS_PELAMAR[s]}</option>`).join('')}
              </select>
            </div>
            <div>
              <label for="d-catatan" class="label">Catatan Tambahan (opsional)</label>
              <textarea id="d-catatan" rows="3" class="input resize-none" placeholder="Tuliskan catatan evaluasi, jadwal interview, atau instruksi selanjutnya..."></textarea>
            </div>
            <button type="button" onclick="simpanTahap()" class="btn-primary w-full text-xs font-semibold py-2.5">
              Simpan Status
            </button>
            <div class="pt-3 border-t border-neutral4">
              <p class="label mb-2">Keputusan Akhir</p>
              <div class="grid grid-cols-2 gap-2">
                <button type="button" onclick="putuskan('ditolak')" class="btn-danger text-xs font-semibold py-2 flex items-center justify-center gap-1.5" ${p.status === 'ditolak' ? 'disabled' : ''}>
                  <i data-lucide="circle-x" class="w-4 h-4"></i> Tolak
                </button>
                <button type="button" onclick="putuskan('diterima')" class="btn-success text-xs font-semibold py-2 flex items-center justify-center gap-1.5" ${p.status === 'diterima' ? 'disabled' : ''}>
                  <i data-lucide="circle-check" class="w-4 h-4"></i> Terima
                </button>
              </div>
            </div>
          </div>`)}
        </div>
      </div>`;

    refreshIcons();
  }

  function lihatDokumen(i) {
    const p = cari();
    if (!p) return;
    const d = DOKUMEN[i];
    const a = p.alumni;
    const l = p.lowongan;

    // Log CV access ke audit log mitra
    if (d.jenis === 'CV' && typeof logCvAccess === 'function') {
      logCvAccess(a.id, a.nama, 'Melihat CV Pelamar', { nim: a.nim, posisi: l.posisi });
    }

    document.getElementById('dok-title').textContent = `${d.jenis} Â· ${a.nama}`;
    let body;
    if (d.jenis === 'CV') {
      const kerja = a.jabatan && a.jabatan !== '-' ? `${esc(a.jabatan)} di ${esc(a.nama_perusahaan)}` : esc(a.status_karir || a.status_pekerjaan || '-');
      const sec = (title, html) => `<div class="pt-4 border-t border-neutral4"><h4 class="text-xs font-semibold text-neutral3 uppercase tracking-wider mb-1.5">${title}</h4>${html}</div>`;
      body = `<div class="space-y-4 text-sm text-neutral1">
        <div>
          <div class="text-xl font-semibold">${esc(a.nama)}</div>
          <div class="text-xs text-neutral2 mt-1">${esc(a.email)} Â· ${esc(p.telepon || '-')} Â· ${esc(a.kota_domisili || 'Semarang')}</div>
          ${a.bio ? `<p class="text-xs text-neutral2 mt-2 italic leading-relaxed">"${esc(a.bio)}"</p>` : ''}
        </div>
        ${sec('Pendidikan', `<div class="font-medium">${esc(a.pendidikan || 'S1 Teknik Informatika, Universitas Dian Nuswantoro')}</div>
          <div class="text-xs text-neutral3 mt-0.5">NIM ${esc(a.nim)} Â· Lulus ${esc(a.tahun_lulus)} Â· IPK ${a.ipk ? a.ipk.toFixed(2) : '-'}</div>`)}
        ${sec('Pengalaman & Riwayat Karir', `<div class="font-medium">${kerja}</div><div class="text-xs text-neutral3 mt-0.5">${esc(a.pengalaman || 'Alumni Bengkel Koding UDINUS')}</div>`)}
        ${a.proyek ? sec('Proyek Terkait', `<div class="text-xs text-neutral2 leading-relaxed">${esc(a.proyek)}</div>`) : ''}
        ${sec('Keahlian & Penguasaan Teknologi', `<div class="flex flex-wrap gap-1.5">${chips(a.skill)}</div>`)}
      </div>`;
    } else {
      body = `<figure class="flex flex-col items-center gap-3 py-4">
        <div class="w-48 h-60 rounded-xl bg-gradient-to-br from-primary5 to-neutral5 border border-neutral4 flex items-center justify-center text-primary1 shadow-sm">
          <i data-lucide="user" class="w-24 h-24"></i>
        </div>
        <figcaption class="text-xs text-neutral3 text-center">Foto profil resmi kandidat ${esc(a.nama)} (${esc(a.nim)})</figcaption>
      </figure>`;
    }

    document.getElementById('dok-body').innerHTML = body;
    openModal('dokumen-modal');
    refreshIcons();
  }

  function simpanTahap() {
    const s = document.getElementById('d-status').value;
    const curr = cari();
    if (!s || s === curr.status) return showToast('Pilih tahap seleksi yang berbeda dari status saat ini.', 'error');
    ubahStatus(s);
  }

  function putuskan(s) {
    const p = cari();
    if (!p) return;
    const label = STATUS_PELAMAR[s] || s;
    confirmAction({
      title: s === 'diterima' ? 'Terima Kandidat?' : 'Tolak Kandidat?',
      message: `${p.alumni.nama} akan dinyatakan ${label.toLowerCase()} untuk lowongan ${p.lowongan.posisi}. Catatan evaluasi yang diisi akan tersimpan dalam riwayat seleksi.`,
      okLabel: s === 'diterima' ? 'Ya, Terima' : 'Ya, Tolak',
      danger: s === 'ditolak',
    }, () => ubahStatus(s));
  }

  function ubahStatus(s) {
    const p = cari();
    if (!p) return;
    const catatan = document.getElementById('d-catatan').value.trim();
    const targetItem = pelamar.find(x => x.id === id);
    if (!targetItem) return;

    if (!targetItem.riwayat) targetItem.riwayat = [];
    targetItem.riwayat.push({
      status: s,
      waktu: new Date().toISOString(),
      catatan: catatan || CATATAN_DEFAULT[s] || `Status diubah ke ${STATUS_PELAMAR[s] || s}`
    });

    savePelamar(pelamar);
    audit('Ubah status pelamar', `${p.alumni.nama} (${p.lowongan.posisi}): ${STATUS_PELAMAR[s]}`);
    render();
    showToast(`Status ${p.alumni.nama} berhasil diubah menjadi ${STATUS_PELAMAR[s]}.`, 'success');
  }

  render();
</script>
</body>
</html>
