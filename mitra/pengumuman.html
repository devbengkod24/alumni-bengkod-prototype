<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengumuman | Portal Mitra Bengkel Koding</title>
  <meta name="description" content="Daftar pengumuman dari koordinator alumni Bengkel Koding untuk mitra perusahaan.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/store.js"></script>
  <script src="assets/js/mitra.js"></script>
  <script src="../assets/js/page-skeleton.js"></script>
  <script src="../assets/js/main.js"></script>
</head>
<body class="bg-white text-neutral1 antialiased font-sans">
<main data-title="Pengumuman">

  <!-- ── HEADER ── -->
  <div class="flex items-center justify-between pb-3 border-b border-gray-200">
    <div>
      <h1 class="text-2xl sm:text-3xl font-bold text-[#1E3A8A] tracking-tight">Pengumuman</h1>
      <p class="text-sm text-gray-500 mt-0.5">Informasi resmi dari koordinator Bengkel Koding</p>
    </div>
  </div>


  <!-- ── DAFTAR PENGUMUMAN (LANGSUNG JUDUL, TANGGAL & DESKRIPSI) ── -->
  <div class="space-y-4">
    <div id="pengumuman-list" class="space-y-4"></div>

    <!-- Empty state jika kosong -->
    <div id="empty-state" class="hidden bg-white rounded-xl border border-gray-200 p-12 text-center text-gray-400">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" class="mx-auto mb-3 text-gray-300" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 01-3.46 0"/>
      </svg>
      <p class="text-[15px] font-medium text-gray-500">Tidak ada pengumuman ditemukan</p>
    </div>
  </div>

</main>

<!-- Modal Detail Pengumuman (Backward-compatibility) -->
<div id="modal-pengumuman" data-modal-backdrop class="fixed inset-0 z-50 bg-neutral1/60 backdrop-blur-sm hidden items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-lg w-full p-6 elevation5">
    <div class="flex items-start justify-between gap-4 mb-4">
      <div id="modal-p-header" class="min-w-0"></div>
      <button onclick="closeModal('modal-pengumuman')" class="btn-icon shrink-0"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <p id="modal-p-isi" class="text-sm text-neutral2 leading-relaxed whitespace-pre-wrap"></p>
    <div class="mt-5 flex justify-end">
      <button onclick="closeModal('modal-pengumuman')" class="btn-primary">Tutup</button>
    </div>
  </div>
</div>

<script>
function formatAnnouncementDate(val) {
  if (!val) return '';
  if (isNaN(Date.parse(val)) && typeof val === 'string' && val.includes(' ')) return val;
  try {
    const d = new Date(val);
    if (!isNaN(d.getTime())) {
      return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
    }
  } catch {}
  return val;
}

function renderPengumuman(list) {
  const container = document.getElementById('pengumuman-list');
  const empty = document.getElementById('empty-state');
  if (!container || !empty) return;

  const items = list || [];
  empty.classList.toggle('hidden', items.length > 0);

  container.innerHTML = items.map((p) => {
    const title = p.judul || p.title || 'Pengumuman';
    const content = p.isi || p.content || '';
    const dateFormatted = formatAnnouncementDate(p.published_at || p.time);
    const target = p.target ? esc(p.target) : '';

    return `
      <div
        id="pengumuman-${p.id}"
        class="bg-white rounded-xl border border-gray-200/90 shadow-sm overflow-hidden transition-all hover:shadow-md hover:border-blue-200"
      >
        <div class="flex items-start gap-4 p-5">
          <!-- Icon lonceng (Biru #1E3A8A seragam dengan alumni) -->
          <div class="w-11 h-11 rounded-xl bg-[#1E3A8A] flex items-center justify-center flex-shrink-0 text-white shadow-xs">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 01-3.46 0"/>
            </svg>
          </div>

          <div class="flex-1 min-w-0">
            <!-- Judul -->
            <h2 class="text-[16px] sm:text-[17px] font-semibold text-gray-900 leading-snug">${esc(title)}</h2>
            <!-- Tanggal & Target -->
            <p class="text-[13px] text-gray-500 mt-1 flex items-center gap-2 flex-wrap">
              <span>${esc(dateFormatted)}</span>
              ${target ? `<span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium bg-gray-100 text-gray-600">${target}</span>` : ''}
            </p>
            <!-- Deskripsi Langsung -->
            <p class="text-[14px] sm:text-[15px] text-gray-700 mt-2.5 leading-relaxed whitespace-pre-line">${esc(content)}</p>
          </div>
        </div>
      </div>
    `;
  }).join('');

  if (window.lucide) window.lucide.createIcons();
}

function openPengumumanDetail(id) {
  const list = MITRA.pengumuman || [];
  const p = list.find(x => x.id === id);
  if (!p) return;
  const title = p.judul || p.title || '';
  const dateFormatted = formatAnnouncementDate(p.published_at || p.time);
  const oleh = p.oleh || p.author || 'Koordinator Alumni';

  document.getElementById('modal-p-header').innerHTML = `
    <div class="text-xs font-semibold text-primary3 mb-1">PENGUMUMAN</div>
    <h3 class="font-semibold text-lg text-neutral1">${esc(title)}</h3>
    <div class="flex flex-wrap gap-2 mt-2">
      ${p.target ? `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold border bg-gray-100 text-gray-700 border-gray-200">${esc(p.target)}</span>` : ''}
      <span class="text-xs text-neutral3">${esc(dateFormatted)} · Oleh: ${esc(oleh)}</span>
    </div>`;
  document.getElementById('modal-p-isi').textContent = p.isi || p.content || '';
  openModal('modal-pengumuman');
}

document.addEventListener('DOMContentLoaded', () => {
  renderPengumuman(MITRA.pengumuman);
});
</script>
</body>
</html>
