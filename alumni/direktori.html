<!DOCTYPE html>
<html lang="id" data-color-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direktori Rekan Alumni | Bengkel Koding UDINUS</title>
  <meta name="description" content="Pencarian dan jejaring sesama rekan alumni Bengkel Koding Universitas Dian Nuswantoro.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/alumni.js"></script>
  <script src="assets/js/alumni-data.js"></script>
</head>
<body>
<!-- Direktori Rekan Alumni Bengkel Koding UDINUS -->
<!-- Desain 100% persis Informasi Mitra pada menu Mitra dengan tombol oval outline seperti Gambar 1 -->
<main data-route="direktori">
  <div x-data="direktoriPage" class="w-full flex flex-col gap-6 py-2 pb-12 antialiased">
    
    <!-- Toast Notifikasi Ringkas -->
    <template x-if="toast">
      <div role="status" class="fixed bottom-6 right-6 z-[90] inline-flex items-center gap-2.5 h-12 px-6 rounded-full bg-gray-900 text-white text-[14px] font-semibold shadow-xl animate-fade-in">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
        <span x-text="toast"></span>
      </div>
    </template>

    <!-- ============================================================
        HEADER DIREKTORI ALUMNI (100% PERSIS INFORMASI MITRA)
    ============================================================ -->
    <div class="bg-white rounded-xl border border-gray-200/90 shadow-sm p-6 sm:p-7">
      <div>
        <h1 class="text-[28px] sm:text-[32px] font-bold text-gray-900 tracking-tight">
          Direktori Rekan Alumni
        </h1>
        <p class="text-[15px] text-gray-500 mt-1 font-normal">
          Jejaring sesama rekan alumni dan asisten laboratorium Bengkel Koding UDINUS.
        </p>
      </div>

      <!-- ============================================================
          PENCARIAN (KATA KUNCI & LOKASI) — PERSIS 100% MITRA
      ============================================================ -->
      <div class="mt-6 pt-5 border-t border-gray-100">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-center">
          <!-- Input Kata Kunci (Col 1-6) -->
          <div class="md:col-span-6 relative">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
              <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" />
            </svg>
            <input
              type="text"
              placeholder="Cari nama alumni, peran, bidang keahlian, atau deskripsi..."
              x-model="searchKeyword"
              class="w-full pl-11 pr-4 py-2.5 bg-white border border-gray-200 rounded-full text-[15px] text-gray-900 placeholder:text-gray-400 focus:outline-none focus:border-[#1E3A8A] focus:ring-2 focus:ring-[#1E3A8A]/10 transition-colors shadow-2xs"
            >
          </div>

          <!-- Input Kota (Col 7-10) -->
          <div class="md:col-span-4 relative">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="12" cy="10" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <input
              type="text"
              placeholder="Kota lokasi (Semarang, Jakarta, Kudus...)"
              x-model="searchLocation"
              class="w-full pl-11 pr-4 py-2.5 bg-white border border-gray-200 rounded-full text-[15px] text-gray-900 placeholder:text-gray-400 focus:outline-none focus:border-[#1E3A8A] focus:ring-2 focus:ring-[#1E3A8A]/10 transition-colors shadow-2xs"
            >
          </div>

          <!-- Reset Filter Button (Col 11-12) -->
          <div class="md:col-span-2">
            <button
              type="button"
              @click="searchKeyword = ''; searchLocation = '';"
              class="w-full py-2.5 px-4 border border-gray-200 hover:border-gray-300 rounded-full text-[14px] font-semibold text-gray-600 hover:text-[#1E3A8A] bg-white transition-colors cursor-pointer text-center shadow-2xs"
            >
              Reset Filter
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ============================================================
        DAFTAR KARTU ALUMNI (100% PERSIS INFORMASI MITRA KEMARIN)
    ============================================================ -->
    <div class="px-1 text-[14px] font-normal text-gray-500">
      <span>Menampilkan <span x-text="filteredAlumni.length"></span> rekan alumni</span>
    </div>

    <!-- Grid Kartu Alumni (Horizontal: Foto Profil di kiri, detail dan tombol di kanan mengikuti kolom teks tanpa garis pembatas) -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6" x-show="filteredAlumni.length > 0">
      <template x-for="alumni in filteredAlumni" :key="alumni.id">
        <div class="bg-white rounded-xl border border-gray-200/90 hover:border-blue-200 hover:shadow-md transition-all duration-200 p-6 flex flex-col justify-between group">
          
          <div class="flex items-start gap-4 sm:gap-5 h-full">
            <!-- Foto Profil / Avatar Alumni (Di Samping Kiri) -->
            <div class="shrink-0">
              <template x-if="alumni.avatarUrl">
                <img :src="alumni.avatarUrl" :alt="alumni.name"
                  class="w-16 h-16 sm:w-20 sm:h-20 rounded-full object-cover bg-white p-1 border border-gray-200 shadow-2xs">
              </template>
              <template x-if="!alumni.avatarUrl">
                <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-gradient-to-br from-[#1E3A8A] to-[#3B82F6] text-white font-extrabold text-base sm:text-lg flex items-center justify-center border border-gray-200 shadow-2xs tracking-wider"
                  x-text="(alumni.name || 'Alumni').substring(0, 2).toUpperCase()">
                </div>
              </template>
            </div>

            <!-- Informasi di Samping Kanan (Nama -> Bidang -> Alamat -> Tombol) -->
            <div class="flex-1 min-w-0 flex flex-col justify-between h-full space-y-3">
              <div class="space-y-1">
                <!-- 1. Nama Alumni (Bold 18px) -->
                <h3 class="text-[17px] sm:text-[18px] font-bold text-gray-900 group-hover:text-[#1E3A8A] transition-colors leading-snug">
                  <a :href="'detail.html?id=' + encodeURIComponent(alumni.id)" x-text="alumni.name"></a>
                </h3>

                <!-- 2. Posisi / Profesi / Bidang (Font 14-15px Medium Warna Biru) -->
                <p class="text-[14px] sm:text-[15px] font-medium text-[#1E3A8A] truncate" x-text="alumni.headline || alumni.jobTitle || 'Alumni Bengkel Koding'"></p>

                <!-- 3. Alamat / Domisili (Font 13px Text-Gray-500) -->
                <p class="text-[13px] text-gray-500 flex items-center gap-1.5 pt-0.5">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400 shrink-0">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z" />
                    <circle cx="12" cy="10" r="3" />
                  </svg>
                  <span class="leading-relaxed truncate" x-text="alumni.location || alumni.city || 'Semarang, Jawa Tengah'"></span>
                </p>
              </div>

              <!-- Tombol Aksi Tepat di Bawah: Ukuran Compact & Proporsional UI/UX -->
              <div class="pt-2">
                <a
                  :href="'detail.html?id=' + encodeURIComponent(alumni.id)"
                  class="inline-flex items-center justify-center px-4 py-1.5 rounded-full bg-white hover:bg-blue-50/50 border border-gray-300 hover:border-[#1E3A8A] text-[#1E3A8A] text-[13px] font-semibold transition-all cursor-pointer shadow-2xs"
                >
                  Lihat Profil Alumni
                </a>
              </div>
            </div>
          </div>

        </div>
      </template>
    </div>

    <!-- State Kosong jika Tidak Ada Hasil Filter -->
    <div x-show="filteredAlumni.length === 0" class="bg-white rounded-xl border border-gray-200/90 p-12 text-center shadow-sm">
      <div class="w-16 h-16 rounded-full bg-gray-100 text-gray-400 flex items-center justify-center mx-auto mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      <h3 class="font-bold text-gray-900 text-[18px]">Tidak Ada Rekan Alumni Ditemukan</h3>
      <p class="text-[14px] text-gray-500 max-w-md mx-auto mt-1 leading-relaxed">
        Alumni yang Anda cari dengan kata kunci "<span class="font-semibold text-gray-700" x-text="searchKeyword || searchLocation"></span>" tidak ditemukan dalam direktori.
      </p>
      <button
        type="button"
        @click="searchKeyword = ''; searchLocation = '';"
        class="mt-5 px-6 py-2.5 rounded-full border border-[#1E3A8A] text-[#1E3A8A] hover:bg-[#1E3A8A] hover:text-white text-[14px] font-bold transition-colors cursor-pointer shadow-xs"
      >
        Tampilkan Semua Alumni
      </button>
    </div>

  </div>
</main>

<script>
  document.addEventListener("alpine:init", () => {
    Alpine.data("direktoriPage", () => {
      const rawList = typeof ALUMNI_DIRECTORY !== "undefined" ? ALUMNI_DIRECTORY : [];
      
      return {
        toast: "",
        alumniList: rawList,
        searchKeyword: "",
        searchLocation: "",

        get filteredAlumni() {
          const kw = (this.searchKeyword || "").toLowerCase().trim();
          const loc = (this.searchLocation || "").toLowerCase().trim();

          return this.alumniList.filter((a) => {
            const nameMatch = (a.name || "").toLowerCase().includes(kw);
            const headMatch = (a.headline || a.jobTitle || "").toLowerCase().includes(kw);
            const aboutMatch = (a.about || "").toLowerCase().includes(kw);
            const passKw = !kw || (nameMatch || headMatch || aboutMatch);

            const locText = (a.location || a.city || "").toLowerCase();
            const passLoc = !loc || locText.includes(loc);

            return passKw && passLoc;
          });
        },

        setToast(msg) {
          this.toast = msg;
          setTimeout(() => (this.toast = ""), 2500);
        }
      };
    });
  });
</script>
</body>
</html>
