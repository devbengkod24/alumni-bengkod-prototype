        searchQuery: '',
        companySearch: '',
        selectedDegree: 'all', // 'all', 's1', 's2'
        selectedAlumniIds: [],
        selectAll: false,
        detailModalOpen: false,
        selectedAlumnus: null,

        alumniList: sampleAlumni,

        get filteredAlumni() {
          const q = this.searchQuery.trim().toLowerCase();
          const compQ = this.companySearch.trim().toLowerCase();

          return this.alumniList.filter(a => {
            // Filter S1 / S2
            if (this.selectedDegree === 's1' && a.degreeLevel !== 'S1') return false;
            if (this.selectedDegree === 's2' && a.degreeLevel !== 'S2') return false;

            // Filter Tempat Kerja / Perusahaan (ada searchnya)
            if (compQ && !a.company.toLowerCase().includes(compQ)) return false;

            // Filter Search Umum (Nama, Posisi, Alamat, Degree, Skills)
            if (q) {
              const haystack = [a.name, a.position, a.company, a.address, a.degreeTitle, (a.skills || []).join(' ')].join(' ').toLowerCase();
              if (!haystack.includes(q)) return false;
            }

            return true;
          });
        },

        get hasFilter() {
          return Boolean(this.searchQuery.trim() || this.companySearch.trim() || this.selectedDegree !== 'all');
        },

        resetFilter() {
          this.searchQuery = '';
          this.companySearch = '';
          this.selectedDegree = 'all';
          this.selectAll = false;
          this.selectedAlumniIds = [];
        },

        toggleSelectAll() {
          if (this.selectAll) {
            this.selectedAlumniIds = this.filteredAlumni.map(a => a.id);
          } else {
            this.selectedAlumniIds = [];
          }
        },

        openDetailModal(alumnus) {
          this.selectedAlumnus = alumnus;
          this.detailModalOpen = true;
        },

        closeDetailModal() {
          this.detailModalOpen = false;
          this.selectedAlumnus = null;
        }

<body class="h-full bg-[#EFF2F7] text-[#212224] antialiased selection:bg-[#3A5988] selection:text-white" x-data="bengkodDirektoriApp()">

      <main class="flex-1 p-6 lg:p-8 max-w-[1400px] w-full mx-auto space-y-6">

        <!-- 1. Header Judul & Subjudul -->
        <div>
          <h1 class="text-[26px] font-semibold text-[#0C1117] tracking-[-0.01em]">Direktori Rekan Alumni</h1>
          <p class="text-[13.5px] text-[#6B7280] mt-1 font-normal">
            Jelajahi dan hubungi jejaring profesional rekan alumni Bengkel Koding berdasarkan tempat kerja dan jenjang pendidikan.
          </p>
        </div>

        <!-- ========================================================
             2. TOOLBAR FILTER DI ATAS (Kerja di Mana + Search + Filter S1 & S2)
        ======================================================== -->
        <div class="bg-white border border-[#E3E4E9] rounded-[14px] p-4 sm:p-5 shadow-sm space-y-4">
          
          <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
            
            <!-- Baris Input Pencarian: 1. Nama/Posisi & 2. Kerja di Mana (Ada Searchnya) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 flex-1">
              
              <!-- Input 1: Search Nama Alumni / Keahlian -->
              <div class="relative">
                <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#91969C] pointer-events-none">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.3-4.3"/>
                  </svg>
                </span>
                <input type="text"
                       x-model="searchQuery"
                       placeholder="Cari nama alumni atau keahlian..."
                       class="w-full h-10 pl-10 pr-3 rounded-[8px] border border-[#E3E4E9] bg-[#F8FAFC] focus:bg-white text-[13.5px] text-[#212224] placeholder-[#91969C] focus:outline-none focus:border-[#3A5988] transition-colors">
              </div>

              <!-- Input 2: Filter Kerja di Mana (Ada Searchnya) -->
              <div class="relative">
                <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#91969C] pointer-events-none">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5m-4 0h4"/>
                  </svg>
                </span>
                <input type="text"
                       x-model="companySearch"
                       placeholder="Kerja di mana? (Cari perusahaan...)"
                       class="w-full h-10 pl-10 pr-8 rounded-[8px] border border-[#E3E4E9] bg-[#F8FAFC] focus:bg-white text-[13.5px] text-[#212224] placeholder-[#91969C] focus:outline-none focus:border-[#3A5988] transition-colors">
                <template x-if="companySearch">
                  <button type="button" @click="companySearch = ''" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[#91969C] hover:text-[#0C1117] text-xs">✕</button>
                </template>
              </div>

            </div>

            <!-- Filter S1 dan S2 (Segmented Buttons) & Reset -->
            <div class="flex items-center gap-3 shrink-0">
              <span class="text-[13px] text-[#6B7280] font-medium hidden sm:inline">Jenjang:</span>
              <div class="bg-[#F4F5F7] p-1 rounded-[10px] inline-flex items-center gap-1 text-[13px]">
                <button type="button"
                        @click="selectedDegree = 'all'"
                        class="h-8 px-3.5 rounded-[7px] font-medium transition-colors cursor-pointer"
                        :class="selectedDegree === 'all' ? 'bg-white text-[#0C1117] shadow-sm font-semibold' : 'text-[#6B7280] hover:text-[#0C1117]'">
                  Semua
                </button>
                <button type="button"
                        @click="selectedDegree = 's1'"
                        class="h-8 px-3.5 rounded-[7px] font-medium transition-colors cursor-pointer"
                        :class="selectedDegree === 's1' ? 'bg-white text-[#0C1117] shadow-sm font-semibold' : 'text-[#6B7280] hover:text-[#0C1117]'">
                  S1
                </button>
                <button type="button"
                        @click="selectedDegree = 's2'"
                        class="h-8 px-3.5 rounded-[7px] font-medium transition-colors cursor-pointer"
                        :class="selectedDegree === 's2' ? 'bg-white text-[#0C1117] shadow-sm font-semibold' : 'text-[#6B7280] hover:text-[#0C1117]'">
                  S2 (Studi Lanjut)
                </button>
              </div>

              <template x-if="hasFilter">
                <button type="button" @click="resetFilter()" class="text-[13px] text-[#326ECE] hover:underline font-medium cursor-pointer whitespace-nowrap pl-1">
                  Reset
                </button>
              </template>
            </div>

        </div>

        <!-- ========================================================
             3. TABEL DIREKTORI ALUMNI (PERSIS LAYOUT TALENTFLY PEOPLE SEARCH)
        ======================================================== -->
        <div class="bg-white border border-[#E3E4E9] rounded-[14px] shadow-sm overflow-hidden">
          
          <!-- Header Bar: People list title & bulk count -->
          <div class="px-6 py-4 border-b border-[#E3E4E9] flex items-center justify-between bg-white">
            <div class="flex items-center gap-2.5">
              <h2 class="text-[17px] font-bold text-[#0C1117] tracking-[-0.01em]">People list</h2>
              <span class="text-[12px] text-[#6B7280] font-normal" x-text="'(' + filteredAlumni.length + ' rekan)'"></span>
            </div>
            <div class="text-[13px] text-[#6B7280]" x-show="selectedAlumniIds.length > 0">
              <span class="font-medium text-[#3A5988]" x-text="selectedAlumniIds.length"></span> alumni dipilih
            </div>
          </div>

          <!-- Table Container with Horizontal Scroll -->
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="border-b border-[#E3E4E9] bg-white text-[13px] font-medium text-[#6B7280]">
                  <th class="py-3.5 pl-6 pr-3 w-12">
                    <input type="checkbox"
                           x-model="selectAll"
                           @change="toggleSelectAll()"
                           class="w-4 h-4 rounded border-[#CBD5E1] text-[#3A5988] focus:ring-[#3A5988] cursor-pointer">
                  </th>
                  <th class="py-3.5 px-4 font-medium min-w-[240px]">Name</th>
                  <th class="py-3.5 px-4 font-medium min-w-[200px]">Address</th>
                  <th class="py-3.5 px-4 font-medium min-w-[160px]">Job Position</th>
                  <th class="py-3.5 px-4 font-medium min-w-[170px]">Tempat Kerja</th>
                  <th class="py-3.5 pr-6 pl-4 font-medium text-right min-w-[120px]">Aksi</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-[#E3E4E9] text-[13.5px]">
                <template x-for="item in filteredAlumni" :key="item.id">
                  <tr class="hover:bg-[#F9FAFB] transition-colors group cursor-pointer"
                      @click="openDetailModal(item)">
                    
                    <!-- Checkbox -->
                    <td class="py-4 pl-6 pr-3" @click.stop>
                      <input type="checkbox"
                             :value="item.id"
                             x-model="selectedAlumniIds"
                             class="w-4 h-4 rounded border-[#CBD5E1] text-[#3A5988] focus:ring-[#3A5988] cursor-pointer">
                    </td>

                    <!-- Name (Avatar + Name + Degree subtitle persis Talentfly) -->
                    <td class="py-4 px-4">
                      <div class="flex items-center gap-3">
                        <img :src="item.avatar" :alt="item.name" class="w-9 h-9 rounded-full object-cover shrink-0 border border-[#E3E4E9]">
                        <div class="min-w-0">
                          <div class="flex items-center gap-1.5">
                            <span class="font-semibold text-[#0C1117] group-hover:text-[#3A5988] transition-colors" x-text="item.name"></span>
                          </div>
                          <div class="text-[12px] text-[#6B7280] font-normal" x-text="item.degreeTitle"></div>
                        </div>
                      </div>
                    </td>

                    <!-- Address (Alamat / Domisili persis Talentfly) -->
                    <td class="py-4 px-4 text-[#374151] font-normal" x-text="item.address"></td>

                    <!-- Job Position (Soft Colored Badge persis Talentfly) -->
                    <td class="py-4 px-4">
                      <span class="inline-block px-2.5 py-1 rounded-[6px] text-[12px] font-medium"
                            :class="item.positionBadgeClass"
                            x-text="item.position"></span>
                    </td>

                    <!-- Tempat Kerja (Perusahaan persis kolom University di Talentfly) -->
                    <td class="py-4 px-4 font-medium text-[#212224]" x-text="item.company"></td>

                    <!-- Action: View details persis Talentfly -->
                    <td class="py-4 pr-6 pl-4 text-right">
                      <button type="button"
                              @click.stop="openDetailModal(item)"
                              class="text-[13px] font-medium text-[#3A5988] hover:text-[#1F365A] hover:underline cursor-pointer">
                        View details
                      </button>
                    </td>

                  </tr>
                </template>

                <!-- Empty State -->
                <template x-if="filteredAlumni.length === 0">
                  <tr>
                    <td colspan="6" class="py-12 text-center text-[#6B7280]">
                      <div class="space-y-2">
                        <p class="text-[15px] font-semibold text-[#0C1117]">Tidak ada alumni yang sesuai</p>
                        <p class="text-[13px]">Coba ubah kata kunci pencarian tempat kerja atau reset filter.</p>
                        <button type="button" @click="resetFilter()" class="mt-2 px-4 py-1.5 rounded-full border border-[#E3E4E9] bg-white text-[13px] font-medium text-[#3A5988] hover:bg-[#F4F5F7]">
                          Reset Filter
                        </button>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <!-- Table Footer -->
          <div class="px-6 py-3.5 border-t border-[#E3E4E9] bg-[#FAFBFC] flex items-center justify-between text-[12.5px] text-[#6B7280]">
            <span>Menampilkan <strong class="text-[#0C1117]" x-text="filteredAlumni.length"></strong> dari <span x-text="alumniList.length"></span> alumni</span>
            <div class="flex items-center gap-1">
              <button type="button" disabled class="px-2.5 py-1 rounded border border-[#E3E4E9] bg-white text-[#91969C] opacity-60 cursor-not-allowed">Sebelumnya</button>
              <span class="px-3 py-1 font-semibold text-[#0C1117]">1</span>
              <button type="button" disabled class="px-2.5 py-1 rounded border border-[#E3E4E9] bg-white text-[#91969C] opacity-60 cursor-not-allowed">Berikutnya</button>
            </div>
          </div>

        </div>

      </main>

  <!-- ========================================================
       MODAL: DETAIL PROFIL ALUMNI (UKURAN SAMA PERSIS DENGAN LIHAT DETAIL: 840px)
  ======================================================== -->
  <template x-if="detailModalOpen && selectedAlumnus">
    <div class="fixed inset-0 z-[120] flex items-center justify-center p-4 max-sm:p-0 max-sm:items-end bg-[#0C1117]/50 backdrop-blur-[2px]"
         @click.self="closeDetailModal()"
         @keydown.window.escape="closeDetailModal()">
      <div class="w-full max-w-[840px] max-h-[88vh] max-sm:max-h-[92vh] max-sm:h-[92vh] bg-white rounded-[20px] max-sm:rounded-t-[20px] max-sm:rounded-b-none border border-[#E3E4E9] shadow-2xl overflow-hidden flex flex-col">
        
        <!-- Header 72px -->
        <header class="h-[72px] px-6 lg:px-8 border-b border-[#E3E4E9] flex items-center justify-between shrink-0 bg-white">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-[#E2F1F9] text-[#3A5988] flex items-center justify-center shrink-0">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <div>
              <span class="text-[17px] font-semibold text-[#0C1117] tracking-[-0.01em]">Profil Rekan Alumni</span>
              <p class="text-[12px] text-[#6B7280]">Informasi karir, kontak, dan keahlian alumni</p>
            </div>
          </div>
          <button type="button"
                  @click="closeDetailModal()"
                  class="w-10 h-10 rounded-full bg-[#F4F5F7] hover:bg-[#E5E9EC] text-[#0C1117] flex items-center justify-center transition-colors cursor-pointer shrink-0" title="Tutup">✕</button>
        </header>

        <!-- Modal Body Scrollable -->
        <div class="p-6 lg:p-8 space-y-6 overflow-y-auto flex-1">
          
          <!-- Profile Header -->
          <div class="flex items-start gap-4">
            <img :src="selectedAlumnus.avatar" :alt="selectedAlumnus.name" class="w-16 h-16 rounded-full object-cover border-2 border-[#E2F1F9] shrink-0">
            <div class="space-y-1 min-w-0">
              <div class="flex items-center gap-2">
                <h3 class="text-[18px] font-bold text-[#0C1117]" x-text="selectedAlumnus.name"></h3>
              </div>
              <p class="text-[14px] text-[#374151] font-medium" x-text="selectedAlumnus.position + ' @ ' + selectedAlumnus.company"></p>
              <div class="flex items-center gap-2 text-[12.5px] text-[#6B7280]">
                <span x-text="selectedAlumnus.address"></span>
                <span>·</span>
                <span class="font-medium text-[#3A5988]" x-text="'Batch ' + selectedAlumnus.batch"></span>
              </div>
            </div>
          </div>

          <!-- Bio -->
          <div class="p-4 rounded-[12px] bg-[#F8FAFC] border border-[#E3E4E9] text-[13.5px] text-[#374151] leading-relaxed" x-text="selectedAlumnus.bio"></div>

          <!-- Info Grid: Jenjang & Tempat Kerja -->
          <div class="grid grid-cols-2 gap-3 text-[13px]">
            <div class="p-3.5 rounded-[10px] border border-[#E3E4E9] bg-white space-y-1">
              <div class="text-[#6B7280] text-[12px]">Jenjang Pendidikan</div>
              <div class="font-semibold text-[#0C1117] flex items-center gap-1.5">
                <span class="px-2 py-0.5 rounded text-[11px] font-bold"
                      :class="selectedAlumnus.degreeLevel === 'S2' ? 'bg-[#FDF0DD] text-[#B26A12]' : 'bg-[#E2F1F9] text-[#3A5A86]'"
                      x-text="selectedAlumnus.degreeLevel"></span>
                <span x-text="selectedAlumnus.degreeTitle"></span>
              </div>
            </div>
            <div class="p-3.5 rounded-[10px] border border-[#E3E4E9] bg-white space-y-1">
              <div class="text-[#6B7280] text-[12px]">Tempat Kerja Saat Ini</div>
              <div class="font-semibold text-[#0C1117]" x-text="selectedAlumnus.company"></div>
            </div>
          </div>

          <!-- Keahlian Utama -->
          <div class="space-y-2">
            <h4 class="text-[13.5px] font-semibold text-[#0C1117]">Keahlian Utama</h4>
            <div class="flex flex-wrap gap-1.5">
              <template x-for="sk in (selectedAlumnus.skills || [])" :key="sk">
                <span class="px-3 py-1 rounded-full bg-[#F4F5F7] border border-[#E3E4E9] text-[12.5px] font-medium text-[#374151]" x-text="sk"></span>
              </template>
            </div>
          </div>

          <!-- Kontak & Jejaring -->
          <div class="space-y-2 pt-2">
            <h4 class="text-[13.5px] font-semibold text-[#0C1117]">Kontak &amp; Tautan Profesional</h4>
            <div class="space-y-1.5 text-[13px]">
              <div class="flex items-center gap-2 text-[#374151]">
                <svg class="w-4 h-4 text-[#6B7280]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                <span x-text="selectedAlumnus.email"></span>
              </div>
              <div class="flex items-center gap-2 text-[#374151]">
                <svg class="w-4 h-4 text-[#6B7280]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2z"/><circle cx="4" cy="4" r="2"/></svg>
                <span x-text="selectedAlumnus.linkedin"></span>
              </div>
              <div class="flex items-center gap-2 text-[#374151]">
                <svg class="w-4 h-4 text-[#6B7280]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
                <span x-text="selectedAlumnus.github"></span>
              </div>
            </div>
          </div>

        </div>

        <!-- Modal Footer -->
        <footer class="h-16 px-6 border-t border-[#E3E4E9] flex items-center justify-between bg-white shrink-0">
          <button type="button"
                  @click="closeDetailModal()"
                  class="h-10 px-4 rounded-[8px] border border-[#E3E4E9] bg-white hover:bg-[#F4F5F7] text-[#374151] text-[13.5px] font-medium transition-colors">
            Tutup
          </button>
          <a :href="'mailto:' + selectedAlumnus.email"
             class="h-10 px-5 rounded-[8px] bg-[#3A5988] hover:bg-[#496DA8] text-white text-[13.5px] font-medium inline-flex items-center gap-2 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            <span>Hubungi Alumni</span>
          </a>
        </footer>

      </div>
    </div>
  </template>

  <script>mountAlumniPortal(document.querySelector('main'));</script>
</body>
</html>
