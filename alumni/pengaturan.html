<!DOCTYPE html>
<html lang="id" data-color-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengaturan Akun | Bengkel Koding UDINUS</title>
  <meta name="description" content="Informasi akun dan ganti password alumni Bengkel Koding">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/page-skeleton.js"></script>
  <script src="assets/js/data.js?v=10"></script>
  <script src="assets/js/alumni.js"></script>
  <script src="assets/js/alumni-data.js"></script>
  <script src="assets/js/alumni-profile-data.js"></script>
  <script>
    // Halaman akun butuh sesi login; tanpa sesi kembali ke halaman masuk
    if (!DB.akun.aktif()) location.replace('login.html');
  </script>
</head>
<body>
<main data-route="pengaturan">
  <div x-data="pengaturanPage" class="w-full flex flex-col gap-6 py-2 pb-12 antialiased">

    <template x-if="toast">
      <div role="status" class="fixed bottom-6 left-4 right-4 sm:left-auto sm:right-6 z-[90] bg-gray-900 text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 text-[14px]">
        <span class="w-2 h-2 rounded-full bg-green2 shrink-0"></span>
        <span x-text="toast"></span>
      </div>
    </template>

    <div>
      <h1 class="text-2xl sm:text-3xl font-bold text-primary1 tracking-tight">Pengaturan Akun</h1>
      <p class="text-sm text-neutral2 mt-1">Kelola informasi login dan keamanan akun Anda.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_minmax(0,2fr)] gap-6">

      <!-- Kartu akun (read-only); tinggi ikut kartu password, tombol menempel di bawah -->
      <section class="bg-white rounded-xl border border-neutral4 shadow-sm overflow-hidden flex flex-col">
        <div class="h-20 bg-gradient-to-br from-primary1 via-primary2 to-primary3"></div>
        <div class="px-5 sm:px-6 pb-6 -mt-10 flex-1 flex flex-col">
          <img :src="profil.avatarUrl" alt="" class="w-20 h-20 rounded-full border-4 border-white bg-primary5 object-cover shadow-sm">
          <h2 class="mt-3 text-lg font-bold text-neutral1 break-words" x-text="profil.name"></h2>
          <p class="text-sm text-neutral2 mt-0.5 line-clamp-2" x-text="profil.headline"></p>
          <span class="self-start mt-2 px-2.5 py-0.5 rounded-full bg-primary5 text-primary1 text-xs font-semibold" x-text="'Alumni · Angkatan ' + profil.gradYear"></span>

          <dl class="mt-4 pt-4 border-t border-neutral4 space-y-2.5 text-sm">
            <div class="flex items-center gap-2.5 min-w-0">
              <dt class="text-neutral3 shrink-0" title="Email">
                <span class="sr-only">Email</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              </dt>
              <dd class="font-medium text-neutral1 break-all" x-text="profil.email"></dd>
            </div>
            <template x-if="profil.nim">
              <div class="flex items-center gap-2.5 min-w-0">
                <dt class="text-neutral3 shrink-0" title="NIM">
                  <span class="sr-only">NIM</span>
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="5" rx="2"/><circle cx="8" cy="12" r="2"/><path d="M14 10h4M14 14h4"/></svg>
                </dt>
                <dd class="font-medium text-neutral1" x-text="'NIM ' + profil.nim"></dd>
              </div>
            </template>
          </dl>

          <div class="mt-auto pt-5">
            <a href="profil.html" class="btn-outline w-full min-h-[44px]">Ubah Data di Profil Saya</a>
          </div>
        </div>
      </section>

      <!-- Ganti password -->
      <section class="bg-white rounded-xl border border-neutral4 shadow-sm p-5 sm:p-6 flex flex-col">
        <div class="flex items-start gap-3">
          <span class="w-10 h-10 rounded-lg bg-primary5 text-primary1 flex items-center justify-center shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <div>
            <h2 class="text-base font-bold text-neutral1">Ganti Password</h2>
            <p class="text-sm text-neutral2 mt-0.5">Gunakan password yang tidak dipakai di akun lain.</p>
          </div>
        </div>

        <form @submit.prevent="simpan()" novalidate class="mt-8 flex-1 flex flex-col">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-5 mb-8">
            <template x-for="f in fields" :key="f.key">
              <div :class="f.key === 'lama' && 'sm:col-span-2'">
                <label :for="'pwd-' + f.key" class="label" x-text="f.label"></label>
                <div class="relative">
                  <input :id="'pwd-' + f.key" :type="lihat[f.key] ? 'text' : 'password'" x-model="form[f.key]" :placeholder="f.placeholder || ''" @input="errors[f.key] = ''"
                    :minlength="f.key !== 'lama' ? 8 : null"
                    :autocomplete="f.key === 'lama' ? 'current-password' : 'new-password'"
                    :aria-invalid="Boolean(errors[f.key])" :aria-describedby="'err-' + f.key"
                    class="input !pr-12 min-h-[44px]" :class="errors[f.key] && '!border-red2'">
                  <button type="button" @click="lihat[f.key] = !lihat[f.key]"
                    class="absolute inset-y-0 right-0 w-11 flex items-center justify-center text-neutral3 hover:text-primary1"
                    :aria-label="(lihat[f.key] ? 'Sembunyikan ' : 'Tampilkan ') + f.label.toLowerCase()" :aria-pressed="Boolean(lihat[f.key])">
                    <svg x-show="!lihat[f.key]" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg x-show="lihat[f.key]" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                  </button>
                </div>
                <p :id="'err-' + f.key" x-show="errors[f.key]" x-text="errors[f.key]" class="text-xs text-red2 mt-1.5" role="alert"></p>
              </div>
            </template>
          </div>

          <!-- Footer menempel di dasar kartu, sejajar tombol kartu akun -->
          <div class="mt-auto pt-5 border-t border-neutral4 flex sm:justify-end">
            <button type="submit" class="btn-primary w-full sm:w-auto min-h-[44px] px-6">Simpan Password</button>
          </div>
        </form>
      </section>
    </div>
  </div>
</main>

<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('pengaturanPage', () => ({
    // Identitas sama dengan Profil Saya & topbar: data profil + hasil edit yang tersimpan
    profil: (() => {
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem('bengkod_alumni_profile') || 'null'); } catch {}
      return { ...INITIAL_PROFILE, ...(saved || {}) };
    })(),
    fields: [
      { key: 'lama', label: 'Password lama', placeholder: 'Masukkan password saat ini' },
      { key: 'baru', label: 'Password baru', placeholder: 'Minimal 8 karakter' },
      { key: 'konfirmasi', label: 'Konfirmasi password baru', placeholder: 'Sama dengan password baru' },
    ],
    form: { lama: '', baru: '', konfirmasi: '' },
    errors: { lama: '', baru: '', konfirmasi: '' },
    lihat: {},
    toast: '',
    toastTimer: null,


    simpan() {
      const { lama, baru, konfirmasi } = this.form;
      this.errors = {
        lama: lama ? '' : 'Password lama wajib diisi.',
        baru: !baru ? 'Password baru wajib diisi.' : baru.length < 8 ? 'Password baru minimal 8 karakter.' : '',
        konfirmasi: baru !== konfirmasi ? 'Konfirmasi password tidak sama.' : '',
      };
      if (Object.values(this.errors).some(Boolean)) return;

      const hasil = DB.akun.gantiPassword(DB.akun.aktif().id, lama, baru);
      if (!hasil.ok) {
        this.errors[hasil.field || 'lama'] = hasil.error;
        return;
      }
      this.form = { lama: '', baru: '', konfirmasi: '' };
      this.lihat = {};
      this.toast = 'Password berhasil diubah.';
      clearTimeout(this.toastTimer);
      this.toastTimer = setTimeout(() => (this.toast = ''), 2600);
    },
  }));
});
</script>
</body>
</html>
