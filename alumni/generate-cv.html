<!DOCTYPE html>
<html lang="id" data-role="alumni">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate CV | Alumni Bengkel Koding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css?v=5">
  <script src="assets/js/data.js?v=8"></script>
  <script src="assets/js/app.js?v=6"></script>
  <script src="assets/js/cv.js?v=5"></script>
  <script src="../assets/js/page-skeleton.js?v=5"></script>
  <script src="../assets/js/main.js?v=5"></script>
  <style>
    @media print {
      @page { size: A4 portrait; margin: 10mm 12mm; }
      html, body { background: #FFFFFF !important; }
      main { padding: 0 !important; }
      main > * { margin-top: 0 !important; }
      #cv-document { box-shadow: none !important; border: 0 !important; border-radius: 0 !important; padding: 0 !important; max-width: none !important; }
      #cv-document * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body class="bg-white text-neutral1 antialiased font-sans">
<main data-title="Generate CV">
  <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 no-print">
    <div>
      <h2 class="!text-2xl font-semibold text-neutral1">Generate CV</h2>
      <p class="!text-sm text-neutral2 mt-1">CV dibuat otomatis dari data Profil Saya, termasuk Proyek dan Portofolio serta pengalaman freelance dari Gigs.</p>
    </div>
    <div class="flex flex-wrap gap-2">
      <a href="profil.html" class="btn-outline"><i data-lucide="pencil" class="w-4 h-4"></i> Edit Profil</a>
      <button type="button" onclick="window.print()" class="btn-primary"><i data-lucide="printer" class="w-4 h-4"></i> Cetak / Unduh PDF</button>
    </div>
  </div>

  <section class="card !p-5 space-y-4 no-print" aria-label="Pengaturan CV">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
      <div>
        <h3 class="!text-base font-semibold text-neutral1">Kustomisasi Dokumen CV</h3>
        <p class="!text-sm text-neutral2 mt-0.5">Pilih format dan bagian yang ingin ditampilkan.</p>
      </div>
      <div id="format" class="inline-flex w-fit p-1 bg-neutral5 rounded-full border border-neutral4 shrink-0" role="group" aria-label="Format CV">
        <button type="button" data-format="ats">Format ATS Standar</button>
        <button type="button" data-format="modern">Format Modern Clean</button>
      </div>
    </div>
    <div id="bagian" class="flex flex-wrap gap-x-5 gap-y-2"></div>
  </section>

  <div class="flex justify-center">
    <article id="cv-document" class="w-full max-w-[850px] bg-white rounded-xl border border-neutral4 shadow-md p-8 sm:p-12"></article>
  </div>
</main>

<script>
  const aktif = new Set(Object.keys(CV_KATEGORI));
  // Centang pengalaman freelance hanya muncul kalau ada proyek dari gig yang selesai
  const adaFreelance = DB.cv.milik('projects', SAYA.id).some(r => r.id_gig);
  let freelance = true;
  let format = 'ats';

  function render() {
    document.getElementById('cv-document').innerHTML = dokumenCv(SAYA.id, format, aktif, freelance);
    document.querySelectorAll('[data-format]').forEach(b => {
      const dipilih = b.dataset.format === format;
      b.setAttribute('aria-pressed', dipilih);
      b.className = `px-4 py-1.5 rounded-full text-[13px] font-semibold transition-all ${dipilih ? 'bg-white text-primary1 shadow-sm' : 'text-neutral2 hover:text-neutral1'}`;
    });
  }

  document.getElementById('bagian').innerHTML = Object.entries(CV_KATEGORI).map(([kunci, k]) => `
    <label class="flex items-center gap-2 text-sm text-neutral1 cursor-pointer"><input type="checkbox" value="${kunci}" checked class="w-4 h-4 accent-[#1E3A8A]"> ${esc(k.judul)}</label>`).join('')
    + (adaFreelance ? '<label class="flex items-center gap-2 text-sm text-neutral1 cursor-pointer"><input type="checkbox" value="freelance" checked class="w-4 h-4 accent-[#1E3A8A]"> Pengalaman Freelance (Gigs)</label>' : '');

  document.getElementById('bagian').addEventListener('change', e => {
    const { value, checked } = e.target;
    if (value === 'freelance') freelance = checked;
    else if (checked) aktif.add(value);
    else aktif.delete(value);
    render();
  });

  document.getElementById('format').addEventListener('click', e => {
    const tombol = e.target.closest('[data-format]');
    if (!tombol) return;
    format = tombol.dataset.format;
    render();
  });

  render();
</script>
</body>
</html>
