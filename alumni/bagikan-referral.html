<!DOCTYPE html>
<html lang="id" data-color-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bagikan Referral | Portal Alumni Bengkel Koding</title>
  <meta name="description" content="Buka jalan perkenalan dan bagikan lowongan pekerjaan di perusahaan Anda kepada sesama alumni Bengkel Koding UDINUS.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/page-skeleton.js"></script>
  <script src="assets/js/alumni.js"></script>
  <script src="assets/js/alumni-data.js"></script>
  <script src="assets/js/alumni-profile-data.js"></script>
  <script src="assets/js/alumni-cv.js"></script>
  <script src="../assets/js/store.js"></script>
</head>
<body>
<main data-route="bagikan-referral">
  <div x-data="bagikanReferralPage()" class="w-full max-w-2xl mx-auto space-y-6 py-2 antialiased">

    <!-- Tombol Kembali -->
    <div>
      <a href="referral.html" class="inline-flex items-center gap-2 text-[14px] font-semibold text-gray-500 hover:text-[#1E3A8A] transition-colors w-fit">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
        <span>Kembali ke Referral</span>
      </a>
    </div>

    <!-- Header Halaman -->
    <div class="pb-4 border-b border-gray-200">
      <h1 class="text-2xl sm:text-3xl font-bold text-[#1E3A8A] tracking-tight" x-text="editingPostId ? 'Edit Info Referral' : 'Bagikan Info Referral'"></h1>
      <p class="text-[14px] sm:text-[15px] text-gray-500 mt-1 font-normal">
        Buka jalan perkenalan dan rekomendasi ke kantor Anda untuk rekan alumni Bengkel Koding.
      </p>
    </div>

    <!-- Kotak Edukasi / Notice Batas Peran -->
    <div class="w-full p-4 rounded-xl bg-blue-50/70 border border-blue-200/70 text-[14px] text-gray-700 leading-relaxed flex items-start gap-3 shadow-2xs">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-[#1E3A8A] shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="16" x2="12" y2="12"/>
        <line x1="12" y1="8" x2="12.01" y2="8"/>
      </svg>
      <span class="text-[13.5px]">
        Anda hanya membuka jalan perkenalan ke kantor Anda. Sistem tidak mencatat proses rekrutmen formal dan Anda tidak wajib menjamin pelamar pasti diterima.
      </span>
    </div>

    <!-- Container Form Utama -->
    <form @submit.prevent="submitForm()" class="bg-white rounded-xl border border-gray-200/90 shadow-xs w-full overflow-hidden">
      <div class="p-6 sm:p-8 space-y-6">

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Nama Perusahaan -->
          <div class="space-y-1.5 sm:col-span-2">
            <label for="ref-perusahaan" class="block text-[14px] font-medium text-gray-700">
              Nama Perusahaan <span class="text-red-500 font-bold">*</span>
            </label>
            <input
              id="ref-perusahaan"
              type="text"
              x-model="form.perusahaan"
              placeholder="Contoh: PT Solusi Digital Nusantara"
              required
              class="w-full rounded-md border border-gray-300 hover:border-gray-400 focus:border-[#1E3A8A] focus:ring-1 focus:ring-[#1E3A8A] bg-white px-3.5 py-2.5 text-[15px] text-gray-900 placeholder:text-gray-400 outline-none transition-all"
            >
          </div>

          <!-- Role / Posisi -->
          <div class="space-y-1.5 sm:col-span-2">
            <label for="ref-posisi" class="block text-[14px] font-medium text-gray-700">
              Role / Posisi Lowongan <span class="text-red-500 font-bold">*</span>
            </label>
            <input
              id="ref-posisi"
              type="text"
              x-model="form.posisi"
              placeholder="Contoh: Backend Developer (Laravel / Go)"
              required
              class="w-full rounded-md border border-gray-300 hover:border-gray-400 focus:border-[#1E3A8A] focus:ring-1 focus:ring-[#1E3A8A] bg-white px-3.5 py-2.5 text-[15px] text-gray-900 placeholder:text-gray-400 outline-none transition-all"
            >
          </div>

          <!-- Level Pengalaman -->
          <div class="space-y-1.5">
            <label for="ref-level" class="block text-[14px] font-medium text-gray-700">
              Level Pengalaman <span class="text-red-500 font-bold">*</span>
            </label>
            <div class="relative">
              <select
                id="ref-level"
                x-model="form.level"
                class="w-full appearance-none rounded-md border border-gray-300 hover:border-gray-400 focus:border-[#1E3A8A] focus:ring-1 focus:ring-[#1E3A8A] bg-white pl-3.5 pr-10 py-2.5 text-[15px] text-gray-900 outline-none transition-all cursor-pointer"
              >
                <option value="Magang/Freshgrad">Magang / Freshgrad</option>
                <option value="Junior (1-2 tahun)">Junior (1-2 tahun)</option>
                <option value="Mid">Mid Level</option>
              </select>
              <span class="absolute right-3.5 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
              </span>
            </div>
          </div>

          <!-- Batas Waktu Review -->
          <div class="space-y-1.5">
            <label for="ref-batas" class="block text-[14px] font-medium text-gray-700">
              Batas Waktu Review <span class="text-red-500 font-bold">*</span>
            </label>
            <input
              id="ref-batas"
              type="date"
              x-model="form.batas"
              :min="todayStr"
              required
              class="w-full rounded-md border border-gray-300 hover:border-gray-400 focus:border-[#1E3A8A] focus:ring-1 focus:ring-[#1E3A8A] bg-white px-3.5 py-2.5 text-[15px] text-gray-900 outline-none transition-all"
            >
          </div>
        </div>

        <!-- Pesan & Kriteria Utama -->
        <div class="space-y-1.5">
          <div class="flex items-center justify-between">
            <label for="ref-isi" class="block text-[14px] font-medium text-gray-700">
              Pesan &amp; Kriteria Utama <span class="text-red-500 font-bold">*</span>
            </label>
            <span class="text-[12px] text-gray-400 tabular-nums">
              <span x-text="form.isi.length"></span>/300 karakter
            </span>
          </div>
          <textarea
            id="ref-isi"
            x-model="form.isi"
            rows="4"
            maxlength="300"
            required
            style="resize: none"
            placeholder="Satu sampai dua kalimat singkat, contoh: familiar dengan Laravel & MySQL, serta berinisiatif tinggi untuk belajar sistem cloud..."
            class="w-full rounded-md border border-gray-300 hover:border-gray-400 focus:border-[#1E3A8A] focus:ring-1 focus:ring-[#1E3A8A] bg-white px-3.5 py-2.5 text-[15px] text-gray-900 placeholder:text-gray-400 outline-none transition-all leading-relaxed"
          ></textarea>
        </div>

        <template x-if="editingClosedManually">
          <p class="text-[13px] text-amber-700 bg-amber-50 border border-amber-200/80 rounded-lg p-3">
            Referral ini sebelumnya telah Anda tutup secara manual. Menyimpan perubahan data tidak akan membuka kembali status referral.
          </p>
        </template>

      </div>

      <!-- Action Footer Bar -->
      <div class="px-6 sm:px-8 py-4 bg-gray-50/80 border-t border-gray-200 flex flex-col-reverse sm:flex-row sm:items-center justify-end gap-3">
        <a
          href="referral.html"
          class="inline-flex items-center justify-center px-5 py-2.5 rounded-full border border-gray-300 text-[14px] font-semibold text-gray-700 hover:bg-gray-100 hover:text-gray-900 transition-colors text-center cursor-pointer"
        >
          Batal
        </a>
        <button
          type="submit"
          :disabled="!isValid"
          class="inline-flex items-center justify-center gap-2 px-6 py-2.5 rounded-full bg-[#1E3A8A] hover:bg-[#1D4ED8] text-white text-[14px] font-semibold shadow-sm transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span class="text-base leading-none font-bold" x-show="!editingPostId">+</span>
          <span x-text="editingPostId ? 'Simpan Perubahan' : 'Bagikan Referral'"></span>
        </button>
      </div>
    </form>

  </div>
</main>

<script>
  function bagikanReferralPage() {
    const currentAlumni = (typeof ALUMNI_DIRECTORY !== "undefined" && ALUMNI_DIRECTORY[0]) || {
      name: "Aisha Dwi Rahmawati",
      headline: "Ex-Asisten Lab Software Engineering Bengkod UDINUS",
      avatarUrl: "assets/img/avatars/alumni-1.png",
    };

    const dPlus = (days) => {
      const d = new Date();
      d.setDate(d.getDate() + days);
      return d.toISOString().slice(0, 10);
    };

    return {
      todayStr: new Date().toISOString().slice(0, 10),
      editingPostId: null,
      editingClosedManually: false,
      profile: {
        name: currentAlumni.name,
        headline: currentAlumni.headline,
        avatarUrl: currentAlumni.avatarUrl || "assets/img/avatars/alumni-1.png",
      },
      form: {
        perusahaan: "",
        posisi: "",
        level: "Magang/Freshgrad",
        batas: dPlus(14),
        isi: "",
      },

      init() {
        try {
          const saved = JSON.parse(localStorage.getItem("bengkod_alumni_profile") || "null");
          if (saved) {
            this.profile = {
              name: saved.name || currentAlumni.name,
              headline: saved.headline || currentAlumni.headline,
              avatarUrl: saved.avatarUrl || currentAlumni.avatarUrl,
            };
          }
        } catch {}

        // Cek parameter ?edit=<id> atau ?id=<id> untuk mode edit
        const params = new URLSearchParams(window.location.search);
        const editId = params.get("edit") || params.get("id");
        if (editId) {
          const posts = typeof loadPosts === "function" ? loadPosts() : [];
          const target = posts.find((p) => String(p.id) === String(editId));
          if (target && target.referral) {
            this.editingPostId = target.id;
            this.editingClosedManually = target.referral.ditutup === true;
            this.form = {
              perusahaan: target.referral.perusahaan || "",
              posisi: target.referral.posisi || "",
              level: target.referral.level || "Magang/Freshgrad",
              batas: target.referral.batas || dPlus(14),
              isi: target.content || "",
            };
          }
        }
      },

      get isValid() {
        return Boolean(
          this.form.perusahaan.trim() &&
          this.form.posisi.trim() &&
          this.form.batas &&
          this.form.isi.trim() &&
          this.form.batas >= this.todayStr
        );
      },

      submitForm() {
        if (!this.isValid) return;

        const detail = {
          perusahaan: this.form.perusahaan.trim(),
          posisi: this.form.posisi.trim(),
          level: this.form.level,
          batas: this.form.batas,
        };

        const posts = typeof loadPosts === "function" ? loadPosts() : [];

        if (this.editingPostId) {
          const updated = posts.map((p) => {
            if (p.id === this.editingPostId) {
              return {
                ...p,
                content: this.form.isi.trim(),
                referral: { ...p.referral, ...detail },
              };
            }
            return p;
          });
          if (typeof savePosts === "function") savePosts(updated);

          sessionStorage.setItem("bengkod_toast", "Perubahan informasi referral berhasil disimpan.");
          window.location.href = "referral.html?tab=saya";
          return;
        }

        const newPost = {
          id: Date.now(),
          authorName: this.profile.name,
          authorAvatar: this.profile.avatarUrl,
          authorHeadline: this.profile.headline,
          date: "Baru saja",
          category: "Referral",
          visibility: "Semua orang",
          content: this.form.isi.trim(),
          imageUrl: "",
          likes: 0,
          isLiked: false,
          commentsCount: 0,
          repostsCount: 0,
          impressions: 1,
          jenis: "referral",
          referral: detail,
          pengajuan: [],
        };

        if (typeof savePosts === "function") {
          savePosts([newPost, ...posts]);
        }

        sessionStorage.setItem("bengkod_toast", "Info referral berhasil dibagikan ke Papan Referral!");
        window.location.href = "referral.html?tab=saya";
      },
    };
  }

  document.addEventListener("alpine:init", () => {
    Alpine.data("bagikanReferralPage", bagikanReferralPage);
  });
</script>
</body>
</html>
