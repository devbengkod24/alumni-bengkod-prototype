<!DOCTYPE html>
<html lang="en" data-color-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengumuman - Bengkel Koding</title>
  <meta name="description" content="Pengumuman dari koordinator Bengkel Koding">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/alumni.js"></script>
</head>
<body>
<main data-route="pengumuman">
  <div x-data="pengumumanPage" class="w-full flex flex-col gap-6 py-2">

    <!-- ── HEADER ── -->
    <div class="flex items-center justify-between pb-3 border-b border-gray-200">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold text-[#1E3A8A] tracking-tight">Pengumuman</h1>
        <p class="text-sm text-gray-500 mt-0.5">Informasi resmi dari koordinator Bengkel Koding</p>
      </div>
    </div>

    <!-- ── DAFTAR PENGUMUMAN (LANGSUNG JUDUL, TANGGAL & DESKRIPSI TANPA DROPDOWN) ── -->
    <div class="space-y-4">
      <template x-for="(item, i) in announcements" :key="item.id">
        <div
          :id="'pengumuman-' + item.id"
          class="bg-white rounded-xl border border-gray-200/90 shadow-sm overflow-hidden transition-all hover:shadow-md hover:border-blue-200"
        >
          <div class="flex items-start gap-4 p-5">
            <!-- Icon lonceng (Semua berwarna biru #1E3A8A) -->
            <div class="w-11 h-11 rounded-xl bg-[#1E3A8A] flex items-center justify-center flex-shrink-0 text-white shadow-xs">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 01-3.46 0"/>
              </svg>
            </div>

            <div class="flex-1 min-w-0">
              <!-- Judul -->
              <h2 class="text-[16px] sm:text-[17px] font-semibold text-gray-900 leading-snug" x-text="item.title"></h2>
              <!-- Tanggal -->
              <p class="text-[13px] text-gray-500 mt-1" x-text="item.time"></p>
              <!-- Deskripsi Langsung -->
              <p class="text-[14px] sm:text-[15px] text-gray-700 mt-2.5 leading-relaxed" x-text="item.content"></p>
            </div>
          </div>
        </div>
      </template>

      <!-- Empty state jika kosong -->
      <template x-if="announcements.length === 0">
        <div class="bg-white rounded-xl border border-gray-200 p-12 text-center text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" class="mx-auto mb-3 text-gray-300" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 01-3.46 0"/>
          </svg>
          <p class="text-[15px] font-medium text-gray-500">Tidak ada pengumuman</p>
        </div>
      </template>
    </div>

  </div>
</main>
<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('pengumumanPage', () => ({
    announcements: [
      {
        id: 1,
        title: 'Jadwal Pelepasan Alumni Angkatan 2024',
        time: '24 Oktober 2025',
        content: 'Acara pelepasan alumni akan dilaksanakan pada Sabtu, 15 November 2025 pukul 09.00 WIB di Gedung Serbaguna Universitas Dian Nuswantoro Semarang. Seluruh alumni angkatan 2024 diwajibkan hadir dengan mengenakan almamater resmi. Konfirmasi kehadiran melalui tautan yang akan dikirimkan ke email masing-masing alumni paling lambat 10 November 2025.',
      },
      {
        id: 2,
        title: 'Pengisian Data Alumni Terbaru',
        time: '21 Oktober 2025',
        content: 'Seluruh alumni Bengkel Koding diwajibkan untuk memperbarui data diri terbaru melalui portal alumni. Data yang perlu diperbarui meliputi: nama lengkap sesuai KTP, posisi pekerjaan saat ini, nama perusahaan/instansi, dan domisili terkini. Pembaruan data ini diperlukan untuk keperluan tracer study dan database alumni.',
      },
      {
        id: 3,
        title: 'Workshop UI/UX Bersama Tokopedia',
        time: '17 Oktober 2025',
        content: 'Pendaftaran workshop UI/UX gratis bersama tim desainer Tokopedia telah dibuka. Workshop akan berlangsung secara online via Zoom pada 20 November 2025 pukul 13.00–17.00 WIB. Kuota terbatas hanya 50 peserta. Daftarkan diri segera melalui link yang tersedia.',
      },
      {
        id: 4,
        title: 'Rekrutmen Asisten Koordinator 2025',
        time: '10 Oktober 2025',
        content: 'Bengkel Koding membuka rekrutmen Asisten Koordinator untuk periode 2025–2026. Posisi ini terbuka bagi alumni aktif yang memiliki dedikasi tinggi terhadap pengembangan program Bengkel Koding. Kualifikasi: lulus dari program Bengkel Koding, IPK minimal 3.0, bersedia hadir 2x seminggu. Kirimkan CV dan portofolio ke email koordinator@bengkelkoding.com dengan subject "Lamaran Asisten Koordinator 2025".',
      },
      {
        id: 5,
        title: 'Pembaruan Kurikulum Program 2025',
        time: '3 Oktober 2025',
        content: 'Koordinator telah merilis kurikulum baru untuk program coding 2025 yang mencakup penambahan modul Artificial Intelligence, Cloud Computing, dan Cybersecurity Fundamentals. Dokumen kurikulum lengkap dapat diakses oleh seluruh alumni melalui portal internal Bengkel Koding di menu Akademik.',
      },
      {
        id: 6,
        title: 'Program Mentorship Karier Tech 2025',
        time: '28 September 2025',
        content: 'Program mentorship 1-on-1 bersama alumni senior Bengkel Koding kini resmi dibuka. Sesi mencakup konsultasi persiapan karier tech, peninjauan portofolio dan resume, serta simulasi technical interview bagi lulusan fresh graduate.',
      },
      {
        id: 7,
        title: 'Gathering Akbar & Networking Night',
        time: '19 September 2025',
        content: 'Temu alumni akbar lintas generasi Bengkel Koding akan diselenggarakan di Aula Utama Kampus Imam Bonjol UDINUS. Kegiatan ini menghadirkan sesi networking santai dan sharing alumni yang telah berkarier di berbagai tech unicorn & startup.',
      },
      {
        id: 8,
        title: 'Voucher Diskon Sertifikasi AWS & GCP',
        time: '12 September 2025',
        content: 'Bengkel Koding bekerjasama dengan mitra sertifikasi internasional menyediakan voucher subsidi biaya ujian resmi sertifikasi Cloud Practitioner, Solutions Architect, dan Associate Cloud Engineer bagi seluruh alumni terdaftar.',
      },
    ],
  }));
});
</script>
</body>
</html>
