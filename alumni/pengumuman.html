<!DOCTYPE html>
<html lang="id" data-role="alumni">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengumuman | Alumni Bengkel Koding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css?v=5">
  <script src="assets/js/data.js?v=8"></script>
  <script src="assets/js/app.js?v=6"></script>
  <script src="../assets/js/page-skeleton.js?v=5"></script>
  <script src="../assets/js/main.js?v=5"></script>
</head>
<body class="bg-white text-neutral1 antialiased font-sans">
<main data-title="Pengumuman" data-nav="beranda.html">
  <div>
    <h2 class="!text-2xl font-semibold text-neutral1">Pengumuman</h2>
    <p class="!text-sm text-neutral2 mt-1">Informasi terbaru dari koordinator alumni.</p>
  </div>
  <section id="daftar" class="space-y-4" aria-label="Daftar pengumuman"></section>
</main>

<script>
  document.getElementById('daftar').innerHTML = DB.pengumuman.semua().map(p => `
    <article class="bg-white rounded-xl border border-neutral4 shadow-sm hover:border-primary4 transition-colors">
      <div class="flex items-start gap-4 p-5">
        <div class="w-11 h-11 rounded-xl bg-primary1 text-white flex items-center justify-center shrink-0"><i data-lucide="bell" class="w-5 h-5"></i></div>
        <div class="flex-1 min-w-0">
          <h3 class="!text-base sm:!text-[17px] font-semibold text-neutral1 leading-snug">${esc(p.judul)}</h3>
          <p class="!text-[13px] text-neutral3 mt-1">${fmtDate(p.published_at)} · Oleh ${esc(p.penulis)}</p>
          <p class="!text-sm sm:!text-[15px] text-neutral1 mt-2.5 leading-relaxed whitespace-pre-line">${esc(p.isi)}</p>
        </div>
      </div>
    </article>`).join('') || kartuKosong('bell', 'Belum ada pengumuman');
</script>
</body>
</html>
