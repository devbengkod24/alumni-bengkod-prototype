<!DOCTYPE html>
<html lang="en" data-color-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengumuman - Bengkel Koding</title>
  <meta name="description" content="Pengumuman dari koordinator Bengkel Koding">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/page-skeleton.js"></script>
  <script src="assets/js/alumni.js"></script>
</head>
<body>
<main data-route="pengumuman">
  <div x-data="pengumumanPage" class="w-full flex flex-col gap-6 py-2">

    <!-- ── HEADER ── -->
    <div class="flex items-center justify-between pb-3 border-b border-gray-200">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold text-[#1E3A8A] tracking-tight">Pengumuman</h1>
        <p class="text-sm text-gray-500 mt-0.5">Informasi resmi dari koordinator dan mitra Bengkel Koding</p>
      </div>
    </div>

    <!-- ── DAFTAR PENGUMUMAN (LANGSUNG JUDUL, TANGGAL & DESKRIPSI TANPA DROPDOWN) ── -->
    <div class="space-y-4">
      <template x-for="(item, i) in announcements" :key="item.id">
        <div
          :id="'pengumuman-' + item.id"
          class="bg-white rounded-xl border border-gray-200/90 shadow-sm overflow-hidden transition-all hover:shadow-md hover:border-blue-200"
        >
          <div class="flex items-start gap-4 p-5">
            <!-- Icon lonceng (Semua berwarna biru #1E3A8A) -->
            <div class="w-11 h-11 rounded-xl bg-[#1E3A8A] flex items-center justify-center flex-shrink-0 text-white shadow-xs">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 01-3.46 0"/>
              </svg>
            </div>

            <div class="flex-1 min-w-0">
              <!-- Judul -->
              <h2 class="text-[16px] sm:text-[17px] font-semibold text-gray-900 leading-snug" x-text="item.title"></h2>
              <!-- Tanggal, Pembuat & Target -->
              <p class="text-[13px] text-gray-500 mt-1 flex items-center gap-2 flex-wrap">
                <span x-text="item.time"></span>
                <span>·</span>
                <span>Oleh <strong class="font-medium text-gray-700" x-text="item.author"></strong> <span class="text-xs text-gray-400" x-text="'(' + (item.role || 'Koordinator') + ')'"></span></span>
                <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium bg-gray-100 text-gray-600 border border-gray-200" x-text="item.target"></span>
              </p>
              <!-- Deskripsi Langsung -->
              <p class="text-[14px] sm:text-[15px] text-gray-700 mt-2.5 leading-relaxed whitespace-pre-line" x-text="item.content"></p>

              <!-- Lampiran Dokumen jika ada -->
              <template x-if="item.lampiran">
                <div class="mt-3">
                  <span class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-medium bg-blue-50 text-[#1E3A8A] border border-blue-200/80 cursor-pointer hover:bg-blue-100/60 transition-colors" @click="alert('Mengunduh lampiran: ' + item.lampiran)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                    <span class="font-medium" x-text="item.lampiran"></span>
                    <span class="text-[11px] text-blue-500">· Unduh Dokumen</span>
                  </span>
                </div>
              </template>
            </div>
          </div>
        </div>
      </template>

      <!-- Empty state jika kosong -->
      <template x-if="announcements.length === 0">
        <div class="bg-white rounded-xl border border-gray-200 p-12 text-center text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" class="mx-auto mb-3 text-gray-300" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 01-3.46 0"/>
          </svg>
          <p class="text-[15px] font-medium text-gray-500">Tidak ada pengumuman</p>
        </div>
      </template>
    </div>

  </div>
</main>
<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('pengumumanPage', () => ({
    announcements: [],

    init() {
      this.load();
      window.addEventListener('bengkod:pengumuman-updated', () => this.load());
    },

    load() {
      if (window.BengkodStore) {
        const raw = window.BengkodStore.getPengumuman('Alumni');
        this.announcements = raw.map(p => ({
          id: p.id,
          title: p.judul || p.title,
          time: this.formatDate(p.published_at || p.time),
          content: p.isi || p.content,
          author: p.author || 'Koordinator Bengkel Koding',
          role: p.author_role || (p.author?.includes('PT') || p.author?.includes('CV') ? 'Mitra' : 'Koordinator'),
          target: p.target || 'Alumni',
          lampiran: p.lampiran || ''
        }));
      } else {
        this.announcements = [
          {
            id: 1,
            title: 'Pengisian Tracer Study Angkatan 2025',
            time: '18 Oktober 2026',
            content: 'Seluruh alumni purna tugas asisten lab lulusan 2025 dimohon memperbarui data status karir dan masa tunggu sebelum 30 November 2026.',
            author: 'Dr. Ayu Lestari, M.Kom',
            role: 'Koordinator',
            target: 'Alumni',
            lampiran: 'Panduan_Tracer_Study_2025.pdf'
          },
          {
            id: 2,
            title: 'Open Recruitment Batch Ganjil 2026/2027',
            time: '22 Oktober 2026',
            content: 'PT Solusi Digital Jateng membuka kesempatan rekrutmen posisi Backend Developer & Data Analyst khusus lulusan Bengkel Koding.',
            author: 'PT Solusi Digital Jateng',
            role: 'Mitra',
            target: 'Alumni',
            lampiran: 'Kualifikasi_Rekrutmen_SolusiDigital.pdf'
          }
        ];
      }
    },

    formatDate(val) {
      if (!val) return 'Terbaru';
      try {
        const d = new Date(val);
        if (!isNaN(d.getTime())) {
          return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
        }
      } catch {}
      return val;
    }
  }));
});
</script>
</body>
</html>
