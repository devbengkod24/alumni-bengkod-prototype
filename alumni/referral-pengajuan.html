<!DOCTYPE html>
<html lang="id" data-color-mode="light" class="h-full bg-[#EFF2F7]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Pelamar Referral | Portal Alumni Bengkel Koding UDINUS</title>
  <meta name="description" content="Daftar pengajuan review dan referral untuk lowongan yang Anda bagikan.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    };
  </script>
  <style>
    [x-cloak] { display: none !important; }
    #masukan-dialog::backdrop { background: rgba(15, 23, 42, 0.45); }
  </style>
  <script src="assets/js/alumni-data.js"></script>
  <script src="assets/js/alumni-catalog.js"></script>
  <script src="assets/js/alumni-profile-data.js"></script>
  <script src="assets/js/alumni-cv.js"></script>
  <script src="assets/js/alumni-referral.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="assets/js/portal-layout.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>
<body class="min-h-full bg-[#EFF2F7] font-sans text-[#212224] antialiased">
<main class="min-w-0 text-[#212224]" data-route="referral" x-data="bengkodReferralPengajuan()" x-init="init()">
  <div class="mx-auto w-full max-w-4xl space-y-5">
    <a href="referral.html" class="inline-flex items-center gap-1.5 text-[13px] font-semibold text-[#3A5988] hover:underline">
      ← Kembali ke Lowongan Referral
    </a>

    <!-- Referral tidak ditemukan / bukan milik sendiri -->
    <div x-show="!post || !isMine(post)" x-cloak class="rounded-2xl border border-[#E3E4E9] bg-white p-10 text-center">
      <p class="text-[16px] font-semibold text-[#0C1117]">Lowongan referral tidak ditemukan</p>
      <p class="mt-1 text-[13.5px] text-[#6B7280]">Lowongan ini sudah dihapus atau bukan referral yang Anda bagikan.</p>
      <a href="referral.html" class="mt-4 inline-flex items-center rounded-[9px] bg-[#3A5988] px-4 py-2 text-[13px] font-semibold text-white hover:bg-[#496DA8]">
        Kembali ke Lowongan Referral
      </a>
    </div>

    <template x-if="post && isMine(post)">
      <div class="space-y-5">
        <!-- Ringkasan Lowongan -->
        <section class="rounded-2xl border border-[#E3E4E9] bg-white p-5 sm:p-6">
          <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
            <div class="min-w-0 space-y-1.5">
              <p class="text-[12px] font-semibold text-[#6B7280]">Manajemen Pelamar Referral</p>
              <div class="flex flex-wrap items-center gap-2.5">
                <h1 class="text-xl font-bold leading-snug text-[#0C1117] sm:text-2xl" x-text="post.referral?.posisi || '-'"></h1>
                <span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-[12px] font-semibold"
                      :class="isClosed ? 'bg-[#F4F5F7] text-[#6B7280]' : 'bg-emerald-50 text-emerald-700'"
                      x-text="isClosed ? 'Ditutup' : 'Dibuka'"></span>
              </div>
              <p class="text-[13.5px] text-[#6B7280]"
                 x-text="(post.referral?.perusahaan || '-') + ' · ' + (post.referral?.level || 'Umum') + (post.referral?.batas ? ' · Batas review ' + formatDate(post.referral.batas) : '')"></p>
            </div>
            <div class="shrink-0">
              <a :href="'detail-referral.html?id=' + post.id"
                 class="inline-flex items-center gap-1.5 rounded-[9px] border border-[#E3E4E9] bg-white px-4 py-2 text-[13px] font-semibold text-[#212224] transition-colors hover:border-[#3A5988] hover:text-[#3A5988]">
                Lihat Detail Lowongan
              </a>
            </div>
          </div>
        </section>

        <!-- Filter Status -->
        <div class="flex flex-wrap items-center gap-2" role="group" aria-label="Filter status pelamar">
          <template x-for="chip in chips" :key="chip.id">
            <button type="button"
                    @click="filterStatus = chip.id"
                    :aria-pressed="filterStatus === chip.id"
                    :class="filterStatus === chip.id ? 'border-[#3A5988] bg-[#3A5988] text-white' : 'border-[#E3E4E9] bg-white text-[#212224] hover:border-[#3A5988]'"
                    class="inline-flex items-center gap-1.5 rounded-full border px-3.5 py-1.5 text-[13px] font-semibold transition-colors">
              <span x-text="chip.label"></span>
              <span class="tabular-nums opacity-80" x-text="'(' + countBy(chip.id) + ')'"></span>
            </button>
          </template>
        </div>

        <!-- Empty state -->
        <div x-show="filtered.length === 0" x-cloak class="rounded-2xl border border-[#E3E4E9] bg-white p-10 text-center">
          <p class="text-[15px] font-semibold text-[#0C1117]">Belum ada pelamar pada kategori ini</p>
          <p class="mt-1 text-[13.5px] text-[#6B7280]">Coba pilih filter status lain atau tunggu pengajuan baru dari rekan alumni.</p>
        </div>

        <!-- Daftar Kartu Pelamar -->
        <div x-show="filtered.length > 0" class="space-y-4">
          <template x-for="pelamar in filtered" :key="pelamar.id">
            <article class="rounded-2xl border border-[#E3E4E9] bg-white p-5 sm:p-6 space-y-4">
              <header class="flex flex-wrap items-start justify-between gap-3">
                <div class="flex min-w-0 items-center gap-3">
                  <img :src="pelamar.authorAvatar || DEFAULT_AVATAR" :alt="pelamar.authorName"
                       class="h-11 w-11 shrink-0 rounded-full bg-[#F4F5F7] object-cover">
                  <div class="min-w-0">
                    <h2 class="truncate text-[15px] font-bold text-[#0C1117]" x-text="pelamar.authorName"></h2>
                    <p class="truncate text-[12.5px] text-[#6B7280]" x-text="pelamar.authorHeadline || 'Alumni Bengkel Koding'"></p>
                  </div>
                </div>
                <div class="flex flex-col items-end gap-1">
                  <span class="rounded-full px-2.5 py-0.5 text-[12px] font-semibold"
                        :class="statusClass(pelamar.status)"
                        x-text="statusLabel(pelamar.status)"></span>
                  <span class="text-[12px] text-[#6B7280]" x-text="formatDate(pelamar.waktu)"></span>
                </div>
              </header>

              <div class="rounded-xl bg-[#F4F5F7] p-3.5">
                <p class="text-[11px] font-semibold uppercase tracking-wide text-[#6B7280]">Pesan perkenalan &amp; pitching</p>
                <p class="mt-1 whitespace-pre-wrap break-words text-[13.5px] leading-relaxed text-[#212224]"
                   x-text="pelamar.pesan || 'Tidak ada pesan pengajuan.'"></p>
              </div>

              <div class="flex flex-wrap items-center gap-2.5">
                <button type="button" @click="openCvViewer(pelamar.authorName)"
                        class="inline-flex items-center gap-1.5 rounded-[9px] border border-[#E3E4E9] bg-white px-3 py-1.5 text-[12.5px] font-semibold text-[#3A5988] transition-colors hover:border-[#3A5988]">
                  Lihat CV Alumni
                </button>
                <template x-if="pelamar.linkedin">
                  <a :href="pelamar.linkedin" target="_blank" rel="noopener noreferrer"
                     class="inline-flex items-center gap-1.5 rounded-[9px] border border-[#E3E4E9] bg-[#F4F7FB] px-3 py-1.5 text-[12.5px] font-semibold text-[#3A5988] transition-colors hover:border-[#3A5988]">
                    Profil LinkedIn <span aria-hidden="true">↗</span>
                  </a>
                </template>
                <span x-show="pelamar.no_hp" class="inline-flex items-center rounded-[9px] bg-[#F4F5F7] px-3 py-1.5 text-[12.5px] font-medium text-[#6B7280]"
                      x-text="pelamar.no_hp"></span>
              </div>

              <div x-show="pelamar.masukan" x-cloak class="rounded-xl border border-[#E3E4E9] bg-[#F4F7FB] p-3.5">
                <p class="text-[12px] font-semibold text-[#3A5988]">Masukan Reviewer</p>
                <p class="mt-1 whitespace-pre-wrap break-words text-[13.5px] leading-relaxed text-[#212224]" x-text="pelamar.masukan"></p>
              </div>

              <footer class="flex flex-wrap items-center justify-end gap-2.5 border-t border-[#E3E4E9] pt-4">
                <button type="button" @click="openMasukanDialog(pelamar)"
                        class="rounded-[9px] border border-[#E3E4E9] bg-white px-4 py-2 text-[13px] font-semibold text-[#212224] transition-colors hover:bg-[#F4F5F7]">
                  Beri Masukan
                </button>
                <button type="button" x-show="pelamar.status === 'menunggu'"
                        @click="ubahPelamar(pelamar.id, 'dihubungi', 'Status pelamar diperbarui menjadi Dihubungi.')"
                        class="rounded-[9px] border border-[#3A5988] px-4 py-2 text-[13px] font-semibold text-[#3A5988] transition-colors hover:bg-[#EFF2F7]">
                  Tandai Dihubungi
                </button>
                <button type="button" @click="hubungiWa(pelamar)"
                        class="inline-flex items-center gap-2 rounded-[9px] bg-[#3A5988] px-4 py-2 text-[13px] font-semibold text-white transition-colors hover:bg-[#496DA8]">
                  Hubungi WhatsApp <span aria-hidden="true">↗</span>
                </button>
              </footer>
            </article>
          </template>
        </div>
      </div>
    </template>
  </div>

  <!-- Modal Beri Masukan -->
  <dialog id="masukan-dialog" x-ref="masukanDialog" aria-labelledby="masukan-title"
          @click.self="$el.close()" @close="masukanTarget = null; masukanText = ''; masukanError = ''"
          class="m-auto max-h-[calc(100%-2rem)] w-[calc(100%-2rem)] max-w-md overflow-y-auto rounded-2xl border border-[#E3E4E9] bg-white text-[#212224] shadow-xl">
    <form @submit.prevent="submitMasukanDialog()" class="space-y-4 p-5 sm:p-6">
      <div class="space-y-1">
        <h2 id="masukan-title" class="text-lg font-bold text-[#0C1117]">Beri Masukan Pengajuan</h2>
        <p class="text-[13px] text-[#6B7280]">Tuliskan masukan singkat untuk <strong x-text="masukanTarget?.authorName"></strong>.</p>
      </div>
      <div class="space-y-2">
        <div class="flex items-center justify-between gap-2">
          <label for="masukan-input" class="block text-[13px] font-semibold">Masukan reviewer</label>
          <span class="text-[11.5px] tabular-nums text-[#6B7280]" x-text="masukanText.length + '/150'"></span>
        </div>
        <textarea id="masukan-input" x-model="masukanText" @input="masukanError = ''" required autofocus rows="4" maxlength="150"
                  placeholder="Contoh: Rapikan ringkasan pengalaman microservices di CV sebelum saya teruskan ke tim HR."
                  class="w-full resize-y rounded-[10px] border border-[#E3E4E9] px-3 py-2.5 text-[13.5px] outline-none focus:border-[#3A5988]"></textarea>
        <p x-show="masukanError" x-text="masukanError" role="alert" class="text-[13px] text-red-700"></p>
      </div>
      <div class="flex flex-wrap justify-end gap-2">
        <button type="button" @click="$refs.masukanDialog.close()" class="rounded-[9px] border border-[#E3E4E9] px-4 py-2 text-[13px] font-semibold hover:bg-[#F4F5F7]">Batal</button>
        <button type="submit" class="rounded-[9px] bg-[#3A5988] px-4 py-2 text-[13px] font-semibold text-white hover:bg-[#496DA8]">Kirim Masukan</button>
      </div>
    </form>
  </dialog>

  <p x-show="toast" x-cloak x-text="toast" role="status"
     class="fixed bottom-5 right-5 z-[90] max-w-[calc(100vw-2.5rem)] rounded-xl bg-[#212224] px-4 py-3 text-[13px] text-white shadow-lg"></p>
</main>

<script>
  function bengkodReferralPengajuan() {
    const postId = new URLSearchParams(window.location.search).get("id");
    return {
      DEFAULT_AVATAR: typeof DEFAULT_AVATAR !== "undefined" ? DEFAULT_AVATAR : "",
      profile: referralCurrentProfile(),
      posts: [],
      filterStatus: "semua",
      masukanTarget: null,
      masukanText: "",
      masukanError: "",
      toast: "",
      toastTimer: null,
      chips: [
        { id: "semua", label: "Semua" },
        { id: "menunggu", label: "Menunggu" },
        { id: "dihubungi", label: "Dihubungi" },
        { id: "masukan", label: "Diberi Masukan" },
      ],

      init() {
        this.muat();
        window.addEventListener("storage", (e) => {
          if (e.key === "bengkod_posts") this.muat();
        });
      },

      muat() {
        const storedPosts = typeof loadPosts === "function" ? loadPosts() : [];
        const boardVacancies = typeof loadBoardVacancies === "function" ? loadBoardVacancies() : [];
        const map = new Map();

        storedPosts.forEach((p) => map.set(String(p.id), p));
        boardVacancies.forEach((v) => {
          if (!map.has(String(v.id))) {
            map.set(String(v.id), { ...v, jenis: "referral" });
          }
        });

        this.posts = Array.from(map.values());
      },

      get post() {
        return this.posts.find((p) => String(p.id) === String(postId) && p.jenis === "referral") || null;
      },

      get isClosed() {
        return this.post ? referralIsClosed(this.post) : false;
      },

      get pengajuan() {
        return (this.post && Array.isArray(this.post.pengajuan)) ? this.post.pengajuan : [];
      },

      get filtered() {
        if (this.filterStatus === "semua") return this.pengajuan;
        return this.pengajuan.filter((p) => p.status === this.filterStatus);
      },

      isMine(post) {
        return referralIsMine(post, this.profile && this.profile.name);
      },

      countBy(status) {
        if (status === "semua") return this.pengajuan.length;
        return this.pengajuan.filter((p) => p.status === status).length;
      },

      statusLabel(status) {
        return referralStatusLabel(status);
      },

      statusClass(status) {
        return referralStatusClass(status);
      },

      formatDate(iso) {
        return referralFormatDate(iso);
      },

      persistPosts() {
        if (typeof savePosts === "function") {
          savePosts(this.posts);
        }
      },

      ubahPelamar(pelamarId, statusBaru, pesanToast, masukan) {
        this.posts = this.posts.map((p) => {
          if (String(p.id) !== String(postId)) return p;
          const next = (p.pengajuan || []).map((item) => {
            if (item.id !== pelamarId) return item;
            return {
              ...item,
              status: statusBaru,
              masukan: masukan !== undefined ? masukan : item.masukan,
            };
          });
          return { ...p, pengajuan: next };
        });
        this.persistPosts();
        if (pesanToast) this.setToast(pesanToast);
      },

      openMasukanDialog(pelamar) {
        this.masukanTarget = pelamar;
        this.masukanText = pelamar.masukan || "";
        this.masukanError = "";
        this.$refs.masukanDialog.showModal();
      },

      submitMasukanDialog() {
        if (!this.masukanTarget) return;
        const teks = this.masukanText.trim().slice(0, 150);
        if (!teks) {
          this.masukanError = "Tuliskan masukan singkat terlebih dahulu.";
          return;
        }
        this.ubahPelamar(
          this.masukanTarget.id,
          "masukan",
          `Masukan dikirim ke ${this.masukanTarget.authorName}.`,
          teks
        );
        this.$refs.masukanDialog.close();
      },

      hubungiWa(pelamar) {
        this.ubahPelamar(pelamar.id, "dihubungi", `Membuka WhatsApp ${pelamar.authorName}.`);
        window.open(referralWaUrl(this.post, pelamar), "_blank", "noopener,noreferrer");
      },

      setToast(msg) {
        this.toast = msg;
        clearTimeout(this.toastTimer);
        this.toastTimer = setTimeout(() => { this.toast = ""; }, 2800);
      },
    };
  }
</script>
<script>mountAlumniPortal(document.querySelector("main"));</script>
</body>
</html>
