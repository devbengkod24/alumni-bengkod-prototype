<!DOCTYPE html>
<html lang="id" data-color-mode="light" class="h-full bg-[#EFF2F7]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Pelamar Referral | Portal Alumni Bengkel Koding UDINUS</title>
  <meta name="description" content="Kelola pengajuan pelamar untuk lowongan referral yang Anda bagikan.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    };
  </script>
  <style>
    [x-cloak] { display: none !important; }
    body { font-family: 'Inter', sans-serif; }
    #tolak-dialog::backdrop { background: rgba(15, 23, 42, 0.45); }
  </style>
  <script src="assets/js/alumni-data.js"></script>
  <script src="assets/js/alumni-catalog.js"></script>
  <script src="assets/js/alumni-profile-data.js"></script>
  <script src="assets/js/alumni-cv.js"></script>
  <script src="assets/js/alumni-referral.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="assets/js/portal-layout.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>
<body class="min-h-full bg-[#EFF2F7] font-sans text-[#212224] antialiased">
<main class="min-w-0 text-[#212224]" data-route="referral" x-data="bengkodReferralPengajuan()" x-init="init()">
  <div class="mx-auto w-full max-w-4xl space-y-5">
    <a href="referral.html" class="inline-flex items-center gap-1.5 text-[13px] font-medium text-[#3A5988] hover:underline">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      Kembali ke Lowongan Referral
    </a>

    <!-- Lowongan tidak ditemukan / bukan milik sendiri -->
    <div x-show="!post || !isMine(post)" x-cloak class="bg-white border border-[#E3E4E9] rounded-[12px] p-10 text-center shadow-[0_1px_3px_rgba(0,0,0,0.04)] space-y-2">
      <p class="text-[16px] font-semibold text-[#0C1117]">Lowongan referral tidak ditemukan</p>
      <p class="text-[13px] text-[#6B7280]">Lowongan ini sudah dihapus atau bukan referral yang Anda bagikan.</p>
      <div class="pt-2">
        <a href="referral.html" class="inline-flex items-center justify-center h-9 px-4 rounded-[8px] bg-[#3A5988] hover:bg-[#496DA8] text-white text-[13px] font-semibold transition-colors">
          Kembali ke Lowongan Referral
        </a>
      </div>
    </div>

    <template x-if="post && isMine(post)">
      <div class="space-y-5">
        <!-- Ringkasan Lowongan (mengikuti kartu Referral Saya di referral.html) -->
        <section class="bg-white border border-[#E3E4E9] rounded-[12px] p-5 shadow-[0_1px_3px_rgba(0,0,0,0.04)] space-y-4">
          <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4">
            <div class="flex items-start gap-3.5 min-w-0">
              <img :src="post.image || (post.id % 2 === 0 ? 'assets/project-city.jpg' : 'assets/project-fuji.webp')"
                   :alt="post.referral?.posisi || 'Lowongan Referral'"
                   class="w-[52px] h-[52px] rounded-[10px] object-cover border border-[#E3E4E9] shrink-0">
              <div class="min-w-0 space-y-1">
                <div class="flex flex-wrap items-center gap-2">
                  <h1 class="text-[18px] font-semibold text-[#0C1117] leading-snug" x-text="post.referral?.posisi || '-'"></h1>
                  <span class="px-2.5 py-0.5 rounded-full text-[11.5px] font-semibold border"
                        :class="isClosed ? 'bg-[#F4F5F7] text-[#6B7280] border-[#E3E4E9]' : 'bg-[#E9F7F8] text-[#2B7A5B] border-[#BDEEE5]'"
                        x-text="isClosed ? 'Ditutup' : 'Terbuka'"></span>
                </div>
                <p class="text-[13px] text-[#6B7280]">
                  <span class="text-[#3A5988] font-medium" x-text="post.referral?.perusahaan || '-'"></span>
                  <span> · </span>
                  <span x-text="post.referral?.level || 'Umum'"></span>
                  <template x-if="post.referral?.batas">
                    <span x-text="' · Batas review ' + formatDate(post.referral.batas)"></span>
                  </template>
                </p>
              </div>
            </div>
            <a :href="'detail-referral.html?id=' + encodeURIComponent(post.id)"
               class="h-9 px-3.5 rounded-[8px] border border-[#E3E4E9] bg-white hover:bg-[#F4F5F7] text-[#212224] text-[13px] font-medium inline-flex items-center justify-center shrink-0 transition-colors">
              Lihat Detail Lowongan
            </a>
          </div>

          <!-- Ringkasan singkat & Filter Status -->
          <div class="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-[#E3E4E9]">
            <div class="flex flex-wrap items-center gap-2" role="group" aria-label="Filter status pelamar">
              <template x-for="chip in chips" :key="chip.id">
                <button type="button"
                        @click="filterStatus = chip.id"
                        :aria-pressed="filterStatus === chip.id"
                        :class="filterStatus === chip.id ? 'bg-[#3A5988] text-white border-[#3A5988]' : 'bg-[#F4F5F7] text-[#212224] border-transparent hover:border-[#3A5988]/40'"
                        class="inline-flex items-center gap-1.5 h-8 px-3.5 rounded-full border text-[12.5px] font-semibold transition-colors">
                  <span x-text="chip.label"></span>
                  <span class="tabular-nums opacity-80" x-text="countBy(chip.id)"></span>
                </button>
              </template>
            </div>
            <p class="text-[12.5px] text-[#6B7280]" x-text="pengajuan.length + ' total pengajuan'"></p>
          </div>
        </section>

        <!-- Empty State -->
        <div x-show="filtered.length === 0" x-cloak class="bg-white border border-[#E3E4E9] rounded-[12px] p-10 text-center shadow-[0_1px_3px_rgba(0,0,0,0.04)] space-y-1.5">
          <p class="text-[15px] font-semibold text-[#0C1117]">Belum ada pelamar pada status ini</p>
          <p class="text-[13px] text-[#6B7280]">Coba pilih filter status lain atau tunggu pengajuan baru dari rekan alumni.</p>
        </div>

        <!-- Daftar Pelamar -->
        <div x-show="filtered.length > 0" class="space-y-3.5">
          <template x-for="pelamar in filtered" :key="pelamar.id">
            <article class="bg-white border border-[#E3E4E9] hover:border-[#3A5988]/40 rounded-[12px] p-5 shadow-[0_1px_3px_rgba(0,0,0,0.04)] transition-all space-y-4">
              <!-- Header Pelamar -->
              <div class="flex flex-wrap items-start justify-between gap-3">
                <div class="flex items-center gap-3 min-w-0">
                  <img :src="pelamar.authorAvatar || DEFAULT_AVATAR" :alt="pelamar.authorName"
                       class="w-11 h-11 rounded-full object-cover border border-[#E3E4E9] bg-[#F4F5F7] shrink-0">
                  <div class="min-w-0">
                    <h2 class="text-[15px] font-semibold text-[#0C1117] truncate" x-text="pelamar.authorName"></h2>
                    <p class="text-[12.5px] text-[#6B7280] truncate" x-text="pelamar.authorHeadline || 'Alumni Bengkel Koding'"></p>
                  </div>
                </div>
                <div class="flex flex-col items-end gap-1 shrink-0">
                  <span class="px-2.5 py-0.5 rounded-full text-[11.5px] font-semibold"
                        :class="statusClass(pelamar.status)"
                        x-text="statusLabel(pelamar.status)"></span>
                  <span class="text-[12px] text-[#6B7280]" x-text="'Diajukan ' + formatDate(pelamar.waktu)"></span>
                </div>
              </div>

              <!-- Pesan Perkenalan -->
              <div class="rounded-[10px] bg-[#F8FAFC] border border-[#E3E4E9] px-3.5 py-3">
                <p class="text-[11.5px] font-semibold text-[#6B7280] mb-1">Pesan Perkenalan &amp; Pitching</p>
                <p class="whitespace-pre-wrap break-words text-[13.5px] leading-relaxed text-[#212224]"
                   x-text="pelamar.pesan || 'Tidak ada pesan pengajuan.'"></p>
              </div>

              <!-- Catatan Penolakan (jika ditolak dan ada catatan) -->
              <div x-show="pelamar.masukan && normalizeStatus(pelamar.status) === 'ditolak'" x-cloak
                   class="rounded-[10px] bg-[#FEECEF]/70 border border-[#FAD2DF] px-3.5 py-2.5">
                <p class="text-[11.5px] font-semibold text-[#A95F77]">Catatan Penolakan</p>
                <p class="mt-0.5 whitespace-pre-wrap break-words text-[13px] text-[#212224]" x-text="pelamar.masukan"></p>
              </div>

              <!-- Dokumen & Aksi -->
              <div class="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-[#E3E4E9]">
                <div class="flex flex-wrap items-center gap-2">
                  <button type="button" @click="openCvViewer(pelamar.authorName)"
                          class="h-8 px-3 rounded-[8px] border border-[#E3E4E9] bg-white hover:border-[#3A5988] text-[#3A5988] text-[12.5px] font-semibold inline-flex items-center gap-1.5 transition-colors">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path stroke-linecap="round" stroke-linejoin="round" d="M14 2v6h6M16 13H8M16 17H8"/></svg>
                    Lihat CV
                  </button>
                  <template x-if="pelamar.linkedin">
                    <a :href="pelamar.linkedin" target="_blank" rel="noopener noreferrer"
                       class="h-8 px-3 rounded-[8px] border border-[#E3E4E9] bg-white hover:border-[#3A5988] text-[#212224] hover:text-[#3A5988] text-[12.5px] font-medium inline-flex items-center gap-1 transition-colors">
                      LinkedIn <span aria-hidden="true">↗</span>
                    </a>
                  </template>
                  <a :href="waUrl(pelamar)" target="_blank" rel="noopener noreferrer"
                     class="h-8 px-3 rounded-[8px] border border-[#E3E4E9] bg-white hover:border-[#3A5988] text-[#212224] hover:text-[#3A5988] text-[12.5px] font-medium inline-flex items-center gap-1 transition-colors">
                    WhatsApp <span aria-hidden="true">↗</span>
                  </a>
                </div>

                <div class="flex flex-wrap items-center gap-2">
                  <template x-if="normalizeStatus(pelamar.status) === 'menunggu'">
                    <div class="flex items-center gap-2">
                      <button type="button" @click="openTolakDialog(pelamar)"
                              class="h-9 px-3.5 rounded-[8px] border border-[#FAD2DF] bg-[#FEECEF]/70 hover:bg-[#FEECEF] text-[#A95F77] text-[13px] font-semibold transition-colors">
                        Tolak
                      </button>
                      <button type="button" @click="ubahStatus(pelamar.id, 'diterima', 'Pengajuan ' + pelamar.authorName + ' diterima.')"
                              class="h-9 px-4 rounded-[8px] bg-[#3A5988] hover:bg-[#496DA8] text-white text-[13px] font-semibold transition-colors">
                        Terima
                      </button>
                    </div>
                  </template>
                  <template x-if="normalizeStatus(pelamar.status) !== 'menunggu'">
                    <button type="button" @click="ubahStatus(pelamar.id, 'menunggu', 'Status ' + pelamar.authorName + ' dikembalikan ke Menunggu.', '')"
                            class="h-8 px-3 rounded-[8px] border border-[#E3E4E9] bg-white hover:bg-[#F4F5F7] text-[#6B7280] text-[12.5px] font-medium transition-colors">
                      Reset ke Menunggu
                    </button>
                  </template>
                </div>
              </div>
            </article>
          </template>
        </div>
      </div>
    </template>
  </div>

  <!-- Modal Tolak Pengajuan -->
  <dialog id="tolak-dialog" x-ref="tolakDialog" aria-labelledby="tolak-title"
          @click.self="$el.close()" @close="tolakTarget = null; tolakAlasan = ''"
          class="m-auto max-h-[calc(100%-2rem)] w-[calc(100%-2rem)] max-w-md overflow-y-auto rounded-[12px] border border-[#E3E4E9] bg-white text-[#212224] shadow-xl">
    <form @submit.prevent="submitTolakDialog()" class="space-y-4 p-5 sm:p-6">
      <div class="space-y-1">
        <h2 id="tolak-title" class="text-[16px] font-bold text-[#0C1117]">Tolak Pengajuan Referral</h2>
        <p class="text-[13px] text-[#6B7280]">Konfirmasi penolakan pengajuan dari <strong x-text="tolakTarget?.authorName"></strong>.</p>
      </div>
      <div class="space-y-1.5">
        <div class="flex items-center justify-between gap-2">
          <label for="tolak-alasan" class="block text-[13px] font-semibold">Catatan singkat (opsional)</label>
          <span class="text-[11.5px] tabular-nums text-[#6B7280]" x-text="tolakAlasan.length + '/150'"></span>
        </div>
        <textarea id="tolak-alasan" x-model="tolakAlasan" rows="3" maxlength="150"
                  placeholder="Contoh: Pengalaman yang dicari saat ini lebih fokus ke Go / microservices."
                  class="w-full resize-y rounded-[8px] border border-[#E3E4E9] px-3 py-2 text-[13px] outline-none focus:border-[#3A5988]"></textarea>
      </div>
      <div class="flex flex-wrap justify-end gap-2">
        <button type="button" @click="$refs.tolakDialog.close()"
                class="h-9 px-3.5 rounded-[8px] border border-[#E3E4E9] bg-white hover:bg-[#F4F5F7] text-[13px] font-medium">
          Batal
        </button>
        <button type="submit"
                class="h-9 px-4 rounded-[8px] bg-[#A95F77] hover:bg-[#914D63] text-white text-[13px] font-semibold">
          Tolak Pengajuan
        </button>
      </div>
    </form>
  </dialog>

  <p x-show="toast" x-cloak x-text="toast" role="status"
     class="fixed bottom-5 right-5 z-[90] max-w-[calc(100vw-2.5rem)] rounded-xl bg-[#212224] px-4 py-3 text-[13px] text-white shadow-lg"></p>
</main>

<script>
  function bengkodReferralPengajuan() {
    const postId = new URLSearchParams(window.location.search).get("id");
    return {
      DEFAULT_AVATAR: typeof DEFAULT_AVATAR !== "undefined" ? DEFAULT_AVATAR : "",
      profile: referralCurrentProfile(),
      posts: [],
      filterStatus: "semua",
      tolakTarget: null,
      tolakAlasan: "",
      toast: "",
      toastTimer: null,
      chips: [
        { id: "semua", label: "Semua" },
        { id: "menunggu", label: "Menunggu" },
        { id: "diterima", label: "Diterima" },
        { id: "ditolak", label: "Ditolak" },
      ],

      init() {
        this.muat();
        window.addEventListener("storage", (e) => {
          if (e.key === "bengkod_posts") this.muat();
        });
      },

      muat() {
        const storedPosts = typeof loadPosts === "function" ? loadPosts() : [];
        const boardVacancies = typeof loadBoardVacancies === "function" ? loadBoardVacancies() : [];
        const map = new Map();

        storedPosts.forEach((p) => map.set(String(p.id), p));
        boardVacancies.forEach((v) => {
          if (!map.has(String(v.id))) {
            map.set(String(v.id), { ...v, jenis: "referral" });
          }
        });

        this.posts = Array.from(map.values());
      },

      get post() {
        return this.posts.find((p) => String(p.id) === String(postId) && p.jenis === "referral") || null;
      },

      get isClosed() {
        return this.post ? referralIsClosed(this.post) : false;
      },

      get pengajuan() {
        return (this.post && Array.isArray(this.post.pengajuan)) ? this.post.pengajuan : [];
      },

      normalizeStatus(status) {
        if (status === "diterima" || status === "dihubungi") return "diterima";
        if (status === "ditolak") return "ditolak";
        return "menunggu";
      },

      get filtered() {
        if (this.filterStatus === "semua") return this.pengajuan;
        return this.pengajuan.filter((p) => this.normalizeStatus(p.status) === this.filterStatus);
      },

      isMine(post) {
        return referralIsMine(post, this.profile && this.profile.name);
      },

      countBy(status) {
        if (status === "semua") return this.pengajuan.length;
        return this.pengajuan.filter((p) => this.normalizeStatus(p.status) === status).length;
      },

      statusLabel(status) {
        return referralStatusLabel(this.normalizeStatus(status));
      },

      statusClass(status) {
        return referralStatusClass(this.normalizeStatus(status));
      },

      formatDate(iso) {
        return referralFormatDate(iso);
      },

      waUrl(pelamar) {
        return referralWaUrl(this.post, pelamar, this.profile && this.profile.name);
      },

      persistPosts() {
        if (typeof savePosts === "function") {
          savePosts(this.posts);
        }
      },

      ubahStatus(pelamarId, statusBaru, pesanToast, catatan) {
        this.posts = this.posts.map((p) => {
          if (String(p.id) !== String(postId)) return p;
          const next = (p.pengajuan || []).map((item) => {
            if (item.id !== pelamarId) return item;
            return {
              ...item,
              status: statusBaru,
              masukan: catatan !== undefined ? catatan : item.masukan,
            };
          });
          return { ...p, pengajuan: next };
        });
        this.persistPosts();
        if (pesanToast) this.setToast(pesanToast);
      },

      openTolakDialog(pelamar) {
        this.tolakTarget = pelamar;
        this.tolakAlasan = pelamar.masukan || "";
        this.$refs.tolakDialog.showModal();
      },

      submitTolakDialog() {
        if (!this.tolakTarget) return;
        const catatan = this.tolakAlasan.trim().slice(0, 150);
        this.ubahStatus(
          this.tolakTarget.id,
          "ditolak",
          `Pengajuan ${this.tolakTarget.authorName} ditolak.`,
          catatan
        );
        this.$refs.tolakDialog.close();
      },

      setToast(msg) {
        this.toast = msg;
        clearTimeout(this.toastTimer);
        this.toastTimer = setTimeout(() => { this.toast = ""; }, 2800);
      },
    };
  }
</script>
<script>mountAlumniPortal(document.querySelector("main"));</script>
</body>
</html>
