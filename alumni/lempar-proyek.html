<!DOCTYPE html>
<html lang="id" data-color-mode="light" class="h-full bg-[#EFF2F7]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lempar Proyek Baru | Portal Alumni Bengkel Koding</title>
  <meta name="description" content="Publikasikan tawaran kolaborasi proyek, tender freelance, atau pembentukan tim untuk sesama alumni Bengkel Koding UDINUS.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/alumni-data.js"></script>
  <script src="assets/js/alumni-profile-data.js"></script>
  <script src="assets/js/alumni-catalog.js"></script>
  <script src="assets/js/portal-layout.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    [x-cloak]:not(body) { display: none !important; }
    body { font-family: "Inter", sans-serif; }
  </style>
</head>
<body class="h-full bg-[#EFF2F7] text-[#212224] antialiased selection:bg-[#3A5988] selection:text-white" x-data="lemparProyekPage()">
  <main data-route="lempar-proyek" class="flex-1 p-6 lg:p-8 w-full max-w-[1400px] mx-auto space-y-6">
    <div>
      <a href="gigs.html" class="inline-flex items-center gap-1.5 text-[13.5px] font-medium text-[#6B7280] hover:text-[#3A5988] transition-colors mb-3">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        <span>Kembali ke Gigs &amp; Proyek</span>
      </a>
      <h1 class="text-[26px] font-semibold text-[#0C1117] tracking-[-0.01em]">Lempar Proyek Baru</h1>
      <p class="mt-1 text-[14px] text-[#6B7280]">Buka kolaborasi side-project, tender freelance, atau rekrutmen tim internal antar-alumni Bengkel Koding.</p>
    </div>

    <form @submit.prevent="submitForm()" class="space-y-6 rounded-[16px] border border-[#E3E4E9] bg-white p-6 shadow-sm lg:p-8">
      <!-- 1. Informasi Pokok Proyek -->
      <div class="space-y-4">
        <h3 class="text-[15px] font-bold text-[#0C1117]">1. Informasi Pokok Proyek</h3>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="space-y-1.5 sm:col-span-2">
            <label for="gig-title" class="block text-[13.5px] font-medium text-[#212224]">
              Judul Proyek <span class="text-red-500">*</span>
            </label>
            <input type="text"
                   id="gig-title"
                   x-model="form.title"
                   required
                   placeholder="Contoh: Redesign Aplikasi Mobile Bengkod"
                   class="w-full h-11 px-3.5 rounded-[10px] border border-[#E3E4E9] bg-white focus:outline-none focus:border-[#3A5988] text-[14px]">
          </div>

          <div class="space-y-1.5">
            <label for="gig-category" class="block text-[13.5px] font-medium text-[#212224]">
              Kategori <span class="text-red-500">*</span>
            </label>
            <select id="gig-category"
                    x-model="form.category"
                    class="w-full h-11 px-3.5 rounded-[10px] border border-[#E3E4E9] bg-white focus:outline-none focus:border-[#3A5988] text-[14px]">
              <option value="Mobile App">Mobile App</option>
              <option value="Frontend Development">Frontend Development</option>
              <option value="Backend API">Backend API</option>
              <option value="UI/UX &amp; Web Design">UI/UX &amp; Web Design</option>
              <option value="Data Science &amp; AI">Data Science &amp; AI</option>
              <option value="QA &amp; Testing">QA &amp; Testing</option>
            </select>
          </div>

          <div class="space-y-1.5">
            <label for="gig-budget" class="block text-[13.5px] font-medium text-[#212224]">
              Rentang Budget <span class="text-red-500">*</span>
            </label>
            <select id="gig-budget"
                    x-model="form.budgetRange"
                    class="w-full h-11 px-3.5 rounded-[10px] border border-[#E3E4E9] bg-white focus:outline-none focus:border-[#3A5988] text-[14px]">
              <template x-for="b in budgetOptions" :key="b">
                <option :value="b" x-text="b"></option>
              </template>
            </select>
          </div>

          <div class="space-y-1.5">
            <label for="gig-deadline" class="block text-[13.5px] font-medium text-[#212224]">
              Target Selesai <span class="text-red-500">*</span>
            </label>
            <input type="date"
                   id="gig-deadline"
                   x-model="form.deadline"
                   :min="todayStr"
                   required
                   class="w-full h-11 px-3.5 rounded-[10px] border border-[#E3E4E9] bg-white focus:outline-none focus:border-[#3A5988] text-[14px]">
          </div>

          <div class="space-y-1.5">
            <label for="gig-quota" class="block text-[13.5px] font-medium text-[#212224]">
              Kuota Tim <span class="text-red-500">*</span>
            </label>
            <input type="number"
                   id="gig-quota"
                   min="1"
                   max="10"
                   x-model="form.quota"
                   required
                   class="w-full h-11 px-3.5 rounded-[10px] border border-[#E3E4E9] bg-white focus:outline-none focus:border-[#3A5988] text-[14px]">
          </div>
        </div>
      </div>

      <!-- 2. Spesifikasi Tim & Teknologi -->
      <div class="space-y-4 pt-2">
        <h3 class="text-[15px] font-bold text-[#0C1117]">2. Spesifikasi Tim &amp; Teknologi</h3>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="space-y-1.5">
            <label for="gig-roles" class="block text-[13.5px] font-medium text-[#212224]">
              Peran yang Dicari <span class="font-normal text-[#6B7280]">(Pisahkan koma)</span>
            </label>
            <input type="text"
                   id="gig-roles"
                   x-model="form.rolesNeeded"
                   placeholder="UI/UX Designer, Flutter Dev"
                   class="w-full h-11 px-3.5 rounded-[10px] border border-[#E3E4E9] bg-white focus:outline-none focus:border-[#3A5988] text-[14px]">
          </div>

          <div class="space-y-1.5">
            <label for="gig-stack" class="block text-[13.5px] font-medium text-[#212224]">
              Tech Stack &amp; Tools <span class="font-normal text-[#6B7280]">(Pisahkan koma)</span>
            </label>
            <input type="text"
                   id="gig-stack"
                   x-model="form.techStack"
                   placeholder="Flutter, Dart, Firebase"
                   class="w-full h-11 px-3.5 rounded-[10px] border border-[#E3E4E9] bg-white focus:outline-none focus:border-[#3A5988] text-[14px]">
          </div>
        </div>
      </div>

      <!-- 3. Ruang Lingkup & Deliverables -->
      <div class="space-y-4 pt-2">
        <h3 class="text-[15px] font-bold text-[#0C1117]">3. Ruang Lingkup &amp; Deliverables</h3>

        <div class="space-y-1.5">
          <label for="gig-desc" class="block text-[13.5px] font-medium text-[#212224]">
            Deskripsi Lengkap &amp; Deliverables <span class="text-red-500">*</span>
          </label>
          <textarea rows="5"
                    id="gig-desc"
                    x-model="form.description"
                    required
                    placeholder="Jelaskan gambaran proyek, fitur inti yang harus selesai, dan target luaran..."
                    class="w-full p-3.5 rounded-[10px] border border-[#E3E4E9] bg-white focus:outline-none focus:border-[#3A5988] text-[14px] leading-relaxed resize-none"></textarea>
        </div>
      </div>

      <p x-cloak x-show="error" x-text="error" role="alert" class="rounded-md bg-red-50 px-3 py-2 text-sm text-red-700"></p>

      <div class="flex flex-wrap items-center justify-end gap-3 border-t border-[#E3E4E9] pt-4">
        <a href="gigs.html"
           class="inline-flex h-10 items-center rounded-[8px] border border-[#E3E4E9] px-5 text-[13.5px] font-medium text-[#212224] transition-colors hover:bg-[#F4F5F7]">
          Batal
        </a>
        <button type="submit"
                :disabled="!isValid"
                class="h-10 rounded-[8px] bg-[#3A5988] px-6 text-[13.5px] font-medium text-white shadow-sm transition-colors hover:bg-[#496DA8] disabled:cursor-not-allowed disabled:opacity-50">
          Terbitkan Proyek
        </button>
      </div>
    </form>
  </main>

<script>
  function lemparProyekPage() {
    const budgetOptions = typeof GIGS_BUDGET_RANGES !== "undefined"
      ? GIGS_BUDGET_RANGES
      : ["< Rp 1.000.000", "Rp 1.000.000 - Rp 3.000.000", "Rp 3.000.000 - Rp 5.000.000", "> Rp 5.000.000", "Bagi Hasil / Equity"];
    const profile = alumniProfileForBoard();

    return {
      budgetOptions,
      todayStr: new Date().toISOString().slice(0, 10),
      error: "",
      form: {
        title: "",
        category: "Mobile App",
        budgetRange: budgetOptions[1] || budgetOptions[0],
        deadline: new Date(Date.now() + 25 * 86400000).toISOString().slice(0, 10),
        quota: 1,
        rolesNeeded: "",
        techStack: "",
        description: "",
      },

      get isValid() {
        return Boolean(this.form.title.trim() && this.form.deadline && this.form.description.trim());
      },

      submitForm() {
        if (!this.isValid) {
          this.error = "Harap lengkapi judul proyek, target selesai, dan deskripsi deliverables.";
          return;
        }
        this.error = "";
        const roles = this.form.rolesNeeded.split(",").map(r => r.trim()).filter(Boolean);
        const tech = this.form.techStack.split(",").map(t => t.trim()).filter(Boolean);
        const newGig = {
          id: "gig-" + Date.now(),
          title: this.form.title.trim(),
          category: this.form.category,
          ownerId: profile.id,
          ownerName: profile.name,
          ownerRole: profile.headline,
          budgetRange: this.form.budgetRange,
          deadline: this.form.deadline,
          postedDate: new Date().toISOString().slice(0, 10),
          quota: parseInt(this.form.quota, 10) || 1,
          status: "Terbuka",
          rolesNeeded: roles.length ? roles : ["Developer"],
          techStack: tech.length ? tech : ["General"],
          description: this.form.description.trim(),
          applicantsCount: 0,
        };

        if (!saveBoardGig(newGig)) {
          this.error = "Proyek gagal disimpan. Periksa penyimpanan browser Anda.";
          return;
        }
        try {
          sessionStorage.setItem("bengkod_toast", "Proyek berhasil dilempar ke board alumni!");
        } catch {}
        window.location.href = "gigs.html?tab=my_gigs";
      },
    };
  }

  document.addEventListener("alpine:init", () => {
    Alpine.data("lemparProyekPage", lemparProyekPage);
  });
</script>
  <script>mountAlumniPortal(document.querySelector('main'));</script>
</body>
</html>
