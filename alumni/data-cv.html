<!DOCTYPE html>
<html lang="id" data-color-mode="light" class="h-full bg-[#EFF2F7]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data CV | Portal Alumni Bengkel Koding UDINUS</title>
  <meta name="description" content="Kelola data dan buat Curriculum Vitae profesional otomatis langsung dari profil alumni Bengkel Koding Universitas Dian Nuswantoro.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            canvas: '#EFF2F7',
            card: '#FFFFFF',
            filter: '#F4F5F7',
            borderline: '#E3E4E9',
            primary: {
              DEFAULT: '#3A5988',
              hover: '#496DA8',
              pressed: '#2F4B76',
            },
            accent: '#326ECE',
            headline: '#0C1117',
            bodytext: '#212224',
            mutedtext: '#6B7280',
            placeholder: '#91969C'
          }
        }
      }
    }
  </script>
  <style>
    [x-cloak]:not(body) { display: none !important; }
    body { font-family: "Inter", sans-serif; display: block !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

    @media print {
      @page {
        size: A4 portrait;
        margin: 10mm 12mm;
      }
      html, body {
        background: #ffffff !important;
        color: #000000 !important;
        font-family: 'Inter', Arial, sans-serif !important;
        margin: 0 !important;
        padding: 0 !important;
        min-height: auto !important;
        height: auto !important;
      }
      aside, header, #cv-controls-panel, #cv-page-header, .no-print {
        display: none !important;
      }
      main, .cv-sheet-container {
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        box-shadow: none !important;
        border: none !important;
      }
      #cv-document {
        box-shadow: none !important;
        border: none !important;
        border-radius: 0 !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
      }
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>

  <script>
    function bengkodCvApp() {
      return {
        toast: '',
        toastTimer: null,
        cvLayout: 'ats', // 'ats' | 'modern'
        showSectionDropdown: false,
        sections: {
          about: true,
          education: true,
          experience: true,
          projects: true,
          skills: true,
          certifications: true
        },
        profile: {
          name: "Aisha Dwi Rahmawati",
          title: "Mobile & Full-Stack Developer",
          email: "aisha.rahma@alumni.dinus.ac.id",
          phone: "+62 812-3456-7890",
          location: "Semarang, Jawa Tengah, Indonesia",
          linkedin: "linkedin.com/in/aishadwirahma",
          github: "github.com/aishaadr",
          about: "Lulusan S1 Teknik Informatika Universitas Dian Nuswantoro (IPK 3.89) dengan rekam jejak sebagai Asisten Laboratorium Bengkel Koding selama 4 semester. Memiliki pengalaman profesional membangun aplikasi mobile berskala produksi (Flutter, React Native) dan arsitektur backend berbasis Go dan Node.js.",
          education: [
            {
              degree: "Sarjana Komputer (S.Kom) - Teknik Informatika",
              school: "Universitas Dian Nuswantoro (UDINUS), Semarang",
              period: "2020 – 2024",
              gpa: "IPK: 3.89 / 4.00 (Cum Laude)",
              desc: "Fokus studi: Rekayasa Perangkat Lunak & Sistem Terdistribusi. Penerima beasiswa prestasi akademik 2022-2023."
            }
          ],
          experience: [
            {
              role: "Mobile Software Engineer",
              company: "PT Teknologi Nusantara Raya, Jakarta (Remote)",
              period: "Jan 2024 – Sekarang",
              desc: "Mengembangkan fitur core payment dan loyalty rewards pada aplikasi mobile multi-platform menggunakan Flutter & Riverpod. Mengurangi rasio crash aplikasi sebesar 42% melalui implementasi automated testing."
            },
            {
              role: "Lead Student Assistant & Mentor Pemrograman",
              company: "Laboratorium Bengkel Koding UDINUS",
              period: "Agu 2022 – Des 2023",
              desc: "Memimpin tim asisten lab untuk 120+ mahasiswa praktikum rekayasa web dan algoritma. Menginisiasi repository template boilerplate starter-kit yang dipakai 300+ asisten dan praktikan."
            }
          ],
          projects: [
            {
              title: "Sentimeter AI - Sentiment Analyzer",
              role: "Lead Full-Stack Developer",
              period: "2024",
              stack: "Python, FastAPI, Flutter, PostgreSQL",
              desc: "Platform otomasi analisis sentimen ulasan pengguna e-commerce dengan akurasi model Transformer 92.4% dan response time di bawah 180ms."
            },
            {
              title: "Simas BK - Sistem Manajemen Aset Lab",
              role: "Frontend Developer",
              period: "2023",
              stack: "Vue 3, Tailwind CSS, Laravel REST API",
              desc: "Sistem inventarisasi perangkat komputer dan jadwal laboratorium interaktif dengan scanning QR Code fisik."
            }
          ],
          skills: [
            "Dart & Flutter",
            "JavaScript & TypeScript",
            "React / Next.js",
            "Go (Golang)",
            "Node.js & Express",
            "PostgreSQL & MySQL",
            "Tailwind CSS",
            "Docker & CI/CD",
            "RESTful API & GraphQL",
            "Git & GitHub Workflow"
          ],
          certifications: [
            "Google Certified Associate Cloud Engineer (2024)",
            "Dicoding Certified Multi-Platform App Developer Expert (2023)",
            "TOEFL ITP Score 580 (2023)"
          ]
        },
        setToast(msg) {
          this.toast = msg;
          clearTimeout(this.toastTimer);
          this.toastTimer = setTimeout(() => { this.toast = ''; }, 3000);
        },
        printCv() {
          window.print();
        },
        handleLogout() {
          if (confirm('Keluar dari Portal Alumni Bengkel Koding?')) {
            window.location.href = 'login.html';
          }
        }
      };
    }
  </script>
  <script src="assets/js/portal-layout.js"></script>
</head>
<body class="h-full bg-[#EFF2F7] text-[#212224] antialiased" x-data="bengkodCvApp()" x-cloak>

  <!-- Toast Notifikasi -->
  <template x-if="toast">
    <div class="fixed bottom-6 right-6 z-[150] bg-[#0C1117] text-white px-5 py-3 rounded-[10px] shadow-xl flex items-center gap-3 border border-[#E3E4E9] text-[13.5px]">
      <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
      <span x-text="toast"></span>
    </div>
  </template>

      <main class="flex-1 p-6 lg:p-8 space-y-6 overflow-y-auto">

        <!-- HEADER HALAMAN & AKSI CEPAT -->
        <div id="cv-page-header" class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div>
            <h1 class="text-2xl lg:text-[26px] font-bold text-[#0C1117] tracking-tight">Data CV Profesional</h1>
            <p class="text-[14px] text-[#6B7280] mt-0.5">
              Generate dokumen Curriculum Vitae terstandarisasi langsung dari data profil dan rekam jejak Bengkel Koding.
            </p>
          </div>
          <div class="flex items-center gap-3 shrink-0">
            <a href="profil.html" class="h-10 px-4 rounded-[8px] border border-[#E3E4E9] bg-white hover:bg-[#F4F5F7] text-[13.5px] font-medium text-[#212224] inline-flex items-center gap-2 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
              <span>Edit Data Profil</span>
            </a>
            <button type="button" @click="printCv()"
                    class="h-10 px-5 rounded-[8px] bg-[#3A5988] hover:bg-[#496DA8] active:bg-[#2F4B76] text-white text-[13.5px] font-semibold inline-flex items-center gap-2 transition-colors shadow-sm cursor-pointer">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
              <span>Cetak / Unduh PDF</span>
            </button>
          </div>
        </div>

        <!-- PANEL PENGATURAN KUSTOMISASI FORMAT & BAGIAN CV -->
        <div id="cv-controls-panel" class="bg-white border border-[#E3E4E9] rounded-[12px] p-4 lg:p-5 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4">
          <div>
            <h2 class="text-[15px] font-semibold text-[#0C1117]">Pengaturan Format Dokumen</h2>
            <p class="text-[13px] text-[#6B7280] mt-0.5">Pilih gaya tata letak dan sesuaikan bagian resume yang ingin ditampilkan.</p>
          </div>

          <div class="flex items-center gap-3 flex-wrap">
            <!-- Selector Format ATS vs Modern -->
            <div class="p-1 bg-[#F4F5F7] rounded-[8px] inline-flex items-center gap-1 text-[13px]">
              <button type="button" @click="cvLayout = 'ats'"
                      class="px-3.5 py-1.5 rounded-[6px] font-medium transition-colors"
                      :class="cvLayout === 'ats' ? 'bg-white text-[#0C1117] shadow-xs font-semibold' : 'text-[#6B7280] hover:text-[#0C1117]'">
                ATS Standard
              </button>
              <button type="button" @click="cvLayout = 'modern'"
                      class="px-3.5 py-1.5 rounded-[6px] font-medium transition-colors"
                      :class="cvLayout === 'modern' ? 'bg-white text-[#0C1117] shadow-xs font-semibold' : 'text-[#6B7280] hover:text-[#0C1117]'">
                Modern Clean
              </button>
            </div>

            <!-- Toggle Bagian CV Dropdown -->
            <div class="relative" @click.outside="showSectionDropdown = false">
              <button type="button" @click="showSectionDropdown = !showSectionDropdown"
                      class="h-9 px-3.5 rounded-[8px] border border-[#E3E4E9] bg-white hover:bg-[#F4F5F7] text-[13px] font-medium text-[#212224] inline-flex items-center gap-2 transition-colors cursor-pointer">
                <svg class="w-4 h-4 text-[#6B7280]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/></svg>
                <span>Bagian CV</span>
                <svg class="w-3.5 h-3.5 text-[#6B7280]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
              </button>

              <div x-show="showSectionDropdown"
                   class="absolute right-0 mt-2 w-64 bg-white rounded-[10px] shadow-lg border border-[#E3E4E9] p-3 z-30 space-y-2 text-[13px]">
                <div class="text-[11.5px] font-semibold text-[#6B7280] uppercase tracking-wider px-1 pb-1 border-b border-[#E3E4E9]">
                  Tampilkan Bagian
                </div>
                <label class="flex items-center gap-2.5 px-1 py-1 hover:bg-[#F4F5F7] rounded cursor-pointer">
                  <input type="checkbox" x-model="sections.about" class="rounded text-[#3A5988]">
                  <span>Ringkasan Tentang Saya</span>
                </label>
                <label class="flex items-center gap-2.5 px-1 py-1 hover:bg-[#F4F5F7] rounded cursor-pointer">
                  <input type="checkbox" x-model="sections.experience" class="rounded text-[#3A5988]">
                  <span>Pengalaman Kerja</span>
                </label>
                <label class="flex items-center gap-2.5 px-1 py-1 hover:bg-[#F4F5F7] rounded cursor-pointer">
                  <input type="checkbox" x-model="sections.projects" class="rounded text-[#3A5988]">
                  <span>Proyek Unggulan</span>
                </label>
                <label class="flex items-center gap-2.5 px-1 py-1 hover:bg-[#F4F5F7] rounded cursor-pointer">
                  <input type="checkbox" x-model="sections.skills" class="rounded text-[#3A5988]">
                  <span>Keahlian & Tech Stack</span>
                </label>
                <label class="flex items-center gap-2.5 px-1 py-1 hover:bg-[#F4F5F7] rounded cursor-pointer">
                  <input type="checkbox" x-model="sections.education" class="rounded text-[#3A5988]">
                  <span>Pendidikan Resmi</span>
                </label>
                <label class="flex items-center gap-2.5 px-1 py-1 hover:bg-[#F4F5F7] rounded cursor-pointer">
                  <input type="checkbox" x-model="sections.certifications" class="rounded text-[#3A5988]">
                  <span>Sertifikasi Profesional</span>
                </label>
              </div>
            </div>
          </div>
        </div>

        <!-- ========================================================
             CANVAS PRATINJAU DOKUMEN CV (A4 FORMAT)
        ======================================================== -->
        <div class="cv-sheet-container flex justify-center py-2">
          
          <div id="cv-document" class="w-full max-w-[820px] bg-white rounded-[12px] border border-[#E3E4E9] shadow-sm p-8 sm:p-12 text-[#212224] transition-all">

            <!-- ===================== FORMAT ATS STANDAR ===================== -->
            <template x-if="cvLayout === 'ats'">
              <div class="space-y-6">
                <!-- Header ATS -->
                <div class="text-center pb-5 border-b border-[#E3E4E9] space-y-1.5">
                  <h2 class="text-2xl sm:text-[28px] font-bold text-[#0C1117] tracking-tight" x-text="profile.name"></h2>
                  <p class="text-[15px] font-medium text-[#3A5988]" x-text="profile.title"></p>
                  <div class="flex flex-wrap items-center justify-center gap-x-4 gap-y-1 text-[13px] text-[#6B7280] pt-1">
                    <span x-text="profile.location"></span>
                    <span>•</span>
                    <span x-text="profile.email"></span>
                    <span>•</span>
                    <span x-text="profile.phone"></span>
                    <span>•</span>
                    <span x-text="profile.linkedin"></span>
                  </div>
                </div>

                <!-- Ringkasan Profil -->
                <template x-if="sections.about">
                  <div class="space-y-2">
                    <h3 class="text-[14px] font-bold text-[#0C1117] uppercase tracking-wider border-b border-[#E3E4E9] pb-1">
                      Ringkasan Profesional
                    </h3>
                    <p class="text-[13.5px] text-[#212224] leading-relaxed" x-text="profile.about"></p>
                  </div>
                </template>

                <!-- Pengalaman Kerja -->
                <template x-if="sections.experience">
                  <div class="space-y-3">
                    <h3 class="text-[14px] font-bold text-[#0C1117] uppercase tracking-wider border-b border-[#E3E4E9] pb-1">
                      Pengalaman Kerja
                    </h3>
                    <div class="space-y-3">
                      <template x-for="exp in profile.experience" :key="exp.company">
                        <div class="space-y-1">
                          <div class="flex flex-col sm:flex-row sm:items-center justify-between text-[13.5px]">
                            <span class="font-bold text-[#0C1117]" x-text="exp.role + ' · ' + exp.company"></span>
                            <span class="text-[12.5px] text-[#6B7280]" x-text="exp.period"></span>
                          </div>
                          <p class="text-[13px] text-[#4B5563] leading-relaxed" x-text="exp.desc"></p>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>

                <!-- Proyek Unggulan -->
                <template x-if="sections.projects">
                  <div class="space-y-3">
                    <h3 class="text-[14px] font-bold text-[#0C1117] uppercase tracking-wider border-b border-[#E3E4E9] pb-1">
                      Proyek Rekayasa Perangkat Lunak
                    </h3>
                    <div class="space-y-3">
                      <template x-for="proj in profile.projects" :key="proj.title">
                        <div class="space-y-1">
                          <div class="flex flex-col sm:flex-row sm:items-center justify-between text-[13.5px]">
                            <div>
                              <span class="font-bold text-[#0C1117]" x-text="proj.title"></span>
                              <span class="text-[#6B7280] font-normal" x-text="' (' + proj.stack + ')'"></span>
                            </div>
                            <span class="text-[12.5px] text-[#6B7280]" x-text="proj.period"></span>
                          </div>
                          <p class="text-[13px] text-[#4B5563] leading-relaxed" x-text="proj.desc"></p>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>

                <!-- Keahlian Teknis -->
                <template x-if="sections.skills">
                  <div class="space-y-2">
                    <h3 class="text-[14px] font-bold text-[#0C1117] uppercase tracking-wider border-b border-[#E3E4E9] pb-1">
                      Keahlian Teknis & Tools
                    </h3>
                    <p class="text-[13px] text-[#212224] leading-relaxed">
                      <span class="font-semibold text-[#0C1117]">Teknologi: </span>
                      <span x-text="profile.skills.join(', ')"></span>
                    </p>
                  </div>
                </template>

                <!-- Pendidikan -->
                <template x-if="sections.education">
                  <div class="space-y-3">
                    <h3 class="text-[14px] font-bold text-[#0C1117] uppercase tracking-wider border-b border-[#E3E4E9] pb-1">
                      Pendidikan Formal
                    </h3>
                    <template x-for="edu in profile.education" :key="edu.degree">
                      <div class="space-y-1">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between text-[13.5px]">
                          <div>
                            <span class="font-bold text-[#0C1117]" x-text="edu.degree"></span>
                            <div class="text-[#4B5563]" x-text="edu.school"></div>
                          </div>
                          <span class="text-[12.5px] text-[#6B7280]" x-text="edu.period"></span>
                        </div>
                        <p class="text-[12.5px] text-[#6B7280]" x-text="edu.gpa + ' • ' + edu.desc"></p>
                      </div>
                    </template>
                  </div>
                </template>

                <!-- Sertifikasi -->
                <template x-if="sections.certifications">
                  <div class="space-y-2">
                    <h3 class="text-[14px] font-bold text-[#0C1117] uppercase tracking-wider border-b border-[#E3E4E9] pb-1">
                      Sertifikasi & Lisensi
                    </h3>
                    <ul class="list-disc list-inside text-[13px] text-[#4B5563] space-y-1">
                      <template x-for="cert in profile.certifications" :key="cert">
                        <li x-text="cert"></li>
                      </template>
                    </ul>
                  </div>
                </template>
              </div>
            </template>

            <!-- ===================== FORMAT MODERN CLEAN ===================== -->
            <template x-if="cvLayout === 'modern'">
              <div class="space-y-8">
                <!-- Header Modern dengan Aksen Border Kiri -->
                <div class="flex flex-col sm:flex-row items-start justify-between gap-6 pb-6 border-b border-[#E3E4E9]">
                  <div class="space-y-2">
                    <div class="inline-block px-3 py-1 rounded-[6px] bg-[#E2F1F9] text-[#3A5988] text-[12px] font-semibold uppercase tracking-wider">
                      Curriculum Vitae Resmi
                    </div>
                    <h2 class="text-3xl font-bold text-[#0C1117] tracking-tight" x-text="profile.name"></h2>
                    <p class="text-[16px] font-semibold text-[#3A5988]" x-text="profile.title"></p>
                  </div>
                  <div class="text-left sm:text-right space-y-1 text-[13px] text-[#6B7280] shrink-0">
                    <p class="font-medium text-[#0C1117]" x-text="profile.email"></p>
                    <p x-text="profile.phone"></p>
                    <p x-text="profile.location"></p>
                    <p class="text-[#3A5988]" x-text="profile.linkedin"></p>
                  </div>
                </div>

                <!-- Konten Grid 2 Kolom Modern -->
                <div class="grid grid-cols-1 md:grid-cols-12 gap-8">
                  
                  <!-- Kolom Kiri: Utama (7 Kolom) -->
                  <div class="md:col-span-8 space-y-6">
                    <!-- Tentang Saya -->
                    <template x-if="sections.about">
                      <div class="space-y-2">
                        <h3 class="text-[13px] font-bold uppercase tracking-wider text-[#3A5988] flex items-center gap-2">
                          <span class="w-2 h-2 rounded-full bg-[#3A5988]"></span>
                          <span>Tentang Saya</span>
                        </h3>
                        <p class="text-[13.5px] text-[#4B5563] leading-relaxed" x-text="profile.about"></p>
                      </div>
                    </template>

                    <!-- Pengalaman Kerja Modern -->
                    <template x-if="sections.experience">
                      <div class="space-y-4">
                        <h3 class="text-[13px] font-bold uppercase tracking-wider text-[#3A5988] flex items-center gap-2">
                          <span class="w-2 h-2 rounded-full bg-[#3A5988]"></span>
                          <span>Pengalaman Profesional</span>
                        </h3>
                        <div class="space-y-4 pl-3 border-l-2 border-[#E2F1F9]">
                          <template x-for="exp in profile.experience" :key="exp.company">
                            <div class="space-y-1">
                              <div class="flex items-center justify-between text-[13.5px]">
                                <span class="font-bold text-[#0C1117]" x-text="exp.role"></span>
                                <span class="text-[12px] font-medium text-[#6B7280]" x-text="exp.period"></span>
                              </div>
                              <div class="text-[13px] font-medium text-[#3A5988]" x-text="exp.company"></div>
                              <p class="text-[13px] text-[#4B5563] leading-relaxed pt-0.5" x-text="exp.desc"></p>
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>

                    <!-- Proyek Unggulan Modern -->
                    <template x-if="sections.projects">
                      <div class="space-y-4">
                        <h3 class="text-[13px] font-bold uppercase tracking-wider text-[#3A5988] flex items-center gap-2">
                          <span class="w-2 h-2 rounded-full bg-[#3A5988]"></span>
                          <span>Portofolio Karya & Proyek</span>
                        </h3>
                        <div class="space-y-3">
                          <template x-for="proj in profile.projects" :key="proj.title">
                            <div class="p-3.5 rounded-[10px] bg-[#F4F5F7] border border-[#E3E4E9] space-y-1">
                              <div class="flex items-center justify-between text-[13.5px]">
                                <span class="font-bold text-[#0C1117]" x-text="proj.title"></span>
                                <span class="text-[12px] text-[#6B7280]" x-text="proj.period"></span>
                              </div>
                              <div class="text-[12px] text-[#3A5988] font-medium" x-text="proj.stack"></div>
                              <p class="text-[13px] text-[#4B5563] leading-relaxed pt-1" x-text="proj.desc"></p>
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>

                  <!-- Kolom Kanan: Meta, Skills, Education (4 Kolom) -->
                  <div class="md:col-span-4 space-y-6">
                    
                    <!-- Keahlian Teknis (Chips) -->
                    <template x-if="sections.skills">
                      <div class="space-y-3">
                        <h3 class="text-[13px] font-bold uppercase tracking-wider text-[#3A5988]">Keahlian Utama</h3>
                        <div class="flex flex-wrap gap-1.5">
                          <template x-for="skill in profile.skills" :key="skill">
                            <span class="px-2.5 py-1 rounded-[6px] text-[12px] font-medium bg-[#E2F1F9] text-[#3A5988]" x-text="skill"></span>
                          </template>
                        </div>
                      </div>
                    </template>

                    <!-- Pendidikan Modern -->
                    <template x-if="sections.education">
                      <div class="space-y-3">
                        <h3 class="text-[13px] font-bold uppercase tracking-wider text-[#3A5988]">Pendidikan</h3>
                        <template x-for="edu in profile.education" :key="edu.degree">
                          <div class="space-y-1 text-[13px]">
                            <p class="font-bold text-[#0C1117]" x-text="edu.degree"></p>
                            <p class="text-[#6B7280]" x-text="edu.school"></p>
                            <p class="text-[12px] text-[#3A5988] font-medium" x-text="edu.period + ' • ' + edu.gpa"></p>
                          </div>
                        </template>
                      </div>
                    </template>

                    <!-- Sertifikasi Modern -->
                    <template x-if="sections.certifications">
                      <div class="space-y-3">
                        <h3 class="text-[13px] font-bold uppercase tracking-wider text-[#3A5988]">Sertifikasi</h3>
                        <div class="space-y-2 text-[12.5px] text-[#4B5563]">
                          <template x-for="cert in profile.certifications" :key="cert">
                            <div class="flex items-start gap-2">
                              <span class="text-[#3A5988] mt-0.5">✓</span>
                              <span x-text="cert"></span>
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>

                  </div>

                </div>

              </div>
            </template>

          </div>

        </div>

      </main>

  <script>mountAlumniPortal(document.querySelector('main'));</script>
</body>
</html>
