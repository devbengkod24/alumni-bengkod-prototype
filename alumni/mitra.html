<!DOCTYPE html>
<html lang="id" data-color-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mitra Perusahaan | Bengkel Koding UDINUS</title>
  <meta name="description" content="Daftar perusahaan dan industri mitra resmi Bengkel Koding Universitas Dian Nuswantoro">
  <script>
    window.location.replace("mitra/index.html" + window.location.search + window.location.hash);
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/alumni.js"></script>
  <script src="assets/js/alumni-data.js"></script>
</head>
<body>
<!-- Direktori Perusahaan Mitra Industri Bengkel Koding -->
<!-- Tampilan ringkas, bersih, dan manusiawi sesuai masukan pengguna -->
<main data-route="mitra">
  <div x-data="mitraPage" class="w-full flex flex-col gap-6 py-2 pb-12 antialiased">
    
    <!-- Toast Notifikasi Ringkas -->
    <template x-if="toast">
      <div role="status" class="fixed bottom-6 right-6 z-[90] inline-flex items-center gap-2.5 h-12 px-6 rounded-full bg-gray-900 text-white text-[14px] font-semibold shadow-xl animate-fade-in">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
        <span x-text="toast"></span>
      </div>
    </template>

    <!-- ============================================================
        HEADER MITRA PERUSAHAAN
    ============================================================ -->
    <div class="bg-white rounded-xl border border-gray-200/90 shadow-sm p-6 sm:p-7">
      <div>
        <h1 class="text-[28px] sm:text-[32px] font-bold text-gray-900 tracking-tight">
          Mitra Perusahaan
        </h1>
        <p class="text-[15px] text-gray-500 mt-1 font-normal">
          Jejaring perusahaan dan industri mitra yang bekerjasama dengan Bengkel Koding UDINUS.
        </p>
      </div>

      <!-- ============================================================
          PENCARIAN (KATA KUNCI & LOKASI)
      ============================================================ -->
      <div class="mt-6 pt-5 border-t border-gray-100">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-center">
          <!-- Input Kata Kunci (Col 1-6) -->
          <div class="md:col-span-6 relative">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
              <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" />
            </svg>
            <input
              type="text"
              placeholder="Cari nama perusahaan, bidang usaha, atau deskripsi..."
              x-model="searchKeyword"
              class="w-full pl-11 pr-4 py-2.5 bg-white border border-gray-200 rounded-full text-[15px] text-gray-900 placeholder:text-gray-400 focus:outline-none focus:border-[#1E3A8A] focus:ring-2 focus:ring-[#1E3A8A]/10 transition-colors shadow-2xs"
            >
          </div>

          <!-- Input Kota (Col 7-10) -->
          <div class="md:col-span-4 relative">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="12" cy="10" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <input
              type="text"
              placeholder="Kota lokasi (Semarang, Jakarta, Bandung...)"
              x-model="searchLocation"
              class="w-full pl-11 pr-4 py-2.5 bg-white border border-gray-200 rounded-full text-[15px] text-gray-900 placeholder:text-gray-400 focus:outline-none focus:border-[#1E3A8A] focus:ring-2 focus:ring-[#1E3A8A]/10 transition-colors shadow-2xs"
            >
          </div>

          <!-- Reset Filter Button (Col 11-12) -->
          <div class="md:col-span-2">
            <button
              type="button"
              @click="searchKeyword = ''; searchLocation = ''; activeTab = 'all'"
              class="w-full py-2.5 px-4 border border-gray-200 hover:border-gray-300 rounded-full text-[14px] font-semibold text-gray-600 hover:text-[#1E3A8A] bg-white transition-colors cursor-pointer text-center shadow-2xs"
            >
              Reset Filter
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ============================================================
        DAFTAR KARTU PERUSAHAAN MITRA
    ============================================================ -->
    <div class="px-1 text-[14px] font-normal text-gray-500">
      <span>Menampilkan <span x-text="filteredCompanies.length"></span> perusahaan mitra</span>
    </div>

    <!-- Grid Kartu Perusahaan (Tanpa cover, vertikal murni: Nama -> Bidang Usaha -> Alamat -> Deskripsi) -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" x-show="filteredCompanies.length > 0">
      <template x-for="company in filteredCompanies" :key="company.id">
        <div class="bg-white rounded-xl border border-gray-200/90 hover:border-blue-200 hover:shadow-md transition-all duration-200 p-6 flex flex-col justify-between group">
          
          <div class="space-y-4">
            <!-- Logo Perusahaan (Lingkaran persis Gambar 2 yang diminta) -->
            <div>
              <template x-if="company.logoUrl">
                <img :src="company.logoUrl" :alt="company.name"
                  class="w-14 h-14 rounded-full object-cover bg-white p-1 border border-gray-200 shadow-2xs">
              </template>
              <template x-if="!company.logoUrl">
                <div class="w-14 h-14 rounded-full bg-gradient-to-br from-primary1 to-primary3 text-white font-extrabold text-base flex items-center justify-center border border-gray-200 shadow-2xs tracking-wider"
                  x-text="company.avatarText || company.name.substring(0, 2).toUpperCase()">
                </div>
              </template>
            </div>

            <!-- Informasi Vertikal (Font, Ukuran, dan Tebal Tipis 100% Identik dengan Menu Lainnya) -->
            <div class="space-y-1.5">
              <!-- 1. Nama Perusahaan (Bold 18px Persis Judul Lowongan di Menu Lain) -->
              <h3 class="text-[18px] font-bold text-gray-900 group-hover:text-[#1E3A8A] transition-colors leading-snug">
                <a :href="'perusahaan.html?id=' + encodeURIComponent(company.id)" x-text="company.nama_perusahaan || company.name"></a>
              </h3>

              <!-- 2. Bergerak di bidang apa (Font 15px Medium Warna Biru) -->
              <p class="text-[15px] font-medium text-[#1E3A8A]" x-text="company.bidang_usaha || company.industry"></p>

              <!-- 3. Alamat (Font 14px Text-Gray-500) -->
              <p class="text-[14px] text-gray-500 flex items-start gap-1.5 pt-0.5">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400 shrink-0 mt-0.5">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z" />
                  <circle cx="12" cy="10" r="3" />
                </svg>
                <span class="leading-relaxed" x-text="company.alamat ? (company.alamat + ', ' + (company.kota || '') + ', ' + (company.provinsi || '')) : (company.kota ? (company.kota + ', ' + company.provinsi) : company.location)"></span>
              </p>

              <!-- 4. Deskripsi (Font 15px Leading Relaxed) -->
              <p class="text-[15px] text-gray-600 pt-1.5 line-clamp-3 leading-relaxed font-normal"
                x-text="company.deskripsi || company.about || 'Perusahaan mitra industri resmi Bengkel Koding.'">
              </p>
            </div>
          </div>

          <!-- Tombol Aksi di Bawah Kartu: Lihat Profil Perusahaan (Rounded-full, Font 15px Semibold) -->
          <div class="pt-5 mt-4 border-t border-gray-100">
            <a
              :href="'perusahaan.html?id=' + encodeURIComponent(company.id)"
              class="w-full block py-2.5 px-5 text-center rounded-full bg-[#1E3A8A] hover:bg-[#1D4ED8] text-white text-[15px] font-semibold transition-colors cursor-pointer shadow-2xs"
            >
              Lihat Profil Perusahaan
            </a>
          </div>

        </div>
      </template>
    </div>

    <!-- State Kosong jika Tidak Ada Hasil Filter -->
    <div x-show="filteredCompanies.length === 0" class="bg-white rounded-xl border border-gray-200/90 p-12 text-center shadow-sm">
      <div class="w-16 h-16 rounded-full bg-gray-100 text-gray-400 flex items-center justify-center mx-auto mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      <h3 class="font-bold text-gray-900 text-[18px]">Tidak Ada Mitra Ditemukan</h3>
      <p class="text-[14px] text-gray-500 max-w-md mx-auto mt-1 leading-relaxed">
        Perusahaan yang Anda cari dengan kata kunci "<span class="font-semibold text-gray-700" x-text="searchKeyword || searchLocation"></span>" tidak ditemukan dalam direktori mitra industri.
      </p>
      <button
        type="button"
        @click="searchKeyword = ''; searchLocation = ''; activeTab = 'all'"
        class="mt-5 px-6 py-2.5 rounded-full bg-[#1E3A8A] text-white text-[14px] font-semibold hover:bg-[#1D4ED8] transition-colors cursor-pointer shadow-xs"
      >
        Tampilkan Semua Mitra
      </button>
    </div>

  </div>
</main>

<script>
  document.addEventListener("alpine:init", () => {
    Alpine.data("mitraPage", () => {
      const rawList = typeof COMPANY_DIRECTORY !== "undefined" ? COMPANY_DIRECTORY : [];
      
      return {
        toast: "",
        companies: rawList,
        searchKeyword: "",
        searchLocation: "",
        activeTab: "all", // 'all' | 'jobs' | 'alumni'

        get totalJobs() {
          return this.companies.reduce((sum, c) => sum + (c.jobs ? c.jobs.length : 0), 0);
        },

        get totalAlumniHired() {
          return this.companies.reduce((sum, c) => {
            const count = c.alumniCount || (c.alumniList ? c.alumniList.length : 0);
            return sum + count;
          }, 0);
        },

        get filteredCompanies() {
          const kw = (this.searchKeyword || "").toLowerCase().trim();
          const loc = (this.searchLocation || "").toLowerCase().trim();
          const tab = this.activeTab;

          return this.companies.filter((c) => {
            // Pencarian Kata Kunci
            const nameMatch = (c.nama_perusahaan || c.name || "").toLowerCase().includes(kw);
            const indMatch = (c.bidang_usaha || c.industry || "").toLowerCase().includes(kw);
            const descMatch = (c.deskripsi || c.about || "").toLowerCase().includes(kw);
            const passKw = !kw || (nameMatch || indMatch || descMatch);

            // Pencarian Lokasi
            const locText = ((c.alamat || "") + " " + (c.kota || "") + " " + (c.provinsi || "") + " " + (c.location || "")).toLowerCase();
            const passLoc = !loc || locText.includes(loc);

            // Tab Filter ala Gambar 2
            let passTab = true;
            if (tab === "jobs") {
              passTab = c.jobs && c.jobs.length > 0;
            } else if (tab === "alumni") {
              const count = c.alumniCount || (c.alumniList ? c.alumniList.length : 0);
              passTab = count > 0;
            }

            return passKw && passLoc && passTab;
          });
        },

        setToast(msg) {
          this.toast = msg;
          setTimeout(() => (this.toast = ""), 2500);
        }
      };
    });
  });
</script>
</body>
</html>
