<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun Alumni | Portal Alumni Bengkel Koding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css?v=5">
  <script src="assets/js/data.js?v=9"></script>
  <script src="assets/js/app.js?v=6"></script>
  <script src="../assets/js/page-skeleton.js?v=5"></script>
  <script src="../assets/js/main.js?v=5"></script>
</head>
<body class="bg-white text-neutral1 antialiased font-sans">

  <div class="min-h-screen w-full flex">

    <div class="w-full md:w-[52%] flex flex-col px-6 lg:px-12 py-8 md:py-10 md:h-screen md:overflow-y-auto">
      <div class="w-full max-w-[26rem] mx-auto flex flex-col flex-1 justify-center">

        <a href="../index.html" class="mb-8 inline-flex w-fit">
          <img src="../assets/images/bengkelkoding-text.webp" alt="Bengkel Koding" class="h-10 w-auto object-contain">
        </a>

        <div class="mb-7">
          <h1 class="font-bold !text-2xl text-neutral1 mb-1.5">Daftar Akun Alumni</h1>
          <p class="text-neutral3 !text-sm leading-relaxed">Kode verifikasi akan dikirim ke email Anda. Data lulusan diisi saat pertama kali masuk.</p>
        </div>

        <form id="form" novalidate class="flex flex-col gap-5">
          <div>
            <label for="nama" class="label">Nama lengkap <span class="text-red1">*</span></label>
            <input type="text" id="nama" name="nama" autocomplete="name" placeholder="Masukkan nama lengkap" class="input">
            <p id="error-nama" class="hidden text-xs text-red2 mt-1" role="alert"></p>
          </div>
          <div>
            <label for="email" class="label">Email <span class="text-red1">*</span></label>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="nama@email.com" class="input">
            <p id="error-email" class="hidden text-xs text-red2 mt-1" role="alert"></p>
          </div>
          <div>
            <label for="password" class="label">Password <span class="text-red1">*</span></label>
            <input type="password" id="password" name="password" autocomplete="new-password" placeholder="Minimal 7 karakter" class="input">
            <p id="error-password" class="hidden text-xs text-red2 mt-1" role="alert"></p>
          </div>
          <button type="submit" class="w-full px-5 py-2.5 font-medium rounded-lg text-white bg-primary1 hover:bg-primary2 focus:ring-4 focus:ring-primary5 focus:outline-none transition-all duration-200 min-h-[44px]">Daftar</button>
        </form>

        <p class="!text-sm text-neutral3 mt-6">
          Sudah punya akun?
          <a href="login.html" class="text-primary1 font-semibold hover:underline">Masuk di sini</a>
        </p>
      </div>
    </div>

    <div class="hidden md:block md:w-[48%] h-screen p-4 lg:p-5 flex-shrink-0">
      <div class="h-full w-full bg-cover bg-center rounded-2xl overflow-hidden relative" style="background-image: url('../assets/images/register-panel.png');" role="img" aria-label="Suasana kegiatan belajar Bengkel Koding">
        <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/10 to-black/10" aria-hidden="true"></div>
        <div class="relative z-10 h-full flex flex-col justify-between p-7 lg:p-9 text-white">
          <div class="flex items-center gap-2 font-semibold text-white/90 text-sm">
            <span class="w-5 h-px bg-white/80"></span>
            Bengkel Koding
            <span class="w-5 h-px bg-white/80"></span>
          </div>
          <div class="max-w-lg">
            <h2 class="font-bold !text-xl lg:!text-2xl leading-tight mb-2.5">Bergabung sebagai<br>Alumni</h2>
            <p class="text-white/80 !text-sm leading-relaxed">Isi tracer study, lengkapi profil, dan buat CV dengan satu akun.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('form');

    form.addEventListener('submit', e => {
      e.preventDefault();
      ['nama', 'email', 'password'].forEach(f => document.getElementById(`error-${f}`).classList.add('hidden'));
      const isi = Object.fromEntries(new FormData(form));
      if (!/^\S+@\S+\.\S+$/.test(isi.email)) {
        const el = document.getElementById('error-email');
        el.textContent = 'Format email tidak valid.';
        el.classList.remove('hidden');
        return;
      }
      const hasil = DB.akun.daftar(isi);
      if (!hasil.ok) {
        const el = document.getElementById(`error-${hasil.field}`);
        el.textContent = hasil.error;
        el.classList.remove('hidden');
        return;
      }
      sessionStorage.setItem('otp_email', hasil.user.email);
      location.href = 'verify-otp.html';
    });
  </script>
</body>
</html>
