<!DOCTYPE html>
<html lang="id" data-color-mode="light" class="h-full overflow-hidden bg-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klaim Akun Alumni | Portal Alumni Bengkel Koding UDINUS</title>
  <meta name="description" content="Klaim akun alumni asisten lab Bengkel Koding Universitas Dian Nuswantoro.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            poppins: ['Poppins', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <script src="assets/js/data.js?v=10"></script>
  <script src="assets/js/auth-panel.js?v=3"></script>
</head>
<body class="h-screen h-dvh overflow-hidden bg-white text-[#0F172A] antialiased font-sans">

  <div class="h-full w-full flex flex-col lg:flex-row overflow-hidden bg-white">

    <!-- Form Klaim Akun (Kiri di desktop, Bawah di mobile, pas 1 layar tanpa scroll) -->
    <main class="order-2 lg:order-1 flex-1 min-h-0 w-full lg:w-[45.14%] lg:flex-none bg-white flex flex-col justify-center px-6 py-3 sm:px-12 lg:px-14 min-[1420px]:px-[94px] lg:py-6 overflow-hidden">
      <div class="w-full max-w-[462px] mx-auto">

        <a href="../index.html" class="inline-flex items-center gap-[10px] lg:gap-[12px] w-fit rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1E3A8A]/30">
          <div class="w-[30px] h-[30px] lg:w-[38px] lg:h-[38px] rounded-[9px] lg:rounded-[12px] bg-[#1E3A8A] flex items-center justify-center shrink-0">
            <span class="font-bold text-[12px] lg:text-[15px] leading-none text-white">BK</span>
          </div>
          <div class="flex flex-col gap-[1.5px] lg:gap-[2px] leading-none">
            <span class="font-bold text-[15px] lg:text-[18px] text-[#1E3A8A]">bengkod</span>
            <span class="font-semibold text-[7.5px] lg:text-[9px] text-[#2563EB]">ALUMNI NETWORK</span>
          </div>
        </a>

        <h1 class="mt-[clamp(10px,1.8vh,20px)] lg:mt-[clamp(18px,3.8vh,40px)] font-bold text-[23px] sm:text-[26px] lg:text-[34px] min-[1420px]:text-[39px] leading-[1.11] text-[#0F172A]">
          Klaim akun alumni
        </h1>
        <p class="mt-1 lg:mt-2.5 font-normal text-[12.5px] sm:text-[13px] lg:text-[15px] leading-[1.35] lg:leading-[1.45] text-[#475569]">
          Gunakan NIM yang tercatat sebagai asisten lab Bengkel Koding.
        </p>

        <form id="form" novalidate class="mt-3 lg:mt-[clamp(16px,2.8vh,28px)]">
          <div>
            <label for="nim" class="block font-semibold text-[12px] lg:text-[13px] leading-[1.35] text-[#0F172A] mb-0.5 lg:mb-1">
              NIM
            </label>
            <input type="text" id="nim" name="nim"
                   placeholder="Masukkan NIM terdaftar"
                   class="w-full h-[38px] lg:h-[clamp(40px,5.2vh,48px)] px-3 rounded-[9px] lg:rounded-[10px] border border-[#8798B2] bg-white text-[13px] lg:text-[14px] text-[#0F172A] placeholder:text-[#475569] placeholder:normal-case uppercase focus:outline-none focus:border-[#1E3A8A] focus:ring-2 focus:ring-[#1E3A8A]/15 transition-colors">
            <p id="error-nim" class="hidden text-[11px] leading-tight text-red-600 mt-0.5" role="alert"></p>
          </div>

          <div class="mt-1.5 lg:mt-2">
            <label for="nama" class="block font-semibold text-[12px] lg:text-[13px] leading-[1.35] text-[#0F172A] mb-0.5 lg:mb-1">
              Nama lengkap
            </label>
            <input type="text" id="nama" name="nama" autocomplete="name"
                   placeholder="Sesuai data asisten lab"
                   class="w-full h-[38px] lg:h-[clamp(40px,5.2vh,48px)] px-3 rounded-[9px] lg:rounded-[10px] border border-[#8798B2] bg-white text-[13px] lg:text-[14px] text-[#0F172A] placeholder:text-[#475569] focus:outline-none focus:border-[#1E3A8A] focus:ring-2 focus:ring-[#1E3A8A]/15 transition-colors">
            <p id="error-nama" class="hidden text-[11px] leading-tight text-red-600 mt-0.5" role="alert"></p>
          </div>

          <div class="mt-1.5 lg:mt-2">
            <label for="email" class="block font-semibold text-[12px] lg:text-[13px] leading-[1.35] text-[#0F172A] mb-0.5 lg:mb-1">
              Email
            </label>
            <input type="email" id="email" name="email" autocomplete="email"
                   placeholder="nama@example.com"
                   class="w-full h-[38px] lg:h-[clamp(40px,5.2vh,48px)] px-3 rounded-[9px] lg:rounded-[10px] border border-[#8798B2] bg-white text-[13px] lg:text-[14px] text-[#0F172A] placeholder:text-[#475569] focus:outline-none focus:border-[#1E3A8A] focus:ring-2 focus:ring-[#1E3A8A]/15 transition-colors">
            <p id="error-email" class="hidden text-[11px] leading-tight text-red-600 mt-0.5" role="alert"></p>
          </div>

          <div class="mt-1.5 lg:mt-2">
            <label for="password" class="block font-semibold text-[12px] lg:text-[13px] leading-[1.35] text-[#0F172A] mb-0.5 lg:mb-1">
              Kata sandi
            </label>
            <input type="password" id="password" name="password" minlength="8" required autocomplete="new-password"
                   placeholder="Minimal 8 karakter"
                   class="w-full h-[38px] lg:h-[clamp(40px,5.2vh,48px)] px-3 rounded-[9px] lg:rounded-[10px] border border-[#8798B2] bg-white text-[13px] lg:text-[14px] text-[#0F172A] placeholder:text-[#475569] focus:outline-none focus:border-[#1E3A8A] focus:ring-2 focus:ring-[#1E3A8A]/15 transition-colors">
            <p id="error-password" class="hidden text-[11px] leading-tight text-red-600 mt-0.5" role="alert"></p>
          </div>

          <div class="mt-1.5 lg:mt-2">
            <label for="password_confirm" class="block font-semibold text-[12px] lg:text-[13px] leading-[1.35] text-[#0F172A] mb-0.5 lg:mb-1">
              Konfirmasi kata sandi
            </label>
            <input type="password" id="password_confirm" name="password_confirm" minlength="8" required autocomplete="new-password"
                   placeholder="Ulangi kata sandi"
                   class="w-full h-[38px] lg:h-[clamp(40px,5.2vh,48px)] px-3 rounded-[9px] lg:rounded-[10px] border border-[#8798B2] bg-white text-[13px] lg:text-[14px] text-[#0F172A] placeholder:text-[#475569] focus:outline-none focus:border-[#1E3A8A] focus:ring-2 focus:ring-[#1E3A8A]/15 transition-colors">
            <p id="error-password_confirm" class="hidden text-[11px] leading-tight text-red-600 mt-0.5" role="alert"></p>
          </div>

          <button type="submit"
                  class="mt-3 lg:mt-[13px] w-full h-[44px] lg:h-[clamp(44px,5.5vh,50px)] rounded-[10px] lg:rounded-[11px] bg-[#1E3A8A] hover:bg-[#1D4ED8] active:bg-[#172E71] text-white font-semibold text-[14px] lg:text-[15px] leading-[1.45] transition-colors cursor-pointer focus:outline-none focus:ring-4 focus:ring-[#1E3A8A]/20">
            Klaim akun
          </button>
        </form>

        <div class="mt-1.5 lg:mt-2.5">
          <a href="login.html" class="inline-flex items-center min-h-[32px] lg:min-h-[38px] font-semibold text-[12.5px] lg:text-[13px] leading-[1.45] text-[#1E3A8A] hover:underline focus:outline-none focus:ring-2 focus:ring-[#1E3A8A]/30 rounded">
            Sudah punya akun? Masuk
          </a>
        </div>

      </div>
    </main>

    <!-- Panel Fitur Alumni (Kanan di desktop, Atas di mobile) -->
    <aside id="auth-feature-panel" class="order-1 lg:order-2 w-full lg:w-[54.86%] lg:h-full shrink-0"></aside>
    <script>renderAuthFeaturePanel({ mobileHeightClass: 'h-[clamp(156px,22dvh,200px)]' });</script>

  </div>

  <script>
    const SAYA = DB.akun.aktif();
    const DASHBOARD = { alumni: 'dashboard.html', admin: '../koordinator/dashboard.html' };
    if (SAYA) {
      location.replace(SAYA.role === 'alumni' && !DB.tracer.milik(SAYA.id) ? 'isi-data.html' : DASHBOARD[SAYA.role]);
    }

    const form = document.getElementById('form');
    const FIELDS = ['nim', 'nama', 'email', 'password', 'password_confirm'];

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'fixed bottom-5 right-5 z-50 bg-[#1C6A1A] text-white px-5 py-3 rounded-xl shadow-lg text-sm font-medium';
      toast.setAttribute('role', 'alert');
      toast.textContent = message;
      document.body.appendChild(toast);
    }

    function bersihkanError() {
      FIELDS.forEach(f => {
        document.getElementById(`error-${f}`)?.classList.add('hidden');
        form.elements[f]?.classList.remove('!border-red-600');
      });
    }

    function tampilError(field, pesan) {
      const el = document.getElementById(`error-${field}`);
      if (el) {
        el.textContent = pesan;
        el.classList.remove('hidden');
      }
      const input = form.elements[field];
      if (input) {
        input.classList.add('!border-red-600');
        input.focus();
      }
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      bersihkanError();
      const isi = Object.fromEntries(new FormData(form));
      if (!isi.password) {
        tampilError('password', 'Password wajib diisi.');
        return;
      }
      if (isi.password.length < 8) {
        tampilError('password', 'Password harus terdiri dari minimal 8 karakter.');
        return;
      }
      if (isi.password_confirm !== undefined && isi.password !== isi.password_confirm) {
        tampilError('password_confirm', 'Konfirmasi password tidak cocok.');
        return;
      }
      const hasil = DB.akun.daftar(isi);
      if (!hasil.ok) {
        tampilError(hasil.field, hasil.error);
        return;
      }
      showToast('Pendaftaran berhasil! Silakan masuk.');
      setTimeout(() => { location.href = 'login.html'; }, 600);
    });
  </script>
</body>
</html>
