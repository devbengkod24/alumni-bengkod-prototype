<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun Alumni | Portal Alumni Bengkel Koding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css?v=5">
  <script src="assets/js/data.js?v=10"></script>
  <script src="assets/js/app.js?v=7"></script>
  <script src="../assets/js/page-skeleton.js?v=5"></script>
  <script src="../assets/js/main.js?v=5"></script>
</head>
<body class="bg-white text-neutral1 antialiased font-sans">

  <div class="min-h-screen w-full flex">

    <div class="w-full md:w-[52%] flex flex-col px-6 lg:px-12 py-8 md:py-10 md:h-screen md:overflow-y-auto">
      <div class="w-full max-w-[26rem] mx-auto flex flex-col flex-1 justify-center">

        <a href="../index.html" class="mb-7 inline-flex w-fit">
          <img src="../assets/images/bengkelkoding-text.webp" alt="Bengkel Koding" class="h-10 w-auto object-contain">
        </a>

        <div class="mb-6">
          <h1 class="font-bold !text-2xl text-neutral1 mb-1.5">Daftar Akun Alumni</h1>
          <p class="text-neutral3 !text-sm leading-relaxed">Validasi menggunakan NIM asisten lab Bengkel Koding. Data karir diisi saat pertama kali masuk.</p>
        </div>

        <form id="form" novalidate class="flex flex-col gap-4">
          <div>
            <label for="nama" class="label">Nama Lengkap <span class="text-red1">*</span></label>
            <input type="text" id="nama" name="nama" autocomplete="name" placeholder="Masukkan nama lengkap" class="input">
            <p id="error-nama" class="hidden text-xs text-red2 mt-1" role="alert"></p>
          </div>

          <div>
            <label for="nim" class="label">NIM <span class="text-red1">*</span></label>
            <input type="text" id="nim" name="nim" placeholder="Contoh: A11.2021.14500" class="input uppercase">
            <p id="error-nim" class="hidden text-xs text-red2 mt-1" role="alert"></p>
          </div>

          <div>
            <label for="email" class="label">Email <span class="text-red1">*</span></label>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="nama@email.com" class="input">
            <p id="error-email" class="hidden text-xs text-red2 mt-1" role="alert"></p>
          </div>

          <div>
            <label for="password" class="label">Password <span class="text-red1">*</span></label>
            <div class="relative">
              <input type="password" id="password" name="password" autocomplete="new-password" placeholder="Minimal 8 karakter" class="input pr-10">
              <button type="button" onclick="tukarPassword('password', 'ikon-mata-1')" aria-label="Tampilkan atau sembunyikan password" class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral3 hover:text-neutral1">
                <span id="ikon-mata-1"><i data-lucide="eye" class="w-4 h-4"></i></span>
              </button>
            </div>
            <p id="error-password" class="hidden text-xs text-red2 mt-1" role="alert"></p>
          </div>

          <div>
            <label for="password_confirm" class="label">Konfirmasi Password <span class="text-red1">*</span></label>
            <div class="relative">
              <input type="password" id="password_confirm" name="password_confirm" autocomplete="new-password" placeholder="Ulangi password" class="input pr-10">
              <button type="button" onclick="tukarPassword('password_confirm', 'ikon-mata-2')" aria-label="Tampilkan atau sembunyikan konfirmasi password" class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral3 hover:text-neutral1">
                <span id="ikon-mata-2"><i data-lucide="eye" class="w-4 h-4"></i></span>
              </button>
            </div>
            <p id="error-password_confirm" class="hidden text-xs text-red2 mt-1" role="alert"></p>
          </div>

          <button type="submit" class="w-full mt-1 px-5 py-2.5 font-medium rounded-lg text-white bg-primary1 hover:bg-primary2 focus:ring-4 focus:ring-primary5 focus:outline-none transition-all duration-200 min-h-[44px]">Daftar</button>
        </form>

        <!-- Contoh NIM valid khusus prototype -->
        <div class="mt-5 p-3.5 bg-blue-50 border border-blue-200 rounded-xl space-y-2">
          <div class="flex items-center gap-2 text-xs font-semibold text-blue-900">
            <i data-lucide="info" class="w-4 h-4 text-blue-600 shrink-0"></i>
            <span>Contoh NIM valid (klik untuk isi cepat)</span>
          </div>
          <div id="nim-contoh" class="flex flex-wrap gap-1.5"></div>
        </div>

        <p class="!text-sm text-neutral3 mt-5">
          Sudah punya akun?
          <a href="login.html" class="text-primary1 font-semibold hover:underline">Masuk di sini</a>
        </p>
      </div>
    </div>

    <div class="hidden md:block md:w-[48%] h-screen p-4 lg:p-5 flex-shrink-0 sticky top-0">
      <div class="h-full w-full bg-cover bg-center rounded-2xl overflow-hidden relative" style="background-image: url('../assets/images/register-panel.png');" role="img" aria-label="Suasana kegiatan belajar Bengkel Koding">
        <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/10 to-black/10" aria-hidden="true"></div>
        <div class="relative z-10 h-full flex flex-col justify-between p-7 lg:p-9 text-white">
          <div class="flex items-center gap-2 font-semibold text-white/90 text-sm">
            <span class="w-5 h-px bg-white/80"></span>
            Bengkel Koding
            <span class="w-5 h-px bg-white/80"></span>
          </div>
          <div class="max-w-lg">
            <h2 class="font-bold !text-xl lg:!text-2xl leading-tight mb-2.5">Bergabung sebagai<br>Alumni</h2>
            <p class="text-white/80 !text-sm leading-relaxed">Isi tracer study, lengkapi profil, dan buat CV dengan satu akun.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    if (SAYA) {
      location.replace(SAYA.role === 'alumni' && !DB.tracer.milik(SAYA.id) ? 'isi-data.html' : DASHBOARD[SAYA.role]);
    }

    const form = document.getElementById('form');
    const FIELDS = ['nama', 'nim', 'email', 'password', 'password_confirm'];

    function tukarPassword(inputId, ikonId) {
      const input = document.getElementById(inputId);
      const tampak = input.type === 'password';
      input.type = tampak ? 'text' : 'password';
      document.getElementById(ikonId).innerHTML = `<i data-lucide="${tampak ? 'eye-off' : 'eye'}" class="w-4 h-4"></i>`;
      refreshIcons();
    }

    // Tampilkan contoh NIM asisten LMS yang belum terdaftar
    const contohWrap = document.getElementById('nim-contoh');
    const daftarContoh = DB.akun.nimContoh(3);
    contohWrap.innerHTML = daftarContoh.map(c => `
      <button type="button" data-nim="${esc(c.nim)}" data-nama="${esc(c.nama)}" class="px-2.5 py-1 rounded-lg bg-white border border-blue-200 hover:border-blue-400 text-[11px] font-medium text-blue-900 transition-colors">
        ${esc(c.nim)}
      </button>
    `).join('');
    contohWrap.addEventListener('click', e => {
      const btn = e.target.closest('button[data-nim]');
      if (!btn) return;
      form.elements.nim.value = btn.dataset.nim;
      if (!form.elements.nama.value.trim()) form.elements.nama.value = btn.dataset.nama;
    });

    function bersihkanError() {
      FIELDS.forEach(f => {
        document.getElementById(`error-${f}`)?.classList.add('hidden');
        form.elements[f]?.classList.remove('!border-red1');
      });
    }

    function tampilError(field, pesan) {
      const el = document.getElementById(`error-${field}`);
      if (el) {
        el.textContent = pesan;
        el.classList.remove('hidden');
      }
      const input = form.elements[field];
      if (input) {
        input.classList.add('!border-red1');
        input.focus();
      }
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      bersihkanError();
      const isi = Object.fromEntries(new FormData(form));
      const hasil = DB.akun.daftar(isi);
      if (!hasil.ok) {
        tampilError(hasil.field, hasil.error);
        return;
      }
      showToast('Pendaftaran berhasil! Silakan masuk.');
      setTimeout(() => { location.href = 'login.html'; }, 600);
    });
  </script>
</body>
</html>
