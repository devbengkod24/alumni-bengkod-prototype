<!DOCTYPE html>
<html lang="id" data-color-mode="light" class="h-full bg-[#EFF2F7]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Karya | Karya Alumni Bengkel Koding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/alumni-data.js"></script>
  <script src="assets/js/alumni-catalog.js"></script>
  <script src="assets/js/portal-layout.js"></script>
  <script src="assets/js/karya-attachments.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    [x-cloak] { display: none !important; }
    body { font-family: "Inter", sans-serif; }
  </style>
</head>
<body class="h-full bg-[#EFF2F7] text-[#212224] antialiased selection:bg-[#3A5988] selection:text-white" x-data="detailKaryaPage()">
  <main data-karya-page="Detail Karya" class="mx-auto w-full max-w-[960px] flex-1 space-y-5 p-6 lg:p-8">
    <a href="showcase.html" class="inline-flex items-center gap-2 rounded text-[13.5px] font-semibold text-[#3A5988] hover:underline">
      <svg aria-hidden="true" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5m7-7-7 7 7 7"/>
      </svg>
      Kembali ke Karya Alumni
    </a>

    <p x-show="message" x-cloak x-text="message" role="status"
       class="fixed bottom-6 right-6 z-50 rounded-[8px] bg-[#0C1117] px-4 py-3 text-[13.5px] text-white shadow-md"></p>

    <template x-if="!work">
      <section class="space-y-2 rounded-[16px] border border-[#E3E4E9] bg-white p-6 shadow-sm">
        <h1 class="text-xl font-semibold text-[#0C1117]">Karya tidak ditemukan</h1>
        <p class="text-[14px] text-[#6B7280]">Pilih karya lain dari daftar Karya Alumni.</p>
      </section>
    </template>

    <template x-if="work">
      <article class="space-y-6 rounded-[16px] border border-[#E3E4E9] bg-white p-5 shadow-sm sm:p-8">
        <header class="space-y-3">
          <div>
            <h1 class="break-words text-[26px] font-semibold leading-tight tracking-[-0.02em] text-[#0C1117] sm:text-[30px]" x-text="work.nama"></h1>
            <p x-show="work.tagline" class="mt-1.5 break-words text-[15px] text-[#6B7280]" x-text="work.tagline"></p>
          </div>
          <div class="flex flex-wrap items-center gap-x-3 gap-y-2 text-[13px] text-[#6B7280]">
            <div class="flex items-center gap-2">
              <div class="relative grid h-8 w-8 shrink-0 place-items-center overflow-hidden rounded-full bg-[#E2F1F9] font-semibold text-[#3A5988]" aria-hidden="true">
                <span x-text="(work.authorName || 'Alumni').charAt(0).toUpperCase()"></span>
                <template x-if="work.authorAvatar">
                  <img :src="work.authorAvatar" alt="" @error="$el.classList.add('hidden')" class="absolute inset-0 h-full w-full object-cover">
                </template>
              </div>
              <span class="font-medium text-[#212224]" x-text="work.authorName || 'Alumni'"></span>
            </div>
            <span x-show="work.category" class="rounded-md bg-[#F4F5F7] px-2 py-1 text-[#3A5988]" x-text="work.category"></span>
            <span x-show="work.date" x-text="work.date"></span>
          </div>
          <template x-if="demoLink">
            <a :href="demoLink" target="_blank" rel="noopener noreferrer"
               class="inline-flex items-center gap-2 rounded-[8px] border border-[#E3E4E9] px-3 py-2 text-[13px] font-semibold text-[#3A5988] hover:bg-[#F4F5F7]">
              Buka Website / Demo
              <svg aria-hidden="true" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 5h6v6m0-6-9 9m7-1v6H5V7h6"/>
              </svg>
            </a>
          </template>
        </header>

        <template x-if="work.banner">
          <img :src="work.banner" :alt="'Tampilan karya ' + work.nama"
               class="aspect-video w-full rounded-[12px] border border-[#E3E4E9] bg-[#E2F1F9] object-cover">
        </template>

        <section x-show="work.leadStory1 || work.leadStory2" class="space-y-3">
          <h2 class="text-[17px] font-semibold text-[#0C1117]">Tentang Karya</h2>
          <p x-show="work.leadStory1" class="whitespace-pre-wrap break-words text-[15px] leading-relaxed text-[#374151]">
            <strong x-show="work.city" class="font-semibold" x-text="work.city"></strong>
            <span x-text="work.leadStory1"></span>
          </p>
          <p x-show="work.leadStory2" class="whitespace-pre-wrap break-words text-[15px] leading-relaxed text-[#374151]" x-text="work.leadStory2"></p>
        </section>

        <section x-show="work.sectionHeading || work.sectionIntro || work.keyFeatures?.length" class="space-y-2">
          <h2 class="text-[17px] font-semibold text-[#0C1117]" x-text="work.sectionHeading || 'Fitur Utama'"></h2>
          <p x-show="work.sectionIntro" class="text-[15px] leading-relaxed text-[#374151]" x-text="work.sectionIntro"></p>
          <ul class="list-disc space-y-1 pl-5 text-[15px] leading-relaxed text-[#374151]">
            <template x-for="feature in (work.keyFeatures || [])" :key="feature">
              <li x-text="feature"></li>
            </template>
          </ul>
        </section>

        <section x-show="work.stack?.length" class="space-y-2">
          <h2 class="text-[17px] font-semibold text-[#0C1117]">Tech Stack yang Digunakan</h2>
          <ul class="flex flex-wrap gap-2">
            <template x-for="stack in (work.stack || [])" :key="stack">
              <li class="rounded-md border border-[#E3E4E9] bg-[#F4F5F7] px-2.5 py-1 text-[13px] text-[#4B5563]" x-text="stack"></li>
            </template>
          </ul>
        </section>

        <template x-if="contributorNames.length">
          <section class="space-y-2">
            <h2 class="text-[17px] font-semibold text-[#0C1117]">Kontributor</h2>
            <ul class="flex flex-wrap gap-2">
              <template x-for="name in contributorNames" :key="name">
                <li class="max-w-full break-words rounded-md bg-[#E2F1F9] px-2.5 py-1 text-[13px] font-medium text-[#3A5988]" x-text="name"></li>
              </template>
            </ul>
          </section>
        </template>

        <section x-show="work.attachments?.length" class="space-y-2">
          <h2 class="text-[17px] font-semibold text-[#0C1117]">Lampiran Karya</h2>
          <ul class="space-y-2">
            <template x-for="(attachment, index) in (work.attachments || [])" :key="index">
              <li>
                <button type="button" @click="downloadAttachment(attachment, index)"
                        class="flex w-full items-center justify-between gap-3 rounded-lg border border-[#E3E4E9] px-3 py-2 text-left text-[13px] hover:bg-[#F4F5F7]">
                  <span class="min-w-0 break-words" x-text="attachment.name"></span>
                  <span class="shrink-0 font-semibold text-[#3A5988]">Unduh</span>
                </button>
              </li>
            </template>
          </ul>
        </section>

      </article>
    </template>
  </main>

  <script>
    function detailKaryaPage() {
      const id = new URLSearchParams(window.location.search).get("id");
      return {
        work: findShowcaseWork(loadShowcaseWorks(), id),
        message: "",
        messageTimer: null,

        get demoLink() {
          try {
            const url = new URL(this.work?.demoLink);
            return ["http:", "https:"].includes(url.protocol) ? url.href : "";
          } catch {
            return "";
          }
        },

        get contributorNames() {
          const contributors = this.work?.contributors || [];
          const names = contributors.map(person => (typeof person === "string" ? person : person?.name)?.trim());
          return [...new Set(names.filter(Boolean))];
        },

        notify(message) {
          this.message = message;
          clearTimeout(this.messageTimer);
          this.messageTimer = setTimeout(() => { this.message = ""; }, 3200);
        },

        async downloadAttachment(attachment, index) {
          try {
            await downloadKaryaAttachment(this.work.projectId, index, attachment);
          } catch {
            this.notify("Lampiran gagal diunduh.");
          }
        }
      };
    }

    mountAlumniPortal(document.querySelector('main'));
  </script>
</body>
</html>
