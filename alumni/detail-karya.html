<!DOCTYPE html>
<html lang="id" data-color-mode="light" class="h-full bg-[#EFF2F7]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Karya | Karya Alumni Bengkel Koding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/alumni-data.js"></script>
  <script src="assets/js/alumni-catalog.js?v=2"></script>
  <script src="assets/js/portal-layout.js"></script>
  <script src="assets/js/karya-attachments.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    [x-cloak] { display: none !important; }
    body { font-family: "Inter", sans-serif; }
  </style>
</head>
<body class="h-full bg-[#EFF2F7] text-[#212224] antialiased selection:bg-[#3A5988] selection:text-white" x-data="detailKaryaPage()">
  <main data-karya-page="Detail Karya" class="mx-auto w-full max-w-[1260px] flex-1 space-y-5 p-4 sm:p-6 lg:p-8">
    <a :href="backHref" class="inline-flex items-center gap-2 rounded text-[13.5px] font-semibold text-[#3A5988] hover:underline">
      <svg aria-hidden="true" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5m7-7-7 7 7 7"/>
      </svg>
      <span x-text="backLabel"></span>
    </a>

    <p x-show="message" x-cloak x-text="message" role="status"
       class="fixed bottom-6 right-6 z-50 rounded-[8px] bg-[#0C1117] px-4 py-3 text-[13.5px] text-white shadow-md"></p>

    <template x-if="!work">
      <section class="space-y-2 rounded-[16px] border border-[#E3E4E9] bg-white p-6 shadow-sm">
        <h1 class="text-xl font-semibold text-[#0C1117]">Karya tidak ditemukan</h1>
        <p class="text-[14px] text-[#6B7280]">Pilih karya lain dari daftar Karya Alumni.</p>
      </section>
    </template>

    <template x-if="work">
      <div class="flex flex-col lg:flex-row gap-6 w-full items-start">
        <article class="flex-1 min-w-0 w-full space-y-6 rounded-[16px] border border-[#E3E4E9] bg-white p-6 sm:p-8 shadow-xs">
          <!-- 1. Header Artikel: Judul Utama, Tagline & Meta -->
          <div class="space-y-3">
            <h1 class="text-[26px] sm:text-[32px] font-bold text-[#0C1117] tracking-tight leading-tight" x-text="work.nama"></h1>
            <p x-show="work.tagline" x-text="work.tagline" class="text-[15.5px] sm:text-[16px] text-[#4B5563] leading-relaxed"></p>

            <!-- 2. Baris Meta Byline (Avatar + Nama + Kategori + Periode Pengerjaan + Tanggal) -->
            <div class="flex flex-wrap items-center gap-2.5 text-[14px] text-[#6B7280]">
              <template x-if="work.authorAvatar">
                <img :src="work.authorAvatar" class="w-8 h-8 rounded-full object-cover shrink-0" :alt="work.authorName">
              </template>
              <template x-if="!work.authorAvatar">
                <div class="w-8 h-8 rounded-full bg-[#E2F1F9] text-[#3A5A86] flex items-center justify-center text-[12px] font-semibold flex-shrink-0" x-text="(work.authorName || 'A').charAt(0).toUpperCase()"></div>
              </template>
              <span class="font-medium text-[#212224]" x-text="work.authorName || 'Alumni'"></span>
              <span class="text-[#9CA3AF]" x-show="work.category">·</span>
              <span class="text-[#3A5988] font-medium" x-show="work.category" x-text="work.category"></span>
              <span class="text-[#9CA3AF]" x-show="work.period">·</span>
              <span x-show="work.period" x-text="'Periode ' + work.period"></span>
              <span class="text-[#9CA3AF]" x-show="work.date">·</span>
              <span x-show="work.date" x-text="work.date"></span>
            </div>
          </div>

          <!-- 3. Banner Karya Resolusi Tinggi -->
          <div class="w-full aspect-[16/9] sm:h-[340px] lg:h-[380px] rounded-[14px] overflow-hidden bg-[#E2F1F9] border border-[#E3E4E9] relative">
            <template x-if="work.banner">
              <img :src="work.banner" :alt="work.nama" @error="work.banner = ''" class="w-full h-full object-cover">
            </template>
            <template x-if="!work.banner">
              <div class="w-full h-full flex items-center justify-center text-[54px] font-semibold text-[#3A5A86]" x-text="(work.nama || 'A').charAt(0).toUpperCase()"></div>
            </template>
          </div>

          <!-- 4. Deskripsi / Narasi Produk -->
          <div class="space-y-4 text-[15.5px] text-[#2D3748] leading-[1.85]" x-show="work.leadStory1 || work.leadStory2">
            <p class="whitespace-pre-line" x-show="work.leadStory1" x-text="work.leadStory1"></p>
            <template x-if="work.leadStory2">
              <p class="whitespace-pre-line" x-text="work.leadStory2"></p>
            </template>
          </div>

          <!-- 5. Tautan Aplikasi & Lampiran -->
          <section x-show="demoLink || (work.attachments && work.attachments.length)" class="pt-2 space-y-3" aria-labelledby="tautan-karya-heading">
            <h2 id="tautan-karya-heading" class="text-[17px] font-semibold text-[#0C1117] tracking-[-0.01em]">Tautan &amp; Lampiran</h2>
            <div class="space-y-2.5">
              <template x-if="demoLink">
                <a :href="demoLink"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="group flex items-center gap-3.5 rounded-[12px] border border-[#E3E4E9] bg-[#F8FAFC] px-4 py-3 no-underline transition-all duration-150 hover:border-[#3A5988] hover:bg-white hover:shadow-xs focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#3A5988] focus-visible:ring-offset-2">
                  <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[10px] bg-[#E2F1F9] text-[#283E5F] transition-colors group-hover:bg-[#3A5988] group-hover:text-white" aria-hidden="true">
                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                    </svg>
                  </span>
                  <span class="min-w-0 flex-1">
                    <span class="block text-[14px] font-semibold text-[#0C1117] group-hover:text-[#3A5988] transition-colors" x-text="demoMeta.label"></span>
                    <span class="block truncate text-[12.5px] text-[#4B5563] mt-0.5" x-text="demoMeta.host"></span>
                  </span>
                  <span class="inline-flex shrink-0 items-center gap-1.5 rounded-[8px] border border-[#DCE3ED] bg-white px-3 py-1.5 text-[12.5px] font-semibold text-[#283E5F] transition-colors group-hover:border-[#3A5988] group-hover:bg-[#E2F1F9]">
                    <span>Kunjungi</span>
                    <svg class="h-3.5 w-3.5 transition-transform group-hover:translate-x-0.5 group-hover:-translate-y-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M7 17 17 7"/><path d="M7 7h10v10"/>
                    </svg>
                  </span>
                </a>
              </template>

              <template x-for="(attachment, index) in (work.attachments || [])" :key="index">
                <button type="button"
                        @click="downloadAttachment(attachment, index)"
                        class="group flex w-full items-center gap-3.5 rounded-[12px] border border-[#E3E4E9] bg-[#F8FAFC] px-4 py-3 text-left transition-all duration-150 hover:border-[#3A5988] hover:bg-white hover:shadow-xs focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#3A5988] focus-visible:ring-offset-2 cursor-pointer">
                  <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[10px] border border-[#E3E4E9] bg-white text-[#283E5F] transition-colors group-hover:border-[#3A5988] group-hover:bg-[#E2F1F9]" aria-hidden="true">
                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
                    </svg>
                  </span>
                  <span class="min-w-0 flex-1">
                    <span class="block truncate text-[14px] font-semibold text-[#0C1117] group-hover:text-[#3A5988] transition-colors" x-text="attachment.name"></span>
                    <span class="block text-[12.5px] text-[#4B5563] mt-0.5" x-text="formatAttachmentMeta(attachment)"></span>
                  </span>
                  <span class="inline-flex shrink-0 items-center gap-1.5 rounded-[8px] border border-[#DCE3ED] bg-white px-3 py-1.5 text-[12.5px] font-semibold text-[#283E5F] transition-colors group-hover:border-[#3A5988] group-hover:bg-[#E2F1F9]">
                    <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    <span>Unduh</span>
                  </span>
                </button>
              </template>
            </div>
          </section>

          <!-- 6. Tech Stack yang Digunakan (Format List Bulet-Bulet) -->
          <section x-show="work.stack?.length" class="pt-2 space-y-2.5">
            <h2 class="text-[17px] font-semibold text-[#0C1117] tracking-[-0.01em]">Tech Stack yang Digunakan</h2>
            <ul class="space-y-2 text-[15px] text-[#374151]">
              <template x-for="stack in (work.stack || [])" :key="stack">
                <li class="flex items-center gap-2.5 leading-relaxed font-normal">
                  <span class="w-1.5 h-1.5 rounded-full bg-[#4B5563] shrink-0"></span>
                  <span x-text="stack"></span>
                </li>
              </template>
            </ul>
          </section>

          <!-- 7. Rekan Kontributor -->
          <section x-show="contributorNames.length" class="pt-2 space-y-2.5">
            <h2 class="text-[17px] font-semibold text-[#0C1117] tracking-[-0.01em]">Rekan Kontributor</h2>
            <ul class="space-y-2 text-[15px] text-[#374151]">
              <template x-for="person in contributorNames" :key="person">
                <li class="flex items-center gap-2.5 leading-relaxed font-normal">
                  <span class="w-1.5 h-1.5 rounded-full bg-[#4B5563] shrink-0"></span>
                  <span x-text="person"></span>
                </li>
              </template>
            </ul>
          </section>
        </article>

        <!-- KOLOM KANAN: KARYA LAINNYA -->
        <aside class="w-full lg:w-[350px] xl:w-[380px] shrink-0 space-y-4">
          <div class="flex items-center justify-between px-1">
            <h2 class="text-[16px] font-bold text-[#0C1117]">Karya Lainnya</h2>
            <a :href="backHref" class="text-[13px] font-medium text-[#3A5988] hover:underline">Lihat Semua →</a>
          </div>

          <div class="space-y-4">
            <template x-for="k in otherWorks" :key="k.id">
              <a :href="isKoordinator ? showcaseWorkLink(k) + '&from=koordinator' : showcaseWorkLink(k)"
                 class="group cursor-pointer flex flex-col no-underline text-inherit bg-white border border-[#E3E4E9] hover:border-[#3A5A86] rounded-[12px] p-3 transition-all duration-150 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-[#3A5988]">
                <div class="aspect-video w-full rounded-[8px] bg-[#E2F1F9] overflow-hidden relative">
                  <template x-if="k.banner">
                    <img :src="k.banner" :alt="k.nama" @error="k.banner = ''" class="w-full h-full object-cover group-hover:scale-[1.02] transition-transform duration-300">
                  </template>
                  <template x-if="!k.banner">
                    <div class="w-full h-full flex items-center justify-center text-[36px] font-semibold text-[#3A5A86]" x-text="(k.nama || 'A').charAt(0).toUpperCase()"></div>
                  </template>
                </div>

                <div class="mt-2.5">
                  <h3 class="text-[15px] font-semibold text-[#0C1117] group-hover:text-[#3A5A86] transition-colors line-clamp-1 leading-snug" x-text="k.nama"></h3>
                </div>

                <div class="mt-2 flex items-center gap-1.5 text-[12.5px] text-[#6B7280] font-normal">
                  <svg class="w-3.5 h-3.5 text-[#6B7280] flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
                    <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/>
                    <line x1="16" x2="16" y1="2" y2="6"/>
                    <line x1="8" x2="8" y1="2" y2="6"/>
                    <line x1="3" x2="21" y1="10" y2="10"/>
                  </svg>
                  <span x-text="k.date"></span>
                </div>

                <div class="mt-2.5 flex items-center gap-1.5 flex-wrap">
                  <template x-for="st in (k.stack || []).slice(0, 3)" :key="st">
                    <span class="h-6 px-2 rounded-[6px] bg-[#F4F5F7] border border-[#E3E4E9] text-[#4B5563] text-[11.5px] font-medium flex items-center" x-text="st"></span>
                  </template>
                  <template x-if="(k.stack || []).length > 3">
                    <span class="text-[11.5px] text-[#6B7280] font-normal ml-0.5" x-text="'+' + ((k.stack || []).length - 3)"></span>
                  </template>
                </div>

                <div class="mt-auto pt-3 flex items-center gap-2 min-w-0">
                  <template x-if="k.authorAvatar">
                    <img :src="k.authorAvatar" :alt="k.authorName" class="w-6 h-6 rounded-full object-cover border border-[#E3E4E9] flex-shrink-0">
                  </template>
                  <template x-if="!k.authorAvatar">
                    <div class="w-6 h-6 rounded-full bg-[#E2F1F9] text-[#3A5A86] flex items-center justify-center text-[10px] font-semibold flex-shrink-0" x-text="(k.authorName || 'A').charAt(0).toUpperCase()"></div>
                  </template>
                  <span class="text-[12.5px] text-[#6B7280] font-normal truncate" x-text="k.authorName"></span>
                </div>
              </a>
            </template>
          </div>
        </aside>
      </div>
    </template>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const dariKoordinator = params.get("from") === "koordinator" || (!params.get("from") && document.referrer.includes("/koordinator/"));

    function koordinatorProfileName() {
      try {
        const sesiId = Number(localStorage.getItem("alumni_revisi_sesi_v1"));
        const db = JSON.parse(localStorage.getItem("alumni_revisi_data_v5") || "{}");
        const user = Array.isArray(db.users) ? db.users.find(u => u.id === sesiId && u.role === "admin") : null;
        return user?.nama || "Koordinator Alumni";
      } catch {
        return "Koordinator Alumni";
      }
    }

    function detailKaryaPage() {
      const id = params.get("id");
      const allWorks = loadShowcaseWorks();
      return {
        allWorks,
        work: findShowcaseWork(allWorks, id),
        isKoordinator: dariKoordinator,
        backHref: dariKoordinator ? "../koordinator/karya.html" : "showcase.html",
        backLabel: dariKoordinator ? "Kembali ke Showcase Alumni" : "Kembali ke Karya Alumni",
        message: "",
        messageTimer: null,

        get otherWorks() {
          return this.allWorks.filter(w => !this.work || w.id !== this.work.id).slice(0, 3);
        },

        get demoLink() {
          try {
            const url = new URL(this.work?.demoLink);
            return ["http:", "https:"].includes(url.protocol) ? url.href : "";
          } catch {
            return "";
          }
        },

        get demoMeta() {
          if (!this.demoLink) return { label: "", host: "" };
          const url = new URL(this.demoLink);
          const host = url.hostname.replace(/^www\./, "");
          const isRepo = /(github\.com|gitlab\.com|bitbucket\.org)$/i.test(host);
          const path = url.pathname && url.pathname !== "/" ? url.pathname.replace(/\/$/, "") : "";
          return {
            label: isRepo ? "Repositori Kode Sumber" : "Demo Live Aplikasi",
            host: host + path
          };
        },

        formatAttachmentMeta(attachment) {
          const ext = /\.([^.]+)$/.exec(attachment?.name || "")?.[1]?.toUpperCase() || "FILE";
          const bytes = Number(attachment?.size) || 0;
          if (!bytes) return `Dokumen ${ext}`;
          const size = bytes >= 1024 * 1024 ? `${(bytes / (1024 * 1024)).toFixed(1)} MB` : `${Math.max(1, Math.round(bytes / 1024))} KB`;
          return `${ext} · ${size}`;
        },

        get contributorNames() {
          const contributors = this.work?.contributors || [];
          const names = contributors.map(person => (typeof person === "string" ? person : person?.name)?.trim());
          return [...new Set(names.filter(Boolean))];
        },

        notify(message) {
          this.message = message;
          clearTimeout(this.messageTimer);
          this.messageTimer = setTimeout(() => { this.message = ""; }, 3200);
        },

        async downloadAttachment(attachment, index) {
          try {
            await downloadKaryaAttachment(this.work.projectId, index, attachment);
          } catch {
            this.notify("Lampiran gagal diunduh.");
          }
        }
      };
    }

    if (dariKoordinator) {
      mountAlumniPortal(document.querySelector("main"), {
        profile: { name: koordinatorProfileName(), meta: "Koordinator Alumni" },
        logout: () => {
          try { localStorage.removeItem("alumni_revisi_sesi_v1"); } catch {}
          location.href = "../login.html?keluar=1";
        },
        nav: {
          routes: {
            "../koordinator/dashboard.html": ["Dashboard"],
            "../koordinator/data-alumni.html": ["Data Alumni"],
            "../koordinator/tracer.html": ["Statistik & Tracer"],
            "../koordinator/mitra.html": ["Mitra"],
            "../koordinator/forum.html": ["Forum"],
            "../koordinator/laporan-forum.html": ["Laporan Forum"],
            "../koordinator/karya.html": ["Karya Alumni"],
            "../koordinator/pengumuman.html": ["Pengumuman"],
            "detail-karya.html": ["Detail Karya", "../koordinator/karya.html"]
          },
          groups: [
            ["Menu Utama", [["../koordinator/dashboard.html", "home"], ["../koordinator/data-alumni.html", "idcard"], ["../koordinator/tracer.html", "chart"], ["../koordinator/mitra.html", "building"]]],
            ["Komunitas", [["../koordinator/forum.html", "chat"], ["../koordinator/laporan-forum.html", "flag"], ["../koordinator/karya.html", "trophy"], ["../koordinator/pengumuman.html", "megaphone"]]]
          ],
          home: "../koordinator/dashboard.html",
          root: "Koordinator",
          brand: "Portal Koordinator",
          label: "koordinator",
          accountLinks: [["../koordinator/profil.html", "Profil Saya"]]
        },
        notifications: {
          getAll: () => [],
          markRead: () => {},
          markAllRead: () => {},
          allHref: "../koordinator/notifikasi.html"
        }
      });
    } else {
      mountAlumniPortal(document.querySelector("main"));
    }
  </script>
</body>
</html>
