<!DOCTYPE html>
<html lang="id" data-color-mode="light" class="h-full bg-[#EFF2F7]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Karya | Karya Alumni Bengkel Koding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/alumni-data.js"></script>
  <script src="assets/js/alumni-catalog.js?v=2"></script>
  <script src="assets/js/portal-layout.js"></script>
  <script src="assets/js/karya-attachments.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    [x-cloak] { display: none !important; }
    body { font-family: "Inter", sans-serif; }
  </style>
</head>
<body class="h-full bg-[#EFF2F7] text-[#212224] antialiased selection:bg-[#3A5988] selection:text-white" x-data="detailKaryaPage()">
  <main data-karya-page="Detail Karya" class="mx-auto w-full max-w-[1260px] flex-1 space-y-5 p-4 sm:p-6 lg:p-8">
    <a href="showcase.html" class="inline-flex items-center gap-2 rounded text-[13.5px] font-semibold text-[#3A5988] hover:underline">
      <svg aria-hidden="true" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5m7-7-7 7 7 7"/>
      </svg>
      Kembali ke Karya Alumni
    </a>

    <p x-show="message" x-cloak x-text="message" role="status"
       class="fixed bottom-6 right-6 z-50 rounded-[8px] bg-[#0C1117] px-4 py-3 text-[13.5px] text-white shadow-md"></p>

    <template x-if="!work">
      <section class="space-y-2 rounded-[16px] border border-[#E3E4E9] bg-white p-6 shadow-sm">
        <h1 class="text-xl font-semibold text-[#0C1117]">Karya tidak ditemukan</h1>
        <p class="text-[14px] text-[#6B7280]">Pilih karya lain dari daftar Karya Alumni.</p>
      </section>
    </template>

    <template x-if="work">
      <div class="flex flex-col lg:flex-row gap-6 w-full items-start">
        <article class="flex-1 min-w-0 w-full space-y-6 rounded-[16px] border border-[#E3E4E9] bg-white p-6 sm:p-8 shadow-xs">
          <!-- 1. Header Artikel: Judul Utama Besar -->
          <div class="space-y-3">
            <h1 class="text-[26px] sm:text-[32px] font-bold text-[#0C1117] tracking-tight leading-tight" x-text="work.nama"></h1>

            <!-- 2. Baris Meta Byline (Avatar + Nama + Kategori + Tanggal) -->
            <div class="flex flex-wrap items-center gap-2.5 text-[14px] text-[#6B7280]">
              <template x-if="work.authorAvatar">
                <img :src="work.authorAvatar" class="w-8 h-8 rounded-full object-cover shrink-0" :alt="work.authorName">
              </template>
              <template x-if="!work.authorAvatar">
                <div class="w-8 h-8 rounded-full bg-[#E2F1F9] text-[#3A5A86] flex items-center justify-center text-[12px] font-semibold flex-shrink-0" x-text="(work.authorName || 'A').charAt(0).toUpperCase()"></div>
              </template>
              <span class="font-medium text-[#212224]" x-text="work.authorName || 'Alumni'"></span>
              <span class="text-[#9CA3AF]" x-show="work.category">·</span>
              <span class="text-[#3A5988] font-medium" x-show="work.category" x-text="work.category"></span>
              <span class="text-[#9CA3AF]" x-show="work.date">·</span>
              <span x-show="work.date" x-text="work.date"></span>
            </div>
          </div>

          <!-- 3. Banner Karya Resolusi Tinggi -->
          <div class="w-full aspect-[16/9] sm:h-[340px] lg:h-[380px] rounded-[14px] overflow-hidden bg-[#E2F1F9] border border-[#E3E4E9] relative">
            <template x-if="work.banner">
              <img :src="work.banner" :alt="work.nama" @error="work.banner = ''" class="w-full h-full object-cover">
            </template>
            <template x-if="!work.banner">
              <div class="w-full h-full flex items-center justify-center text-[54px] font-semibold text-[#3A5A86]" x-text="(work.nama || 'A').charAt(0).toUpperCase()"></div>
            </template>
          </div>

          <!-- 4. Deskripsi / Narasi Produk -->
          <div class="space-y-4 text-[15.5px] text-[#2D3748] leading-[1.85]">
            <p x-show="work.leadStory1 || work.tagline" x-text="work.leadStory1 || work.tagline"></p>
            <template x-if="work.leadStory2">
              <p x-text="work.leadStory2"></p>
            </template>
          </div>

          <!-- 5. Tautan Link & File di Bawah Deskripsi -->
          <div class="space-y-2.5 pt-1" x-show="demoLink || (work.attachments && work.attachments.length)">
            <template x-if="demoLink">
              <div class="flex items-center gap-2.5 text-[15px]">
                <span class="text-base select-none">🔗</span>
                <a :href="demoLink"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="text-[#3A5988] hover:text-[#283E5F] font-medium break-all no-underline"
                   x-text="demoLink"></a>
              </div>
            </template>

            <template x-for="(attachment, index) in (work.attachments || [])" :key="index">
              <div class="flex items-center gap-2.5 text-[15px]">
                <span class="text-base select-none">📁</span>
                <button type="button"
                        @click="downloadAttachment(attachment, index)"
                        class="text-[#3A5988] hover:text-[#283E5F] font-medium break-all text-left cursor-pointer"
                        x-text="attachment.name"></button>
              </div>
            </template>
          </div>

          <!-- 6. Tech Stack yang Digunakan (Format List Bulet-Bulet) -->
          <section x-show="work.stack?.length" class="pt-2 space-y-2.5">
            <h2 class="text-[17px] font-semibold text-[#0C1117] tracking-[-0.01em]">Tech Stack yang Digunakan</h2>
            <ul class="space-y-2 text-[15px] text-[#374151]">
              <template x-for="stack in (work.stack || [])" :key="stack">
                <li class="flex items-center gap-2.5 leading-relaxed font-normal">
                  <span class="w-1.5 h-1.5 rounded-full bg-[#4B5563] shrink-0"></span>
                  <span x-text="stack"></span>
                </li>
              </template>
            </ul>
          </section>
        </article>

        <!-- KOLOM KANAN: KARYA LAINNYA -->
        <aside class="w-full lg:w-[350px] xl:w-[380px] shrink-0 space-y-4">
          <div class="flex items-center justify-between px-1">
            <h2 class="text-[16px] font-bold text-[#0C1117]">Karya Lainnya</h2>
            <a href="showcase.html" class="text-[13px] font-medium text-[#3A5988] hover:underline">Lihat Semua →</a>
          </div>

          <div class="space-y-4">
            <template x-for="k in otherWorks" :key="k.id">
              <a :href="showcaseWorkLink(k)"
                 class="group cursor-pointer flex flex-col no-underline text-inherit bg-white border border-[#E3E4E9] hover:border-[#3A5A86] rounded-[12px] p-3 transition-all duration-150 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-[#3A5988]">
                <div class="aspect-video w-full rounded-[8px] bg-[#E2F1F9] overflow-hidden relative">
                  <template x-if="k.banner">
                    <img :src="k.banner" :alt="k.nama" @error="k.banner = ''" class="w-full h-full object-cover group-hover:scale-[1.02] transition-transform duration-300">
                  </template>
                  <template x-if="!k.banner">
                    <div class="w-full h-full flex items-center justify-center text-[36px] font-semibold text-[#3A5A86]" x-text="(k.nama || 'A').charAt(0).toUpperCase()"></div>
                  </template>
                </div>

                <div class="mt-2.5">
                  <h3 class="text-[15px] font-semibold text-[#0C1117] group-hover:text-[#3A5A86] transition-colors line-clamp-1 leading-snug" x-text="k.nama"></h3>
                </div>

                <div class="mt-2 flex items-center gap-1.5 text-[12.5px] text-[#6B7280] font-normal">
                  <svg class="w-3.5 h-3.5 text-[#6B7280] flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
                    <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/>
                    <line x1="16" x2="16" y1="2" y2="6"/>
                    <line x1="8" x2="8" y1="2" y2="6"/>
                    <line x1="3" x2="21" y1="10" y2="10"/>
                  </svg>
                  <span x-text="k.date"></span>
                </div>

                <div class="mt-2.5 flex items-center gap-1.5 flex-wrap">
                  <template x-for="st in (k.stack || []).slice(0, 3)" :key="st">
                    <span class="h-6 px-2 rounded-[6px] bg-[#F4F5F7] border border-[#E3E4E9] text-[#4B5563] text-[11.5px] font-medium flex items-center" x-text="st"></span>
                  </template>
                  <template x-if="(k.stack || []).length > 3">
                    <span class="text-[11.5px] text-[#6B7280] font-normal ml-0.5" x-text="'+' + ((k.stack || []).length - 3)"></span>
                  </template>
                </div>

                <div class="mt-auto pt-3 flex items-center gap-2 min-w-0">
                  <template x-if="k.authorAvatar">
                    <img :src="k.authorAvatar" :alt="k.authorName" class="w-6 h-6 rounded-full object-cover border border-[#E3E4E9] flex-shrink-0">
                  </template>
                  <template x-if="!k.authorAvatar">
                    <div class="w-6 h-6 rounded-full bg-[#E2F1F9] text-[#3A5A86] flex items-center justify-center text-[10px] font-semibold flex-shrink-0" x-text="(k.authorName || 'A').charAt(0).toUpperCase()"></div>
                  </template>
                  <span class="text-[12.5px] text-[#6B7280] font-normal truncate" x-text="k.authorName"></span>
                </div>
              </a>
            </template>
          </div>
        </aside>
      </div>
    </template>
  </main>

  <script>
    function detailKaryaPage() {
      const id = new URLSearchParams(window.location.search).get("id");
      const allWorks = loadShowcaseWorks();
      return {
        allWorks,
        work: findShowcaseWork(allWorks, id),
        message: "",
        messageTimer: null,

        get otherWorks() {
          return this.allWorks.filter(w => !this.work || w.id !== this.work.id).slice(0, 3);
        },

        get demoLink() {
          try {
            const url = new URL(this.work?.demoLink);
            return ["http:", "https:"].includes(url.protocol) ? url.href : "";
          } catch {
            return "";
          }
        },

        get contributorNames() {
          const contributors = this.work?.contributors || [];
          const names = contributors.map(person => (typeof person === "string" ? person : person?.name)?.trim());
          return [...new Set(names.filter(Boolean))];
        },

        notify(message) {
          this.message = message;
          clearTimeout(this.messageTimer);
          this.messageTimer = setTimeout(() => { this.message = ""; }, 3200);
        },

        async downloadAttachment(attachment, index) {
          try {
            await downloadKaryaAttachment(this.work.projectId, index, attachment);
          } catch {
            this.notify("Lampiran gagal diunduh.");
          }
        }
      };
    }

    mountAlumniPortal(document.querySelector('main'));
  </script>
</body>
</html>
