<!DOCTYPE html>
<html lang="en" data-color-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bengkel Koding</title>
  <meta name="description" content="Bengkel Koding Universitas Dian Nuswantoro Semarang">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/alumni.js"></script>
  <script src="assets/js/alumni-data.js"></script>
</head>
<body>
<!-- Konversi HTML dari lms-bengkod-web: app/(dashboard)/dashboard/alumni/lowongan/page.tsx + _components/ApplyJobModal.tsx -->
<main data-route="lowongan">
  <div x-data="jobsPage" class="w-full flex flex-col gap-6 py-2">
    <!-- Toast Notifikasi -->
    <template x-if="toast">
      <div class="fixed bottom-6 right-6 z-[90] bg-gray-900 text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 animate-fade-in text-[14px]">
        <span class="w-2 h-2 rounded-full bg-blue-500"></span>
        <span x-text="toast"></span>
      </div>
    </template>

    <!-- ============================================================
        HEADER & NAVIGASI TABS
    ============================================================ -->
    <div class="bg-white rounded-xl border border-gray-200/90 shadow-sm p-6 sm:p-7">
      <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
        <div>
          <h1 class="text-[28px] sm:text-[32px] font-bold text-gray-900 tracking-tight">
            Lowongan Kerja &amp; Karir Alumni
          </h1>
          <p class="text-[15px] text-gray-500 mt-1 font-normal">
            Peluang karir terverifikasi dari ekosistem mitra startup teknologi dan korporasi terkemuka.
          </p>
        </div>

        <!-- Tab Navigasi Simpel ala Profile & Dashboard -->
        <div class="flex items-center bg-gray-100 p-1 rounded-full w-fit">
          <button
            @click="activeTab = 'explore'"
            class="px-5 py-2.5 rounded-full text-[15px] font-semibold transition-colors cursor-pointer whitespace-nowrap"
            :class="activeTab === 'explore' ? 'bg-white text-[#1E3A8A] shadow-xs' : 'text-gray-600 hover:text-gray-900'"
          >
            Jelajahi
          </button>

          <button
            @click="activeTab = 'saved'"
            class="px-5 py-2.5 rounded-full text-[15px] font-semibold transition-colors cursor-pointer whitespace-nowrap"
            :class="activeTab === 'saved' ? 'bg-white text-[#1E3A8A] shadow-xs' : 'text-gray-600 hover:text-gray-900'"
          >
            Tersimpan
          </button>

          <button
            @click="activeTab = 'applied'"
            class="px-5 py-2.5 rounded-full text-[15px] font-semibold transition-colors cursor-pointer whitespace-nowrap"
            :class="activeTab === 'applied' ? 'bg-white text-[#1E3A8A] shadow-xs' : 'text-gray-600 hover:text-gray-900'"
          >
            Lamaran Saya
          </button>
        </div>
      </div>

      <!-- ============================================================
          BAR PENCARIAN & FILTER KATA KUNCI (HANYA MUNCUL DI EXPLORE/SAVED)
          BARIS 1 & 2 SEJAJAR PERSIS DALAM 12-KOLOM DENGAN KONTROL OVAL
      ============================================================ -->
      <template x-if="activeTab !== 'applied'">
        <div class="mt-6 pt-5 border-t border-gray-100 space-y-3">
          <!-- ── BARIS 1: PENCARIAN & RESET FILTER ── -->
          <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-center">
            <!-- Input Kata Kunci (Col 1-6) -->
            <div class="md:col-span-6 relative">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
                <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" />
              </svg>
              <input
                type="text"
                placeholder="Cari posisi pekerjaan, keahlian (Python, Next.js), atau perusahaan..."
                x-model="searchKeyword"
                class="w-full pl-11 pr-4 py-2.5 bg-white border border-gray-200 rounded-full text-[15px] text-gray-900 placeholder:text-gray-400 focus:outline-none focus:border-[#1E3A8A] focus:ring-2 focus:ring-[#1E3A8A]/10 transition-colors shadow-2xs"
              >
            </div>

            <!-- Input Lokasi (Col 7-10) -->
            <div class="md:col-span-4 relative">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                <circle cx="12" cy="10" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <input
                type="text"
                placeholder="Kota (Semarang, Jakarta) atau 'Remote'..."
                x-model="searchLocation"
                class="w-full pl-11 pr-4 py-2.5 bg-white border border-gray-200 rounded-full text-[15px] text-gray-900 placeholder:text-gray-400 focus:outline-none focus:border-[#1E3A8A] focus:ring-2 focus:ring-[#1E3A8A]/10 transition-colors shadow-2xs"
              >
            </div>

            <!-- Reset Filter Button (Col 11-12) -->
            <div class="md:col-span-2">
              <button
                type="button"
                @click="searchKeyword = ''; searchLocation = ''; filterWorkModel = 'Semua'; filterEmpType = 'Semua'; filterExpLevel = 'Semua'"
                class="w-full py-2.5 px-4 border border-gray-200 hover:border-gray-300 rounded-full text-[14px] font-semibold text-gray-600 hover:text-[#1E3A8A] bg-white transition-colors cursor-pointer text-center shadow-2xs"
              >
                Reset Filter
              </button>
            </div>
          </div>

          <!-- ── BARIS 2: FILTER DROPDOWN (3 KOLOM SEIMBANG) ── -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3 items-center">
            <!-- Filter Model Kerja -->
            <div>
              <select
                x-model="filterWorkModel"
                class="w-full px-4 py-2.5 rounded-full border border-gray-200 bg-white text-[15px] text-gray-700 hover:border-gray-300 focus:outline-none focus:border-[#1E3A8A] cursor-pointer shadow-2xs"
              >
                <option value="Semua">Model Kerja: Semua</option>
                <option value="Remote">Jarak Jauh (Remote)</option>
                <option value="Hybrid">Hybrid</option>
                <option value="On-site">Di Kantor (On-site)</option>
              </select>
            </div>

            <!-- Filter Tipe Pekerjaan -->
            <div>
              <select
                x-model="filterEmpType"
                class="w-full px-4 py-2.5 rounded-full border border-gray-200 bg-white text-[15px] text-gray-700 hover:border-gray-300 focus:outline-none focus:border-[#1E3A8A] cursor-pointer shadow-2xs"
              >
                <option value="Semua">Tipe: Semua</option>
                <option value="Full-time">Penuh Waktu (Full-time)</option>
                <option value="Internship">Magang (Internship)</option>
                <option value="Contract">Kontrak</option>
              </select>
            </div>

            <!-- Filter Pengalaman -->
            <div>
              <select
                x-model="filterExpLevel"
                class="w-full px-4 py-2.5 rounded-full border border-gray-200 bg-white text-[15px] text-gray-700 hover:border-gray-300 focus:outline-none focus:border-[#1E3A8A] cursor-pointer shadow-2xs"
              >
                <option value="Semua">Pengalaman: Semua</option>
                <option value="Fresh Graduate">Fresh Graduate</option>
                <option value="Junior">Junior (0-2 thn)</option>
                <option value="Mid-Level">Mid-Level (2-4 thn)</option>
              </select>
            </div>
          </div>
        </div>
      </template>
    </div>

    <!-- ============================================================
        KONTEN TAB: "LAMARAN SAYA" (APPLICATION TRACKER)
    ============================================================ -->
    <template x-if="activeTab === 'applied'">
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-2xs">
        <template x-if="applications.length === 0">
          <div class="text-center py-16 text-gray-400 space-y-3">
            <div class="w-16 h-16 rounded-full bg-blue-50 text-[#1E3A8A] flex items-center justify-center mx-auto">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none">
                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>
            <p class="text-[17px] font-semibold text-gray-900">Belum Ada Lamaran yang Dikirim</p>
            <p class="text-[15px] text-gray-500 max-w-md mx-auto">
              Eksplorasi lowongan kerja dari mitra Bengkel Koding dan kirimkan lamaran Anda!
            </p>
          </div>
        </template>
        <template x-if="applications.length > 0">
          <div>
            <!-- Delete action bar — hanya muncul jika ada item dipilih -->
            <template x-if="selectedAppIds.length > 0">
              <div class="flex items-center justify-between px-6 py-3 bg-blue-50 border-b border-blue-100">
                <span class="text-[14px] font-medium text-[#1E3A8A]" x-text="selectedAppIds.length + ' lamaran dipilih'"></span>
                <button
                  @click="handleDeleteSelected()"
                  class="flex items-center gap-2 px-4 py-1.5 rounded-full bg-[#1E3A8A] hover:bg-blue-900 text-white text-[14px] font-semibold transition-colors cursor-pointer"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9" />
                    <path d="M15 9l-6 6M9 9l6 6" />
                  </svg>
                  Batalkan
                </button>
              </div>
            </template>

            <!-- Header Kolom: Checkbox + "Pekerjaan" -->
            <div class="flex items-center gap-5 px-6 py-3.5 border-b border-gray-100 bg-gray-50/70">
              <input
                type="checkbox"
                :checked="selectedAppIds.length === applications.length && applications.length > 0"
                @change="handleToggleSelectAll()"
                class="w-4.5 h-4.5 rounded-[4px] border-2 border-gray-400 text-[#1E3A8A] focus:ring-0 cursor-pointer"
                aria-label="Pilih semua pekerjaan"
              >
              <span class="font-semibold text-[13px] text-gray-500 uppercase tracking-wide">Pekerjaan</span>
            </div>

            <!-- Rows List -->
            <div class="divide-y divide-gray-100">
              <template x-for="app in applications" :key="app.id">
                <div
                  @click="selectedJobId = app.jobId; activeTab = 'explore'"
                  class="flex items-center gap-5 px-6 py-5 hover:bg-blue-50/30 transition-colors cursor-pointer"
                  :class="selectedAppIds.includes(app.id) ? 'bg-blue-50/50' : ''"
                >
                  <!-- Checkbox -->
                  <input
                    type="checkbox"
                    :checked="selectedAppIds.includes(app.id)"
                    @click.stop
                    @change.stop="handleToggleSelectApp(app.id)"
                    class="w-4.5 h-4.5 flex-shrink-0 rounded-[4px] border-2 border-gray-300 text-[#1E3A8A] focus:ring-0 cursor-pointer"
                    :aria-label="'Pilih ' + app.jobTitle"
                  >

                  <!-- Logo -->
                  <img :src="app.companyLogo" :alt="app.company" class="w-11 h-11 rounded-lg object-cover border border-gray-200 flex-shrink-0">

                  <!-- Info -->
                  <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-1.5">
                      <h3 class="text-[15px] font-semibold text-gray-900 hover:text-[#1E3A8A] transition-colors leading-snug truncate" x-text="app.jobTitle"></h3>
                    </div>
                    <p class="text-[14px] text-gray-600 mt-0.5 truncate" x-text="app.company + ' · ' + app.applicantLocation"></p>
                    <p class="text-[13px] text-gray-400 mt-0.5" x-text="'Dilamar ' + app.appliedAt"></p>
                  </div>

                  <!-- Status badge -->
                  <div class="flex-shrink-0">
                    <span
                      class="inline-block px-3 py-1 rounded-full text-[13px] font-medium"
                      :class="app.status === 'Diterima'
                        ? 'bg-green-50 text-green-700'
                        : app.status === 'Ditolak'
                        ? 'bg-red-50 text-red-600'
                        : app.status === 'Proses Interview'
                        ? 'bg-blue-50 text-blue-700'
                        : 'bg-gray-100 text-gray-500'"
                      x-text="app.status"
                    ></span>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- ============================================================
        KONTEN UTAMA: LINKEDIN SPLIT SCREEN 2-COLUMN (EXPLORE & SAVED)
    ============================================================ -->
    <template x-if="activeTab !== 'applied'">
      <div class="flex flex-col lg:flex-row gap-6 items-start">
        <!-- ── KOLOM KIRI: DAFTAR KARTU LOWONGAN (FEED) ─────────────── -->
        <div class="w-full lg:w-[410px] xl:w-[440px] flex-shrink-0 flex flex-col gap-3.5">
          <div class="flex items-center justify-between px-1 text-[14px] font-medium text-gray-500">
            <span x-text="'Menampilkan ' + filteredJobs.length + ' lowongan'"></span>
            <span class="text-[13px] text-gray-400">Diurutkan: Paling Relevan</span>
          </div>

          <template x-if="filteredJobs.length === 0">
            <div class="bg-white rounded-xl border border-gray-200 p-10 text-center text-gray-400 shadow-xs">
              <p class="text-[15px] font-semibold text-gray-700">Tidak ada lowongan yang cocok</p>
              <p class="text-[14px] text-gray-400 mt-1">Coba sesuaikan kata kunci atau bersihkan filter pencarian.</p>
            </div>
          </template>
          <template x-if="filteredJobs.length > 0">
            <div class="space-y-3.5 max-h-[840px] overflow-y-auto pr-1 [&::-webkit-scrollbar]:w-1.5 [&::-webkit-scrollbar-thumb]:bg-gray-200 [&::-webkit-scrollbar-thumb]:rounded-full">
              <template x-for="job in filteredJobs" :key="job.id">
                <div
                  @click="selectedJobId = job.id"
                  class="p-5 rounded-xl border transition-all cursor-pointer relative bg-white"
                  :class="selectedJob && selectedJob.id === job.id
                    ? 'border-[#1E3A8A] ring-2 ring-[#1E3A8A]/15 shadow-sm'
                    : 'border-gray-200/90 hover:border-gray-300 hover:shadow-xs'"
                >
                  <!-- Atas: Logo, Info Utama, Bookmark -->
                  <div class="flex items-start justify-between gap-3">
                    <div class="flex items-start gap-3.5 min-w-0">
                      <img :src="job.companyLogo" :alt="job.company" class="w-11 h-11 rounded-lg object-cover border border-gray-100 flex-shrink-0">
                      <div class="min-w-0">
                        <h3 class="text-[15px] font-semibold text-gray-900 leading-snug hover:text-[#1E3A8A] transition-colors line-clamp-1" x-text="job.title"></h3>
                        <p class="text-[14px] font-normal text-[#1E3A8A] line-clamp-1 mt-0.5" x-text="job.company"></p>
                        <p class="text-[13px] text-gray-400 line-clamp-1 mt-0.5" x-text="job.location.replace(/\s*\(.*?\)\s*/g, '').trim()"></p>
                        <p class="text-[13px] text-gray-400 mt-0.5" x-text="job.datePosted"></p>
                      </div>
                    </div>

                    <!-- Tombol Bookmark -->
                    <button
                      type="button"
                      @click.stop="handleToggleBookmark(job.id)"
                      :title="savedJobIds.includes(job.id) ? 'Hapus dari tersimpan' : 'Simpan lowongan'"
                      class="w-8 h-8 rounded-full flex items-center justify-center transition-colors cursor-pointer flex-shrink-0"
                      :class="savedJobIds.includes(job.id) ? 'text-[#1E3A8A] bg-blue-50' : 'text-gray-400 hover:text-gray-700 hover:bg-gray-100'"
                    >
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" :fill="savedJobIds.includes(job.id) ? 'currentColor' : 'none'">
                        <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                      </svg>
                    </button>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </div>

        <!-- ── KOLOM KANAN: RINCIAN LENGKAP LOWONGAN (DETAIL VIEW) ──── -->
        <div class="flex-1 min-w-0 bg-white rounded-xl border border-gray-200/90 shadow-sm p-6 sm:p-7 sticky top-4 max-h-[860px] overflow-y-auto space-y-6 [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:bg-gray-200 [&::-webkit-scrollbar-thumb]:rounded-full">
          <template x-if="selectedJob">
            <div class="contents space-y-6">
              <!-- Header Card Detail -->
              <div class="border-b border-gray-100 pb-5">
                <div class="flex items-start justify-between gap-4">
                  <div class="flex items-start gap-4">
                    <img :src="selectedJob.companyLogo" :alt="selectedJob.company" class="w-14 h-14 rounded-xl object-cover border border-gray-200 shadow-xs flex-shrink-0">
                    <div>
                      <h2 class="text-[20px] font-bold text-gray-900 tracking-tight leading-tight" x-text="selectedJob.title"></h2>
                      <div class="flex items-center gap-2 mt-1">
                        <a :href="selectedJob.companyWebsite" target="_blank" rel="noreferrer" class="text-[15px] font-semibold text-[#1E3A8A] hover:underline" x-text="selectedJob.company"></a>
                      </div>
                      <p class="text-[14px] text-gray-700 mt-1" x-text="selectedJob.location + ' • ' + selectedJob.workModel + ' • Diposting ' + selectedJob.datePosted + ' • ' + selectedJob.applicantsCount + ' pelamar'"></p>
                    </div>
                  </div>
                </div>

                <!-- Tombol Aksi Utama (Lamar Sekarang & Simpan) -->
                <div class="mt-5 flex flex-wrap items-center gap-3">
                  <template x-if="applicationForSelectedJob">
                    <div class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-blue-50 text-[#1E3A8A] border border-blue-200 text-[15px] font-semibold">
                      <span x-text="'Lamaran Terkirim (' + applicationForSelectedJob.status + ')'"></span>
                    </div>
                  </template>
                  <template x-if="!applicationForSelectedJob">
                    <button
                      type="button"
                      id="btn-apply-job"
                      @click="handleOpenApply(selectedJob)"
                      class="px-6 py-2.5 bg-[#1E3A8A] hover:bg-[#1D4ED8] text-white font-semibold text-[15px] rounded-full shadow-sm transition-colors cursor-pointer"
                    >
                      Lamar Sekarang
                    </button>
                  </template>

                  <button
                    type="button"
                    @click="handleToggleBookmark(selectedJob.id)"
                    class="px-5 py-2.5 rounded-full text-[15px] font-semibold border transition-colors cursor-pointer"
                    :class="savedJobIds.includes(selectedJob.id) ? 'border-[#1E3A8A] text-[#1E3A8A] bg-blue-50/60' : 'border-gray-300 text-gray-700 hover:bg-gray-100'"
                    x-text="savedJobIds.includes(selectedJob.id) ? 'Tersimpan' : 'Simpan'"
                  ></button>

                  <button
                    type="button"
                    @click="navigator.clipboard.writeText(window.location.href); setToast('Tautan lowongan berhasil disalin ke clipboard!')"
                    class="p-2.5 rounded-full text-gray-500 hover:text-gray-800 hover:bg-gray-100 transition-colors cursor-pointer border border-gray-200"
                    title="Salin tautan lowongan"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none">
                      <circle cx="18" cy="5" r="3" stroke="currentColor" stroke-width="2" />
                      <circle cx="6" cy="12" r="3" stroke="currentColor" stroke-width="2" />
                      <circle cx="18" cy="19" r="3" stroke="currentColor" stroke-width="2" />
                      <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" stroke="currentColor" stroke-width="2" />
                      <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" stroke="currentColor" stroke-width="2" />
                    </svg>
                  </button>
                </div>

                <!-- Informasi Ringkas Posisi (Tersusun ke Bawah Secara Rapi) -->
                <div class="mt-4 pt-4 border-t border-gray-100 space-y-2 text-[15px]">
                  <div class="flex items-center">
                    <span class="text-gray-700 w-36 flex-shrink-0">Tipe Pekerjaan</span>
                    <span class="text-gray-700 mr-2">:</span>
                    <span class="text-gray-700" x-text="selectedJob.employmentType.split(' (')[0]"></span>
                  </div>
                  <div class="flex items-center">
                    <span class="text-gray-700 w-36 flex-shrink-0">Pengalaman</span>
                    <span class="text-gray-700 mr-2">:</span>
                    <span class="text-gray-700" x-text="selectedJob.experienceLevel"></span>
                  </div>
                  <div class="flex items-center">
                    <span class="text-gray-700 w-36 flex-shrink-0">Estimasi Gaji</span>
                    <span class="text-gray-700 mr-2">:</span>
                    <span class="text-gray-700" x-text="selectedJob.salaryRange.split(' /')[0]"></span>
                  </div>
                  <div class="flex items-center">
                    <span class="text-gray-700 w-36 flex-shrink-0">Skala Perusahaan</span>
                    <span class="text-gray-700 mr-2">:</span>
                    <span class="text-gray-700" x-text="selectedJob.companySize"></span>
                  </div>
                </div>
              </div>

              <!-- ── KEAHLIAN YANG DIBUTUHKAN ── -->
              <div class="space-y-2.5">
                <h3 class="text-[15px] font-bold text-gray-900">Keahlian yang Dibutuhkan:</h3>
                <div class="flex flex-wrap gap-2">
                  <template x-for="(skill, i) in selectedJob.skillsRequired" :key="i">
                    <span class="px-3 py-1 rounded-full text-[13px] font-medium bg-gray-100 text-gray-800" x-text="skill"></span>
                  </template>
                </div>
              </div>

              <!-- ── DESKRIPSI & RINCIAN PERAN ── -->
              <div class="space-y-4 text-[15px] text-gray-800 leading-relaxed border-t border-gray-100 pt-5">
                <div>
                  <h3 class="text-[15px] font-bold text-gray-900 mb-2">Tentang Posisi Ini</h3>
                  <p class="text-gray-700" x-text="selectedJob.description"></p>
                </div>

                <div>
                  <h4 class="text-[15px] font-bold text-gray-900 mb-2">Tanggung Jawab Utama:</h4>
                  <ul class="list-disc pl-5 space-y-1.5 text-gray-700">
                    <template x-for="(res, i) in selectedJob.responsibilities" :key="i"><li x-text="res"></li></template>
                  </ul>
                </div>

                <div>
                  <h4 class="text-[15px] font-bold text-gray-900 mb-2">Kualifikasi &amp; Persyaratan:</h4>
                  <ul class="list-disc pl-5 space-y-1.5 text-gray-700">
                    <template x-for="(q, i) in selectedJob.qualifications" :key="i"><li x-text="q"></li></template>
                  </ul>
                </div>

                <div>
                  <h4 class="text-[15px] font-bold text-gray-900 mb-2">Benefit &amp; Fasilitas:</h4>
                  <ul class="list-disc pl-5 space-y-1.5 text-gray-700">
                    <template x-for="(b, i) in selectedJob.benefits" :key="i"><li x-text="b"></li></template>
                  </ul>
                </div>
              </div>

    <!-- ============================================================
        MODAL: LAMAR PEKERJAAN (EASY APPLY MULTI-STEP) — _components/ApplyJobModal.tsx

          <!-- Progress Bar (Step Indicator) -->

          <!-- Body Content by Step -->
          <div class="p-6 overflow-y-auto space-y-4 flex-1 text-[15px]">
            <!-- STEP 1: INFO KONTAK -->
            <template x-if="ap.step === 1">
              <div class="space-y-4">
                <div>
                  <h4 class="text-[15px] font-medium text-gray-900">Informasi Kontak Anda</h4>

                <div>
                  <label class="block text-[14px] font-medium text-gray-700 mb-1.5">Nama Lengkap *</label>

                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" class="text-[#1E3A8A] flex-shrink-0">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />

                <div class="p-3 bg-blue-50/60 rounded-xl border border-blue-100 flex items-start gap-2.5 text-[14px] text-blue-900">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" class="flex-shrink-0 mt-0.5 text-[#1E3A8A]">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
                    <line x1="12" y1="16" x2="12" y2="12" stroke="currentColor" stroke-width="2" />

                  <span>CV berisi data profil, pendidikan, proyek, keahlian, dan sertifikasi Anda. Untuk mengubah isinya, perbarui halaman <a href="profil.html" class="font-semibold underline">Profil Saya</a>.</span>

            </template>

            <!-- STEP 3: PORTOFOLIO & CATATAN PENGANTAR -->
            <template x-if="ap.step === 3">
              <div class="space-y-4">
                <div>
                  <h4 class="text-[15px] font-medium text-gray-900">Tautan Portofolio &amp; Pengantar</h4>
                  <p class="text-[14px] text-gray-500 mt-0.5">
                    Berikan bukti pencapaian riset, proyek capstone, atau link akun profesional Anda.
                  </p>
                </div>

                <div>
                  <label class="block text-[14px] font-medium text-gray-700 mb-1.5">Tautan GitHub / Portofolio Web</label>
                  <input type="url" x-model="ap.portfolioUrl" placeholder="https://github.com/username" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-[#1E3A8A] focus:ring-2 focus:ring-[#1E3A8A]/10 text-gray-900 shadow-xs">
                </div>

                <div>
                  <label class="block text-[14px] font-medium text-gray-700 mb-1.5">Tautan Profil LinkedIn</label>
                  <input type="url" x-model="ap.linkedinUrl" placeholder="https://linkedin.com/in/username" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-[#1E3A8A] focus:ring-2 focus:ring-[#1E3A8A]/10 text-gray-900 shadow-xs">
                </div>

                <div>
                  <label class="block text-[14px] font-medium text-gray-700 mb-1.5">
                    Surat Pengantar Singkat / Cover Note (Opsional)
                  </label>
                  <textarea rows="3" x-model="ap.coverNote" placeholder="Ceritakan secara ringkas mengapa Anda antusias melamar posisi ini..." class="w-full p-3 rounded-xl border border-gray-200 focus:outline-none focus:border-[#1E3A8A] focus:ring-2 focus:ring-[#1E3A8A]/10 text-gray-900 resize-none leading-relaxed shadow-xs"></textarea>
                </div>
              </div>
            </template>

            <!-- STEP 4: TINJAU & KONFIRMASI -->
            <template x-if="ap.step === 4">
              <div class="space-y-4">
                <div>
                  <h4 class="text-[15px] font-medium text-gray-900">Tinjau Lamaran Anda</h4>
                  <p class="text-[15px] text-gray-500 mt-0.5" x-text="'Pastikan semua data sudah benar sebelum mengirimkan ke tim rekrutmen ' + applyingJob.company + '.'"></p>
                </div>

                <div class="bg-gray-50/70 rounded-xl p-4 border border-gray-200 space-y-3">
                  <div class="flex items-center justify-between border-b border-gray-100 pb-2.5">
                    <span class="text-gray-700">Posisi Lowongan:</span>
                    <span class="text-gray-700" x-text="applyingJob.title"></span>
                  </div>
                  <div class="flex items-center justify-between border-b border-gray-100 pb-2.5">
                    <span class="text-gray-700">Nama Pelamar:</span>
                    <span class="text-gray-700" x-text="ap.name"></span>
                  </div>
                  <div class="flex items-center justify-between border-b border-gray-100 pb-2.5">
                    <span class="text-gray-700">Email &amp; HP:</span>
                    <span class="text-gray-700 text-right" x-text="ap.email + ' • ' + ap.phone"></span>
                  </div>
                  <div class="flex items-center justify-between border-b border-gray-100 pb-2.5">
                    <span class="text-gray-700">File Resume Terpilih:</span>
                    <span class="text-[#1E3A8A] flex items-center gap-1.5">
                      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" class="text-[#1E3A8A] flex-shrink-0">
                        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        <polyline points="14 2 14 8 20 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                      </svg>
                      <span x-text="cvFileName"></span>
                    </span>
                  </div>
                  <template x-if="ap.portfolioUrl">
                    <div class="flex items-center justify-between">
                      <span class="text-gray-700">Tautan Portofolio:</span>
                      <span class="text-gray-700 truncate max-w-[240px]" x-text="ap.portfolioUrl"></span>
                    </div>
                  </template>
                </div>

                <label class="flex items-start gap-2.5 p-3 rounded-xl border border-gray-200 bg-white cursor-pointer select-none">
                  <input type="checkbox" x-model="ap.consentCheck" class="w-4 h-4 mt-0.5 text-[#1E3A8A] rounded">
                  <span class="text-[14px] text-gray-700 leading-snug">
                    Saya mengonfirmasi bahwa data yang diberikan adalah benar dan mengizinkan tim rekrutmen <strong x-text="applyingJob.company"></strong> untuk melihat profil portofolio serta riwayat proyek saya.
                  </span>
                </label>
              </div>
            </template>
          </div>

          <!-- Footer Actions -->
          <div class="px-6 py-4 border-t border-gray-100 flex items-center justify-between bg-white">
            <template x-if="ap.step > 1">
              <button
                type="button"
                @click="ap.step--"
                class="px-5 py-2.5 border border-gray-300 text-gray-700 hover:bg-gray-100 font-semibold text-[14px] rounded-full transition-colors cursor-pointer"
              >
                Kembali
              </button>
            </template>
            <template x-if="ap.step <= 1">
              <button
                type="button"
                @click="applyModalOpen = false"
                class="px-5 py-2.5 text-gray-600 hover:bg-gray-100 font-semibold text-[14px] rounded-full transition-colors cursor-pointer"
              >
                Batal
              </button>
            </template>

            <template x-if="ap.step < 4">
              <button
                type="button"
                @click="ap.step++"
                class="px-6 py-2.5 bg-[#1E3A8A] hover:bg-[#1D4ED8] text-white font-semibold text-[14px] rounded-full shadow-sm transition-colors cursor-pointer"
              >
                Lanjutkan
              </button>
            </template>
            <template x-if="ap.step >= 4">
              <button
                type="button"
                id="btn-submit-job-application"
                :disabled="!ap.consentCheck"
                @click="handleApplySubmit()"
                class="px-6 py-2.5 text-white font-semibold text-[14px] rounded-full shadow-sm transition-colors cursor-pointer flex items-center gap-2"
                :class="ap.consentCheck ? 'bg-[#1E3A8A] hover:bg-[#1D4ED8]' : 'bg-gray-400 cursor-not-allowed'"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none">
                  <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>Kirim Lamaran Sekarang</span>
              </button>
            </template>
          </div>
        </div>
      </div>
    </template>

</main>

<script>
  document.addEventListener("alpine:init", () => {
    Alpine.data("jobsPage", () => {
      const currentAlumni = ALUMNI_DIRECTORY[0];
      const defaultProfile = {
        name: currentAlumni.name,
        email: currentAlumni.email || "aisha.rahma@alumni.dinus.ac.id",
        phone: "+62 812-3456-7890",
        location: currentAlumni.location,
        headline: currentAlumni.headline,
        github: currentAlumni.github,
        linkedin: currentAlumni.linkedin,
        skills: ["Python", "Machine Learning", "Data Science", "SQL", "Next.js", "TypeScript", "React"],
      };
      return {
        profile: { ...defaultProfile },
        activeTab: "explore",
        jobs: INITIAL_JOBS,
        selectedJobId: INITIAL_JOBS[0].id,
        searchKeyword: "",
        searchLocation: "",
        filterWorkModel: "Semua",
        filterEmpType: "Semua",
        filterExpLevel: "Semua",
        savedJobIds: [],
        applications: [],
        selectedAppIds: [],
        applyModalOpen: false,
        applyingJob: null,
        toast: "",
        toastTimer: null,

        // State ApplyJobModal (tetap tersimpan antar buka/tutup seperti komponen React yang selalu ter-mount)
        ap: {
          step: 1,
          name: defaultProfile.name,
          email: defaultProfile.email,
          phone: defaultProfile.phone,
          location: defaultProfile.location,
          portfolioUrl: defaultProfile.github || "https://github.com/aishaadr",
          linkedinUrl: defaultProfile.linkedin || "https://linkedin.com/in/aisharah",
          coverNote: "",
          consentCheck: true,
        },

        init() {
          this.savedJobIds = loadSavedJobs();
          this.applications = loadJobApplications();
          try {
            const savedProf = localStorage.getItem("bengkod_alumni_profile");
            if (savedProf) {
              const parsed = JSON.parse(savedProf);
              this.profile = {
                ...this.profile,
                name: parsed.name || this.profile.name,
                headline: parsed.headline || this.profile.headline,
                location: parsed.location || this.profile.location,
                email: parsed.email || this.profile.email,
              };
            }
          } catch {}
        },

        setToast(msg) {
          this.toast = msg;
          clearTimeout(this.toastTimer);
          this.toastTimer = setTimeout(() => (this.toast = ""), 2800);
        },

        get filteredJobs() {
          return this.jobs.filter((job) => {
            if (this.activeTab === "saved" && !this.savedJobIds.includes(job.id)) return false;
            if (this.searchKeyword.trim()) {
              const q = this.searchKeyword.toLowerCase();
              const matchTitle = job.title.toLowerCase().includes(q);
              const matchCompany = job.company.toLowerCase().includes(q);
              const matchSkills = job.skillsRequired.some((s) => s.toLowerCase().includes(q));
              if (!matchTitle && !matchCompany && !matchSkills) return false;
            }
            if (this.searchLocation.trim()) {
              const loc = this.searchLocation.toLowerCase();
              const matchLoc = job.location.toLowerCase().includes(loc);
              const matchModel = job.workModel.toLowerCase().includes(loc);
              if (!matchLoc && !matchModel) return false;
            }
            if (this.filterWorkModel !== "Semua" && !job.workModel.toLowerCase().includes(this.filterWorkModel.toLowerCase())) return false;
            if (this.filterEmpType !== "Semua" && !job.employmentType.toLowerCase().includes(this.filterEmpType.toLowerCase())) return false;
            if (this.filterExpLevel !== "Semua" && !job.experienceLevel.toLowerCase().includes(this.filterExpLevel.toLowerCase())) return false;
            return true;
          });
        },

        // Revisi UX: nama berkas CV otomatis dari nama pelamar
        get cvFileName() {
          return "CV_" + this.ap.name.trim().split(/\s+/).join("_") + "_2026.pdf";
        },

        get selectedJob() {
          return this.jobs.find((j) => j.id === this.selectedJobId) || this.filteredJobs[0] || this.jobs[0];
        },

        get applicationForSelectedJob() {
          return this.applications.find((a) => a.jobId === (this.selectedJob && this.selectedJob.id));
        },

        handleToggleBookmark(id) {
          let updated;
          if (this.savedJobIds.includes(id)) {
            updated = this.savedJobIds.filter((itemId) => itemId !== id);
            this.setToast("Lowongan dihapus dari daftar tersimpan");
          } else {
            updated = [...this.savedJobIds, id];
            this.setToast("Lowongan disimpan ke daftar tersimpan");
          }
          this.savedJobIds = updated;
          saveSavedJobs(updated);
        },

        handleOpenApply(jobToApply) {
          this.applyingJob = jobToApply;
          this.applyModalOpen = true;
        },

        handleApplySubmit() {
          const job = this.applyingJob;
          const newApp = {
            id: `app-${Date.now()}`,
            jobId: job.id,
            jobTitle: job.title,
            company: job.company,
            companyLogo: job.companyLogo,
            applicantName: this.ap.name,
            applicantEmail: this.ap.email,
            applicantPhone: this.ap.phone,
            applicantLocation: this.ap.location,
            resumeFileName: this.cvFileName,
            portfolioUrl: this.ap.portfolioUrl || undefined,
            linkedinUrl: this.ap.linkedinUrl || undefined,
            coverNote: this.ap.coverNote || undefined,
            status: "Lamaran Terkirim",
            appliedAt: "Baru saja",
          };
          const updated = [newApp, ...this.applications];
          this.applications = updated;
          saveJobApplications(updated);
          this.applyModalOpen = false;
          this.setToast(`Lamaran berhasil dikirim ke ${newApp.company}!`);
          this.ap.step = 1;
        },

        handleToggleSelectAll() {
          if (this.selectedAppIds.length === this.applications.length) this.selectedAppIds = [];
          else this.selectedAppIds = this.applications.map((a) => a.id);
        },

        handleToggleSelectApp(id) {
          this.selectedAppIds = this.selectedAppIds.includes(id)
            ? this.selectedAppIds.filter((item) => item !== id)
            : [...this.selectedAppIds, id];
        },

        // Revisi UX: aksi "Hapus" diganti "Batalkan" lamaran
        handleDeleteSelected() {
          const count = this.selectedAppIds.length;
          this.applications = this.applications.filter((a) => !this.selectedAppIds.includes(a.id));
          this.selectedAppIds = [];
          this.setToast(`${count} lamaran berhasil dibatalkan.`);
        },
      };
    });
  });
</script>
