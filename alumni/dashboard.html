        get filteredPosts() {
          let list = this.posts;

          // Filter Tab
          if (this.activeTab !== 'all') {
            list = list.filter(p => p.category === this.activeTab);
          }

          // Filter Tag
          if (this.selectedTag) {
            list = list.filter(p => (p.tags || []).includes(this.selectedTag));
          }

          return list;
        },

        filterByTag(tag) {
          if (this.selectedTag === tag) {
            this.selectedTag = '';
          } else {
            this.selectedTag = tag;
          }
        },

        toggleLike(post) {
          post.isLiked = !post.isLiked;
          post.likesCount += (post.isLiked ? 1 : -1);
          if (post.isLiked) {
            this.setToast('Apresiasi berhasil diberikan (+1 Like)!');
          }
        },

        toggleComments(post) {
          post.showComments = !post.showComments;
        },

        addComment(post) {
          if (!post.newCommentText || !post.newCommentText.trim()) return;
          const newComment = {
            id: Date.now(),
            author: this.userProfile.name,
            avatar: this.userProfile.avatar,
            time: "Baru saja",
            text: post.newCommentText.trim()
          };
          if (!post.comments) post.comments = [];
          post.comments.push(newComment);
          post.commentsCount++;
          post.newCommentText = '';
          this.setToast('Komentar Anda berhasil diposting!');
        },

        sharePost(post) {
          navigator.clipboard.writeText(window.location.href);
          post.sharesCount++;
          this.setToast('Tautan postingan berhasil disalin ke clipboard!');
        },

        init() {
          this.refreshStoredPosts(this.seedDashboardPosts() ? [] : this.posts);
          this.refreshSidebar();
          window.addEventListener('pageshow', event => {
            if (event.persisted) this.refreshStoredPosts();
            this.refreshSidebar();
          });
          window.addEventListener('storage', event => {
            if (event.key === STORAGE_KEY || event.key === null) this.refreshStoredPosts();
            this.refreshSidebar();
          });
          this.startSpotlightAutoplay();
        },

        seedDashboardPosts() {
          try {
            if (localStorage.getItem(DASHBOARD_SEED_KEY)) return true;
            const posts = loadPosts();
            const existingIds = new Set(posts.map(post => post.id));
            const examples = this.posts.filter(post => !existingIds.has(post.id)).map(post => ({
              id: post.id,
              date: new Date().toISOString(),
              authorName: post.authorName,
              authorAvatar: post.authorAvatar,
              authorHeadline: post.authorHeadline,
              content: post.textFull,
              imageUrl: post.mediaImage || '',
              category: this.attachmentTypes[post.category]?.category || 'Umum',
              likes: post.likesCount,
              commentsCount: post.commentsCount,
              repostsCount: post.sharesCount,
              fromDashboard: true,
              dashboardPresentation: post
            }));
            if (examples.length && !savePosts([...posts, ...examples])) return false;
            localStorage.setItem(DASHBOARD_SEED_KEY, '1');
            return true;
          } catch {
            return false;
          }
        },

        refreshStoredPosts(fallback = []) {
          const shown = new Map(this.posts.map(post => [post.id, post]));
          const saved = loadPosts()
            .filter(post => post.fromDashboard)
            .sort((a, b) => b.id - a.id)
            .map(post => this.formatDashboardPost(post, shown.get(post.id)));
          const savedIds = new Set(saved.map(post => post.id));
          this.posts = [...saved, ...fallback.filter(post => !savedIds.has(post.id))];
        },

        ownsPost(post) {
          if (!post?.fromDashboard || post.dashboardPresentation) return false;
          return post.authorId != null
            ? post.authorId === this.userProfile.id
            : [this.userProfile.name, ALUMNI_DIRECTORY[0].name].includes(post.authorName);
        },

        openPostReport(post) {
          this.postMenuId = null;
          this.reportTargetId = post.id;
          this.reportReason = '';
          this.reportError = '';
          this.$refs.postReportDialog.showModal();
        },

        submitPostReport() {
          const reason = this.reportReason.trim();
          if (!reason) {
            this.reportError = 'Isi alasan laporan terlebih dahulu.';
            return;
          }

          const result = FeedBersama.lapor({
            id: this.reportTargetId,
            pelapor: this.userProfile.name,
            alasan: reason
          });
          if (!result.ok) {
            this.reportError = result.error;
            return;
          }
          this.$refs.postReportDialog.close();
          this.setToast('Laporan dikirim ke koordinator.');
        },

        deleteOwnPost(post) {
          this.postMenuId = null;
          if (!this.ownsPost(post) || !window.confirm('Hapus postingan ini?')) return;

          const posts = loadPosts();
          if (!this.ownsPost(posts.find(item => item.id === post.id))) {
            this.refreshStoredPosts();
            this.setToast('Postingan sudah tidak tersedia.');
            return;
          }
          if (!savePosts(posts.filter(item => item.id !== post.id))) {
            this.setToast('Postingan gagal dihapus. Coba lagi.');
            return;
          }
          this.posts = this.posts.filter(item => item.id !== post.id);
          this.setToast('Postingan berhasil dihapus.');
        },

        refreshSidebar() {
          this.spotlightWorks = loadSpotlightWorks().slice(0, 3).map(work => ({
            ...work, link: showcaseWorkLink(work)
          }));
          if (this.spotlightIndex >= this.spotlightWorks.length) this.spotlightIndex = 0;
          this.latestProjects = latestBoardGigs().slice(0, 3).map(gig => ({
            ...gig, link: boardGigLink(gig)
          }));
        },

        prevSpotlight() {
          if (this.spotlightWorks.length <= 1) return;
          this.spotlightIndex = (this.spotlightIndex - 1 + this.spotlightWorks.length) % this.spotlightWorks.length;
          this.startSpotlightAutoplay();
        },

        nextSpotlight() {
          if (this.spotlightWorks.length <= 1) return;
          this.spotlightIndex = (this.spotlightIndex + 1) % this.spotlightWorks.length;
          this.startSpotlightAutoplay();
        },

        goToSpotlight(idx) {
          this.spotlightIndex = idx;
          this.startSpotlightAutoplay();
        },

        startSpotlightAutoplay() {
          this.stopSpotlightAutoplay();
          if (this.spotlightWorks.length <= 1) return;
          this.spotlightTimer = setInterval(() => {
            this.spotlightIndex = (this.spotlightIndex + 1) % this.spotlightWorks.length;
          }, 7000);
        },

        stopSpotlightAutoplay() {
          if (this.spotlightTimer) {
            clearInterval(this.spotlightTimer);
            this.spotlightTimer = null;
          }
        },

        get canSubmitPost() {
          return !this.photoReading && Boolean(this.newPostText.trim() || this.composerPhoto || this.attachment);
        },

        toggleAttachmentPicker(kind) {
          this.pickerKind = this.pickerKind === kind ? '' : kind;
          this.pickerSearch = '';
          this.pickerOptions = this.pickerKind ? dashboardAttachmentOptions(kind, this.userProfile) : [];
        },

        get filteredPickerOptions() {
          const q = this.pickerSearch.trim().toLowerCase();
          if (!q) return this.pickerOptions;
          return this.pickerOptions.filter(o =>
            [o.title, o.detail].filter(Boolean).some(v => v.toLowerCase().includes(q))
          );
        },

        selectAttachment(option) {
          this.attachment = { ...option, kind: this.pickerKind };
          if (this.newPostCategory === 'all') this.newPostCategory = this.pickerKind;
          this.pickerKind = '';
          this.pickerSearch = '';
        },

        async selectPhoto(event) {
          const file = event.target.files[0];
          event.target.value = '';
          if (!file || this.photoReading) return;
          const error = validateImageFile(file);
          if (error) {
            this.setToast(error);
            return;
          }
          this.photoReading = true;
          try {
            this.composerPhoto = await readFileAsDataUrl(file);
          } catch {
            this.setToast('Foto gagal dibaca.');
          } finally {
            this.photoReading = false;
          }
        },

        formatDashboardPost(post, shown) {
          return {
            timeAgo: new Date(post.id).toLocaleDateString('id-ID', { dateStyle: 'medium' }),
            category: post.dashboardAttachment?.kind || post.dashboardCategory || 'all',
            tags: [],
            textShort: post.content,
            textFull: post.content,
            mediaImage: post.imageUrl,
            attachment: post.dashboardAttachment,
            isExpanded: false,
            likesCount: post.likes || 0,
            isLiked: post.isLiked || false,
            commentsCount: post.commentsCount || 0,
            sharesCount: post.repostsCount || 0,
            showComments: false,
            newCommentText: '',
            comments: [],
            ...post.dashboardPresentation,
            ...shown,
            id: post.id,
            authorName: post.authorName,
            authorAvatar: post.authorAvatar,
            authorHeadline: post.authorHeadline,
            authorId: post.authorId,
            fromDashboard: post.fromDashboard,
            dashboardPresentation: post.dashboardPresentation
          };
        },

        submitNewPost() {
          if (!this.canSubmitPost) return;
          const posts = loadPosts();
          let id = Date.now();
          while (posts.some(post => post.id === id)) id++;
          const effectiveKind = this.attachment?.kind || (this.newPostCategory !== 'all' ? this.newPostCategory : '');
          const post = {
            id,
            date: 'Baru saja',
            authorId: this.userProfile.id,
            authorName: this.userProfile.name,
            authorAvatar: this.userProfile.avatar,
            authorHeadline: this.userProfile.headline,
            category: this.attachmentTypes[effectiveKind]?.category || 'Umum',
            dashboardCategory: effectiveKind || 'all',
            content: this.newPostText.trim(),
            imageUrl: this.composerPhoto,
            dashboardAttachment: this.attachment ? { ...this.attachment } : null,
            fromDashboard: true,
            likes: 0,
            commentsCount: 0,
            repostsCount: 0
          };
          if (!savePosts([post, ...posts])) {
            this.setToast('Postingan gagal disimpan. Coba lagi atau gunakan foto yang lebih kecil.');
            return;
          }

          const displayed = this.formatDashboardPost(post);
          displayed.timeAgo = 'Baru saja';
          this.posts.unshift(displayed);
          this.newPostText = '';
          this.newPostCategory = 'all';
          this.composerPhoto = '';
          this.attachment = null;
          this.pickerKind = '';
          this.pickerSearch = '';
          if (this.$refs.composerTextarea) {
            this.$refs.composerTextarea.style.height = '24px';
            this.$refs.composerTextarea.style.overflowY = 'hidden';
          }
          this.activeTab = 'all';
          this.selectedTag = '';
          this.setToast('Postingan berhasil dibagikan ke linimasa alumni!');
        },

        setToast(msg) {
          this.toast = msg;
          clearTimeout(this.toastTimer);
          this.toastTimer = setTimeout(() => { this.toast = ''; }, 3200);
        }
      };
    }

    document.addEventListener('alpine:init', () => {
      if (window.Alpine) {
        window.Alpine.data('bengkodDashboardApp', bengkodDashboardApp);
      }
    });
  </script>
  <script src="assets/js/portal-layout.js"></script>
</head>

                    </form>

                    <!-- Daftar Komentar Mengalir Bersih -->
                    <div class="space-y-3 pt-2">
                      <template x-for="c in post.comments" :key="c.id">
                        <div class="flex items-start gap-2.5 text-[13px]">
                          <img :src="c.avatar" class="w-7 h-7 rounded-full object-cover shrink-0 mt-0.5">
                          <div class="bg-[#F8FAFC] p-3 rounded-[12px] flex-1 space-y-0.5">
                            <div class="flex items-center justify-between">
                              <span class="font-bold text-[#0C1117]" x-text="c.author"></span>
                              <span class="text-[11px] text-[#91969C]" x-text="c.time"></span>
                            </div>
                            <p class="text-[#374151]" x-text="c.text"></p>
                          </div>
                        </div>
                      </template>
                    </div>

                  </div>

                </article>
              </template>

              <!-- Empty State bila filter tidak menemukan post -->
              <template x-if="filteredPosts.length === 0">
                <div class="bg-white border border-[#E3E4E9] rounded-[16px] p-8 text-center space-y-2">
                  <p class="text-[15px] font-semibold text-[#0C1117]">Belum ada postingan di kategori ini</p>
                  <p class="text-[13px] text-[#6B7280]">Coba ganti filter tab atau pilih topik populer lain.</p>
                  <button type="button" @click="activeTab = 'all'; selectedTag = ''" class="mt-2 px-4 py-1.5 rounded-full border border-[#E3E4E9] bg-white text-[13px] font-medium text-[#3A5988] hover:bg-[#F4F5F7]">
                    Reset Filter Linimasa
                  </button>
                </div>
              </template>

            </div>

          </div>

          <!-- ========================================================
               KOLOM KANAN: PROFIL SAYA & WIDGET PENGUMUMAN
          ======================================================== -->
          <aside class="lg:col-span-4 space-y-5 lg:sticky lg:top-20">

            <!-- 1. Spotlight Karya (Carousel maks. 3 card) -->
            <section aria-label="Spotlight Karya"
                     @mouseenter="stopSpotlightAutoplay()"
                     @mouseleave="startSpotlightAutoplay()"
                     @focusin="stopSpotlightAutoplay()"
                     @focusout="startSpotlightAutoplay()"
                     class="bg-white border border-[#E3E4E9] rounded-[16px] p-5 sm:p-6 shadow-sm space-y-4">
              <div class="flex items-center justify-between gap-3">
                <h3 class="text-[16px] font-bold text-[#0C1117]">Spotlight Karya</h3>
                <div class="flex items-center gap-2">
                  <template x-if="spotlightWorks.length > 1">
                    <div class="flex items-center gap-1">
                      <button type="button" @click="prevSpotlight()" aria-label="Karya sebelumnya"
                              class="w-7 h-7 rounded-full border border-[#E3E4E9] bg-white hover:bg-[#F4F5F7] text-[#374151] flex items-center justify-center transition-colors cursor-pointer">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6"/></svg>
                      </button>
                      <button type="button" @click="nextSpotlight()" aria-label="Karya berikutnya"
                              class="w-7 h-7 rounded-full border border-[#E3E4E9] bg-white hover:bg-[#F4F5F7] text-[#374151] flex items-center justify-center transition-colors cursor-pointer">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6"/></svg>
                      </button>
                    </div>
                  </template>
                </div>
              </div>
              <p x-show="!spotlightWorks.length" class="text-[13px] text-[#6B7280]">Belum ada karya yang ditampilkan.</p>

              <div x-show="spotlightWorks.length" class="overflow-hidden rounded-[14px]">
                <div class="flex transition-transform duration-300 ease-out"
                     :style="'transform: translateX(-' + (spotlightIndex * 100) + '%)'">
                  <template x-for="work in spotlightWorks" :key="work.id">
                    <a :href="work.link"
                       class="group block w-full shrink-0 overflow-hidden rounded-[14px] border border-[#E3E4E9] transition hover:border-[#3A5988]/40 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#3A5988]">
                      <div class="relative aspect-video overflow-hidden bg-gradient-to-br from-[#E2F1F9] to-[#F4F5F7]">
                        <div aria-hidden="true" class="absolute inset-0 grid place-items-center text-3xl font-bold text-[#3A5988]"
                             x-text="work.nama.slice(0, 2).toUpperCase()"></div>
                        <template x-if="work.banner || work.logo">
                          <img :src="work.banner || work.logo"
                               :alt="'Tampilan karya ' + work.nama"
                               loading="lazy"
                               @error="$el.classList.add('hidden')"
                               :class="work.banner ? 'object-cover' : 'bg-[#F4F5F7] object-contain p-8'"
                               class="absolute inset-0 h-full w-full transition-transform duration-300 motion-safe:group-hover:scale-[1.03]">
                        </template>
                      </div>
                      <div class="space-y-3 p-3.5">
                        <div class="space-y-1">
                          <h4 class="break-words text-[15px] font-bold leading-snug text-[#0C1117] group-hover:text-[#3A5988]"
                              x-text="work.nama"></h4>
                          <p x-show="work.tagline" class="line-clamp-2 text-[12.5px] leading-relaxed text-[#6B7280]" x-text="work.tagline"></p>
                        </div>
                        <div class="flex items-center gap-2.5 border-t border-[#E3E4E9] pt-3">
                          <div aria-hidden="true" class="relative grid h-8 w-8 shrink-0 place-items-center overflow-hidden rounded-full bg-[#E2F1F9] text-[12px] font-semibold text-[#3A5988]">
                            <span x-text="(work.authorName || 'Alumni').slice(0, 1).toUpperCase()"></span>
                            <template x-if="work.authorAvatar">
                              <img :src="work.authorAvatar" alt="" loading="lazy"
                                   @error="$el.classList.add('hidden')" class="absolute inset-0 h-full w-full object-cover">
                            </template>
                          </div>
                          <div class="min-w-0">
                            <p class="text-[11px] leading-tight text-[#6B7280]">Dibuat oleh</p>
                            <p class="break-words text-[13px] font-semibold text-[#212224]" x-text="work.authorName || 'Alumni'"></p>
                          </div>
                        </div>
                      </div>
                    </a>
                  </template>
                </div>
              </div>

              <template x-if="spotlightWorks.length > 1">
                <div class="flex items-center justify-center gap-1.5 pt-1">
                  <template x-for="(work, idx) in spotlightWorks" :key="work.id">
                    <button type="button"
                            @click="goToSpotlight(idx)"
                            :aria-label="'Tampilkan karya ' + (idx + 1)"
                            :class="spotlightIndex === idx ? 'w-5 bg-[#3A5988]' : 'w-1.5 bg-[#CBD5E1] hover:bg-[#94A3B8]'"
                            class="h-1.5 rounded-full transition-all cursor-pointer"></button>
                  </template>
                </div>
              </template>
            </section>

            <!-- 2. Kartu Pengumuman Sesuai Referensi Pengguna -->
            <div class="bg-white border border-[#E3E4E9] rounded-[16px] p-5 sm:p-6 shadow-sm space-y-5">
              
              <!-- Header Kartu: Judul, Subjudul, dan Link Semua (Tanpa Tanda Panah) -->
              <div class="flex items-start justify-between gap-3">
                <div>
                  <h3 class="text-[16px] font-bold text-[#0C1117] leading-tight">Pengumuman</h3>
                  <p class="text-[12.5px] text-[#6B7280] mt-0.5">Informasi utama Bengkel Koding</p>
                </div>
                <button type="button"
                        @click="openAllAnnouncementsModal()"
                        class="text-[13px] font-semibold text-[#3A5988] hover:underline transition-colors cursor-pointer shrink-0">
                  Semua
                </button>
              </div>

              <!-- Daftar Pengumuman (Sesuai Referensi, Bersih Tanpa Garis Pemisah) -->
              <div class="space-y-4">
                <template x-for="item in announcements" :key="item.id">
                  <div @click="openAnnouncementModal(item)"
                       class="group p-2.5 -mx-2.5 rounded-[12px] hover:bg-[#F8FAFC] transition-colors cursor-pointer space-y-1">
                    <h4 class="text-[13.5px] font-bold text-[#0C1117] group-hover:text-[#3A5988] leading-snug transition-colors"
                        x-text="item.title"></h4>
                    <p class="text-[12.5px] text-[#6B7280] leading-relaxed line-clamp-2"
                       x-text="item.desc"></p>
                    <span class="text-[11.5px] text-[#91969C] font-medium block pt-0.5"
                          x-text="item.date"></span>
                  </div>
                </template>
              </div>

            </div>

            <section class="bg-white border border-[#E3E4E9] rounded-[16px] p-5 sm:p-6 shadow-sm space-y-3">
              <div class="flex items-start justify-between gap-3">
                <h3 class="text-[16px] font-bold text-[#0C1117]">Proyek Terbaru</h3>
                <a href="gigs.html" class="text-[13px] font-semibold text-[#3A5988] hover:underline">Semua</a>
              </div>
              <p x-show="!latestProjects.length" class="text-[13px] text-[#6B7280]">Belum ada proyek.</p>
              <template x-for="project in latestProjects" :key="project.id">
                <a :href="project.link" class="block rounded-[12px] p-2.5 -mx-2.5 hover:bg-[#F8FAFC] space-y-1">
                  <h4 class="text-[13.5px] font-bold text-[#0C1117] break-words" x-text="project.title"></h4>
                  <p class="text-[12.5px] text-[#6B7280]" x-text="project.ownerName + ' · ' + project.status"></p>
                </a>
              </template>
            </section>

          </aside>

        </div>

      </main>

  <!-- ========================================================
       MODAL DETAIL PENGUMUMAN TUNGGAL (UKURAN SAMA PERSIS DENGAN LIHAT DETAIL: 840px)
  ======================================================== -->
  <div x-show="announcementModalOpen"
       x-cloak
       class="fixed inset-0 z-[120] flex items-center justify-center p-4 max-sm:p-0 max-sm:items-end bg-[#0C1117]/50 backdrop-blur-[2px]"
       role="dialog"
       aria-modal="true">
    <div class="fixed inset-0" @click="closeAnnouncementModal()"></div>
    <div class="relative w-full max-w-[840px] max-h-[88vh] max-sm:max-h-[92vh] max-sm:h-[92vh] bg-white rounded-[20px] max-sm:rounded-t-[20px] max-sm:rounded-b-none border border-[#E3E4E9] shadow-2xl overflow-hidden flex flex-col" @click.stop>
      <header class="h-[72px] px-6 lg:px-8 border-b border-[#E3E4E9] flex items-center justify-between shrink-0 bg-white">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-[#E2F1F9] text-[#3A5988] flex items-center justify-center shrink-0">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </div>
          <div>
            <span class="inline-block px-2 py-0.5 rounded text-[11px] font-bold bg-[#E2F1F9] text-[#3A5988]" x-text="selectedAnnouncement?.category"></span>
            <h3 class="text-[17px] font-bold text-[#0C1117] leading-snug" x-text="selectedAnnouncement?.title"></h3>
          </div>
        </div>
        <button type="button" @click="closeAnnouncementModal()" class="w-10 h-10 rounded-full bg-[#F4F5F7] hover:bg-[#E5E9EC] text-[#0C1117] flex items-center justify-center transition-colors cursor-pointer" title="Tutup">✕</button>
      </header>
      <div class="p-6 lg:p-8 space-y-4 overflow-y-auto flex-1">
        <div class="text-[12.5px] text-[#6B7280]" x-text="'Dipublikasikan oleh: ' + (selectedAnnouncement?.author || 'Bengkel Koding') + ' · ' + (selectedAnnouncement?.date || '')"></div>
        <div class="text-[14px] text-[#374151] leading-relaxed" x-text="selectedAnnouncement?.fullText"></div>
      </div>
      <div class="h-[72px] px-6 lg:px-8 border-t border-[#E3E4E9] flex items-center justify-end shrink-0 bg-white">
        <button type="button" @click="closeAnnouncementModal()" class="h-10 px-5 rounded-[8px] bg-[#3A5988] hover:bg-[#496DA8] text-white text-[13.5px] font-medium transition-colors cursor-pointer">
          Tutup
        </button>
      </div>
    </div>
  </div>

  <!-- ========================================================
       MODAL SEMUA PENGUMUMAN BENGKEL KODING (UKURAN SAMA PERSIS DENGAN LIHAT DETAIL: 840px)
  ======================================================== -->
  <div x-show="allAnnouncementsModalOpen"
       x-cloak
       class="fixed inset-0 z-[120] flex items-center justify-center p-4 max-sm:p-0 max-sm:items-end bg-[#0C1117]/50 backdrop-blur-[2px]"
       role="dialog"
       aria-modal="true">
    <div class="fixed inset-0" @click="closeAllAnnouncementsModal()"></div>
    <div class="relative w-full max-w-[840px] max-h-[88vh] max-sm:max-h-[92vh] max-sm:h-[92vh] bg-white rounded-[20px] max-sm:rounded-t-[20px] max-sm:rounded-b-none border border-[#E3E4E9] shadow-2xl overflow-hidden flex flex-col" @click.stop>
      <header class="h-[72px] px-6 lg:px-8 border-b border-[#E3E4E9] flex items-center justify-between shrink-0 bg-white">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-[#E2F1F9] text-[#3A5988] flex items-center justify-center shrink-0">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </div>
          <div>
            <h3 class="text-[17px] font-bold text-[#0C1117]">Semua Pengumuman</h3>
            <p class="text-[12.5px] text-[#6B7280]">Informasi resmi dan agenda penting Bengkel Koding UDINUS</p>
          </div>
        </div>
        <button type="button" @click="closeAllAnnouncementsModal()" class="w-10 h-10 rounded-full bg-[#F4F5F7] hover:bg-[#E5E9EC] text-[#0C1117] flex items-center justify-center transition-colors cursor-pointer" title="Tutup">✕</button>
      </header>
      <div class="p-6 lg:p-8 space-y-3.5 overflow-y-auto flex-1">
        <template x-for="item in announcements" :key="item.id">
          <div @click="closeAllAnnouncementsModal(); openAnnouncementModal(item)"
               class="p-4 rounded-[14px] bg-[#F8FAFC] hover:bg-[#EFF4FB] border border-[#E3E4E9] transition-colors cursor-pointer space-y-1.5">
            <div class="flex items-center justify-between gap-2">
              <span class="px-2 py-0.5 rounded text-[11px] font-semibold bg-[#E2F1F9] text-[#3A5988]" x-text="item.category"></span>
              <span class="text-[11.5px] text-[#91969C]" x-text="item.date"></span>
            </div>
            <h4 class="text-[14.5px] font-bold text-[#0C1117]" x-text="item.title"></h4>
            <p class="text-[12.5px] text-[#6B7280] leading-relaxed" x-text="item.desc"></p>
          </div>
        </template>
      </div>
      <div class="h-[72px] px-6 lg:px-8 border-t border-[#E3E4E9] flex items-center justify-end shrink-0 bg-white">
        <button type="button" @click="closeAllAnnouncementsModal()" class="h-10 px-5 rounded-[8px] bg-[#3A5988] hover:bg-[#496DA8] text-white text-[13.5px] font-medium transition-colors cursor-pointer">
          Tutup
        </button>
      </div>
    </div>
  </div>


  <dialog id="post-report-dialog" x-ref="postReportDialog" aria-labelledby="post-report-title"
          @click.self="$el.close()"
          class="m-auto max-h-[calc(100%-2rem)] w-[calc(100%-2rem)] max-w-md overflow-y-auto rounded-[16px] border border-[#E3E4E9] bg-white text-[#212224] shadow-xl">
    <form @submit.prevent="submitPostReport()" class="space-y-4 p-5 sm:p-6">
      <h2 id="post-report-title" class="text-[17px] font-bold text-[#0C1117]">Laporkan Postingan</h2>
      <div class="space-y-2">
        <label for="post-report-reason" class="block text-[13px] font-semibold">Alasan laporan</label>
        <textarea id="post-report-reason" x-model="reportReason" @input="reportError = ''"
                  required autofocus rows="4" placeholder="Jelaskan alasan Anda melaporkan postingan ini."
                  class="w-full resize-y rounded-[10px] border border-[#E3E4E9] px-3 py-2.5 text-[13.5px] outline-none focus:border-[#3A5988]"></textarea>
        <p x-show="reportError" x-text="reportError" role="alert" class="text-[13px] text-red-700"></p>
      </div>
      <div class="flex justify-end gap-2">
        <button type="button" @click="$refs.postReportDialog.close()"
                class="h-10 rounded-[8px] border border-[#E3E4E9] px-4 text-[13px] font-semibold hover:bg-[#F4F5F7]">Batal</button>
        <button type="submit"
                class="h-10 rounded-[8px] bg-[#3A5988] px-4 text-[13px] font-semibold text-white hover:bg-[#496DA8]">Kirim Laporan</button>
      </div>
    </form>
  </dialog>
  <script>mountAlumniPortal(document.querySelector('main'));</script>
</body>
</html>
