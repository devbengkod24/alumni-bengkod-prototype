<!DOCTYPE html>
<html lang="id" data-role="alumni">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Saya | Alumni Bengkel Koding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css?v=5">
  <script src="assets/js/data.js?v=5"></script>
  <script src="assets/js/app.js?v=5"></script>
  <script src="assets/js/cv.js?v=5"></script>
  <script src="assets/js/tracer.js?v=5"></script>
  <script src="assets/js/profil.js?v=5"></script>
  <script src="../assets/js/page-skeleton.js?v=5"></script>
  <script src="../assets/js/main.js?v=5"></script>
</head>
<body class="bg-white text-neutral1 antialiased font-sans">
<main data-title="Profil Saya"></main>
<script>
  const lencana = DB.feed.lencanaTester(SAYA.id);
  pasangHalamanProfil(`
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div class="flex flex-wrap items-center gap-2">
        <h3 class="!text-lg font-semibold text-neutral1">Status Karir</h3>
        ${lencana ? badge(lencana, 'green') : ''}
      </div>
      <a href="tracer.html" class="btn-outline shrink-0"><i data-lucide="pencil" class="w-4 h-4"></i> Ubah</a>
    </div>
    <p class="!text-sm text-neutral2 -mt-3">Tracer study Anda: pekerjaan utama, studi lanjut, dan pekerjaan sampingan. Koordinator membaca data ini langsung.</p>
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-4 items-start">${ringkasanTracer(DB.tracer.milik(SAYA.id))}</div>
    <div>
      <h3 class="!text-lg font-semibold text-neutral1">Riwayat, Portofolio, dan Kemampuan</h3>
      <p class="!text-sm text-neutral2 mt-1">Dipakai untuk Generate CV, lampiran Gigs, dan karya di Beranda. Tekan ikon pensil untuk mengubah isi kategori.</p>
    </div>
    <div id="cv" class="grid grid-cols-1 xl:grid-cols-2 gap-4 items-start"></div>`);
  renderCv('cv', SAYA.id, true);
</script>
</body>
</html>
