<!DOCTYPE html>
<html lang="en" data-color-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bengkel Koding</title>
  <meta name="description" content="Bengkel Koding Universitas Dian Nuswantoro Semarang">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/page-skeleton.js"></script>
  <script src="assets/js/alumni.js"></script>
  <script src="assets/js/alumni-data.js"></script>
  <script src="assets/js/alumni-profile-data.js"></script>
  <script src="assets/js/alumni-profile-modals.js"></script>
  <script src="assets/js/alumni-profile-page.js"></script>
  <script src="assets/js/alumni-cv.js"></script>
</head>
<body>
<!-- Konversi HTML dari lms-bengkod-web: app/(dashboard)/dashboard/alumni/profil/page.tsx -->
<main data-route="profil">
  <div x-data="profilPage" class="w-full space-y-6 pb-12 antialiased" @click.window="shareDropdownId = null">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <!-- ======================================================
          KOLOM UTAMA (KIRI/TENGAH)
      ====================================================== -->
      <div class="lg:col-span-8 space-y-6">
        <!-- ── SEKSI 1: BIODATA & KONTAK ── -->
        <div class="space-y-2">
          <div data-partial="profile-top" data-variant="profil"></div>
        </div>

        <!-- ── SEKSI 2: PENGALAMAN KERJA & MAGANG (Clean Design) ── -->
        <div id="section-experience" class="bg-white rounded-xl border border-gray-200/90 shadow-sm p-6 sm:p-7">
          <div class="flex items-center justify-between pb-4 border-b border-gray-100">
            <div class="flex items-center gap-2.5">
              <h3 class="text-[20px] font-bold text-gray-900 tracking-tight">Pengalaman Kerja &amp; Magang</h3>
              <!-- Jumlah pengalaman disamakan dgn Gambar 3 (lingkaran bg-blue-50 border border-blue-200 text-[#1E3A8A]) -->
              <span class="w-7 h-7 rounded-full bg-blue-50 border border-blue-200 text-[#1E3A8A] font-bold text-[13px] flex items-center justify-center shrink-0" x-text="experiences.length"></span>
            </div>
            <!-- Tombol Aksi: Tambah (Icon Plus) & Edit (Icon Pensil) Persis Card Lainnya Tanpa Teks -->
            <div class="flex items-center gap-1">
              <button
                type="button"
                @click="openAddExperienceModal()"
                class="w-10 h-10 rounded-full flex items-center justify-center text-gray-400 hover:text-[#1E3A8A] hover:bg-blue-50 transition-colors cursor-pointer"
                aria-label="Tambah pengalaman kerja"
                title="Tambah pengalaman kerja"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                  <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </button>
              <button
                type="button"
                @click="openManageExperienceModal()"
                class="w-10 h-10 rounded-full flex items-center justify-center text-gray-400 hover:text-[#1E3A8A] hover:bg-blue-50 transition-colors cursor-pointer"
                aria-label="Edit pengalaman kerja"
                title="Edit pengalaman kerja"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="divide-y divide-gray-100 pt-2">
            <template x-for="(exp, idx) in experiences" :key="exp.key || idx">
              <div class="py-5" :class="[idx === 0 ? 'pt-2' : '', idx === experiences.length - 1 ? 'pb-0' : '']">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <h4 class="text-[17px] font-semibold text-gray-900 leading-snug" x-text="exp.title"></h4>
                  <!-- Saat ini (tanpa oval, tata letak dan font tetap sama persis) -->
                  <template x-if="exp.isCurrent || (exp.period && exp.period.toLowerCase().includes('sekarang'))">
                    <span class="text-[13px] font-semibold text-[#1E3A8A]">Saat ini</span>
                  </template>
                </div>
                <!-- Perusahaan · Lokasi · Tipe (e.g. Magang / Purnawaktu) -->
                <p class="text-[15px] text-gray-700 font-medium mt-1" x-text="[exp.place, exp.type].filter(Boolean).join(' · ')"></p>
                <p class="text-[14px] text-gray-500 mt-1" x-text="exp.period"></p>
                <template x-if="exp.note"><p class="text-[15px] text-gray-600 mt-2.5 leading-relaxed" x-text="exp.note"></p></template>
              </div>
            </template>
          </div>
        </div>

        <!-- ── SEKSI 3: PORTOFOLIO & BANK KARYA ── -->
        <div class="space-y-2">
          <div data-partial="profile-bottom" data-variant="profil"></div>
        </div>
      </div>

      <!-- ======================================================
          KOLOM SAMPING (KANAN) - GAMBAR 1 & GAMBAR 2
      ====================================================== -->
      <div class="lg:col-span-4 space-y-6 self-stretch relative">

        <!-- ── CARD: KELENGKAPAN PROFIL (dihitung dari state profil; item belum lengkap membuka modal edit terkait) ── -->
        <div id="kelengkapan-profil" class="sticky top-[80px] bg-white rounded-xl border border-gray-200/80 shadow-sm p-5 sm:p-6">
          <div class="pb-3 flex items-start justify-between gap-3">
            <div>
              <h3 class="text-[17px] font-bold text-gray-900 tracking-tight">Kelengkapan Profil</h3>
              <p class="text-[13px] text-gray-500 font-medium mt-0.5">Profil lengkap lebih mudah ditemukan rekan &amp; mitra</p>
            </div>
            <span class="text-[22px] font-bold text-[#1E3A8A] leading-none shrink-0" x-text="profileCompleteness.percent + '%'"></span>
          </div>

          <div class="h-2 rounded-full bg-gray-100 overflow-hidden" role="progressbar" aria-label="Kelengkapan profil"
            aria-valuemin="0" aria-valuemax="100" :aria-valuenow="profileCompleteness.percent">
            <div class="h-full rounded-full bg-[#1E3A8A] transition-all duration-300" :style="'width: ' + profileCompleteness.percent + '%'"></div>
          </div>
          <p class="text-[12px] text-gray-500 mt-2" x-text="profileCompleteness.done + ' dari ' + profileCompleteness.items.length + ' bagian sudah lengkap'"></p>

          <ul class="mt-3 space-y-0.5">
            <template x-for="item in profileCompleteness.items" :key="item.key">
              <li class="flex items-center gap-3 p-2.5 -mx-1.5 rounded-lg" :class="item.done ? '' : 'hover:bg-gray-50/90'">
                <span class="w-6 h-6 rounded-full flex items-center justify-center shrink-0"
                  :class="item.done ? 'bg-[#1E3A8A] text-white' : 'border-2 border-gray-300 bg-white'">
                  <template x-if="item.done">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12" /></svg>
                  </template>
                </span>
                <div class="min-w-0 flex-1">
                  <p class="text-[14px] font-semibold leading-snug" :class="item.done ? 'text-gray-500' : 'text-gray-900'" x-text="item.label"></p>
                  <p class="text-[12px] text-gray-500 leading-snug" x-text="item.hint"></p>
                </div>
                <template x-if="!item.done">
                  <button type="button" @click="openCompletenessItem(item.key)"
                    class="px-3 py-1 rounded-full border border-gray-300 hover:border-[#1E3A8A] text-[12px] font-semibold text-gray-700 hover:text-[#1E3A8A] transition-colors cursor-pointer shrink-0">
                    Lengkapi
                  </button>
                </template>
                <template x-if="item.done && item.key === 'cv'">
                  <button type="button" @click="openCvPdf()"
                    class="text-[12px] font-semibold text-[#1E3A8A] hover:underline cursor-pointer shrink-0">Lihat CV</button>
                </template>
              </li>
            </template>
          </ul>
        </div>
      </div>
    </div>

    <!-- Modals Edit Bahasa & URL Publik -->
    <!-- ======================================================
        MODAL: EDIT STATUS KARIR & STUDI LANJUT S2
    ====================================================== -->
    <template x-teleport="body">
      <template x-if="editCareerOpen">
        <div class="fixed inset-0 z-[100] bg-gray-900/60 backdrop-blur-[2px] flex items-center justify-center p-4" @mousedown.self="editCareerOpen = false">
          <div class="bg-white rounded-xl border border-gray-200/90 shadow-xl w-full max-w-lg overflow-hidden animate-in fade-in zoom-in-95 duration-150">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
              <h3 class="text-[17px] font-bold text-gray-900">Edit Status Karir &amp; Tracer</h3>
              <button type="button" @click="editCareerOpen = false" class="text-gray-400 hover:text-gray-700 w-8 h-8 rounded-full flex items-center justify-center hover:bg-gray-100 transition-colors cursor-pointer">
                ✕
              </button>
            </div>
            <form @submit.prevent="saveCareer()" class="p-6 space-y-4 text-sm">
              <div>
                <label class="block font-semibold text-gray-700 mb-1">Status Utama Saat Ini</label>
                <select x-model="careerDraft.status" class="w-full px-3.5 py-2 rounded-lg border border-gray-300 bg-white">
                  <option value="Bekerja Full Time">Bekerja Full Time</option>
                  <option value="Bekerja Part Time">Bekerja Part Time</option>
                  <option value="Wiraswasta / Founder">Wiraswasta / Founder</option>
                  <option value="Studi Lanjut S2">Studi Lanjut S2</option>
                  <option value="Sedang Mencari Kerja">Sedang Mencari Kerja</option>
                </select>
              </div>

              <div>
                <label class="block font-semibold text-gray-700 mb-1">Instansi / Perusahaan Utama</label>
                <input type="text" x-model="careerDraft.company" placeholder="Contoh: PT Solusi Digital / Tokopedia" class="w-full px-3.5 py-2 rounded-lg border border-gray-300">
              </div>

              <div class="border-t border-gray-100 pt-3 space-y-3">
                <p class="font-bold text-xs uppercase tracking-wider text-gray-500">Pekerjaan Sampingan / Freelance</p>
                <div>
                  <label class="block font-semibold text-gray-700 mb-1">Klien / Tempat Part-Time</label>
                  <input type="text" x-model="careerDraft.moonlight" placeholder="Contoh: Studio Kode / Klien Lepas" class="w-full px-3.5 py-2 rounded-lg border border-gray-300">
                </div>
                <div>
                  <label class="block font-semibold text-gray-700 mb-1">Peran Sampingan</label>
                  <input type="text" x-model="careerDraft.moonlightRole" placeholder="Contoh: Freelance Frontend Developer" class="w-full px-3.5 py-2 rounded-lg border border-gray-300">
                </div>
              </div>

              <div class="border-t border-gray-100 pt-3 space-y-3">
                <p class="font-bold text-xs uppercase tracking-wider text-gray-500">Data Studi Lanjut S2</p>
                <div>
                  <label class="block font-semibold text-gray-700 mb-1">Perguruan Tinggi Lanjutan</label>
                  <input type="text" x-model="careerDraft.s2Campus" placeholder="Contoh: Universitas Dian Nuswantoro" class="w-full px-3.5 py-2 rounded-lg border border-gray-300">
                </div>
                <div>
                  <label class="block font-semibold text-gray-700 mb-1">Program Studi S2</label>
                  <input type="text" x-model="careerDraft.s2Major" placeholder="Contoh: Magister Teknik Informatika" class="w-full px-3.5 py-2 rounded-lg border border-gray-300">
                </div>
              </div>

              <div class="flex items-center justify-end gap-2.5 pt-3 border-t border-gray-100">
                <button type="button" @click="editCareerOpen = false" class="px-4 py-2 text-xs font-semibold text-gray-700 hover:bg-gray-100 rounded-full">Batal</button>
                <button type="submit" class="px-6 py-2 bg-[#1E3A8A] hover:bg-[#1D4ED8] text-white text-xs font-semibold rounded-full shadow-sm">Simpan Status Karir</button>
              </div>
            </form>
          </div>
        </div>
      </template>
    </template>

    <!-- ======================================================
        MODAL: PUBLISH KE BERANDA (HALL OF FAME & BETA TESTING)
    ====================================================== -->
    <template x-teleport="body">
      <template x-if="publishKaryaModalOpen && targetPublishProj">
        <div class="fixed inset-0 z-[100] bg-gray-900/60 backdrop-blur-[2px] flex items-center justify-center p-4" @mousedown.self="publishKaryaModalOpen = false">
          <div class="bg-white rounded-2xl border border-gray-200/90 shadow-2xl w-full max-w-xl max-h-[92vh] flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-150">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-white shrink-0">
              <div>
                <h3 class="text-[17px] font-bold text-gray-900">Publikasikan Karya ke Showcase Beranda</h3>
                <p class="text-xs text-gray-500 mt-0.5">Pamerkan karya software Anda ke linimasa dan leaderboard Showcase Alumni</p>
              </div>
              <button type="button" @click="publishKaryaModalOpen = false" class="text-gray-400 hover:text-gray-700 w-8 h-8 rounded-full flex items-center justify-center hover:bg-gray-100 transition-colors cursor-pointer">
                ✕
              </button>
            </div>

            <form @submit.prevent="submitPublishKarya()" class="p-6 space-y-4 text-sm overflow-y-auto">
              <div>
                <label class="block font-semibold text-gray-800 text-xs mb-1">Nama Produk Software <span class="text-red-500">*</span></label>
                <input type="text" x-model="publishForm.nama" required class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm focus:outline-none focus:border-[#1E3A8A]">
              </div>

              <div>
                <label class="block font-semibold text-gray-800 text-xs mb-1">Tagline Ringkas (1 Baris) <span class="text-red-500">*</span></label>
                <input type="text" x-model="publishForm.tagline" required placeholder="Contoh: Analisis sentimen otomatis berbasis machine learning" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm focus:outline-none focus:border-[#1E3A8A]">
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block font-semibold text-gray-800 text-xs mb-1">Tautan Staging / Demo / Live URL</label>
                  <input type="url" x-model="publishForm.url" placeholder="https://..." class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm focus:outline-none focus:border-[#1E3A8A]">
                </div>
                <div>
                  <label class="block font-semibold text-gray-800 text-xs mb-1">Tech Stack</label>
                  <input type="text" x-model="publishForm.stack" placeholder="Next.js, Python, PostgreSQL" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm focus:outline-none focus:border-[#1E3A8A]">
                </div>
              </div>

              <!-- Tab Feedback Monitoring jika sudah ada masukan -->
              <template x-if="targetPublishProj.feedbacks && targetPublishProj.feedbacks.length > 0">
                <div class="pt-3 border-t border-gray-100 space-y-2">
                  <span class="font-bold text-gray-700 text-xs block">Daftar Masukan &amp; Review Diterima:</span>
                  <div class="space-y-2 max-h-36 overflow-y-auto pr-1">
                    <template x-for="fb in targetPublishProj.feedbacks" :key="fb.id">
                      <div class="p-2.5 bg-gray-50 rounded-xl border border-gray-200 text-xs flex items-start justify-between gap-2">
                        <div>
                          <div class="flex items-center gap-2">
                            <span class="font-bold text-gray-900" x-text="fb.author"></span>
                            <span class="px-2 py-0.2 rounded text-[10px] font-semibold"
                                  :class="fb.category === 'Bug' ? 'bg-red-50 text-red-600' : 'bg-blue-50 text-[#1E3A8A]'"
                                  x-text="fb.category"></span>
                          </div>
                          <p class="text-gray-700 mt-1 leading-relaxed" x-text="fb.text"></p>
                        </div>
                        <button
                          type="button"
                          @click="toggleFeedbackStatus(targetPublishProj.id, fb.id)"
                          class="px-2.5 py-1 rounded-full text-[11px] font-semibold shrink-0 cursor-pointer"
                          :class="fb.status === 'Diterapkan' ? 'bg-emerald-100 text-emerald-800' : 'bg-gray-200 text-gray-700'"
                          x-text="fb.status === 'Diterapkan' ? '✓ Diterapkan' : 'Tandai Diterapkan'"
                        ></button>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <div class="pt-3 border-t border-gray-100 flex items-center justify-end gap-2.5">
                <button type="button" @click="publishKaryaModalOpen = false" class="px-4 py-2 text-xs font-semibold text-gray-700 hover:bg-gray-100 rounded-full">Batal</button>
                <button type="submit" class="px-6 py-2 bg-[#1E3A8A] hover:bg-[#1D4ED8] text-white text-xs font-bold rounded-full shadow-sm">Simpan &amp; Publikasikan</button>
              </div>
            </form>
          </div>
        </div>
      </template>
    </template>

    <template x-teleport="body">
      <template x-if="editLanguageModalOpen">
        <div class="fixed inset-0 z-[100] bg-gray-900/60 backdrop-blur-[2px] flex items-center justify-center p-4" @mousedown.self="editLanguageModalOpen = false">
          <div class="bg-white rounded-xl border border-gray-200/90 shadow-xl w-full max-w-md overflow-hidden animate-in fade-in zoom-in-95 duration-150">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
              <h3 class="text-[17px] font-bold text-gray-900">Ubah Bahasa Profil</h3>
              <button type="button" @click="editLanguageModalOpen = false" class="text-gray-400 hover:text-gray-700 w-8 h-8 rounded-full flex items-center justify-center hover:bg-gray-100 transition-colors cursor-pointer">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
              </button>
            </div>
            <div class="p-6 space-y-4">
              <div>
                <label class="block text-[14px] font-semibold text-gray-700 mb-2">Pilih Bahasa</label>
                <select x-model="tempLanguage" class="w-full px-3.5 py-2.5 rounded-lg border border-gray-300 text-[14px] text-gray-900 focus:outline-none focus:border-[#1E3A8A] focus:ring-2 focus:ring-[#1E3A8A]/10 bg-white">
                  <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                  <option value="English (US)">English (US)</option>
                </select>
              </div>
              <div class="flex items-center justify-end gap-2.5 pt-3 border-t border-gray-100">
                <button type="button" @click="editLanguageModalOpen = false" class="px-4 py-2 text-[14px] font-semibold text-gray-700 hover:bg-gray-100 rounded-full transition-colors cursor-pointer">Batal</button>
                <button type="button" @click="saveLanguage()" class="px-6 py-2 bg-[#1E3A8A] hover:bg-[#1D4ED8] text-white text-[14px] font-semibold rounded-full shadow-sm transition-colors cursor-pointer">Simpan</button>
              </div>
            </div>
          </div>
        </div>
      </template>
    </template>

    <template x-teleport="body">
      <template x-if="editPublicUrlModalOpen">
        <div class="fixed inset-0 z-[100] bg-gray-900/60 backdrop-blur-[2px] flex items-center justify-center p-4" @mousedown.self="editPublicUrlModalOpen = false">
          <div class="bg-white rounded-xl border border-gray-200/90 shadow-xl w-full max-w-md overflow-hidden animate-in fade-in zoom-in-95 duration-150">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
              <h3 class="text-[17px] font-bold text-gray-900">Ubah Profil Publik dan URL</h3>
              <button type="button" @click="editPublicUrlModalOpen = false" class="text-gray-400 hover:text-gray-700 w-8 h-8 rounded-full flex items-center justify-center hover:bg-gray-100 transition-colors cursor-pointer">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
              </button>
            </div>
            <div class="p-6 space-y-4">
              <div>
                <label class="block text-[14px] font-semibold text-gray-700 mb-1.5">Kustomisasi URL Profil Anda</label>
                <div class="flex items-center border border-gray-300 rounded-lg overflow-hidden focus-within:border-[#1E3A8A] focus-within:ring-2 focus-within:ring-[#1E3A8A]/10 bg-white">
                  <span class="px-3 py-2.5 text-sm text-gray-400 bg-gray-50 border-r border-gray-200 select-none">https://</span>
                  <input type="text" x-model="tempPublicUrl" class="w-full px-3 py-2.5 text-[14px] text-gray-900 focus:outline-none">
                </div>
                <p class="text-[12px] text-gray-500 mt-1.5">Bagikan URL unik ini di CV, portofolio, atau media sosial Anda.</p>
              </div>
              <div class="flex items-center justify-end gap-2.5 pt-3 border-t border-gray-100">
                <button type="button" @click="editPublicUrlModalOpen = false" class="px-4 py-2 text-[14px] font-semibold text-gray-700 hover:bg-gray-100 rounded-full transition-colors cursor-pointer">Batal</button>
                <button type="button" @click="savePublicUrl()" class="px-6 py-2 bg-[#1E3A8A] hover:bg-[#1D4ED8] text-white text-[14px] font-semibold rounded-full shadow-sm transition-colors cursor-pointer">Simpan</button>
              </div>
            </div>
          </div>
        </div>
      </template>
    </template>

    <div data-partial="profile-modals"></div>
    <div data-partial="modal-add-cert"></div>
    <div data-partial="modal-edit-cert"></div>

    <!-- ======================================================
        MODAL: BUAT / EDIT POSTINGAN (_components/PostModals.tsx)
    ====================================================== -->
    <template x-teleport="body">
      <template x-if="postModalOpen">
        <div class="fixed inset-0 z-[100] bg-gray-900/60 backdrop-blur-[2px] flex items-center justify-center p-4" @mousedown.self="closePostModal()">
          <form role="dialog" aria-modal="true" aria-labelledby="add-post-title" novalidate autocomplete="off" @submit.prevent="handlePostModalSubmit()"
            class="bg-white rounded-xl border border-gray-200/90 shadow-sm flex flex-col overflow-hidden" style="width: 90vw; max-width: 1024px; height: min(92vh, 720px)">
            <div class="px-6 sm:px-8 py-5 border-b border-gray-200 flex items-center justify-between flex-shrink-0">
              <h2 id="add-post-title" class="text-[20px] font-bold text-gray-900 tracking-tight" x-text="editingPost ? 'Edit postingan' : 'Tambah postingan'"></h2>
              <button type="button" @click="closePostModal()" class="w-10 h-10 rounded-full flex items-center justify-center text-gray-400 hover:text-[#1E3A8A] hover:bg-blue-50 transition-colors cursor-pointer" aria-label="Tutup modal">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>

            likes: 0,
          };
          this.comments = { ...this.comments, [postId]: [...(this.comments[postId] || []), newComment] };
          this.commentInputs = { ...this.commentInputs, [postId]: "" };
        },
        likeComment(postId, commentId) {
          this.comments = {
            ...this.comments,
            [postId]: (this.comments[postId] || []).map((item) => (item.id === commentId ? { ...item, likes: (item.likes || 0) + 1 } : item)),
          };
        },
        likeReply(postId, commentId, replyId) {
          this.comments = {
            ...this.comments,
            [postId]: (this.comments[postId] || []).map((item) =>
              item.id === commentId ? { ...item, replies: (item.replies || []).map((r) => (r.id === replyId ? { ...r, likes: (r.likes || 0) + 1 } : r)) } : item
            ),
          };
        },
        addReply(postId, commentId) {
          const newReply = {
            id: Date.now(),
            author: this.profile.name,
            avatar: this.profile.avatarUrl || "assets/img/user.png",
            text: (this.replyInputs[commentId] || "").trim(),
            time: "Baru saja",
            likes: 0,
          };
          this.comments = {
            ...this.comments,
            [postId]: (this.comments[postId] || []).map((item) => (item.id === commentId ? { ...item, replies: [...(item.replies || []), newReply] } : item)),
          };
          this.replyInputs = { ...this.replyInputs, [commentId]: "" };
          this.activeReplyCommentId = null;
        },

        // Status Karir & Tracer Modal
        editCareerOpen: false,
        careerDraft: {
          status: 'Bekerja Full Time',
          company: '',
          title: '',
          field: 'Infokom',
          scope: 'Nasional',
          studyUniv: '',
          studyMajor: '',
          studyFunding: 'Beasiswa'
        },
        openCareerModal() {
          this.careerDraft = {
            status: this.profile.careerStatus || 'Bekerja Full Time',
            company: this.profile.companyName || '',
            title: this.profile.jobTitle || '',
            field: this.profile.jobField || 'Infokom',
            scope: this.profile.jobScope || 'Nasional',
            studyUniv: this.profile.studyUniversity || '',
            studyMajor: this.profile.studyMajor || '',
            studyFunding: this.profile.studyFunding || 'Beasiswa'
          };
          this.editCareerOpen = true;
        },
        handleSaveCareer() {
          this.profile.careerStatus = this.careerDraft.status;
          this.profile.companyName = this.careerDraft.company;
          this.profile.jobTitle = this.careerDraft.title;
          this.profile.jobField = this.careerDraft.field;
          this.profile.jobScope = this.careerDraft.scope;
          this.profile.studyUniversity = this.careerDraft.studyUniv;
          this.profile.studyMajor = this.careerDraft.studyMajor;
          this.profile.studyFunding = this.careerDraft.studyFunding;
          try {
            localStorage.setItem("bengkod_alumni_profile", JSON.stringify(this.profile));
            if (typeof DB !== "undefined" && DB.tracer) {
              const u = SAYA || DB.akun.aktif();
              if (u) {
                const cur = DB.tracer.milik(u.id) || {};
                DB.tracer.simpan(u.id, {
                  ...cur,
                  status: this.careerDraft.status,
                  nama_job: this.careerDraft.company,
                  jabatan_job: this.careerDraft.title,
                  bidang_job: this.careerDraft.field,
                  lingkup_job: this.careerDraft.scope,
                  nama_studi: this.careerDraft.studyUniv,
                  prodi: this.careerDraft.studyMajor,
                  biaya_studi: this.careerDraft.studyFunding,
                });
              }
            }
          } catch (e) {}
          this.editCareerOpen = false;
          this.toast = "Status karir berhasil diperbarui";
        },
      })
    );
  });
</script>
</body>
</html>
