<!DOCTYPE html>
<html lang="id" data-color-mode="light" class="h-full bg-[#EFF2F7]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profil | Portal Alumni Bengkel Koding UDINUS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/profil-saya.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/profile-layout.css">
  <style>
    [x-cloak] { display: none !important; }
    body { font-family: "Inter", sans-serif; }
  </style>
  <script src="assets/js/portal-layout.js"></script>
</head>
<body class="h-full bg-[#EFF2F7] text-[#212224] antialiased selection:bg-[#3A5988] selection:text-white" x-data="editProfilPage()">
  <main data-profile-page="edit" class="mx-auto w-full max-w-[960px] flex-1 space-y-5 p-4 sm:p-6 lg:p-8">
    <div>
      <h1 class="text-[26px] font-semibold tracking-[-0.01em] text-[#0C1117]">Edit Profil</h1>
      <p class="mt-1 text-[14px] text-[#6B7280]">Perbarui biodata, kontak, dan ringkasan profil alumni.</p>
    </div>

    <form @submit.prevent="saveProfile()" class="rounded-[16px] border border-[#E3E4E9] bg-white shadow-sm">
      <div class="space-y-4 p-5 text-[14px] sm:p-6">
        <div class="space-y-2">
          <label for="profil-banner" class="block font-semibold text-[#0C1117]">Banner Profil</label>
          <div class="profile-cover relative overflow-hidden rounded-[10px] bg-[#3A5988]">
            <template x-if="draft.coverImageUrl">
              <img :src="draft.coverImageUrl" alt="Pratinjau banner profil" class="absolute inset-0 h-full w-full object-cover">
            </template>
          </div>
          <div class="flex flex-wrap items-center justify-between gap-2">
            <input id="profil-banner" type="file" accept="image/jpeg,image/png,image/webp" :disabled="!!imageReading"
                   @change="selectImage($event, 'coverImageUrl', 2)" aria-describedby="profil-banner-help" class="max-w-full text-[13px]">
            <button type="button" x-show="draft.coverImageUrl" x-cloak :disabled="!!imageReading"
                    @click="draft.coverImageUrl = ''; imageErrors.coverImageUrl = ''" class="profile-action disabled:opacity-50">Hapus Banner</button>
          </div>
          <p id="profil-banner-help" class="text-[12px] text-[#6B7280]">Gambar horizontal JPG, PNG, atau WebP hingga 2 MB.</p>
          <p x-show="imageReading === 'coverImageUrl'" x-cloak role="status" class="text-[12px] text-[#6B7280]">Memuat pratinjau…</p>
          <p x-show="imageErrors.coverImageUrl" x-cloak x-text="imageErrors.coverImageUrl" role="alert" class="text-[13px] text-red-700"></p>
        </div>

        <div class="space-y-2">
          <label for="profil-foto" class="block font-semibold text-[#0C1117]">Foto Profil</label>
          <div class="flex flex-wrap items-center gap-3">
            <img :src="draft.avatarUrl" alt="Pratinjau foto profil" class="h-20 w-20 shrink-0 rounded-[12px] border border-[#E3E4E9] bg-[#F4F5F7] object-cover">
            <div class="min-w-0 space-y-1.5">
              <input id="profil-foto" type="file" accept="image/jpeg,image/png,image/webp" :disabled="!!imageReading"
                     @change="selectImage($event, 'avatarUrl', 1)" aria-describedby="profil-foto-help" class="max-w-full text-[13px]">
              <p id="profil-foto-help" class="text-[12px] text-[#6B7280]">JPG, PNG, atau WebP hingga 1 MB.</p>
              <p x-show="imageReading === 'avatarUrl'" x-cloak role="status" class="text-[12px] text-[#6B7280]">Memuat pratinjau…</p>
              <p x-show="imageErrors.avatarUrl" x-cloak x-text="imageErrors.avatarUrl" role="alert" class="text-[13px] text-red-700"></p>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="profil-name" class="mb-1 block font-semibold text-[#0C1117]">Nama Lengkap</label>
            <input type="text" id="profil-name" x-model="draft.name" required class="w-full h-10 px-3 rounded-[8px] border border-[#E3E4E9] focus:border-[#3A5988] focus:outline-none">
          </div>
          <div>
            <label for="profil-nim" class="mb-1 block font-semibold text-[#0C1117]">NIM Alumni</label>
            <input type="text" id="profil-nim" x-model="draft.nim" class="w-full h-10 px-3 rounded-[8px] border border-[#E3E4E9] focus:border-[#3A5988] focus:outline-none">
          </div>
        </div>

        <div>
          <label for="profil-headline" class="mb-1 block font-semibold text-[#0C1117]">Headline Karier / Profesi</label>
          <input type="text" id="profil-headline" x-model="draft.headline" class="w-full h-10 px-3 rounded-[8px] border border-[#E3E4E9] focus:border-[#3A5988] focus:outline-none">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="profil-batch" class="mb-1 block font-semibold text-[#0C1117]">Angkatan Kelulusan</label>
            <input type="text" id="profil-batch" x-model="draft.batch" class="w-full h-10 px-3 rounded-[8px] border border-[#E3E4E9] focus:border-[#3A5988] focus:outline-none">
          </div>
          <div>
            <label for="profil-location" class="mb-1 block font-semibold text-[#0C1117]">Lokasi Domisili</label>
            <input type="text" id="profil-location" x-model="draft.location" class="w-full h-10 px-3 rounded-[8px] border border-[#E3E4E9] focus:border-[#3A5988] focus:outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="profil-email" class="mb-1 block font-semibold text-[#0C1117]">Email Resmi</label>
            <input type="email" id="profil-email" x-model="draft.email" class="w-full h-10 px-3 rounded-[8px] border border-[#E3E4E9] focus:border-[#3A5988] focus:outline-none">
          </div>
          <div>
            <label for="profil-linkedin" class="mb-1 block font-semibold text-[#0C1117]">Tautan LinkedIn</label>
            <input type="url" id="profil-linkedin" x-model="draft.linkedin" class="w-full h-10 px-3 rounded-[8px] border border-[#E3E4E9] focus:border-[#3A5988] focus:outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="profil-github" class="mb-1 block font-semibold text-[#0C1117]">Tautan GitHub</label>
            <input type="url" id="profil-github" x-model="draft.github" class="w-full h-10 px-3 rounded-[8px] border border-[#E3E4E9] focus:border-[#3A5988] focus:outline-none">
          </div>
          <div>
            <label for="profil-website" class="mb-1 block font-semibold text-[#0C1117]">Website Pribadi</label>
            <input type="url" id="profil-website" x-model="draft.website" class="w-full h-10 px-3 rounded-[8px] border border-[#E3E4E9] focus:border-[#3A5988] focus:outline-none">
          </div>
        </div>

        <div>
          <label for="profil-about" class="mb-1 block font-semibold text-[#0C1117]">Tentang Saya (Bio)</label>
          <textarea rows="4" id="profil-about" x-model="draft.about" class="w-full p-3 rounded-[8px] border border-[#E3E4E9] focus:border-[#3A5988] focus:outline-none leading-relaxed"></textarea>
        </div>

        <p x-show="error" x-cloak x-text="error" role="alert" class="rounded-[8px] bg-red-50 px-3 py-2 text-[13px] text-red-700"></p>
      </div>
      <div class="flex flex-wrap justify-end gap-2.5 border-t border-[#E3E4E9] px-5 py-4 sm:px-6">
        <a href="profil.html" class="inline-flex h-10 items-center rounded-[8px] border border-[#E3E4E9] px-4 text-[13px] font-semibold hover:bg-[#F4F5F7]">Batal</a>
        <button type="submit" :disabled="!!imageReading" class="h-10 rounded-[8px] bg-[#3A5988] px-5 text-[13px] font-semibold text-white shadow-sm hover:bg-[#496DA8] disabled:opacity-50">Simpan Perubahan</button>
      </div>
    </form>
  </main>

  <script>
    function editProfilPage() {
      const profile = loadProfilSaya();
      const fields = ["name", "nim", "headline", "batch", "location", "email", "linkedin", "github", "website", "about", "coverImageUrl", "avatarUrl"];
      const original = Object.fromEntries(fields.map(field => [field, String(profile[field] ?? "")]));
      return {
        profile,
        draft: { ...original },
        error: "",
        imageErrors: { coverImageUrl: "", avatarUrl: "" },
        imageReading: "",

        async selectImage(event, field, limitMb) {
          const input = event.target;
          const file = input.files[0];
          if (!file || this.imageReading) return;
          this.imageReading = field;
          this.imageErrors[field] = "";
          try {
            this.draft[field] = await readProfileImage(file, limitMb);
          } catch (error) {
            this.imageErrors[field] = error.message;
          } finally {
            this.imageReading = "";
            input.value = "";
          }
        },

        saveProfile() {
          if (this.imageReading) return;
          const values = Object.fromEntries(fields.map(field => [field, this.draft[field].trim()]));
          if (!values.name) {
            this.error = "Nama lengkap tidak boleh kosong.";
            return;
          }
          for (const field of ["linkedin", "github", "website"]) {
            if (values[field] && !/^https?:\/\//i.test(values[field])) {
              this.error = "Gunakan tautan yang diawali dengan https:// atau http://.";
              return;
            }
          }
          const changes = Object.fromEntries(Object.entries(values).filter(([field, value]) => value !== original[field].trim()));
          try {
            saveProfilSaya(changes);
          } catch {
            this.error = "Perubahan profil gagal disimpan. Coba lagi.";
            return;
          }
          try {
            sessionStorage.setItem("bengkod_profil_notice", "Perubahan profil berhasil disimpan.");
          } catch {}
          window.location.href = "profil.html";
        }
      };
    }

    mountAlumniPortal(document.querySelector('main'));
  </script>
</body>
</html>
