<!DOCTYPE html>
<html lang="id" data-color-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bengkod Gigs &amp; Side-Project Exchange | Bengkel Koding UDINUS</title>
  <meta name="description" content="Platform Peer-to-Peer (P2P) kolaborasi side-project, tender freelance, dan rekrutmen tim internal alumni Bengkel Koding.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/page-skeleton.js"></script>
  <script src="assets/js/alumni.js"></script>
  <script src="assets/js/alumni-data.js"></script>
  <script src="assets/js/alumni-profile-data.js"></script>
  <script src="assets/js/alumni-cv.js"></script>
  <script src="../assets/js/store.js"></script>
</head>
<body>
<main data-route="gigs">
  <div x-data="bengkodGigsExchange" class="w-full flex flex-col gap-6 py-2">

    <!-- Toast Notifikasi Interaktif -->
    <template x-if="toast">
      <div class="fixed bottom-6 right-6 z-[90] bg-gray-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3.5 animate-fade-in text-[14px] max-w-md">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 shrink-0"></span>
        <span class="flex-1" x-text="toast"></span>
        <template x-if="toastAction">
          <button
            type="button"
            @click="toastAction.callback(); toast = ''; toastAction = null"
            class="px-3 py-1 rounded-full bg-blue-600 hover:bg-blue-500 text-white text-[12.5px] font-semibold whitespace-nowrap transition-colors cursor-pointer"
            x-text="toastAction.label"
          ></button>
        </template>
      </div>
    </template>

    <!-- ============================================================
        HEADER HALAMAN (BERSIH & MINIMALIS TANPA CONTAINER CARD)
    ============================================================ -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-gray-200">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold text-[#1E3A8A] tracking-tight">
          Gigs &amp; Proyek
        </h1>
        <p class="text-[14px] sm:text-[15px] text-gray-500 mt-1 font-normal">
          Papan kolaborasi side-project, tender freelance, dan rekrutmen tim internal antar-alumni Bengkel Koding.
        </p>
      </div>

      <!-- Proyek milik sendiri dikelola di gigs-kelola.html; Lempar Proyek membuka modal buat di sana -->
      <div class="shrink-0 flex flex-wrap items-center gap-2.5">
        <a
          href="gigs-kelola.html"
          class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full text-[14px] font-semibold text-gray-700 border border-gray-300 hover:border-[#1E3A8A] hover:text-[#1E3A8A] hover:bg-blue-50/40 transition-colors whitespace-nowrap"
        >
          <span>Kelola Proyek Saya</span>
          <template x-if="myGigs.length > 0">
            <span class="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-gray-100 text-gray-600" x-text="myGigs.length"></span>
          </template>
        </a>
        <a
          href="gigs-kelola.html?buat=1"
          class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full text-[14px] font-semibold text-white bg-[#1E3A8A] hover:bg-[#1D4ED8] shadow-sm transition-colors cursor-pointer whitespace-nowrap"
        >
          <span class="text-base leading-none font-bold">+</span>
          <span>Lempar Proyek</span>
        </a>
      </div>
    </div>

    <!-- ── TAB NAVIGASI UTAMA (LANGSUNG DI HALAMAN) ── -->
    <div class="flex items-center justify-between gap-3 overflow-x-auto no-scrollbar">
      <div class="inline-flex items-center bg-gray-100 p-1 rounded-full">
        <button
          type="button"
          @click="activeTab = 'board'"
          class="px-4 py-2 rounded-full text-[14px] font-medium transition-all cursor-pointer whitespace-nowrap flex items-center gap-1.5"
          :class="activeTab === 'board' ? 'bg-white text-[#1E3A8A] font-semibold shadow-xs' : 'text-gray-600 hover:text-gray-900'"
        >
          <span>Jelajahi</span>
          <span
            class="px-2 py-0.5 rounded-full text-[11px] font-semibold"
            :class="activeTab === 'board' ? 'bg-blue-50 text-[#1E3A8A]' : 'bg-gray-200/70 text-gray-600'"
            x-text="openGigsCount"
          ></span>
        </button>

        <button
          type="button"
          @click="activeTab = 'saved'"
          class="px-4 py-2 rounded-full text-[14px] font-medium transition-all cursor-pointer whitespace-nowrap flex items-center gap-1.5"
          :class="activeTab === 'saved' ? 'bg-white text-[#1E3A8A] font-semibold shadow-xs' : 'text-gray-600 hover:text-gray-900'"
        >
          <span>Tersimpan</span>
          <template x-if="savedGigIds.length > 0">
            <span
              class="px-2 py-0.5 rounded-full text-[11px] font-semibold"
              :class="activeTab === 'saved' ? 'bg-blue-50 text-[#1E3A8A]' : 'bg-gray-200/70 text-gray-600'"
              x-text="savedGigIds.length"
            ></span>
          </template>
        </button>

        <button
          type="button"
          @click="activeTab = 'applications'"
          class="px-4 py-2 rounded-full text-[14px] font-medium transition-all cursor-pointer whitespace-nowrap flex items-center gap-1.5"
          :class="activeTab === 'applications' ? 'bg-white text-[#1E3A8A] font-semibold shadow-xs' : 'text-gray-600 hover:text-gray-900'"
        >
          <span>Lamaran Terkirim</span>
          <template x-if="myApplications.length > 0">
            <span
              class="px-2 py-0.5 rounded-full text-[11px] font-semibold"
              :class="activeTab === 'applications' ? 'bg-blue-50 text-[#1E3A8A]' : 'bg-gray-200/70 text-gray-600'"
              x-text="myApplications.length"
            ></span>
          </template>
        </button>
      </div>
    </div>

    <!-- ── BAR PENCARIAN & FILTER KATA KUNCI ── -->
    <template x-if="activeTab === 'board' || (activeTab === 'saved' && savedGigIds.length > 0)">
      <div class="space-y-3">
        <!-- Input Pencarian -->
        <div class="relative w-full">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          <input
            type="search"
            placeholder="Cari kebutuhan proyek, tech stack (Flutter, Next.js), deliverables, atau nama owner..."
            x-model="searchQuery"
            class="w-full h-11 pl-11 pr-4 bg-white border border-gray-200 rounded-full text-[14px] text-gray-900 placeholder:text-gray-400 focus:outline-none focus:border-[#1E3A8A] focus:ring-2 focus:ring-[#1E3A8A]/15 transition-all shadow-2xs"
          >
        </div>

        <!-- Filter Dropdowns Pill Row -->
        <div class="flex items-center gap-2.5 overflow-x-auto no-scrollbar -mx-1 px-1 pb-1 sm:flex-wrap sm:overflow-visible">
          <!-- Filter Kategori -->
          <div class="relative shrink-0">
            <label for="filter-gigs-category" class="sr-only">Kategori Proyek</label>
            <select
              id="filter-gigs-category"
              x-model="selectedCategoryTag"
              class="appearance-none h-10 pl-4 pr-9 rounded-full border bg-white text-[13.5px] font-medium focus:outline-none focus:ring-2 focus:ring-[#1E3A8A]/20 focus:border-[#1E3A8A] cursor-pointer transition-all shadow-2xs"
              :class="selectedCategoryTag ? 'border-blue-300 bg-blue-50/70 text-[#1E3A8A] font-semibold' : 'border-gray-200 text-gray-700 hover:border-gray-300'"
            >
              <option value="">Kategori: Semua</option>
              <option value="Mobile App">Mobile App</option>
              <option value="Frontend">Frontend Development</option>
              <option value="Backend">Backend API</option>
              <option value="UI/UX">UI/UX &amp; Web Design</option>
              <option value="Data Science">Data Science &amp; AI</option>
              <option value="QA">QA &amp; Testing</option>
            </select>
            <span class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none" :class="selectedCategoryTag ? 'text-[#1E3A8A]' : 'text-gray-400'">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
            </span>
          </div>

          <!-- Filter Budget -->
          <div class="relative shrink-0">
            <label for="filter-gigs-budget" class="sr-only">Rentang Budget</label>
            <select
              id="filter-gigs-budget"
              x-model="filterBudget"
              class="appearance-none h-10 pl-4 pr-9 rounded-full border bg-white text-[13.5px] font-medium focus:outline-none focus:ring-2 focus:ring-[#1E3A8A]/20 focus:border-[#1E3A8A] cursor-pointer transition-all shadow-2xs"
              :class="filterBudget ? 'border-blue-300 bg-blue-50/70 text-[#1E3A8A] font-semibold' : 'border-gray-200 text-gray-700 hover:border-gray-300'"
            >
              <option value="">Rentang Budget: Semua</option>
              <template x-for="b in GIGS_BUDGET_RANGES" :key="b">
                <option :value="b" x-text="b"></option>
              </template>
            </select>
            <span class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none" :class="filterBudget ? 'text-[#1E3A8A]' : 'text-gray-400'">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
            </span>
          </div>

          <!-- Filter Status -->
          <div class="relative shrink-0">
            <label for="filter-gigs-status" class="sr-only">Status Proyek</label>
            <select
              id="filter-gigs-status"
              x-model="filterStatus"
              class="appearance-none h-10 pl-4 pr-9 rounded-full border bg-white text-[13.5px] font-medium focus:outline-none focus:ring-2 focus:ring-[#1E3A8A]/20 focus:border-[#1E3A8A] cursor-pointer transition-all shadow-2xs"
              :class="filterStatus && filterStatus !== 'Semua' ? 'border-blue-300 bg-blue-50/70 text-[#1E3A8A] font-semibold' : 'border-gray-200 text-gray-700 hover:border-gray-300'"
            >
              <option value="Semua">Status Proyek: Semua</option>
              <option value="Terbuka">Open</option>
              <option value="Sedang Dikerjakan">Disetujui</option>
              <option value="Selesai">Selesai</option>
            </select>
            <span class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none" :class="filterStatus && filterStatus !== 'Semua' ? 'text-[#1E3A8A]' : 'text-gray-400'">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
            </span>
          </div>

          <!-- Reset Filter Button (Hanya tampil saat ada filter atau pencarian aktif) -->
          <button
            type="button"
            x-show="searchQuery || filterBudget || selectedCategoryTag || (filterStatus && filterStatus !== 'Semua')"
            @click="searchQuery = ''; filterBudget = ''; filterStatus = 'Semua'; selectedCategoryTag = ''"
            class="h-10 px-4 rounded-full border border-gray-200 hover:border-gray-300 text-[13px] font-semibold text-gray-600 hover:text-[#1E3A8A] bg-white transition-colors cursor-pointer flex items-center gap-1.5 shrink-0 shadow-2xs"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            <span>Reset Filter</span>
          </button>
        </div>
      </div>
    </template>

    <!-- ============================================================
        TAB: LAMARAN SAYA (APPLICATION TRACKER)
        100% PERSIS TAB "LAMARAN SAYA" DI LOWONGAN PEKERJAAN
    ============================================================ -->
    <template x-if="activeTab === 'applications'">
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-2xs">
        <template x-if="myApplications.length === 0">
          <div class="text-center py-16 text-gray-400 space-y-3">
            <div class="w-16 h-16 rounded-full bg-blue-50 text-[#1E3A8A] flex items-center justify-center mx-auto">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none">
                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>
            <p class="text-[17px] font-semibold text-gray-900">Belum Ada Lamaran yang Dikirim</p>
            <p class="text-[15px] text-gray-500 max-w-md mx-auto leading-relaxed font-normal">
              Jelajahi Papan Gigs dan ajukan minat kolaborasi pada proyek alumni yang sesuai dengan keahlian Anda!
            </p>
            <div class="pt-2">
              <button
                type="button"
                @click="activeTab = 'board'"
                class="inline-flex items-center gap-2 px-6 py-2.5 rounded-full text-[14px] font-semibold text-white bg-[#1E3A8A] hover:bg-[#1D4ED8] shadow-sm transition-colors cursor-pointer"
              >
                <span>Jelajahi Papan Gigs</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
              </button>
            </div>
          </div>
        </template>
        <template x-if="myApplications.length > 0">
          <div>
            <!-- Bulk Action Bar jika ada item dipilih -->
            <template x-if="selectedAppIds.length > 0">
              <div class="flex items-center justify-between px-6 py-3 bg-blue-50 border-b border-blue-100">
                <span class="text-[14px] font-medium text-[#1E3A8A]" x-text="selectedAppIds.length + ' lamaran dipilih'"></span>
                <button
                  @click="handleDeleteSelected()"
                  class="flex items-center gap-2 px-4 py-1.5 rounded-full bg-[#1E3A8A] hover:bg-blue-900 text-white text-[14px] font-semibold transition-colors cursor-pointer"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9" />
                    <path d="M15 9l-6 6M9 9l6 6" />
                  </svg>
                  Batalkan
                </button>
              </div>
            </template>

            <!-- Header Kolom: Checkbox + "Proyek & Owner" -->
            <div class="flex items-center justify-between gap-5 px-6 py-3.5 border-b border-gray-100 bg-gray-50/70">
              <div class="flex items-center gap-5">
                <input
                  type="checkbox"
                  :checked="selectedAppIds.length === myApplications.length && myApplications.length > 0"
                  @change="handleToggleSelectAll()"
                  class="w-4.5 h-4.5 rounded-[4px] border-2 border-gray-400 text-[#1E3A8A] focus:ring-0 cursor-pointer"
                  aria-label="Pilih semua proyek"
                >
                <span class="font-semibold text-[13px] text-gray-500 uppercase tracking-wide">Daftar Lamaran Anda</span>
              </div>
              <span class="text-[12px] text-gray-400 font-normal">Klik baris untuk melihat detail proyek</span>
            </div>

            <!-- Rows List (Persis 100% Lowongan Pekerjaan) -->
            <div class="divide-y divide-gray-100">
              <template x-for="app in myApplications" :key="app.id">
                <div
                  @click="selectedGigId = app.gigId; activeTab = 'board'"
                  class="flex items-center gap-5 px-6 py-5 hover:bg-blue-50/30 transition-colors cursor-pointer"
                  :class="selectedAppIds.includes(app.id) ? 'bg-blue-50/50' : ''"
                >
                  <!-- Checkbox -->
                  <input
                    type="checkbox"
                    :checked="selectedAppIds.includes(app.id)"
                    @click.stop
                    @change.stop="handleToggleSelectApp(app.id)"
                    class="w-4.5 h-4.5 flex-shrink-0 rounded-[4px] border-2 border-gray-300 text-[#1E3A8A] focus:ring-0 cursor-pointer"
                    :aria-label="'Pilih ' + app.gigTitle"
                  >

                  <!-- Icon Proyek -->
                  <div class="w-11 h-11 rounded-lg bg-blue-50 border border-blue-100 flex items-center justify-center flex-shrink-0 text-[#1E3A8A] font-bold text-[15px]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                  </div>

                  <!-- Info -->
                  <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-1.5">
                      <h3 class="text-[15px] font-semibold text-gray-900 hover:text-[#1E3A8A] transition-colors leading-snug truncate" x-text="app.gigTitle"></h3>
                    </div>
                    <p class="text-[14px] text-gray-600 mt-0.5 truncate" x-text="'Owner: ' + app.ownerName + ' · ' + app.budgetRange"></p>
                    <p class="text-[13px] text-gray-400 mt-0.5" x-text="'Diajukan ' + app.appliedDate"></p>
                  </div>

                  <!-- Status badge: UKURAN SERAGAM w-44 PERSIS LOWONGAN PEKERJAAN -->
                  <div class="flex-shrink-0 flex items-center gap-2">
                    <span
                      class="inline-flex items-center justify-center w-44 py-1.5 px-3 rounded-full text-[13px] font-semibold text-center bg-blue-50 text-[#1E3A8A] border border-blue-200/90 shadow-2xs"
                      x-text="app.status === 'ACCEPTED' ? 'Disetujui' : (app.status === 'PENDING' ? 'Menunggu Review' : (app.status === 'COMPLETED' ? 'Selesai' : 'Belum Terpilih'))"
                    ></span>

                    <template x-if="app.status === 'PENDING'">
                      <button
                        type="button"
                        @click.stop="withdrawApplication(app.id, app.gigId)"
                        class="p-2 rounded-full text-gray-400 hover:text-red-600 hover:bg-red-50 transition-colors cursor-pointer"
                        title="Tarik lamaran"
                      >
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
                      </button>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- ============================================================
        TAB: PROYEK TERSIMPAN (KONDISI KOSONG BELUM ADA PROYEK DISIMPAN)
    ============================================================ -->
    <template x-if="activeTab === 'saved' && savedGigIds.length === 0">
      <div class="bg-white rounded-xl border border-gray-200 p-12 sm:p-16 text-center space-y-4 shadow-2xs">
        <div class="w-16 h-16 rounded-full bg-blue-50 text-[#1E3A8A] flex items-center justify-center mx-auto">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z" />
          </svg>
        </div>
        <div class="space-y-1">
          <h3 class="text-[18px] font-bold text-gray-900 tracking-tight">Belum Ada Proyek Tersimpan</h3>
          <p class="text-[15px] text-gray-500 max-w-md mx-auto leading-relaxed font-normal">
            Simpan proyek menarik saat menjelajahi Papan Gigs dengan menekan tombol Simpan atau ikon bookmark untuk ditinjau di kemudian hari.
          </p>
        </div>
        <div class="pt-2">
          <button
            type="button"
            @click="activeTab = 'board'"
            class="inline-flex items-center gap-2 px-6 py-2.5 rounded-full text-[14px] font-semibold text-white bg-[#1E3A8A] hover:bg-[#1D4ED8] shadow-sm transition-colors cursor-pointer"
          >
            <span>Jelajahi Papan Gigs</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </button>
        </div>
      </div>
    </template>

    <!-- ============================================================
        KONTEN UTAMA: JELAJAHI & TERSIMPAN (KONDISI ADA DATA ATAU HASIL FILTER 0)
    ============================================================ -->
    <template x-if="activeTab === 'board' || (activeTab === 'saved' && savedGigIds.length > 0)">
      <div class="w-full">
        <!-- ── EMPTY STATE FULL-WIDTH KETIKA HASIL PENCARIAN/FILTER KOSONG (TIDAK ADA CARD KOSONG DI KANAN) ── -->
        <template x-if="filteredBoardGigs.length === 0">
          <div class="bg-white rounded-xl border border-gray-200 p-12 sm:p-16 text-center space-y-4 shadow-2xs w-full">
            <div class="w-16 h-16 rounded-full bg-gray-50 text-gray-400 flex items-center justify-center mx-auto">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.3-4.3" />
              </svg>
            </div>
            <div class="space-y-1">
              <h3 class="text-[17px] font-semibold text-gray-900">Tidak ada proyek yang cocok</h3>
              <p class="text-[14px] text-gray-500 max-w-md mx-auto leading-relaxed font-normal">
                Coba sesuaikan kata kunci pencarian atau bersihkan filter kategori dan budget yang aktif.
              </p>
            </div>
            <div class="pt-1">
              <button
                type="button"
                @click="searchQuery = ''; filterBudget = ''; filterStatus = 'Semua'; selectedCategoryTag = ''"
                class="inline-flex items-center gap-1.5 px-5 py-2.5 rounded-full border border-gray-300 text-[13px] font-semibold text-gray-700 hover:text-[#1E3A8A] hover:border-[#1E3A8A] bg-white transition-colors cursor-pointer"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                <span>Reset Pencarian &amp; Filter</span>
              </button>
            </div>
          </div>
        </template>

        <!-- ── SPLIT SCREEN 2-KOLOM (HANYA MUNCUL KETIKA ADA PROYEK UNTUK DITAMPILKAN) ── -->
        <template x-if="filteredBoardGigs.length > 0">

      targetApplyGig: null,
      applyPitchMessage: "",
      applyPortfolioUrl: "",
      applyContactPhone: "081234567890",
      applyResumeFileName: "",

      init() {
        this.muat();
        // Load saved gigs from localStorage
        try {
          const rawSaved = localStorage.getItem("bengkod_saved_gigs");
          if (rawSaved) this.savedGigIds = JSON.parse(rawSaved);
        } catch {}

        const loaded = typeof loadGigs === "function" ? loadGigs() : (window.INITIAL_GIGS || []);
        // ?gig=<id> dari halaman Kelola Gigs langsung membuka rincian proyek tersebut
        const wanted = new URLSearchParams(window.location.search).get("gig");
        if (wanted && loaded.some((g) => g.id === wanted)) this.selectedGigId = wanted;
        else if (loaded && loaded.length > 0) this.selectedGigId = loaded[0].id;
        window.addEventListener("bengkod_gigs_updated", () => this.muat());
        window.addEventListener("bengkod_gigs_apply_updated", () => this.muat());
      },

      muat() {
        const loaded = typeof loadGigs === "function" ? loadGigs() : (window.INITIAL_GIGS || []);
        this.gigs = Array.isArray(loaded) && loaded.length > 0 ? loaded : (window.INITIAL_GIGS || []);
        this.myApplications = typeof loadMyApplications === "function" ? loadMyApplications() : [];
      },

      get selectedGig() {
        if (!this.selectedGigId) return this.filteredBoardGigs[0] || null;
        return this.filteredBoardGigs.find((g) => g.id === this.selectedGigId) || this.filteredBoardGigs[0] || null;
      },

      get openGigsCount() {
        return this.gigs.filter((g) => g.status === "Terbuka").length;
      },

      get inProgressCount() {
        return this.gigs.filter((g) => g.status === "Sedang Dikerjakan").length;
      },

      get completedCount() {
        return this.gigs.filter((g) => g.status === "Selesai").length;
      },

      get myGigs() {
        return this.gigs.filter((g) => g.ownerId === this.currentUserId);
      },

      get filteredBoardGigs() {
        const q = this.searchQuery.trim().toLowerCase();
        return this.gigs.filter((g) => {
          if (this.activeTab === "saved" && !this.savedGigIds.includes(g.id)) return false;
          if (this.filterBudget && g.budgetRange !== this.filterBudget) return false;
          if (this.filterStatus && this.filterStatus !== "" && this.filterStatus !== "Semua") {
            const gs = (g.status || "").toLowerCase();
            const fs = this.filterStatus.toLowerCase();
            if (fs === "terbuka" || fs === "open") {
              if (gs !== "terbuka" && gs !== "open") return false;
            } else if (fs.includes("dikerjakan") || fs.includes("progress")) {
              if (!gs.includes("dikerjakan") && !gs.includes("progress")) return false;
            } else if (fs.includes("selesai") || fs.includes("complete")) {
              if (!gs.includes("selesai") && !gs.includes("complete")) return false;
            } else if (gs !== fs) {
              return false;
            }
          }
          if (this.selectedCategoryTag && !g.category.toLowerCase().includes(this.selectedCategoryTag.toLowerCase())) return false;
          if (q) {
            const haystack = [g.title, g.description, (g.techStack || []).join(" "), (g.rolesNeeded || []).join(" "), g.ownerName].join(" ").toLowerCase();
            if (!haystack.includes(q)) return false;
          }
          return true;
        });
      },

      hasAppliedTo(gigId) {
        return this.myApplications.some((a) => a.gigId === gigId);
      },

      // Profil sendiri ke profil.html, pemilik lain ke detail.html
      ownerProfileHref(gig) {
        if (!gig) return "#";
        if (gig.ownerId === this.currentUserId) return "profil.html";
        return "detail.html?id=" + encodeURIComponent(gig.ownerId || gig.ownerName || "");
      },

      handleToggleBookmark(gigId) {
        if (this.savedGigIds.includes(gigId)) {
          this.savedGigIds = this.savedGigIds.filter((id) => id !== gigId);
          this.setToast("Proyek dihapus dari daftar tersimpan");
        } else {
          this.savedGigIds.push(gigId);
          this.setToast("Proyek disimpan ke daftar tersimpan");
        }
        try {
          localStorage.setItem("bengkod_saved_gigs", JSON.stringify(this.savedGigIds));
        } catch {}
      },

      handleToggleSelectAll() {
        if (this.selectedAppIds.length === this.myApplications.length) {
          this.selectedAppIds = [];
        } else {
          this.selectedAppIds = this.myApplications.map((a) => a.id);
        }
      },

      handleToggleSelectApp(id) {
        if (this.selectedAppIds.includes(id)) {
          this.selectedAppIds = this.selectedAppIds.filter((i) => i !== id);
        } else {
          this.selectedAppIds.push(id);
        }
      },

      handleDeleteSelected() {
        if (!confirm(`Batalkan ${this.selectedAppIds.length} lamaran yang dipilih?`)) return;
        this.myApplications = this.myApplications.filter((a) => !this.selectedAppIds.includes(a.id));
        if (typeof saveMyApplications === "function") saveMyApplications(this.myApplications);
        this.selectedAppIds = [];
        this.setToast("Pengajuan minat yang dipilih berhasil dibatalkan.");
      },

      openQuickApplyModal(gig) {
        this.targetApplyGig = gig;
        this.applyPitchMessage = "";
        this.applyPortfolioUrl = "";
        this.applyContactPhone = "081234567890";
        this.applyResumeFileName = typeof cvFileName === "function"
          ? cvFileName(typeof alumniCvData === "function" ? alumniCvData().profile.name : this.currentUserName)
          : "";
        this.quickApplyModalOpen = true;
      },

      submitQuickApply() {
        if (!this.targetApplyGig || !this.applyPitchMessage.trim()) return;
        if (this.applyPitchMessage.length > 250) {
          alert("Pesan pitching maksimal 250 karakter.");
          return;
        }

        const pickedProjects = this.applyPortfolioUrl.trim()
          ? [{ title: "Tautan Portofolio / GitHub", linkUrl: this.applyPortfolioUrl.trim(), stack: "Karya Terlampir" }]
          : [];

        const newApplicant = {
          id: "app-" + Date.now(),
          applicantId: this.currentUserId,
          applicantName: this.currentUserName,
          applicantAvatar: this.currentUserAvatar,
          applicantBatch: "2024",
          applicantPhone: this.applyContactPhone,
          skills: ["Data Science", "Python", "Machine Learning", "FastAPI"],
          pitchMessage: this.applyPitchMessage.trim(),
          portfolioItems: pickedProjects,
          resumeFileName: this.applyResumeFileName,
          appliedDate: new Date().toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" }),
          status: "PENDING"
        };

        const updatedGigs = this.gigs.map((g) => {
          if (g.id === this.targetApplyGig.id) {
            return { ...g, applicants: [newApplicant, ...(g.applicants || [])] };
          }
          return g;
        });
        if (typeof saveGigs === "function") saveGigs(updatedGigs);
        this.gigs = updatedGigs;

        const myAppEntry = {
          id: newApplicant.id,
          gigId: this.targetApplyGig.id,
          gigTitle: this.targetApplyGig.title,
          ownerName: this.targetApplyGig.ownerName,
          ownerPhone: this.targetApplyGig.ownerPhone,
          message: this.applyPitchMessage.trim(),
          portfolioItems: pickedProjects,
          resumeFileName: this.applyResumeFileName,
          appliedDate: newApplicant.appliedDate,
          budgetRange: this.targetApplyGig.budgetRange,
          status: "PENDING"
        };
        const nextApps = [myAppEntry, ...this.myApplications];
        if (typeof saveMyApplications === "function") saveMyApplications(nextApps);
        this.myApplications = nextApps;

        this.quickApplyModalOpen = false;
        this.setToast(
          "Minat berhasil diajukan! Owner proyek akan segera meninjau pitching Anda.",
          {
            label: "Lihat Lamaran →",
            callback: () => { this.activeTab = "applications"; }
          }
        );
      },

      withdrawApplication(appId, gigId) {
        if (!confirm("Tarik kembali pengajuan minat Anda untuk proyek ini?")) return;
        this.myApplications = this.myApplications.filter((a) => a.id !== appId);
        if (typeof saveMyApplications === "function") saveMyApplications(this.myApplications);

        this.gigs = this.gigs.map((g) => {
          if (g.id === gigId) {
            return {
              ...g,
              applicants: (g.applicants || []).filter((a) => a.id !== appId && a.applicantId !== this.currentUserId),
              applicantsCount: Math.max(0, (g.applicantsCount || 1) - 1),
            };
          }
          return g;
        });
        if (typeof saveGigs === "function") saveGigs(this.gigs);
        this.setToast("Pengajuan minat berhasil ditarik.");
      },

      setToast(msg, action = null) {
        this.toast = msg;
        this.toastAction = action;
        setTimeout(() => {
          if (this.toast === msg) {
            this.toast = "";
            this.toastAction = null;
          }
        }, 4500);
      }
    };
  }

  window.bengkodGigsExchange = bengkodGigsExchange;
  document.addEventListener("alpine:init", () => {
    Alpine.data("bengkodGigsExchange", bengkodGigsExchange);
  });
</script>
</body>
