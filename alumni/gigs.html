<!DOCTYPE html>
<html lang="id" data-color-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bengkod Gigs & Side-Project Exchange | Bengkel Koding UDINUS</title>
  <meta name="description" content="Platform Peer-to-Peer (P2P) kolaborasi side-project, tender freelance, dan rekrutmen tim internal alumni Bengkel Koding.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/page-skeleton.js"></script>
  <script src="assets/js/alumni.js"></script>
  <script src="assets/js/alumni-data.js"></script>
  <script src="assets/js/alumni-profile-data.js"></script>
  <script src="../assets/js/store.js"></script>
</head>
<body>
<main data-route="gigs">
  <div x-data="bengkodGigsExchange" class="w-full space-y-6 py-2 antialiased">
    <!-- Toast Notifikasi Interaktif -->
    <template x-if="toast">
      <div class="fixed bottom-6 right-6 z-[120] bg-gray-900 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 animate-fade-in text-[14px]">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
        <span x-text="toast"></span>
      </div>
    </template>

    <!-- ============================================================
        HEADER MINIMALIS & CLEAN (BENGKOD DESIGN SYSTEM)
    ============================================================ -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-gray-200">
      <div>
        <div class="flex items-center gap-2.5">
          <h1 class="text-2xl sm:text-3xl font-bold text-[#1E3A8A] tracking-tight">Gigs &amp; Proyek</h1>
        </div>
        <p class="text-sm text-gray-500 mt-1">
          Papan kolaborasi side-project, tender freelance, dan rekrutmen tim internal antar-alumni Bengkel Koding
        </p>
      </div>

      <div class="flex items-center gap-3 shrink-0">
        <button
          type="button"
          @click="openCreateGigModal()"
          class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full text-[14px] font-semibold text-white bg-[#1E3A8A] hover:bg-[#1D4ED8] shadow-sm transition-colors cursor-pointer"
        >
          <span class="text-base leading-none">+</span>
          <span>Lempar Proyek (Create Gig)</span>
        </button>
      </div>
    </div>

    <!-- ============================================================
        TAB NAVIGASI UTAMA (ProductHunt Tab Bar)
    ============================================================ -->
    <div class="flex items-center justify-between gap-3 border-b border-gray-200">
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar text-sm">
        <button
          type="button"
          @click="activeTab = 'board'"
          class="px-5 py-3 font-semibold border-b-2 transition-all flex items-center gap-2 cursor-pointer"
          :class="activeTab === 'board' ? 'border-[#1E3A8A] text-[#1E3A8A]' : 'border-transparent text-gray-500 hover:text-gray-900'"
        >
          <span>Eksplorasi Papan Gigs</span>
          <span class="px-2 py-0.5 rounded-full text-xs" :class="activeTab === 'board' ? 'bg-blue-50 text-[#1E3A8A]' : 'bg-gray-100 text-gray-600'" x-text="openGigsCount"></span>
        </button>

        <button
          type="button"
          @click="activeTab = 'my_gigs'"
          class="px-5 py-3 font-semibold border-b-2 transition-all flex items-center gap-2 cursor-pointer"
          :class="activeTab === 'my_gigs' ? 'border-[#1E3A8A] text-[#1E3A8A]' : 'border-transparent text-gray-500 hover:text-gray-900'"
        >
          <span>Proyek Saya (Project Owner)</span>
          <span class="px-2 py-0.5 rounded-full text-xs" :class="activeTab === 'my_gigs' ? 'bg-blue-50 text-[#1E3A8A]' : 'bg-gray-100 text-gray-600'" x-text="myGigs.length"></span>
        </button>

        <button
          type="button"
          @click="activeTab = 'applications'"
          class="px-5 py-3 font-semibold border-b-2 transition-all flex items-center gap-2 cursor-pointer"
          :class="activeTab === 'applications' ? 'border-[#1E3A8A] text-[#1E3A8A]' : 'border-transparent text-gray-500 hover:text-gray-900'"
        >
          <span>Lamaran Saya (Contributor)</span>
          <span class="px-2 py-0.5 rounded-full text-xs" :class="activeTab === 'applications' ? 'bg-emerald-50 text-emerald-700' : 'bg-gray-100 text-gray-600'" x-text="myApplications.length"></span>
        </button>
      </div>
    </div>

    <!-- ============================================================
        TAB 1: EKSPLORASI PAPAN GIGS (CONTRIBUTOR BROWSE)
    ============================================================ -->
    <div x-show="activeTab === 'board'" class="space-y-5">
        <!-- Filter & Search Controls -->
        <div class="bg-white rounded-xl border border-gray-200 p-4 shadow-xs space-y-3">
          <div class="flex flex-col md:flex-row gap-3 items-center justify-between">
            <div class="relative w-full md:w-96">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
              </span>
              <input
                type="text"
                x-model="searchQuery"
                placeholder="Cari kebutuhan proyek, deliverables, tech stack..."
                class="w-full pl-10 pr-4 py-2 rounded-lg border border-gray-200 text-sm focus:outline-none focus:border-[#1E3A8A]"
              >
            </div>

            <div class="flex items-center gap-2.5 w-full md:w-auto text-xs sm:text-sm">
              <select x-model="filterBudget" class="px-3 py-2 rounded-lg border border-gray-200 bg-white text-gray-700 focus:outline-none focus:border-[#1E3A8A]">
                <option value="">Semua Kisaran Budget</option>
                <template x-for="b in GIGS_BUDGET_RANGES" :key="b">
                  <option :value="b" x-text="b"></option>
                </template>
              </select>

              <select x-model="filterStatus" class="px-3 py-2 rounded-lg border border-gray-200 bg-white text-gray-700 focus:outline-none focus:border-[#1E3A8A]">
                <option value="Terbuka">Buka Tim (OPEN Saja)</option>
                <option value="Sedang Dikerjakan">Sedang Dikerjakan (In Progress)</option>
                <option value="Selesai">Riwayat Selesai (Completed)</option>
                <option value="">Semua Status</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Grid Card Gigs (ProductHunt Modern Card) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <template x-if="filteredBoardGigs.length === 0">
            <div class="col-span-full bg-white rounded-xl border border-gray-200 p-12 text-center text-gray-400 text-sm">
              Tidak ada tender proyek yang cocok dengan filter saat ini.
            </div>
          </template>

          <template x-for="gig in filteredBoardGigs" :key="gig.id">
            <div class="bg-white rounded-xl border border-gray-200/90 hover:border-blue-300 p-6 shadow-xs hover:shadow-md transition-all flex flex-col justify-between group">
              <div class="space-y-4">
                <!-- Status & Quota Header -->
                <div class="flex items-center justify-between gap-3">
                  <div class="flex items-center gap-2 flex-wrap">
                    <template x-if="gig.status === 'Terbuka'">
                      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span>OPEN</span>
                      </span>
                    </template>
                    <template x-if="gig.status === 'Sedang Dikerjakan'">
                      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-blue-50 text-[#1E3A8A] border border-blue-200">
                        <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                        <span>IN PROGRESS</span>
                      </span>
                    </template>
                    <template x-if="gig.status === 'Selesai'">
                      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-purple-50 text-purple-700 border border-purple-200">
                        <span>★ COMPLETED</span>
                      </span>
                    </template>

                    <span class="text-xs text-gray-500 font-medium" x-text="'Kuota: ' + (gig.quota || 1) + ' Tim'"></span>
                  </div>

                  <span class="text-xs text-gray-400" x-text="gig.postedDate"></span>
                </div>

                <!-- Info Owner -->
                <div class="flex items-center gap-3">
                  <img :src="gig.ownerAvatar || DEFAULT_AVATAR" :alt="gig.ownerName" class="w-10 h-10 rounded-full object-cover border border-gray-200 shrink-0">
                  <div class="min-w-0">
                    <p class="text-xs font-bold text-gray-900 truncate" x-text="gig.ownerName"></p>
                    <p class="text-[11px] text-gray-500 truncate" x-text="gig.ownerRole"></p>
                  </div>
                </div>

                <!-- Judul & Keterangan -->
                <div>
                  <h3 class="text-[16px] font-bold text-gray-900 group-hover:text-[#1E3A8A] transition-colors leading-snug" x-text="gig.title"></h3>
                  <p class="text-[13px] text-gray-600 mt-2 line-clamp-3 leading-relaxed" x-text="gig.description"></p>
                </div>

                <!-- Peran & Tech Stack Pills -->
                <div class="space-y-2">
                  <div class="flex flex-wrap items-center gap-1.5">
                    <span class="text-[11px] font-semibold text-gray-400">Peran:</span>
                    <template x-for="r in gig.rolesNeeded" :key="r">
                      <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold bg-blue-50 text-[#1E3A8A]" x-text="r"></span>
                    </template>
                  </div>

                  <div class="flex flex-wrap items-center gap-1.5">
                    <template x-for="st in gig.techStack" :key="st">
                      <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium bg-gray-100 text-gray-700" x-text="st"></span>
                    </template>
                  </div>
                </div>

                <!-- Budget & Deadline Grid -->
                <div class="pt-3 border-t border-gray-100 grid grid-cols-2 gap-3 text-xs">
                  <div>
                    <span class="text-gray-400 block font-medium">Rentang Budget</span>
                    <span class="font-bold text-[#1E3A8A] text-[14px]" x-text="gig.budgetRange"></span>
                  </div>
                  <div>
                    <span class="text-gray-400 block font-medium">Target Selesai</span>
                    <span class="font-semibold text-gray-700 text-[13px]" x-text="gig.deadline"></span>
                  </div>
                </div>
              </div>

              <!-- Footer Aksi -->
              <div class="mt-5 pt-3 border-t border-gray-100 flex items-center justify-between gap-2">
                <span class="text-xs text-gray-400" x-text="((gig.applicants || []).length) + ' Rekan Mengajukan'"></span>

                <div>
                  <!-- Kasus 1: Ini Gig buatan user sendiri -->
                  <template x-if="gig.ownerId === currentUserId">
                    <button
                      type="button"
                      @click="activeTab = 'my_gigs'"
                      class="px-4 py-1.5 rounded-full text-xs font-semibold text-gray-700 border border-gray-300 hover:bg-gray-50"
                    >
                      Kelola di Proyek Saya
                    </button>
                  </template>

                  <!-- Kasus 2: User sudah melamar -->
                  <template x-if="gig.ownerId !== currentUserId && hasAppliedTo(gig.id)">
                    <span class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-gray-100 text-gray-500">
                      ✓ Minat Terkirim
                    </span>
                  </template>

                  <!-- Kasus 3: Belum melamar dan status OPEN -->
                  <template x-if="gig.ownerId !== currentUserId && !hasAppliedTo(gig.id) && gig.status === 'Terbuka'">
                    <button
                      type="button"
                      @click="openQuickApplyModal(gig)"
                      class="inline-flex items-center gap-1 px-4 py-1.5 rounded-full text-xs font-bold text-white bg-[#1E3A8A] hover:bg-[#1D4ED8] transition-colors shadow-xs cursor-pointer"
                    >
                      <span>Ajukan Minat</span>
                      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </button>
                  </template>

                  <!-- Kasus 4: Sudah ditutup / pengerjaan -->
                  <template x-if="gig.ownerId !== currentUserId && !hasAppliedTo(gig.id) && gig.status !== 'Terbuka'">
                    <span class="text-xs font-semibold text-gray-400">Tim Terpenuhi</span>
                  </template>
                </div>
              </div>
            </div>
          </template>
        </div>
    </div>

    <!-- ============================================================
        TAB 2: PROYEK SAYA (ALUR PROJECT OWNER)
    ============================================================ -->
    <div x-show="activeTab === 'my_gigs'" class="space-y-4">
        <template x-if="myGigs.length === 0">
          <div class="bg-white rounded-xl border border-gray-200 p-12 text-center text-gray-400 text-sm space-y-3">
            <p>Anda belum mempublikasikan tender side-project.</p>
            <button
              type="button"
              @click="openCreateGigModal()"
              class="px-5 py-2 rounded-full bg-[#1E3A8A] text-white text-xs font-bold"
            >
              Buat Gig Pertama Anda
            </button>
          </div>
        </template>

        <div class="space-y-4">
          <template x-for="g in myGigs" :key="g.id">
            <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-xs flex flex-col lg:flex-row lg:items-center justify-between gap-5">
              <div class="space-y-2 flex-1">
                <div class="flex items-center gap-2.5 flex-wrap">
                  <template x-if="g.status === 'Terbuka'">
                    <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">OPEN</span>
                  </template>
                  <template x-if="g.status === 'Sedang Dikerjakan'">
                    <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-blue-50 text-[#1E3A8A] border border-blue-200">IN PROGRESS</span>
                  </template>
                  <template x-if="g.status === 'Selesai'">
                    <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-purple-50 text-purple-700 border border-purple-200">COMPLETED</span>
                  </template>
                  <template x-if="g.status === 'Batal'">
                    <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-gray-100 text-gray-500 border border-gray-200">CANCELLED</span>
                  </template>
                  <span class="text-xs text-gray-400" x-text="'Dibuat: ' + g.postedDate"></span>
                  <span class="text-xs text-gray-400">•</span>
                  <span class="text-xs text-gray-500 font-semibold" x-text="g.category"></span>
                </div>

                <h3 class="text-[17px] font-bold text-gray-900" x-text="g.title"></h3>
                <p class="text-xs text-gray-600 line-clamp-2 leading-relaxed" x-text="g.description"></p>

                <div class="flex items-center gap-4 text-xs pt-1 flex-wrap">
                  <span class="font-bold text-[#1E3A8A]" x-text="'Budget: ' + g.budgetRange"></span>
                  <span class="text-gray-500" x-text="'Tenggat: ' + g.deadline"></span>
                  <template x-if="g.assignedContributor">
                    <span class="font-semibold text-emerald-700" x-text="'Kontributor: ' + g.assignedContributor.name"></span>
                  </template>
                </div>
              </div>

              <!-- Owner Action Buttons -->
              <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 shrink-0">
                <!-- Tombol Buka Applicants Drawer jika status bukan Batal -->
                <template x-if="g.status !== 'Batal'">
                  <button
                    type="button"
                    @click="openApplicantsDrawer(g)"
                    class="px-3.5 py-2 rounded-xl text-xs font-bold border border-gray-300 hover:border-[#1E3A8A] text-gray-700 hover:text-[#1E3A8A] hover:bg-blue-50/50 transition-colors flex items-center justify-center gap-1.5 cursor-pointer shadow-2xs"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    <span>Pelamar</span>
                    <span class="px-1.5 py-0.2 rounded-full bg-[#1E3A8A] text-white text-[10px]" x-text="(g.applicants || []).length"></span>
                  </button>
                </template>

                <!-- Tombol Edit Proyek (hanya saat Terbuka) -->
                <template x-if="g.status === 'Terbuka'">
                  <button
                    type="button"
                    @click="openEditGigModal(g)"
                    class="px-3 py-2 rounded-xl text-xs font-semibold border border-gray-300 hover:bg-gray-50 text-gray-700 transition-colors cursor-pointer"
                    title="Ubah rincian proyek"
                  >
                    Edit
                  </button>
                </template>

                <!-- Tombol Batalkan Proyek (hanya saat Terbuka) -->
                <template x-if="g.status === 'Terbuka'">
                  <button
                    type="button"
                    @click="cancelGig(g.id)"
                    class="px-3 py-2 rounded-xl text-xs font-semibold text-red-600 bg-red hover:bg-red-50 border border-red hover:border-red-200 transition-colors cursor-pointer"
                    title="Batalkan proyek ini"
                  >
                    Batalkan
                  </button>
                </template>

                <!-- Tombol Buka Kembali jika Batal -->
                <template x-if="g.status === 'Batal'">
                  <button
                    type="button"
                    @click="reopenGig(g.id)"
                    class="px-3.5 py-2 rounded-xl text-xs font-semibold border border-gray-300 hover:bg-gray-50 text-gray-700 transition-colors cursor-pointer"
                  >
                    Buka Kembali
                  </button>
                </template>

                <!-- Tombol WhatsApp jika sudah di-assign -->
                <template x-if="g.assignedContributor && g.status === 'Sedang Dikerjakan'">
                  <a
                    :href="formatWaUrl(g.assignedContributor.phone, 'Halo ' + g.assignedContributor.name + ', saya ' + g.ownerName + ' dari Bengkel Koding. Pengajuan minatmu untuk gig ' + g.title + ' sudah saya setujui. Mari kita koordinasi teknis pengerjaannya.')"
                    target="_blank"
                    rel="noreferrer"
                    class="px-3.5 py-2 rounded-xl text-xs font-bold bg-emerald-600 hover:bg-emerald-700 text-white transition-colors flex items-center justify-center gap-1.5 shadow-sm"
                  >
                    <span>Hubungi via WA</span>
                  </a>
                </template>

                <!-- Tombol Tandai Selesai & Endorse -->
                <template x-if="g.status === 'Sedang Dikerjakan'">
                  <button
                    type="button"
                    @click="openEndorseModal(g)"
                    class="px-3.5 py-2 rounded-xl text-xs font-bold bg-[#1E3A8A] hover:bg-[#1D4ED8] text-white transition-colors flex items-center justify-center gap-1.5 shadow-sm cursor-pointer"
                  >
                    <span>✓ Tandai Selesai</span>
                  </button>
                </template>
              </div>
            </div>
          </template>
        </div>
    </div>

    <!-- ============================================================
        TAB 3: LAMARAN SAYA (ALUR CONTRIBUTOR)
    ============================================================ -->
    <div x-show="activeTab === 'applications'" class="space-y-4">
        <template x-if="myApplications.length === 0">
          <div class="bg-white rounded-xl border border-gray-200 p-12 text-center text-gray-400 text-sm">
            Anda belum mengajukan minat pada proyek mana pun. Jelajahi tab &quot;Eksplorasi Papan Gigs&quot; untuk mulai berkontribusi.
          </div>
        </template>

        <div class="space-y-4">
          <template x-for="app in myApplications" :key="app.id">
            <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-xs space-y-4">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-gray-100 pb-3">
                <div>
                  <div class="flex items-center gap-2">
                    <span class="text-xs text-gray-400" x-text="'Diajukan pada ' + app.appliedDate"></span>
                    <span class="text-xs text-gray-400">•</span>
                    <span class="text-xs font-bold text-[#1E3A8A]" x-text="app.budgetRange"></span>
                  </div>
                  <h3 class="text-[17px] font-bold text-gray-900 mt-1" x-text="app.gigTitle"></h3>
                  <p class="text-xs text-gray-500 mt-0.5" x-text="'Owner: ' + app.ownerName"></p>
                </div>

                <div class="flex items-center gap-2">
                  <template x-if="app.status === 'PENDING'">
                    <div class="flex items-center gap-2">
                      <span class="px-3.5 py-1 rounded-full text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200">
                        Menunggu Review Owner
                      </span>
                      <button
                        type="button"
                        @click="withdrawApplication(app.id, app.gigId)"
                        class="px-2.5 py-1 rounded-full text-xs font-semibold text-gray-400 hover:text-red-600 hover:bg-red-50 border border-transparent hover:border-red-200 transition-colors cursor-pointer"
                        title="Tarik kembali pengajuan minat"
                      >
                        ✕ Tarik Lamaran
                      </button>
                    </div>
                  </template>
                  <template x-if="app.status === 'ACCEPTED'">
                    <span class="px-3.5 py-1 rounded-full text-xs font-bold bg-blue-50 text-[#1E3A8A] border border-blue-200">
                      Disetujui · Sedang Dikerjakan
                    </span>
                  </template>
                  <template x-if="app.status === 'REJECTED'">
                    <span class="px-3.5 py-1 rounded-full text-xs font-bold bg-gray-100 text-gray-500 border border-gray-200">
                      ✕ Belum Terpilih / Kuota Penuh
                    </span>
                  </template>
                  <template x-if="app.status === 'COMPLETED'">
                    <span class="px-3.5 py-1 rounded-full text-xs font-bold bg-purple-50 text-purple-700 border border-purple-200">
                      ★ Selesai &amp; Mendapat Endorsement
                    </span>
                  </template>
                </div>
              </div>

              <!-- Pesan Pitching & Lampiran Portofolio -->
              <div class="p-4 rounded-xl bg-gray-50/70 border border-gray-100 space-y-2 text-xs">
                <span class="font-bold text-gray-500 block uppercase tracking-wider text-[11px]">Pesan Pitching Anda:</span>
                <p class="text-gray-800 leading-relaxed italic" x-text="'&ldquo;' + app.message + '&rdquo;'"></p>

                <template x-if="app.portfolioItems && app.portfolioItems.length > 0">
                  <div class="pt-2 border-t border-gray-200/60 mt-2">
                    <span class="font-bold text-gray-500 block text-[11px] mb-1">Bukti Portofolio Dilampirkan:</span>
                    <div class="flex flex-wrap gap-2">
                      <template x-for="p in app.portfolioItems" :key="p.title">
                        <a :href="p.linkUrl || '#'" target="_blank" class="inline-flex items-center gap-1.5 px-3 py-1 bg-white border border-gray-200 rounded-lg text-xs font-medium text-[#1E3A8A] hover:underline">
                          <span x-text="p.title"></span>
                          <span class="text-[10px] text-gray-400" x-text="'(' + p.stack + ')'"></span>
                        </a>
                      </template>
                    </div>
                  </div>
                </template>
              </div>

              <!-- Endorsement dari Owner jika ada -->
              <template x-if="app.endorsement">

                  <option value="Backend">Backend API</option>
                  <option value="UI/UX & Web">UI/UX &amp; Web Design</option>
                  <option value="QA / Testing">QA &amp; Automated Testing</option>
                  <option value="Data Science">Data Science &amp; AI</option>
                  <option value="Keamanan Siber">Keamanan Siber</option>
                </select>
              </div>

              <div>
                <label class="block font-semibold text-gray-800 mb-1">Rentang Budget (Transparan) <span class="text-red-500">*</span></label>
                <select x-model="editGigForm.budgetRange" class="w-full px-3.5 py-2 rounded-xl border border-gray-300 text-sm bg-white focus:outline-none focus:border-[#1E3A8A]">
                  <template x-for="b in GIGS_BUDGET_RANGES" :key="b">
                    <option :value="b" x-text="b"></option>
                  </template>
                </select>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block font-semibold text-gray-800 mb-1">Kuota Anggota Tim</label>
                <select x-model.number="editGigForm.quota" class="w-full px-3.5 py-2 rounded-xl border border-gray-300 text-sm bg-white focus:outline-none focus:border-[#1E3A8A]">
                  <option value="1">1 Orang</option>
                  <option value="2">2 Orang</option>
                  <option value="3">3 Orang</option>
                  <option value="5">5 Orang (Tim Lengkap)</option>
                </select>
              </div>

              <div>
                <label class="block font-semibold text-gray-800 mb-1">Target Tenggat Waktu <span class="text-red-500">*</span></label>
                <input type="date" x-model="editGigForm.deadline" required class="w-full px-3.5 py-2 rounded-xl border border-gray-300 text-sm focus:outline-none focus:border-[#1E3A8A]">
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block font-semibold text-gray-800 mb-1">Peran Spesifik yang Dicari</label>
                <input type="text" x-model="editGigForm.rolesNeeded" class="w-full px-3.5 py-2 rounded-xl border border-gray-300 text-sm focus:outline-none focus:border-[#1E3A8A]">
              </div>

              <div>
                <label class="block font-semibold text-gray-800 mb-1">Tech Stack Tags</label>
                <input type="text" x-model="editGigForm.techStack" class="w-full px-3.5 py-2 rounded-xl border border-gray-300 text-sm focus:outline-none focus:border-[#1E3A8A]">
              </div>
            </div>

            <div>
              <label class="block font-semibold text-gray-800 mb-1">Deskripsi &amp; Deliverables Proyek <span class="text-red-500">*</span></label>
              <textarea rows="4" x-model="editGigForm.description" required class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm focus:outline-none focus:border-[#1E3A8A] leading-relaxed"></textarea>
            </div>

            <div class="pt-3 border-t border-gray-200 flex items-center justify-end gap-2.5">
              <button type="button" @click="editGigModalOpen = false" class="px-5 py-2 rounded-full border border-gray-300 text-gray-700 font-semibold text-xs hover:bg-gray-50">Batal</button>
              <button type="submit" class="px-6 py-2 rounded-full bg-[#1E3A8A] hover:bg-[#1D4ED8] text-white font-bold text-xs shadow-sm">Simpan Perubahan</button>
            </div>
          </form>
        </div>
      </div>
    </template>
  </div>
</main>

<script>
  function bengkodGigsExchange() {
    const budgetList = (typeof GIGS_BUDGET_RANGES !== "undefined" && Array.isArray(GIGS_BUDGET_RANGES))
      ? GIGS_BUDGET_RANGES
      : [
          "< Rp 1.000.000",
          "Rp 1.000.000 - Rp 3.000.000",
          "Rp 3.000.000 - Rp 5.000.000",
          "> Rp 5.000.000",
          "Bagi Hasil / Equity",
        ];

    return {
      currentUserId: "aisha-dwi-rahmawati",
      currentUserName: "Aisha Dwi Rahmawati",
      currentUserAvatar: typeof DEFAULT_AVATAR !== "undefined" ? DEFAULT_AVATAR : "",
      currentUserRole: "Alumni 2024 · Lab Bengkel Koding",

      activeTab: "board",
      searchQuery: "",
      filterBudget: "",
      filterStatus: "Terbuka",
      selectedCategoryTag: "",
      toast: "",

      GIGS_BUDGET_RANGES: budgetList,

      gigs: (typeof loadGigs === "function" ? loadGigs() : (window.INITIAL_GIGS || [])),
      myApplications: (typeof loadMyApplications === "function" ? loadMyApplications() : []),

      // Drawer state
      drawerOpen: false,
      activeGigReview: null,

      // Quick apply modal
      quickApplyModalOpen: false,
      targetApplyGig: null,
      applyPitchMessage: "",
      applyPortfolioUrl: "https://github.com/aishaadr",
      applyContactPhone: "081234567890",

      // Endorsement modal
      endorseModalOpen: false,
      targetEndorseGig: null,
      endorsementText: "",
      autoPublishFeed: true,

      // Create gig modal
      createGigModalOpen: false,
      newGigForm: {
        title: "",
        category: "Mobile App",
        budgetRange: budgetList[1],
        quota: 1,
        deadline: new Date(Date.now() + 25 * 86400000).toISOString().slice(0, 10),
        rolesNeeded: "Flutter, REST API",
        techStack: "Flutter, Laravel, PostgreSQL",
        description: "",
      },

      // Edit gig modal
      editGigModalOpen: false,
      editingGigId: null,
      editGigForm: {
        title: "",
        category: "Mobile App",
        budgetRange: budgetList[1],
        quota: 1,
        deadline: "",
        rolesNeeded: "",
        techStack: "",
        description: "",
      },

      init() {
        this.muat();
        window.addEventListener("bengkod_gigs_updated", () => this.muat());
        window.addEventListener("bengkod_gigs_apply_updated", () => this.muat());
      },

      muat() {
        const loaded = typeof loadGigs === "function" ? loadGigs() : (window.INITIAL_GIGS || []);
        this.gigs = Array.isArray(loaded) && loaded.length > 0 ? loaded : (window.INITIAL_GIGS || []);
        this.myApplications = typeof loadMyApplications === "function" ? loadMyApplications() : [];
      },

      get openGigsCount() {
        return this.gigs.filter((g) => g.status === "Terbuka").length;
      },

      get inProgressCount() {
        return this.gigs.filter((g) => g.status === "Sedang Dikerjakan").length;
      },

      get completedCount() {
        return this.gigs.filter((g) => g.status === "Selesai").length;
      },

      get myGigs() {
        return this.gigs.filter((g) => g.ownerId === this.currentUserId);
      },

      get availablePortfolioProjects() {
        return typeof INITIAL_PROJECTS !== "undefined" ? INITIAL_PROJECTS : [
          { id: 1, title: "UMKM Success Probability Prediction", desc: "Machine Learning model ensemble regresi", tags: ["Python", "PostgreSQL"] },
          { id: 2, title: "Automatic Proofreading Academic Documents", desc: "NLP Hybrid Transformer", tags: ["NLP", "PyTorch"] }
        ];
      },

      get filteredBoardGigs() {
        const q = this.searchQuery.trim().toLowerCase();
        return this.gigs.filter((g) => {
          if (this.filterBudget && g.budgetRange !== this.filterBudget) return false;
          if (this.filterStatus && this.filterStatus !== "" && this.filterStatus !== "Semua") {
            const gs = (g.status || "").toLowerCase();
            const fs = this.filterStatus.toLowerCase();
            if (fs === "terbuka" || fs === "open") {
              if (gs !== "terbuka" && gs !== "open") return false;
            } else if (fs.includes("dikerjakan") || fs.includes("progress")) {
              if (!gs.includes("dikerjakan") && !gs.includes("progress")) return false;
            } else if (fs.includes("selesai") || fs.includes("complete")) {
              if (!gs.includes("selesai") && !gs.includes("complete")) return false;
            } else if (gs !== fs) {
              return false;
            }
          }
          if (this.selectedCategoryTag && !g.category.toLowerCase().includes(this.selectedCategoryTag.toLowerCase())) return false;
          if (q) {
            const haystack = [g.title, g.description, (g.techStack || []).join(" "), (g.rolesNeeded || []).join(" "), g.ownerName].join(" ").toLowerCase();
            if (!haystack.includes(q)) return false;
          }
          return true;
        });
      },

      hasAppliedTo(gigId) {
        return this.myApplications.some((a) => a.gigId === gigId);
      },

      openCreateGigModal() {
        this.newGigForm = {
          title: "",
          category: "Mobile App",
          budgetRange: budgetList[1],
          quota: 1,
          deadline: new Date(Date.now() + 25 * 86400000).toISOString().slice(0, 10),
          rolesNeeded: "",
          techStack: "",
          description: "",
        };
        this.createGigModalOpen = true;
      },

      submitCreateGig() {
        if (!this.newGigForm.title.trim() || !this.newGigForm.description.trim()) return;
        const newGig = {
          id: "gig-" + Date.now(),
          title: this.newGigForm.title.trim(),
          ownerId: this.currentUserId,
          ownerName: this.currentUserName,
          ownerAvatar: this.currentUserAvatar,
          ownerRole: this.currentUserRole,
          ownerPhone: "081234567890",
          category: this.newGigForm.category,
          rolesNeeded: this.newGigForm.rolesNeeded.split(",").map((s) => s.trim()).filter(Boolean),
          techStack: this.newGigForm.techStack.split(",").map((s) => s.trim()).filter(Boolean),
          budgetRange: this.newGigForm.budgetRange,
          deadline: this.newGigForm.deadline,
          quota: Number(this.newGigForm.quota) || 1,
          status: "Terbuka",
          postedDate: new Date().toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" }),
          description: this.newGigForm.description.trim(),
          assignedContributor: null,
          endorsement: "",
          completedDate: null,
          applicants: [],
        };
        const updated = [newGig, ...this.gigs];
        saveGigs(updated);
        this.gigs = updated;
        this.createGigModalOpen = false;
        this.setToast("Tender proyek berhasil diterbitkan ke Papan Gigs!");
      },

      openApplicantsDrawer(gig) {
        this.activeGigReview = gig;
        this.drawerOpen = true;
      },

      assignContributor(gigId, applicant) {
        const updated = this.gigs.map((g) => {
          if (g.id === gigId) {
            return {
              ...g,
              status: "Sedang Dikerjakan",
              assignedContributor: {
                id: applicant.applicantId,
                name: applicant.applicantName,
                avatar: applicant.applicantAvatar,
                batch: applicant.applicantBatch,
                phone: applicant.applicantPhone,
                assignedDate: new Date().toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" })
              },
              applicants: (g.applicants || []).map((app) =>
                app.id === applicant.id ? { ...app, status: "ACCEPTED" } : app
              )
            };
          }
          return g;
        });

        saveGigs(updated);
        this.gigs = updated;
        this.activeGigReview = updated.find((g) => g.id === gigId);

        // Buka link WhatsApp otomatis di tab baru
        const waLink = formatWaUrl(
          applicant.applicantPhone,
          `Halo ${applicant.applicantName}, saya ${this.activeGigReview.ownerName} dari Bengkel Koding. Pengajuan minatmu untuk gig "${this.activeGigReview.title}" sudah saya setujui. Mari kita koordinasi teknis pengerjaannya.`
        );
        window.open(waLink, "_blank");

        this.setToast(`Rekan ${applicant.applicantName} berhasil ditugaskan! WhatsApp koordinasi telah dibuka.`);
      },

      openQuickApplyModal(gig) {
        this.targetApplyGig = gig;
        this.applyPitchMessage = "";
        this.applyPortfolioUrl = "https://github.com/aishaadr";
        this.applyContactPhone = "081234567890";
        this.quickApplyModalOpen = true;
      },

      submitQuickApply() {
        if (!this.targetApplyGig || !this.applyPitchMessage.trim()) return;
        if (this.applyPitchMessage.length > 250) {
          alert("Pesan pitching maksimal 250 karakter.");
          return;
        }

        const pickedProjects = this.applyPortfolioUrl.trim()
          ? [{
              title: "Tautan Portofolio / GitHub",
              linkUrl: this.applyPortfolioUrl.trim(),
              stack: "Karya Terlampir"
            }]
          : [];

        const newApplicant = {
          id: "app-" + Date.now(),
          applicantId: this.currentUserId,
          applicantName: this.currentUserName,
          applicantAvatar: this.currentUserAvatar,
          applicantBatch: "2024",
          applicantPhone: this.applyContactPhone,
          skills: ["Data Science", "Python", "Machine Learning", "FastAPI"],
          pitchMessage: this.applyPitchMessage.trim(),
          portfolioItems: pickedProjects,
          appliedDate: new Date().toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" }),
          status: "PENDING"
        };

        // 1. Simpan ke daftar applicants pada Gig yang bersangkutan
        const updatedGigs = this.gigs.map((g) => {
          if (g.id === this.targetApplyGig.id) {
            return {
              ...g,
              applicants: [newApplicant, ...(g.applicants || [])]
            };
          }
          return g;
        });
        saveGigs(updatedGigs);
        this.gigs = updatedGigs;

        // 2. Simpan ke Lamaran Saya
        const myAppEntry = {
          id: newApplicant.id,
          gigId: this.targetApplyGig.id,
          gigTitle: this.targetApplyGig.title,
          ownerName: this.targetApplyGig.ownerName,
          ownerPhone: this.targetApplyGig.ownerPhone,
          message: this.applyPitchMessage.trim(),
          portfolioItems: pickedProjects,
          appliedDate: newApplicant.appliedDate,
          budgetRange: this.targetApplyGig.budgetRange,
          status: "PENDING"
        };
        const nextApps = [myAppEntry, ...this.myApplications];
        saveMyApplications(nextApps);
        this.myApplications = nextApps;

        this.quickApplyModalOpen = false;
        this.setToast("Minat berhasil diajukan! Owner proyek akan segera meninjau pitching Anda.");
      },

      openEndorseModal(gig) {
        this.targetEndorseGig = gig;
        this.endorsementText = "Kerja sama luar biasa. Deliverables selesai tepat waktu dengan kualitas arsitektur kode yang solid.";
        this.autoPublishFeed = true;
        this.endorseModalOpen = true;
      },

      submitCompleteGig() {
        if (!this.targetEndorseGig || !this.endorsementText.trim()) return;

        const updated = this.gigs.map((g) => {
          if (g.id === this.targetEndorseGig.id) {
            return {
              ...g,
              status: "Selesai",
              endorsement: this.endorsementText.trim(),
              completedDate: new Date().toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" })
            };
          }
          return g;
        });

        saveGigs(updated);
        this.gigs = updated;

        // Jika auto publish dicentang, buat postingan baru di feed
        if (this.autoPublishFeed) {
          publishGigCompletionToFeed(this.targetEndorseGig, this.endorsementText.trim());
        }

        this.endorseModalOpen = false;
        this.setToast("Proyek resmi diselesaikan & rekomendasi/endorsement telah diterbitkan!");
      },

      // Fitur 3: Edit Proyek (Owner)
      openEditGigModal(gig) {
        this.editingGigId = gig.id;
        this.editGigForm = {
          title: gig.title,
          category: gig.category,
          budgetRange: gig.budgetRange,
          quota: gig.quota || 1,
          deadline: gig.deadline,
          rolesNeeded: (gig.rolesNeeded || []).join(", "),
          techStack: (gig.techStack || []).join(", "),
          description: gig.description,
        };
        this.editGigModalOpen = true;
      },

      submitEditGig() {
        if (!this.editingGigId || !this.editGigForm.title.trim()) return;
        const id = this.editingGigId;
        const f = this.editGigForm;
        this.gigs = this.gigs.map((g) => {
          if (g.id === id) {
            return {
              ...g,
              title: f.title.trim(),
              category: f.category,
              budgetRange: f.budgetRange,
              quota: Number(f.quota) || 1,
              deadline: f.deadline,
              rolesNeeded: f.rolesNeeded.split(",").map((s) => s.trim()).filter(Boolean),
              techStack: f.techStack.split(",").map((s) => s.trim()).filter(Boolean),
              description: f.description.trim(),
            };
          }
          return g;
        });
        saveGigs(this.gigs);
        this.editGigModalOpen = false;
        this.setToast("Rincian proyek berhasil diperbarui.");
      },

      // Fitur 3: Batalkan Proyek & Buka Kembali (Owner)
      cancelGig(gigId) {
        if (!confirm("Apakah Anda yakin ingin membatalkan proyek ini? Status akan dialihkan ke Batal (Cancelled).")) return;
        this.gigs = this.gigs.map((g) => (g.id === gigId ? { ...g, status: "Batal" } : g));
        saveGigs(this.gigs);
        this.setToast("Proyek telah dibatalkan.");
      },

      reopenGig(gigId) {
        this.gigs = this.gigs.map((g) => (g.id === gigId ? { ...g, status: "Terbuka" } : g));
        saveGigs(this.gigs);
        this.setToast("Proyek dibuka kembali di Papan Gigs.");
      },

      // Fitur 2: Tolak Pelamar di Applicants Drawer (Owner)
      rejectApplicant(gigId, applicantId) {
        this.gigs = this.gigs.map((g) => {
          if (g.id === gigId) {
            return {
              ...g,
              applicants: (g.applicants || []).map((a) => (a.id === applicantId ? { ...a, status: "REJECTED" } : a)),
            };
          }
          return g;
        });
        saveGigs(this.gigs);

        if (this.activeGigReview && this.activeGigReview.id === gigId) {
          this.activeGigReview = this.gigs.find((g) => g.id === gigId);
        }

        // Sinkronkan ke daftar lamaran kontributor jika ada
        this.myApplications = this.myApplications.map((app) => {
          if (app.gigId === gigId && app.id === applicantId) {
            return { ...app, status: "REJECTED" };
          }
          return app;
        });
        saveMyApplications(this.myApplications);

        this.setToast("Pelamar telah ditandai belum sesuai / kuota penuh.");
      },

      // Fitur 4: Tarik Lamaran (Contributor)
      withdrawApplication(appId, gigId) {
        if (!confirm("Tarik kembali pengajuan minat Anda untuk proyek ini?")) return;
        this.myApplications = this.myApplications.filter((a) => a.id !== appId);
        saveMyApplications(this.myApplications);

        // Hapus juga pelamar ini dari data applicants pada gig bersangkutan
        this.gigs = this.gigs.map((g) => {
          if (g.id === gigId) {
            return {
              ...g,
              applicants: (g.applicants || []).filter((a) => a.id !== appId && a.applicantId !== this.currentUserId),
              applicantsCount: Math.max(0, (g.applicantsCount || 1) - 1),
            };
          }
          return g;
        });
        saveGigs(this.gigs);

        this.setToast("Pengajuan minat berhasil ditarik.");
      },

      setToast(msg) {
        this.toast = msg;
        setTimeout(() => {
          if (this.toast === msg) this.toast = "";
        }, 3500);
      }
    };
  }

  window.bengkodGigsExchange = bengkodGigsExchange;
  document.addEventListener("alpine:init", () => {
    Alpine.data("bengkodGigsExchange", bengkodGigsExchange);
  });
</script>
</body>
</html>
