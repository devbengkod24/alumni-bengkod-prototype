<!DOCTYPE html>
<html lang="id" data-color-mode="light" class="h-full bg-[#EFF2F7]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gigs & Proyek | Portal Alumni Bengkel Koding UDINUS</title>
  <meta name="description" content="Papan kolaborasi side-project, tender freelance, dan rekrutmen tim internal antar-alumni Bengkel Koding.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/alumni-data.js"></script>
  <script src="assets/js/alumni-catalog.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            canvas: '#EFF2F7',
            card: '#FFFFFF',
            filter: '#F4F5F7',
            borderline: '#E3E4E9',
            primary: {
              DEFAULT: '#3A5988',
              hover: '#496DA8',
              pressed: '#2F4B76',
            },
            accent: '#326ECE',
            headline: '#0C1117',
            bodytext: '#212224',
            mutedtext: '#6B7280',
            placeholder: '#91969C',
            chip: {
              bg: '#E2F1F9',
              text: '#3A5A86',
            },
            status: {
              successBg: '#E9F7F8',
              successText: '#2B7A5B',
              processBg: '#FDF0DD',
              processText: '#B26A12',
              neutralBg: '#E4EBF3',
              neutralText: '#4B5563',
              dangerBg: '#FAD9E9',
              dangerText: '#B4325F',
            }
          }
        }
      }
    }
  </script>
  <style>
    [x-cloak]:not(body) { display: none !important; }
    body { font-family: "Inter", sans-serif; display: block !important; }
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
  </style>
<script>
    function bengkodGigsApp() {
      const budgetRanges = [
        "< Rp 1.000.000",
        "Rp 1.000.000 - Rp 3.000.000",
        "Rp 3.000.000 - Rp 5.000.000",
        "> Rp 5.000.000",
        "Bagi Hasil / Equity"
      ];

      const profile = alumniProfileForBoard();
      return {
        currentUserId: profile.id,
        currentUserName: profile.name,
        currentUserRole: "Lab Bengkel Koding",

        GIGS_BUDGET_RANGES: budgetRanges,
        gigs: loadBoardGigs(),
        savedGigIds: ["demo-gig-1"],
        get myApplications() {
          return this.gigs.flatMap(gig => (gig.applicants || [])
            .filter(app => app.applicantId === profile.id)
            .map(app => ({
              ...app,
              gigId: gig.id,
              gigTitle: gig.title,
              ownerName: gig.ownerName
            })))
            .sort((a, b) => boardDate(b.appliedDate) - boardDate(a.appliedDate));
        },

        // Views & Modal states
        detailModalOpen: false,
        descExpanded: false,
        selectedGig: null,
        activeTab: "board",
        searchQuery: "",
        selectedCategoryTag: "",
        filterBudget: "",
        selectedAppIds: [],
        toast: "",
        toastTimer: null,

        // Modal states
        quickApplyModalOpen: false,
        targetApplyGig: null,
        applyContactPhone: profile.phone || "",
        applyContactEmail: profile.email || "",
        applyError: "",
        applyPitchMessage: "",
        applyPortfolioUrl: "",

        editGigModalOpen: false,
        editingGigId: null,
        editGigForm: {},

        categoryOptions: [
          { value: "", label: "Semua Kategori" },
          { value: "Mobile App", label: "Mobile App" },
          { value: "Frontend Development", label: "Frontend Development" },
          { value: "Backend API", label: "Backend API" },
          { value: "UI/UX & Web Design", label: "UI/UX & Web Design" },
          { value: "Data Science & AI", label: "Data Science & AI" },
          { value: "QA & Testing", label: "QA & Testing" },
        ],

        gigFromUrl() {
          const params = new URLSearchParams(window.location.search);
          const id = params.get('gig');
          if (id) return this.gigs.find(gig => gig.id === id);
          const legacyId = params.get('id');
          return this.gigs.find(gig => gig.id === 'demo-' + legacyId)
            || this.gigs.find(gig => gig.id === legacyId);
        },

        init() {
          const params = new URLSearchParams(window.location.search);
          if (params.get('tab') === 'my_gigs') this.activeTab = 'my_gigs';
          try {
            const flash = sessionStorage.getItem('bengkod_toast');
            if (flash) {
              sessionStorage.removeItem('bengkod_toast');
              this.setToast(flash);
            }
          } catch {}
          const openLinkedGig = () => {
            const gig = this.gigFromUrl();
            this.selectedGig = gig || null;
            this.detailModalOpen = Boolean(gig);
          };
          openLinkedGig();
          window.addEventListener('popstate', openLinkedGig);
          window.addEventListener('pageshow', event => {
            if (event.persisted) this.gigs = loadBoardGigs();
          });
          window.addEventListener('storage', event => {
            if (event.key === GIGS_STORAGE_KEY || event.key === null) this.gigs = loadBoardGigs();
          });
        },

        get myGigs() {
          return this.gigs.filter(g => this.isOwnGig(g));
        },

        get displayedGigs() {
          const q = this.searchQuery.trim().toLowerCase();
          return this.gigs.filter(g => {
            if (this.activeTab === 'board' && this.isOwnGig(g)) return false;
            if (this.activeTab === 'saved' && !this.savedGigIds.includes(g.id)) return false;
            if (this.filterBudget && g.budgetRange !== this.filterBudget) return false;
            if (this.selectedCategoryTag && g.category !== this.selectedCategoryTag) return false;
            if (q) {
              const text = [g.title, g.category, g.ownerName, (g.techStack || []).join(" "), (g.rolesNeeded || []).join(" ")].join(" ").toLowerCase();
              if (!text.includes(q)) return false;
            }
            return true;
          });
        },

        get hasFilter() {
          return Boolean(this.searchQuery.trim() || this.filterBudget || this.selectedCategoryTag);
        },

        countGigsCategory(catValue) {
          if (!catValue) return this.gigs.length;
          return this.gigs.filter(g => g.category === catValue).length;
        },

        viewDetail(gig) {
          window.location.href = 'detail-gigs.html?proyek=' + encodeURIComponent(gig.id);
        },

        closeDetailModal() {
          this.detailModalOpen = false;
          history.pushState({}, '', window.location.pathname);
        },

        backToList() {
          this.closeDetailModal();
        },

        salinTautan() {
          const url = new URL(boardGigLink(this.selectedGig), window.location.href).href;
          navigator.clipboard.writeText(url);
          this.setToast('Tautan proyek disalin');
        },

        isOwnGig(gig) {
          return ownsBoardGig(gig, profile);
        },

        applicantStatus: gigApplicantStatus,

        isSaved(gigId) {
          return this.savedGigIds.includes(gigId);
        },

        hasAppliedTo(id) {
          return this.myApplications.some(a => a.gigId === id);
        },

        resetFilter() {
          this.searchQuery = "";
          this.filterBudget = "";
          this.selectedCategoryTag = "";
        },

        setCategoryFilter(catVal) {
          this.selectedCategoryTag = this.selectedCategoryTag === catVal ? "" : catVal;
        },

        setBudgetFilter(rangeVal) {
          this.filterBudget = this.filterBudget === rangeVal ? "" : rangeVal;
        },

        handleToggleBookmark(gigId) {
          if (this.savedGigIds.includes(gigId)) {
            this.savedGigIds = this.savedGigIds.filter(id => id !== gigId);
            this.setToast("Proyek dihapus dari simpanan.");
          } else {
            this.savedGigIds.push(gigId);
            this.setToast("Proyek disimpan.");
          }
        },

        ownerProfileHref(gig) {
          return "direktori.html?q=" + encodeURIComponent(gig.ownerName);
        },

        statusPillClass(status) {
          if (status === 'Terbuka') return 'bg-[#FEECEF] text-[#A95F77] border border-[#FAD2DF]/60';
          if (status === 'Sedang Dikerjakan') return 'bg-[#FEF3C7] text-[#B45309]';
          if (status === 'Selesai') return 'bg-[#E4EBF3] text-[#4B5563]';
          if (status === 'Batal') return 'bg-[#FAD9E9] text-[#B4325F]';
          return 'bg-[#E4EBF3] text-[#4B5563]';
        },

        getInitials(name) {
          if (!name) return "BK";
          return name.split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();
        },

        formatDate(dateStr) {
          if (!dateStr) return "";
          const d = new Date(boardDate(dateStr) || dateStr);
          return d.toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
        },

        openQuickApplyModal(gig) {
          this.targetApplyGig = gig;
          this.applyPitchMessage = "";
          this.applyPortfolioUrl = "";
          this.applyError = "";
          this.quickApplyModalOpen = true;
        },

        submitQuickApply() {
          const target = loadBoardGigs().find(gig => gig.id === this.targetApplyGig?.id);
          if (!target || this.isOwnGig(target) || ["Selesai", "Batal"].includes(target.status)) {
            this.applyError = "Proyek ini tidak tersedia untuk Anda lamar.";
            return;
          }

          const applicants = target.applicants || [];
          if (applicants.some(app => app.applicantId === profile.id)) {
            this.applyError = "Anda sudah mengajukan lamaran untuk proyek ini.";
            return;
          }

          const email = this.applyContactEmail.trim();
          const phone = this.applyContactPhone.trim();
          const pitch = this.applyPitchMessage.trim();
          const portfolio = this.applyPortfolioUrl.trim();
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || !phone || !pitch) {
            this.applyError = "Isi email, nomor kontak, dan pesan pengajuan.";
            return;
          }
          if (portfolio && !/^https?:\/\//i.test(portfolio)) {
            this.applyError = "Gunakan tautan portofolio yang diawali http:// atau https://.";
            return;
          }

          const appliedAt = new Date();
          const applicant = {
            id: "app-" + appliedAt.getTime() + "-" + profile.id,
            applicantId: profile.id,
            applicantName: profile.name,
            applicantAvatar: profile.avatar,
            applicantBatch: profile.batch,
            applicantEmail: email,
            applicantPhone: phone,
            pitchMessage: pitch,
            portfolioUrl: portfolio,
            appliedDate: appliedAt.toISOString(),
            status: "PENDING"
          };
          if (!saveBoardGig(target, { applicants: [...applicants, applicant] })) {
            this.applyError = "Lamaran gagal disimpan. Coba lagi.";
            return;
          }

          this.gigs = loadBoardGigs();
          this.quickApplyModalOpen = false;
          this.setToast("Lamaran proyek berhasil dikirim!");
        },

        handleWithdrawApp(gigId) {
          const target = loadBoardGigs().find(gig => gig.id === gigId);
          const applicants = target?.applicants || [];
          const application = applicants.find(app => app.applicantId === profile.id);
          if (!application || gigApplicantStatus(application) !== "pending") return;
          if (!confirm("Tarik kembali lamaran untuk proyek ini?")) return;
          if (!saveBoardGig(target, { applicants: applicants.filter(app => app.id !== application.id) })) {
            this.setToast("Lamaran gagal ditarik. Coba lagi.");
            return;
          }

          this.gigs = loadBoardGigs();
          this.setToast("Lamaran berhasil ditarik.");
        },

        openEditGigModal(gig) {
          this.editingGigId = gig.id;
          this.editGigForm = {
            title: gig.title,
            category: gig.category,
            budgetRange: gig.budgetRange,
            quota: gig.quota,
            status: gig.status,
            deadline: gig.deadline,
            rolesNeeded: (gig.rolesNeeded || []).join(", "),
            techStack: (gig.techStack || []).join(", "),
            description: gig.description,
          };
          this.editGigModalOpen = true;
        },

        submitEditGig() {
          const target = loadBoardGigs().find(g => g.id === this.editingGigId);
          if (!this.isOwnGig(target)) return;
          const form = this.editGigForm;
          const updated = {
            ...target,
            title: form.title,
            category: form.category,
            budgetRange: form.budgetRange,
            quota: parseInt(form.quota, 10) || 1,
            status: form.status,
            deadline: form.deadline,
            rolesNeeded: form.rolesNeeded.split(",").map(r => r.trim()).filter(Boolean),
            techStack: form.techStack.split(",").map(t => t.trim()).filter(Boolean),
            description: form.description
          };
          if (!saveBoardGig(updated)) {
            this.setToast("Perubahan proyek gagal disimpan.");
            return;
          }
          this.gigs = loadBoardGigs();
          this.editGigModalOpen = false;
          this.setToast("Perubahan proyek tersimpan.");
        },

        handleDeleteGig(gigId) {
          if (!confirm("Yakin ingin menghapus postingan proyek ini?")) return;
          const gig = this.gigs.find(item => item.id === gigId);
          if (!gig) return;
          if (!saveBoardGig(gig, { boardDeleted: true })) return;
          this.gigs = this.gigs.filter(g => g.id !== gigId);
          if (this.selectedGig && this.selectedGig.id === gigId) {
            this.closeDetailModal();
          }
          this.setToast("Proyek telah dihapus.");
        },

        setToast(msg) {
          this.toast = msg;
          clearTimeout(this.toastTimer);
          this.toastTimer = setTimeout(() => { this.toast = ""; }, 3200);
        }
      }
    }

    document.addEventListener('alpine:init', () => {
      if (window.Alpine) {
        window.Alpine.data('bengkodGigsApp', bengkodGigsApp);
      }
    });
  </script>
  <script src="assets/js/portal-layout.js"></script>
</head>
<body class="h-full bg-[#EFF2F7] text-[#212224] antialiased selection:bg-[#3A5988] selection:text-white" x-data="bengkodGigsApp()">

  <!-- TOAST NOTIFICATION -->
  <template x-if="toast">
    <div class="fixed bottom-6 right-6 z-[120] bg-[#0C1117] text-white px-5 py-3 rounded-[8px] shadow-sm flex items-center gap-3 text-[14px] border border-[#E3E4E9]/20" role="status">
      <span class="w-2 h-2 rounded-full bg-emerald-400 shrink-0"></span>
      <span class="font-normal" x-text="toast"></span>
      <button type="button" @click="toast = ''" class="text-[#91969C] hover:text-white ml-2 text-xs">✕</button>
    </div>
  </template>

      <main class="flex-1 p-4 sm:p-6 lg:p-6 w-full space-y-6">

        <!-- HEADER HALAMAN + TAB SEGMENTED + CTA LEMPAR PROYEK -->
        <div class="space-y-4">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 class="text-[26px] font-semibold text-[#0C1117] tracking-[-0.01em]">Gigs & Proyek</h1>
              <p class="text-[13px] text-[#6B7280] mt-1 font-normal">
                Papan kolaborasi side-project, tender freelance, dan rekrutmen tim internal antar-alumni Bengkel Koding.
              </p>
            </div>
            <a href="lempar-proyek.html"
              class="inline-flex items-center justify-center gap-2 h-10 px-5 rounded-[8px] text-[14px] font-medium text-white bg-[#3A5988] hover:bg-[#496DA8] active:bg-[#2F4B76] transition-colors cursor-pointer self-start sm:self-auto shadow-sm">
              <span class="text-base leading-none font-medium">+</span>
              <span>Lempar Proyek</span>
            </a>
          </div>

          <!-- Tab Segmented -->
          <div class="bg-[#F4F5F7] p-1 rounded-[10px] inline-flex items-center gap-1 text-[13.5px]">
            <button type="button" @click="activeTab = 'board'" class="px-4 py-2 rounded-[8px] font-medium transition-colors" :class="activeTab === 'board' ? 'bg-white text-[#0C1117] shadow-sm font-semibold' : 'text-[#6B7280] hover:text-[#0C1117]'">
              Jelajahi Proyek
            </button>
            <button type="button" @click="activeTab = 'my_gigs'" class="px-4 py-2 rounded-[8px] font-medium transition-colors" :class="activeTab === 'my_gigs' ? 'bg-white text-[#0C1117] shadow-sm font-semibold' : 'text-[#6B7280] hover:text-[#0C1117]'">
              Proyek Dibuat (<span x-text="myGigs.length"></span>)
            </button>
            <button type="button" @click="activeTab = 'applications'" class="px-4 py-2 rounded-[8px] font-medium transition-colors" :class="activeTab === 'applications' ? 'bg-white text-[#0C1117] shadow-sm font-semibold' : 'text-[#6B7280] hover:text-[#0C1117]'">
              Lamaran Terkirim (<span x-text="myApplications.length"></span>)
            </button>
            <button type="button" @click="activeTab = 'saved'" class="px-4 py-2 rounded-[8px] font-medium transition-colors" :class="activeTab === 'saved' ? 'bg-white text-[#0C1117] shadow-sm font-semibold' : 'text-[#6B7280] hover:text-[#0C1117]'">
              Tersimpan (<span x-text="savedGigIds.length"></span>)
            </button>
          </div>
        </div>

        <!-- ======================================================
             A. TAB JELAJAHI & TERSIMPAN: DUA KOLOM (FILTER KIRI + DAFTAR KANAN)
        ====================================================== -->
        <div x-show="activeTab === 'board' || activeTab === 'saved'" class="space-y-6">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            <!-- PANEL FILTER KIRI (280px / 3.5 cols di desktop) -->
            <aside class="lg:col-span-4 xl:col-span-3 bg-[#F4F5F7] border border-[#E3E4E9] rounded-[12px] p-5 space-y-6 lg:sticky lg:top-6">
              <div class="flex items-center justify-between pb-3 border-b border-[#E3E4E9]">
                <h2 class="text-[14px] font-medium text-[#0C1117]">Cari Proyek</h2>
                <template x-if="hasFilter">
                  <button type="button" @click="resetFilter()" class="text-[12px] text-[#326ECE] hover:underline cursor-pointer">Reset Filter</button>
                </template>
              </div>

              <!-- Grup Filter 1: Kategori Proyek -->
              <div class="space-y-2">
                <label class="text-[13px] font-medium text-[#0C1117] block">Kategori Keahlian</label>
                <div class="space-y-1">
                  <template x-for="cat in categoryOptions" :key="cat.value">
                    <button type="button"
                            @click="setCategoryFilter(cat.value)"
                            class="w-full flex items-center justify-between px-3 py-2 rounded-[8px] text-[13px] transition-colors text-left cursor-pointer"
                            :class="selectedCategoryTag === cat.value ? 'bg-[#3A5988] text-white font-medium' : 'text-[#212224] hover:bg-white'">
                      <span x-text="cat.label"></span>
                      <span class="text-[11.5px] px-1.5 py-0.5 rounded"
                            :class="selectedCategoryTag === cat.value ? 'bg-white/20 text-white' : 'text-[#6B7280] bg-[#E4EBF3]'"
                            x-text="countGigsCategory(cat.value)"></span>
                    </button>
                  </template>
                </div>
              </div>

              <!-- Grup Filter 2: Rentang Budget (Tanpa Icon Centang) -->
              <div class="space-y-2 pt-3">
                <label class="text-[13px] font-medium text-[#0C1117] block">Rentang Budget</label>
                <div class="space-y-1">
                  <template x-for="b in GIGS_BUDGET_RANGES" :key="b">
                    <button type="button"
                            @click="setBudgetFilter(b)"
                            class="w-full flex items-center justify-between px-3 py-2 rounded-[8px] text-[13px] transition-colors text-left cursor-pointer"
                            :class="filterBudget === b ? 'bg-[#3A5988] text-white font-medium' : 'text-[#212224] hover:bg-white'">
                      <span x-text="b"></span>
                    </button>
                  </template>
                </div>
              </div>

              <template x-if="hasFilter">
                <button type="button" @click="resetFilter()" class="w-full h-9 rounded-[8px] border border-[#E3E4E9] bg-white hover:bg-[#EFF2F7] text-[#212224] text-[13px] font-medium transition-colors cursor-pointer">
                  Reset Semua Filter
                </button>
              </template>
            </aside>

            <!-- DAFTAR KARTU KANAN (col-span-8 atau 9) - Tinggi Sejajar dengan Filter Kiri -->
            <div class="lg:col-span-8 xl:col-span-9 flex flex-col gap-4">
              <!-- Toolbar Pencarian (Sebelum Kartu Proyek) -->
              <div class="bg-white border border-[#E3E4E9] rounded-[12px] p-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-xs">
                <div class="relative flex-1">
                  <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-[#6B7280]">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                  </span>
                  <input type="text"
                         x-model="searchQuery"
                         placeholder="Cari berdasarkan judul, nama pemilik, tech stack..."
                         class="w-full pl-10 pr-4 py-2 text-[14px] rounded-[8px] border border-[#E3E4E9] bg-[#F4F5F7] focus:bg-white focus:outline-none focus:border-[#3A5988] transition-colors">
                </div>
                <div class="text-[13px] text-[#6B7280] font-normal px-2 shrink-0">
                  <span x-text="displayedGigs.length + ' proyek ditemukan'"></span>
                </div>
              </div>

              <template x-for="(gig, gigIdx) in displayedGigs" :key="gig.id">
                  <div class="bg-white border border-[#E3E4E9] hover:border-[#3A5988]/50 rounded-[12px] p-5 shadow-[0_1px_3px_rgba(0,0,0,0.04)] hover:shadow-md transition-all space-y-4">
                    
                    <div class="flex items-start justify-between gap-4">
                      <div class="flex items-start gap-4 min-w-0">
                        <img :src="gig.image || (gig.id === 'gig-2' || gig.id === 'gig-4' || gig.id === 'gig-6' ? 'assets/project-city.jpg' : 'assets/project-fuji.webp')"
                             :alt="gig.title"
                             class="w-14 h-14 rounded-[10px] object-cover border border-[#E3E4E9] shadow-xs shrink-0">

                        <div class="space-y-1 min-w-0">
                          <h3 class="text-[16px] font-semibold text-[#0C1117] tracking-[-0.01em] hover:text-[#326ECE] cursor-pointer" @click="viewDetail(gig)" x-text="gig.title"></h3>
                          <p class="text-[13px] text-[#6B7280]">
                            <a :href="ownerProfileHref(gig)" class="text-[#326ECE] hover:underline font-medium" x-text="gig.ownerName"></a>
                            <span> · </span>
                            <span x-text="(gig.ownerRole || '').replace(/Alumni \d{4}\s*·?\s*/gi, '')"></span>
                          </p>
                        </div>
                      </div>

                      <div class="text-right shrink-0">
                        <div class="text-[16px] font-semibold text-[#0C1117]" x-text="gig.budgetRange"></div>

                    <span class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-[#F4F5F7] text-[#212224] text-[13px] font-medium border border-[#E3E4E9]">
                      <svg class="w-[15px] h-[15px] text-[#6B7280] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                      <span x-text="'Kuota: ' + selectedGig.quota + ' orang'"></span>
                    </span>

                    <span class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-[#F4F5F7] text-[#212224] text-[13px] font-medium border border-[#E3E4E9]">
                      <svg class="w-[15px] h-[15px] text-[#6B7280] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                      <span x-text="'Target Selesai: ' + formatDate(selectedGig.deadline)"></span>
                    </span>

                    <span class="px-3 py-1.5 rounded-[8px] text-[13px] font-medium"
                          :class="{
                            'bg-[#FEECEF] text-[#A95F77] border border-[#FAD2DF]/60': selectedGig.status === 'Terbuka',
                            'bg-[#FEF3C7] text-[#B45309]': selectedGig.status === 'Sedang Dikerjakan',
                            'bg-[#E4EBF3] text-[#4B5563]': selectedGig.status === 'Selesai',
                            'bg-[#FAD9E9] text-[#B4325F]': selectedGig.status === 'Batal'
                          }"
                          x-text="selectedGig.status"></span>


                  </div>

                  <!-- Deskripsi & Deliverables (Full-Width, Lega) -->
                  <div class="pt-2">
                    <h4 class="text-[17px] font-semibold text-[#0C1117] tracking-[-0.01em]">Deskripsi & Deliverables Proyek</h4>
                    <p class="mt-2.5 text-[15.5px] text-[#374151] leading-[1.75] font-normal" x-text="selectedGig.description"></p>
                  </div>

                  <!-- Peran yang Dibutuhkan (Bullet List) -->
                  <div>
                    <h4 class="text-[17px] font-semibold text-[#0C1117] tracking-[-0.01em]">Peran yang Dibutuhkan</h4>
                    <ul class="mt-2.5 space-y-2 text-[15px] text-[#374151]">
                      <template x-for="r in (selectedGig.rolesNeeded || [])" :key="r">
                        <li class="flex items-center gap-2.5 leading-relaxed font-normal">
                          <span class="w-1.5 h-1.5 rounded-full bg-[#4B5563] shrink-0"></span>
                          <span x-text="r"></span>
                        </li>
                      </template>
                    </ul>
                  </div>

                  <!-- Tech Stack yang Digunakan (Bullet List) -->
                  <div>
                    <h4 class="text-[17px] font-semibold text-[#0C1117] tracking-[-0.01em]">Tech Stack yang Digunakan</h4>
                    <ul class="mt-2.5 space-y-2 text-[15px] text-[#374151]">
                      <template x-for="t in (selectedGig.techStack || [])" :key="t">
                        <li class="flex items-center gap-2.5 leading-relaxed font-normal">
                          <span class="w-1.5 h-1.5 rounded-full bg-[#4B5563] shrink-0"></span>
                          <span x-text="t"></span>
                        </li>
                      </template>
                    </ul>
                  </div>

                  <!-- Pemilik Proyek (Cukup Tulis Nama, Tanpa Kotak, Tanpa Ikon Panah, Tanpa Garis) -->
                  <div class="pt-4">
                    <h4 class="text-[17px] font-semibold text-[#0C1117] tracking-[-0.01em]">Pemilik Proyek</h4>
                    <div class="mt-2.5 flex items-center gap-3">
                      <div class="w-10 h-10 rounded-full bg-[#E2F1F9] text-[#3A5A86] font-semibold text-[14px] flex items-center justify-center shrink-0" x-text="getInitials(selectedGig.ownerName)"></div>
                      <div>
                        <div class="text-[15px] font-medium text-[#0C1117]" x-text="selectedGig.ownerName"></div>
                        <div class="text-[13px] text-[#6B7280]" x-text="selectedGig.ownerRole"></div>
                      </div>
                    </div>
                  </div>

                </div>
              </template>
            </div>

            <!-- 3. Footer Bar Aksi Dialog (Lamar Proyek / Status) -->
            <footer class="sticky bottom-0 bg-white border-t border-[#E3E4E9] px-6 py-4 flex items-center justify-between rounded-b-[20px] z-10 shrink-0">
              <template x-if="selectedGig">
                <div class="flex items-center justify-between w-full gap-4">
                  
                  <!-- Kiri: Bookmark -->
                  <div class="flex items-center gap-2">
                    <button type="button"
                            @click="handleToggleBookmark(selectedGig.id)"
                            class="h-11 px-4 rounded-[8px] border border-[#E3E4E9] flex items-center gap-2 hover:bg-[#F4F5F7] transition-colors cursor-pointer text-[13.5px]"
                            :class="isSaved(selectedGig.id) ? 'text-[#3A5988] bg-[#F4F7FB] border-[#3A5988]' : 'text-[#212224] bg-white'">
                      <svg class="w-4 h-4" viewBox="0 0 24 24" :fill="isSaved(selectedGig.id) ? '#3A5988' : 'none'" stroke="currentColor" stroke-width="1.75"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                      <span x-text="isSaved(selectedGig.id) ? 'Tersimpan' : 'Simpan Proyek'"></span>
                    </button>
                  </div>

                  <!-- Kanan: Tombol Aksi Melamar / Status -->
                  <div class="flex items-center gap-3">
                    <button type="button"
                            @click="closeDetailModal()"
                            class="h-11 px-5 rounded-[8px] border border-[#E3E4E9] bg-white hover:bg-[#F4F5F7] text-[#212224] text-[14px] font-medium transition-colors cursor-pointer">
                      Tutup
                    </button>

                    <!-- Kondisi A: Proyek Milik Sendiri -->
                    <template x-if="isOwnGig(selectedGig)">
                      <button type="button"
                              @click="closeDetailModal(); openEditGigModal(selectedGig)"
                              class="h-11 px-5 rounded-[8px] bg-[#3A5988] hover:bg-[#496DA8] text-white text-[14px] font-medium transition-colors">
                        Edit Informasi Proyek
                      </button>
                    </template>

                    <!-- Kondisi B: Sudah Pernah Melamar -->
                    <template x-if="!isOwnGig(selectedGig) && myApplications.some(app => app.gigId === selectedGig.id && applicantStatus(app) === 'pending')">
                      <div class="flex items-center gap-2">
                        <button type="button"
                                @click="handleWithdrawApp(selectedGig.id)"
                                class="h-11 px-4 rounded-[8px] border border-[#B4325F]/30 bg-white hover:bg-[#FAD9E9]/40 text-[#B4325F] text-[13.5px] font-medium transition-colors cursor-pointer">
                          Tarik Lamaran
                        </button>
                      </div>
                    </template>

                    <!-- Kondisi C: Belum Melamar & Masih Terbuka -> TOMBOL PRIMER "LAMAR PROYEK INI" -->
                    <template x-if="!isOwnGig(selectedGig) && !hasAppliedTo(selectedGig.id) && selectedGig.status !== 'Selesai' && selectedGig.status !== 'Batal'">
                      <button type="button"
                              @click.stop="openQuickApplyModal(selectedGig)"
                              class="h-11 px-6 rounded-[8px] bg-[#3A5988] hover:bg-[#496DA8] active:bg-[#2F4B76] text-white text-[14.5px] font-semibold transition-colors flex items-center gap-2 cursor-pointer shadow-sm">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                        <span>Lamar Proyek Ini</span>
                      </button>
                    </template>
                  </div>

                </div>
              </template>
            </footer>

          </div>
        </div>

      </main>

  <!-- ========================================================
       MODAL: FORMULIR MELAMAR PROYEK (FRAME LEBAR 840px SEPERTI DETAIL)
  ======================================================== -->
  <template x-if="quickApplyModalOpen && targetApplyGig">
    <div class="fixed inset-0 z-[120] flex items-center justify-center p-4 max-sm:p-0 max-sm:items-end bg-[#0C1117]/50 backdrop-blur-[2px]"
         @click.self="quickApplyModalOpen = false"
         @keydown.window.escape="quickApplyModalOpen = false">
      <div class="w-full max-w-[840px] max-h-[88vh] max-sm:max-h-[92vh] max-sm:h-[92vh] bg-white rounded-[20px] max-sm:rounded-t-[20px] max-sm:rounded-b-none border border-[#E3E4E9] shadow-2xl overflow-hidden flex flex-col">
        
        <!-- Header Bar: 72px -->
        <div class="h-[72px] px-6 lg:px-8 border-b border-[#E3E4E9] flex items-center justify-between shrink-0 bg-white">
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-10 h-10 rounded-full bg-[#E2F1F9] text-[#3A5988] flex items-center justify-center shrink-0">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            </div>
            <div class="min-w-0">
              <h3 class="text-[17px] font-semibold text-[#0C1117] tracking-[-0.01em]">Formulir Melamar Proyek</h3>
              <p class="text-[12.5px] text-[#6B7280] truncate">
                Isi formulir di bawah ini untuk mengirim pitching ke <strong class="text-[#212224] font-medium" x-text="targetApplyGig.ownerName"></strong>.
              </p>
            </div>
          </div>
          <button type="button" @click="quickApplyModalOpen = false" class="w-9 h-9 rounded-full bg-[#F4F5F7] hover:bg-[#E5E9EC] text-[#5F6672] hover:text-[#0C1117] flex items-center justify-center text-sm font-medium transition-colors shrink-0">✕</button>
        </div>

        <!-- Body Formulir (Scrollable & Rapi) -->
        <form @submit.prevent="submitQuickApply()" class="flex-1 flex flex-col overflow-hidden">
          <div class="p-6 lg:p-8 space-y-5 overflow-y-auto flex-1">
            
            <!-- Baris 1: Grid 2 Kolom Seimbang (Pelamar & Nomor WhatsApp) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div class="space-y-1.5">
                <label class="font-medium text-[#212224] text-[13.5px] block">Pelamar</label>
                <div class="h-11 px-4 rounded-[10px] bg-[#F8FAFC] border border-[#E3E4E9] flex items-center justify-between text-[14px]">
                  <span class="font-medium text-[#0C1117]" x-text="currentUserName">Aisha Dwi Rahmawati</span>
                </div>
              </div>

              <div class="space-y-1.5">
                <label class="font-medium text-[#212224] text-[13.5px] block">Nomor WhatsApp / HP Kontak <span class="text-[#B4325F]">*</span></label>
                <input type="tel"
                       x-model="applyContactPhone"
                       required
                       placeholder="081234567890"
                       class="w-full h-11 px-4 rounded-[10px] border border-[#E3E4E9] bg-white focus:outline-none focus:border-[#3A5988] focus:ring-2 focus:ring-[#3A5988]/15 text-[14px] text-[#212224] transition-all placeholder:text-[#91969C]">
              </div>
            </div>

            <div class="space-y-1.5">
              <label for="apply-contact-email" class="block text-[13.5px] font-medium text-[#212224]">Email kontak <span class="text-[#B4325F]">*</span></label>
              <input id="apply-contact-email" type="email" x-model="applyContactEmail" autocomplete="email" required
                     class="h-11 w-full rounded-[10px] border border-[#E3E4E9] px-4 text-[14px] focus:border-[#3A5988] focus:outline-none">
            </div>

            <!-- Baris 2: Tautan Portofolio / GitHub -->
            <div class="space-y-1.5">
              <label class="font-medium text-[#212224] text-[13.5px] block">Tautan Portofolio / GitHub</label>
              <input type="url"
                     x-model="applyPortfolioUrl"
                     placeholder="https://github.com/username atau portofolio"
                     class="w-full h-11 px-4 rounded-[10px] border border-[#E3E4E9] bg-white focus:outline-none focus:border-[#3A5988] focus:ring-2 focus:ring-[#3A5988]/15 text-[14px] text-[#212224] transition-all placeholder:text-[#91969C]">
            </div>

            <!-- Baris 3: Pesan & Pitching Keahlian -->
            <div class="space-y-1.5">
              <label class="font-medium text-[#212224] text-[13.5px] block">Pesan & Pitching Keahlian <span class="text-[#B4325F]">*</span></label>
              <textarea x-model="applyPitchMessage"
                        rows="5"
                        required
                        placeholder="Ceritakan peran yang ingin Anda ambil dan portofolio relevan..."
                        class="w-full p-4 rounded-[10px] border border-[#E3E4E9] bg-white focus:outline-none focus:border-[#3A5988] focus:ring-2 focus:ring-[#3A5988]/15 text-[14px] text-[#212224] transition-all resize-none leading-relaxed placeholder:text-[#91969C]"></textarea>
            </div>

          </div>

          <p x-show="applyError" x-text="applyError" role="alert" class="px-6 pb-3 text-[13px] text-red-700 lg:px-8"></p>

          <!-- Footer Bar: 72px -->
          <div class="h-[72px] px-6 lg:px-8 border-t border-[#E3E4E9] flex items-center justify-between shrink-0 bg-white">
            <button type="button" @click="quickApplyModalOpen = false" class="h-11 px-5 rounded-[8px] border border-[#E3E4E9] text-[#212224] hover:bg-[#F4F5F7] text-[14px] font-medium transition-colors cursor-pointer">Batal</button>
            <button type="submit" class="h-11 px-7 rounded-[8px] bg-[#3A5988] hover:bg-[#496DA8] active:bg-[#2F4B76] text-white text-[14.5px] font-semibold transition-colors flex items-center gap-2 cursor-pointer shadow-sm">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
              <span>Kirim Lamaran Sekarang</span>
            </button>
          </div>
        </form>

      </div>
    </div>
  </template>

  <!-- ========================================================
       MODAL: EDIT PROYEK ANDA
  ======================================================== -->
  <!-- ========================================================
       MODAL: EDIT PROYEK SAYA (UKURAN SAMA PERSIS DENGAN LIHAT DETAIL: 840px)
  ======================================================== -->
  <template x-if="editGigModalOpen">
    <div class="fixed inset-0 z-[120] flex items-center justify-center p-4 max-sm:p-0 max-sm:items-end bg-[#0C1117]/50 backdrop-blur-[2px]"
         @click.self="editGigModalOpen = false" @keydown.window.escape="editGigModalOpen = false">
      <div class="w-full max-w-[840px] max-h-[88vh] max-sm:max-h-[92vh] max-sm:h-[92vh] bg-white rounded-[20px] max-sm:rounded-t-[20px] max-sm:rounded-b-none border border-[#E3E4E9] shadow-2xl overflow-hidden flex flex-col">
        <header class="h-[72px] px-6 lg:px-8 border-b border-[#E3E4E9] flex items-center justify-between shrink-0 bg-white">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-[#E2F1F9] text-[#3A5988] flex items-center justify-center shrink-0">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </div>
            <h3 class="text-[17px] font-semibold text-[#0C1117] tracking-[-0.01em]">Edit Proyek Anda</h3>
          </div>
          <button type="button" @click="editGigModalOpen = false" class="w-10 h-10 rounded-full bg-[#F4F5F7] hover:bg-[#E5E9EC] text-[#0C1117] flex items-center justify-center transition-colors cursor-pointer" title="Tutup">✕</button>
        </header>
        <form @submit.prevent="submitEditGig()" class="p-6 lg:p-8 space-y-4 overflow-y-auto flex-1 text-[13.5px]">
          <div class="space-y-1">
            <label class="font-medium text-[#212224]">Judul Proyek</label>
            <input type="text" x-model="editGigForm.title" required class="w-full h-10 px-3 rounded-[8px] border border-[#E3E4E9]">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div class="space-y-1">
              <label class="font-medium text-[#212224]">Kategori</label>
              <select x-model="editGigForm.category" class="w-full h-10 px-2 rounded-[8px] border border-[#E3E4E9] bg-white">
                <template x-for="cat in categoryOptions.slice(1)" :key="cat.value">
                  <option :value="cat.value" x-text="cat.label"></option>
                </template>
              </select>
            </div>
            <div class="space-y-1">
              <label class="font-medium text-[#212224]">Rentang Budget</label>
              <select x-model="editGigForm.budgetRange" class="w-full h-10 px-2 rounded-[8px] border border-[#E3E4E9] bg-white">
                <template x-for="b in GIGS_BUDGET_RANGES" :key="b">
                  <option :value="b" x-text="b"></option>
                </template>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div class="space-y-1">
              <label class="font-medium text-[#212224]">Target Selesai</label>
              <input type="date" x-model="editGigForm.deadline" required class="w-full h-10 px-3 rounded-[8px] border border-[#E3E4E9]">
            </div>
            <div class="space-y-1">
              <label class="font-medium text-[#212224]">Kuota Tim (Orang)</label>
              <input type="number" min="1" max="10" x-model="editGigForm.quota" required class="w-full h-10 px-3 rounded-[8px] border border-[#E3E4E9]">
            </div>
          </div>
          <div class="space-y-1">
            <label class="font-medium text-[#212224]">Deskripsi Proyek</label>
            <textarea x-model="editGigForm.description" rows="3" required class="w-full p-3 rounded-[8px] border border-[#E3E4E9]"></textarea>
          </div>
          <div class="flex items-center justify-between pt-3">
            <button type="button" @click="handleDeleteGig(editingGigId)" class="text-red-600 font-medium hover:underline text-[13px] cursor-pointer">Hapus Proyek</button>
            <div class="flex items-center gap-2">
              <button type="button" @click="editGigModalOpen = false" class="h-10 px-4 rounded-[8px] border border-[#E3E4E9] text-[#212224] hover:bg-[#F4F5F7] font-medium cursor-pointer">Batal</button>
              <button type="submit" class="h-10 px-5 rounded-[8px] bg-[#3A5988] text-white font-medium hover:bg-[#496DA8] cursor-pointer">Simpan Perubahan</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- JAVASCRIPT STATE LOGIC (Clean & Human Structured) -->
  
  <script>mountAlumniPortal(document.querySelector('main'));</script>
</body>
</html>
