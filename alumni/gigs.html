<!DOCTYPE html>
<html lang="id" data-color-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bengkod Gigs &amp; Side-Project Exchange | Bengkel Koding UDINUS</title>
  <meta name="description" content="Platform Peer-to-Peer (P2P) kolaborasi side-project, tender freelance, dan rekrutmen tim internal alumni Bengkel Koding.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/page-skeleton.js"></script>
  <script src="assets/js/alumni.js"></script>
  <script src="assets/js/alumni-data.js"></script>
  <script src="assets/js/alumni-profile-data.js"></script>
  <script src="../assets/js/store.js"></script>
</head>
<body>
<main data-route="gigs">
  <div x-data="bengkodGigsExchange" class="w-full flex flex-col gap-6 py-2">

    <!-- Toast Notifikasi -->
    <template x-if="toast">
      <div class="fixed bottom-6 right-6 z-[90] bg-gray-900 text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 animate-fade-in text-[14px]">
        <span class="w-2 h-2 rounded-full bg-blue-500"></span>
        <span x-text="toast"></span>
      </div>
    </template>

    <!-- ============================================================
        HEADER & NAVIGASI TABS (100% PERSIS LOWONGAN PEKERJAAN)
    ============================================================ -->
    <div class="bg-white rounded-xl border border-gray-200/90 shadow-sm p-6 sm:p-7">
      <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
        <div>
          <h1 class="text-2xl sm:text-3xl font-bold text-[#1E3A8A] tracking-tight">
            Gigs &amp; Side-Project Exchange
          </h1>
          <p class="text-[15px] text-gray-500 mt-1 font-normal">
            Papan kolaborasi side-project, tender freelance, dan rekrutmen tim internal antar-alumni Bengkel Koding.
          </p>
        </div>

        <div class="flex flex-col sm:flex-row items-start sm:items-center gap-3">
          <!-- Tab Navigasi Pill ala Lowongan -->
          <div class="flex items-center bg-gray-100 p-1 rounded-full w-fit">
            <button
              @click="activeTab = 'board'"
              class="px-5 py-2.5 rounded-full text-[15px] font-semibold transition-colors cursor-pointer whitespace-nowrap"
              :class="activeTab === 'board' ? 'bg-white text-[#1E3A8A] shadow-xs' : 'text-gray-600 hover:text-gray-900'"
            >
              Jelajahi
              <span class="ml-1 text-[13px]" x-text="'(' + openGigsCount + ')'"></span>
            </button>

            <button
              @click="activeTab = 'saved'"
              class="px-5 py-2.5 rounded-full text-[15px] font-semibold transition-colors cursor-pointer whitespace-nowrap"
              :class="activeTab === 'saved' ? 'bg-white text-[#1E3A8A] shadow-xs' : 'text-gray-600 hover:text-gray-900'"
            >
              Tersimpan
              <template x-if="savedGigIds.length > 0">
                <span class="ml-1 text-[13px]" x-text="'(' + savedGigIds.length + ')'"></span>
              </template>
            </button>

            <button
              @click="activeTab = 'my_gigs'"
              class="px-5 py-2.5 rounded-full text-[15px] font-semibold transition-colors cursor-pointer whitespace-nowrap"
              :class="activeTab === 'my_gigs' ? 'bg-white text-[#1E3A8A] shadow-xs' : 'text-gray-600 hover:text-gray-900'"
            >
              Proyek Saya
            </button>

            <button
              @click="activeTab = 'applications'"
              class="px-5 py-2.5 rounded-full text-[15px] font-semibold transition-colors cursor-pointer whitespace-nowrap"
              :class="activeTab === 'applications' ? 'bg-white text-[#1E3A8A] shadow-xs' : 'text-gray-600 hover:text-gray-900'"
            >
              Lamaran Saya
            </button>
          </div>

          <!-- Tombol Lempar Proyek -->
          <button
            type="button"
            @click="openCreateGigModal()"
            class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full text-[15px] font-semibold text-white bg-[#1E3A8A] hover:bg-[#1D4ED8] shadow-sm transition-colors cursor-pointer whitespace-nowrap"
          >
            <span class="text-base leading-none">+</span>
            <span>Lempar Proyek</span>
          </button>
        </div>
      </div>

      <!-- ============================================================
          BAR PENCARIAN & FILTER KATA KUNCI (HANYA DI TAB JELAJAHI / TERSIMPAN)
          BARIS 1: PENCARIAN (COL-10) & RESET FILTER (COL-2)
          BARIS 2: 1 BARIS UNTUK KATEGORI, RENTANG BUDGET, STATUS PROYEK
      ============================================================ -->
      <template x-if="activeTab === 'board' || activeTab === 'saved'">
        <div class="mt-6 pt-5 border-t border-gray-100 space-y-3">
          <!-- ── BARIS 1: PENCARIAN & RESET FILTER ── -->
          <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-center">
            <!-- Input Kata Kunci (Col 1-10) -->
            <div class="md:col-span-10 relative">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
                <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" />
              </svg>
              <input
                type="text"
                placeholder="Cari kebutuhan proyek, tech stack (Flutter, Next.js), atau nama owner..."
                x-model="searchQuery"
                class="w-full pl-11 pr-4 py-2.5 bg-white border border-gray-200 rounded-full text-[15px] text-gray-900 placeholder:text-gray-400 focus:outline-none focus:border-[#1E3A8A] focus:ring-2 focus:ring-[#1E3A8A]/10 transition-colors shadow-2xs"
              >
            </div>

            <!-- Reset Filter Button (Col 11-12) -->
            <div class="md:col-span-2">
              <button
                type="button"
                @click="searchQuery = ''; filterBudget = ''; filterStatus = 'Semua'; selectedCategoryTag = ''"
                class="w-full py-2.5 px-4 border border-gray-200 hover:border-gray-300 rounded-full text-[14px] font-semibold text-gray-600 hover:text-[#1E3A8A] bg-white transition-colors cursor-pointer text-center shadow-2xs"
              >
                Reset Filter
              </button>
            </div>
          </div>

          <!-- ── BARIS 2: 1 BARIS UNTUK RENTANG BUDGET, STATUS, KATEGORI (3 KOLOM SEIMBANG) ── -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3 items-center">
            <!-- Filter Kategori -->
            <div>
              <select
                x-model="selectedCategoryTag"
                class="w-full px-4 py-2.5 rounded-full border border-gray-200 bg-white text-[15px] text-gray-700 hover:border-gray-300 focus:outline-none focus:border-[#1E3A8A] cursor-pointer shadow-2xs"
              >
                <option value="">Kategori: Semua</option>
                <option value="Mobile App">Mobile App</option>
                <option value="Frontend">Frontend Development</option>
                <option value="Backend">Backend API</option>
                <option value="UI/UX">UI/UX &amp; Web Design</option>
                <option value="Data Science">Data Science &amp; AI</option>
                <option value="QA">QA &amp; Testing</option>
              </select>
            </div>

            <!-- Filter Budget -->
            <div>
              <select
                x-model="filterBudget"
                class="w-full px-4 py-2.5 rounded-full border border-gray-200 bg-white text-[15px] text-gray-700 hover:border-gray-300 focus:outline-none focus:border-[#1E3A8A] cursor-pointer shadow-2xs"
              >
                <option value="">Rentang Budget: Semua</option>
                <template x-for="b in GIGS_BUDGET_RANGES" :key="b">
                  <option :value="b" x-text="b"></option>
                </template>
              </select>
            </div>

            <!-- Filter Status -->
            <div>
              <select
                x-model="filterStatus"
                class="w-full px-4 py-2.5 rounded-full border border-gray-200 bg-white text-[15px] text-gray-700 hover:border-gray-300 focus:outline-none focus:border-[#1E3A8A] cursor-pointer shadow-2xs"
              >
                <option value="Semua">Status Proyek: Semua</option>
                <option value="Terbuka">Open</option>
                <option value="Sedang Dikerjakan">Disetujui</option>
                <option value="Selesai">Selesai</option>
              </select>
            </div>
          </div>
        </div>
      </template>
    </div>

    <!-- ============================================================
        TAB: LAMARAN SAYA (APPLICATION TRACKER)
        100% PERSIS TAB "LAMARAN SAYA" DI LOWONGAN PEKERJAAN
    ============================================================ -->
    <template x-if="activeTab === 'applications'">
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-2xs">
        <template x-if="myApplications.length === 0">
          <div class="text-center py-16 text-gray-400 space-y-3">
            <div class="w-16 h-16 rounded-full bg-blue-50 text-[#1E3A8A] flex items-center justify-center mx-auto">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none">
                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>
            <p class="text-[17px] font-semibold text-gray-900">Belum Ada Pengajuan Minat Proyek</p>
            <p class="text-[15px] text-gray-500 max-w-md mx-auto">
              Jelajahi Papan Gigs dan ajukan minat kolaborasi pada proyek alumni yang sesuai dengan keahlian Anda!
            </p>
          </div>
        </template>
        <template x-if="myApplications.length > 0">
          <div>
            <!-- Bulk Action Bar jika ada item dipilih -->
            <template x-if="selectedAppIds.length > 0">
              <div class="flex items-center justify-between px-6 py-3 bg-blue-50 border-b border-blue-100">
                <span class="text-[14px] font-medium text-[#1E3A8A]" x-text="selectedAppIds.length + ' lamaran dipilih'"></span>
                <button
                  @click="handleDeleteSelected()"
                  class="flex items-center gap-2 px-4 py-1.5 rounded-full bg-[#1E3A8A] hover:bg-blue-900 text-white text-[14px] font-semibold transition-colors cursor-pointer"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9" />
                    <path d="M15 9l-6 6M9 9l6 6" />
                  </svg>
                  Batalkan
                </button>
              </div>
            </template>

            <!-- Header Kolom: Checkbox + "Proyek & Owner" -->
            <div class="flex items-center gap-5 px-6 py-3.5 border-b border-gray-100 bg-gray-50/70">
              <input
                type="checkbox"
                :checked="selectedAppIds.length === myApplications.length && myApplications.length > 0"
                @change="handleToggleSelectAll()"
                class="w-4.5 h-4.5 rounded-[4px] border-2 border-gray-400 text-[#1E3A8A] focus:ring-0 cursor-pointer"
                aria-label="Pilih semua proyek"
              >
              <span class="font-semibold text-[13px] text-gray-500 uppercase tracking-wide">Proyek &amp; Owner</span>
            </div>

            <!-- Rows List (Persis 100% Lowongan Pekerjaan) -->
            <div class="divide-y divide-gray-100">
              <template x-for="app in myApplications" :key="app.id">
                <div
                  @click="selectedGigId = app.gigId; activeTab = 'board'"
                  class="flex items-center gap-5 px-6 py-5 hover:bg-blue-50/30 transition-colors cursor-pointer"
                  :class="selectedAppIds.includes(app.id) ? 'bg-blue-50/50' : ''"
                >
                  <!-- Checkbox -->
                  <input
                    type="checkbox"
                    :checked="selectedAppIds.includes(app.id)"
                    @click.stop
                    @change.stop="handleToggleSelectApp(app.id)"
                    class="w-4.5 h-4.5 flex-shrink-0 rounded-[4px] border-2 border-gray-300 text-[#1E3A8A] focus:ring-0 cursor-pointer"
                    :aria-label="'Pilih ' + app.gigTitle"
                  >

                  <!-- Icon Proyek -->
                  <div class="w-11 h-11 rounded-lg bg-blue-50 border border-blue-100 flex items-center justify-center flex-shrink-0 text-[#1E3A8A] font-bold text-[15px]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                  </div>

                  <!-- Info -->
                  <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-1.5">
                      <h3 class="text-[15px] font-semibold text-gray-900 hover:text-[#1E3A8A] transition-colors leading-snug truncate" x-text="app.gigTitle"></h3>
                    </div>
                    <p class="text-[14px] text-gray-600 mt-0.5 truncate" x-text="'Owner: ' + app.ownerName + ' · ' + app.budgetRange"></p>
                    <p class="text-[13px] text-gray-400 mt-0.5" x-text="'Diajukan ' + app.appliedDate"></p>
                  </div>

                  <!-- Status badge: UKURAN SERAGAM w-44 PERSIS LOWONGAN PEKERJAAN -->
                  <div class="flex-shrink-0 flex items-center gap-2">
                    <span
                      class="inline-flex items-center justify-center w-44 py-1.5 px-3 rounded-full text-[13px] font-semibold text-center bg-blue-50 text-[#1E3A8A] border border-blue-200/90 shadow-2xs"
                      x-text="app.status === 'ACCEPTED' ? 'Disetujui' : (app.status === 'PENDING' ? 'Menunggu Review' : (app.status === 'COMPLETED' ? 'Selesai' : 'Belum Terpilih'))"
                    ></span>

                    <template x-if="app.status === 'PENDING'">
                      <button
                        type="button"
                        @click.stop="withdrawApplication(app.id, app.gigId)"
                        class="p-2 rounded-full text-gray-400 hover:text-red-600 hover:bg-red-50 transition-colors cursor-pointer"
                        title="Tarik lamaran"
                      >
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
                      </button>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- ============================================================
        TAB: PROYEK SAYA (OWNER) — TAMPILAN TABEL BERSIH ALA LOWONGAN
    ============================================================ -->
    <template x-if="activeTab === 'my_gigs'">
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-2xs">
        <template x-if="myGigs.length === 0">
          <div class="text-center py-16 text-gray-400 space-y-3">
            <div class="w-16 h-16 rounded-full bg-blue-50 text-[#1E3A8A] flex items-center justify-center mx-auto">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            </div>
            <p class="text-[17px] font-semibold text-gray-900">Belum Ada Proyek Diterbitkan</p>
            <p class="text-[15px] text-gray-500 max-w-md mx-auto">
              Lempar proyek ke Papan Gigs dan temukan rekan kolaborasi dari ekosistem alumni Bengkel Koding.
            </p>
            <button
              type="button"
              @click="openCreateGigModal()"
              class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full text-[15px] font-semibold text-white bg-[#1E3A8A] hover:bg-[#1D4ED8] shadow-sm transition-colors cursor-pointer"
            >
              + Lempar Proyek Pertama
            </button>
          </div>
        </template>
        <template x-if="myGigs.length > 0">
          <div>
            <!-- Header Kolom -->
            <div class="flex items-center gap-5 px-6 py-3.5 border-b border-gray-100 bg-gray-50/70">
              <span class="font-semibold text-[13px] text-gray-500 uppercase tracking-wide">Proyek Anda</span>
            </div>
            <!-- Rows -->
            <div class="divide-y divide-gray-100">
              <template x-for="g in myGigs" :key="g.id">
                <div class="flex items-center gap-5 px-6 py-5 hover:bg-blue-50/30 transition-colors">
                  <!-- Icon -->
                  <div class="w-11 h-11 rounded-lg bg-blue-50 border border-blue-100 flex items-center justify-center flex-shrink-0 text-[#1E3A8A]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                  </div>

                  <!-- Info -->
                  <div class="min-w-0 flex-1">
                    <h3 class="text-[15px] font-semibold text-gray-900 leading-snug truncate" x-text="g.title"></h3>
                    <p class="text-[14px] text-gray-600 font-medium mt-0.5 truncate" x-text="g.category + ' · ' + g.budgetRange"></p>
                    <p class="text-[13px] text-gray-400 mt-0.5" x-text="'Dibuat ' + g.postedDate + ' · Tenggat ' + g.deadline"></p>
                  </div>

                  <!-- Status badge & aksi -->
                  <div class="flex-shrink-0 flex items-center gap-2.5">
                    <!-- Status badge (ukuran oval sama dengan tombol lainnya, tanpa warna hijau) -->
                    <span
                      class="w-[110px] h-8 inline-flex items-center justify-center rounded-full text-[13px] font-semibold text-center border shadow-2xs"
                      :class="{
                        'bg-white text-gray-700 border-gray-200': g.status === 'Terbuka',
                        'bg-blue-50 text-[#1E3A8A] border-blue-200': g.status === 'Sedang Dikerjakan',
                        'bg-purple-50 text-purple-700 border-purple-200': g.status === 'Selesai',
                        'bg-gray-100 text-gray-500 border-gray-200': g.status === 'Batal'
                      }"
                      x-text="g.status === 'Terbuka' ? 'Open' : (g.status === 'Sedang Dikerjakan' ? 'Disetujui' : g.status)"
                    ></span>

                    <!-- Tombol Review Pelamar -->
                    <template x-if="g.status !== 'Batal'">
                      <button
                        type="button"
                        @click="openApplicantsDrawer(g)"
                        class="w-[110px] h-8 inline-flex items-center justify-center gap-1.5 rounded-full text-[13px] font-semibold border border-gray-200 hover:border-[#1E3A8A] text-gray-700 hover:text-[#1E3A8A] hover:bg-blue-50/50 transition-colors cursor-pointer shadow-2xs"
                      >
                        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        <span x-text="(g.applicants || []).length + ' Pelamar'"></span>
                      </button>
                    </template>

                    <!-- Edit -->
                    <template x-if="g.status === 'Terbuka'">
                      <button
                        type="button"
                        @click.stop="openEditGigModal(g)"
                        class="w-[110px] h-8 inline-flex items-center justify-center rounded-full text-[13px] font-semibold border border-gray-200 hover:bg-gray-50 text-gray-700 transition-colors cursor-pointer shadow-2xs"
                      >
                        Edit
                      </button>
                    </template>

                    <!-- Tandai Selesai -->
                    <template x-if="g.status === 'Sedang Dikerjakan'">
                      <button
                        type="button"
                        @click="openEndorseModal(g)"
                        class="px-4 py-1.5 rounded-full text-[13px] font-bold bg-[#1E3A8A] hover:bg-[#1D4ED8] text-white transition-colors cursor-pointer shadow-sm"
                      >
                        ✓ Selesai
                      </button>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- ============================================================
        KONTEN UTAMA: LINKEDIN SPLIT SCREEN 2-KOLOM (JELAJAHI & TERSIMPAN)
        100% PERSIS LAYOUT SPLIT-SCREEN LOWONGAN PEKERJAAN
    ============================================================ -->
    <template x-if="activeTab === 'board' || activeTab === 'saved'">
      <div class="flex flex-col lg:flex-row gap-6 items-start">

        <!-- ── KOLOM KIRI: DAFTAR KARTU PROYEK (FEED) ─────────────── -->
        <div class="w-full lg:w-[410px] xl:w-[440px] flex-shrink-0 flex flex-col gap-3.5">
          <div class="flex items-center justify-between px-1 text-[14px] font-medium text-gray-500">
            <span x-text="'Menampilkan ' + filteredBoardGigs.length + ' proyek'"></span>
            <span class="text-[13px] text-gray-400">Diurutkan: Paling Relevan</span>
          </div>

          <template x-if="filteredBoardGigs.length === 0">
            <div class="bg-white rounded-xl border border-gray-200 p-10 text-center text-gray-400 shadow-xs">
              <p class="text-[15px] font-semibold text-gray-700">Tidak ada proyek yang cocok</p>
              <p class="text-[14px] text-gray-400 mt-1">Coba sesuaikan kata kunci atau bersihkan filter pencarian.</p>
            </div>
          </template>

          <template x-if="filteredBoardGigs.length > 0">
            <div class="space-y-3.5 max-h-[840px] overflow-y-auto pr-1 [&::-webkit-scrollbar]:w-1.5 [&::-webkit-scrollbar-thumb]:bg-gray-200 [&::-webkit-scrollbar-thumb]:rounded-full">
              <template x-for="gig in filteredBoardGigs" :key="gig.id">
                <div
                  @click="selectedGigId = gig.id"
                  class="p-5 rounded-xl border transition-all cursor-pointer relative bg-white"
                  :class="selectedGig && selectedGig.id === gig.id
                    ? 'border-[#1E3A8A] ring-2 ring-[#1E3A8A]/15 shadow-sm'
                    : 'border-gray-200/90 hover:border-gray-300 hover:shadow-xs'"
                >
                  <!-- Baris Atas: Avatar Owner, Judul Luas, Kategori & Status Pill -->
                  <div class="flex items-start justify-between gap-3">
                    <div class="flex items-start gap-3.5 min-w-0 flex-1">
                      <!-- Avatar Owner -->
                      <img :src="gig.ownerAvatar || DEFAULT_AVATAR" :alt="gig.ownerName" class="w-11 h-11 rounded-lg object-cover border border-gray-100 flex-shrink-0">
                      
                      <!-- Judul, Owner, Kategori, Status -->
                      <div class="min-w-0 flex-1">
                        <h3 class="text-[15px] font-semibold text-gray-900 leading-snug hover:text-[#1E3A8A] transition-colors line-clamp-1" x-text="gig.title"></h3>
                        <p class="text-[14px] font-normal text-[#1E3A8A] line-clamp-1 mt-0.5" x-text="gig.ownerName"></p>
                        <p class="text-[13px] font-normal text-gray-500 line-clamp-1 mt-0.5" x-text="gig.category"></p>
                        <p class="text-[13px] font-normal text-gray-500 line-clamp-1 mt-0.5" x-text="gig.status === 'Terbuka' ? 'Open' : (gig.status === 'Sedang Dikerjakan' ? 'Disetujui' : (gig.status === 'Selesai' ? 'Selesai' : gig.status))"></p>
                      </div>
                    </div>

                    <!-- Tombol Bookmark (100% PERSIS LOWONGAN PEKERJAAN) -->
                    <button
                      type="button"
                      @click.stop="handleToggleBookmark(gig.id)"
                      :title="savedGigIds.includes(gig.id) ? 'Hapus dari tersimpan' : 'Simpan proyek'"

<script>
  function bengkodGigsExchange() {
    const budgetList = (typeof GIGS_BUDGET_RANGES !== "undefined" && Array.isArray(GIGS_BUDGET_RANGES))
      ? GIGS_BUDGET_RANGES
      : [
          "< Rp 1.000.000",
          "Rp 1.000.000 - Rp 3.000.000",
          "Rp 3.000.000 - Rp 5.000.000",
          "> Rp 5.000.000",
          "Bagi Hasil / Equity",
        ];

    return {
      currentUserId: "aisha-dwi-rahmawati",
      currentUserName: "Aisha Dwi Rahmawati",
      currentUserAvatar: typeof DEFAULT_AVATAR !== "undefined" ? DEFAULT_AVATAR : "",
      currentUserRole: "Alumni 2024 · Lab Bengkel Koding",

      activeTab: "board",
      searchQuery: "",
      filterBudget: "",
      filterStatus: "Semua",
      selectedCategoryTag: "",
      selectedGigId: null,
      savedGigIds: [],
      selectedAppIds: [],
      toast: "",

      GIGS_BUDGET_RANGES: budgetList,

      gigs: (typeof loadGigs === "function" ? loadGigs() : (window.INITIAL_GIGS || [])),
      myApplications: (typeof loadMyApplications === "function" ? loadMyApplications() : []),

      // Drawer state
      drawerOpen: false,
      activeGigReview: null,

      // Quick apply modal
      quickApplyModalOpen: false,
      targetApplyGig: null,
      applyPitchMessage: "",
      applyPortfolioUrl: "https://github.com/aishaadr",
      applyContactPhone: "081234567890",

      // Endorsement modal
      endorseModalOpen: false,
      targetEndorseGig: null,
      endorsementText: "",
      autoPublishFeed: true,

      // Create gig modal
      createGigModalOpen: false,
      newGigForm: {
        title: "",
        category: "Mobile App",
        budgetRange: budgetList[1],
        quota: 1,
        deadline: new Date(Date.now() + 25 * 86400000).toISOString().slice(0, 10),
        rolesNeeded: "Flutter, REST API",
        techStack: "Flutter, Laravel, PostgreSQL",
        description: "",
      },

      // Edit gig modal
      editGigModalOpen: false,
      editingGigId: null,
      editGigForm: {
        title: "",
        category: "Mobile App",
        budgetRange: budgetList[1],
        quota: 1,
        deadline: "",
        rolesNeeded: "",
        techStack: "",
        description: "",
      },

      init() {
        this.muat();
        // Load saved gigs from localStorage
        try {
          const rawSaved = localStorage.getItem("bengkod_saved_gigs");
          if (rawSaved) this.savedGigIds = JSON.parse(rawSaved);
        } catch {}

        const loaded = typeof loadGigs === "function" ? loadGigs() : (window.INITIAL_GIGS || []);
        if (loaded && loaded.length > 0) this.selectedGigId = loaded[0].id;
        window.addEventListener("bengkod_gigs_updated", () => this.muat());
        window.addEventListener("bengkod_gigs_apply_updated", () => this.muat());
      },

      muat() {
        const loaded = typeof loadGigs === "function" ? loadGigs() : (window.INITIAL_GIGS || []);
        this.gigs = Array.isArray(loaded) && loaded.length > 0 ? loaded : (window.INITIAL_GIGS || []);
        this.myApplications = typeof loadMyApplications === "function" ? loadMyApplications() : [];
      },

      get selectedGig() {
        if (!this.selectedGigId) return this.filteredBoardGigs[0] || null;
        return this.filteredBoardGigs.find((g) => g.id === this.selectedGigId) || this.filteredBoardGigs[0] || null;
      },

      get openGigsCount() {
        return this.gigs.filter((g) => g.status === "Terbuka").length;
      },

      get inProgressCount() {
        return this.gigs.filter((g) => g.status === "Sedang Dikerjakan").length;
      },

      get completedCount() {
        return this.gigs.filter((g) => g.status === "Selesai").length;
      },

      get myGigs() {
        return this.gigs.filter((g) => g.ownerId === this.currentUserId);
      },

      get filteredBoardGigs() {
        const q = this.searchQuery.trim().toLowerCase();
        return this.gigs.filter((g) => {
          if (this.activeTab === "saved" && !this.savedGigIds.includes(g.id)) return false;
          if (this.filterBudget && g.budgetRange !== this.filterBudget) return false;
          if (this.filterStatus && this.filterStatus !== "" && this.filterStatus !== "Semua") {
            const gs = (g.status || "").toLowerCase();
            const fs = this.filterStatus.toLowerCase();
            if (fs === "terbuka" || fs === "open") {
              if (gs !== "terbuka" && gs !== "open") return false;
            } else if (fs.includes("dikerjakan") || fs.includes("progress")) {
              if (!gs.includes("dikerjakan") && !gs.includes("progress")) return false;
            } else if (fs.includes("selesai") || fs.includes("complete")) {
              if (!gs.includes("selesai") && !gs.includes("complete")) return false;
            } else if (gs !== fs) {
              return false;
            }
          }
          if (this.selectedCategoryTag && !g.category.toLowerCase().includes(this.selectedCategoryTag.toLowerCase())) return false;
          if (q) {
            const haystack = [g.title, g.description, (g.techStack || []).join(" "), (g.rolesNeeded || []).join(" "), g.ownerName].join(" ").toLowerCase();
            if (!haystack.includes(q)) return false;
          }
          return true;
        });
      },

      hasAppliedTo(gigId) {
        return this.myApplications.some((a) => a.gigId === gigId);
      },

      getOwnerAbout(ownerName, ownerId) {
        if (ownerId === this.currentUserId || ownerName === this.currentUserName) {
          try {
            const savedProf = JSON.parse(localStorage.getItem("bengkod_alumni_profile") || "null");
            if (savedProf && savedProf.about) return savedProf.about;
          } catch {}
          if (typeof INITIAL_PROFILE !== "undefined" && INITIAL_PROFILE.about) return INITIAL_PROFILE.about;
        }
        if (typeof ALUMNI_DIRECTORY !== "undefined" && Array.isArray(ALUMNI_DIRECTORY)) {
          const found = ALUMNI_DIRECTORY.find((a) => a.name === ownerName || a.id === ownerId);
          if (found && found.about) return found.about;
        }
        return "Alumni berdedikasi dari ekosistem Bengkel Koding Universitas Dian Nuswantoro Semarang dengan pengalaman mendalam dalam pengembangan perangkat lunak, perancangan arsitektur sistem, serta kolaborasi proyek teknologi.";
      },

      handleToggleBookmark(gigId) {
        if (this.savedGigIds.includes(gigId)) {
          this.savedGigIds = this.savedGigIds.filter((id) => id !== gigId);
          this.setToast("Proyek dihapus dari daftar tersimpan");
        } else {
          this.savedGigIds.push(gigId);
          this.setToast("Proyek disimpan ke daftar tersimpan");
        }
        try {
          localStorage.setItem("bengkod_saved_gigs", JSON.stringify(this.savedGigIds));
        } catch {}
      },

      handleToggleSelectAll() {
        if (this.selectedAppIds.length === this.myApplications.length) {
          this.selectedAppIds = [];
        } else {
          this.selectedAppIds = this.myApplications.map((a) => a.id);
        }
      },

      handleToggleSelectApp(id) {
        if (this.selectedAppIds.includes(id)) {
          this.selectedAppIds = this.selectedAppIds.filter((i) => i !== id);
        } else {
          this.selectedAppIds.push(id);
        }
      },

      handleDeleteSelected() {
        if (!confirm(`Batalkan ${this.selectedAppIds.length} lamaran yang dipilih?`)) return;
        this.myApplications = this.myApplications.filter((a) => !this.selectedAppIds.includes(a.id));
        if (typeof saveMyApplications === "function") saveMyApplications(this.myApplications);
        this.selectedAppIds = [];
        this.setToast("Pengajuan minat yang dipilih berhasil dibatalkan.");
      },

      openCreateGigModal() {
        this.newGigForm = {
          title: "",
          category: "Mobile App",
          budgetRange: budgetList[1],
          quota: 1,
          deadline: new Date(Date.now() + 25 * 86400000).toISOString().slice(0, 10),
          rolesNeeded: "",
          techStack: "",
          description: "",
        };
        this.createGigModalOpen = true;
      },

      submitCreateGig() {
        if (!this.newGigForm.title.trim() || !this.newGigForm.description.trim()) return;
        const newGig = {
          id: "gig-" + Date.now(),
          title: this.newGigForm.title.trim(),
          ownerId: this.currentUserId,
          ownerName: this.currentUserName,
          ownerAvatar: this.currentUserAvatar,
          ownerRole: this.currentUserRole,
          ownerPhone: "081234567890",
          category: this.newGigForm.category,
          rolesNeeded: this.newGigForm.rolesNeeded.split(",").map((s) => s.trim()).filter(Boolean),
          techStack: this.newGigForm.techStack.split(",").map((s) => s.trim()).filter(Boolean),
          budgetRange: this.newGigForm.budgetRange,
          deadline: this.newGigForm.deadline,
          quota: Number(this.newGigForm.quota) || 1,
          status: "Terbuka",
          postedDate: new Date().toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" }),
          description: this.newGigForm.description.trim(),
          assignedContributor: null,
          endorsement: "",
          completedDate: null,
          applicants: [],
        };
        const updated = [newGig, ...this.gigs];
        if (typeof saveGigs === "function") saveGigs(updated);
        this.gigs = updated;
        this.selectedGigId = newGig.id;
        this.createGigModalOpen = false;
        this.activeTab = "board";
        this.setToast("Tender proyek berhasil diterbitkan ke Papan Gigs!");
      },

      openApplicantsDrawer(gig) {
        this.activeGigReview = gig;
        this.drawerOpen = true;
      },

      assignContributor(gigId, applicant) {
        const updated = this.gigs.map((g) => {
          if (g.id === gigId) {
            return {
              ...g,
              status: "Sedang Dikerjakan",
              assignedContributor: {
                id: applicant.applicantId,
                name: applicant.applicantName,
                avatar: applicant.applicantAvatar,
                batch: applicant.applicantBatch,
                phone: applicant.applicantPhone,
                assignedDate: new Date().toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" })
              },
              applicants: (g.applicants || []).map((app) =>
                app.id === applicant.id ? { ...app, status: "ACCEPTED" } : app
              )
            };
          }
          return g;
        });

        if (typeof saveGigs === "function") saveGigs(updated);
        this.gigs = updated;
        this.activeGigReview = updated.find((g) => g.id === gigId);

        const phone = applicant.applicantPhone || "081234567890";
        const waLink = "https://wa.me/" + phone.replace(/[^0-9]/g, "") + "?text=" + encodeURIComponent(
          `Halo ${applicant.applicantName}, saya ${this.activeGigReview.ownerName} dari Bengkel Koding. Pengajuan minatmu untuk gig "${this.activeGigReview.title}" sudah saya setujui. Mari kita koordinasi teknis pengerjaannya.`
        );
        window.open(waLink, "_blank");

        this.setToast(`Rekan ${applicant.applicantName} berhasil ditugaskan!`);
      },

      openQuickApplyModal(gig) {
        this.targetApplyGig = gig;
        this.applyPitchMessage = "";
        this.applyPortfolioUrl = "https://github.com/aishaadr";
        this.applyContactPhone = "081234567890";
        this.quickApplyModalOpen = true;
      },

      submitQuickApply() {
        if (!this.targetApplyGig || !this.applyPitchMessage.trim()) return;
        if (this.applyPitchMessage.length > 250) {
          alert("Pesan pitching maksimal 250 karakter.");
          return;
        }

        const pickedProjects = this.applyPortfolioUrl.trim()
          ? [{ title: "Tautan Portofolio / GitHub", linkUrl: this.applyPortfolioUrl.trim(), stack: "Karya Terlampir" }]
          : [];

        const newApplicant = {
          id: "app-" + Date.now(),
          applicantId: this.currentUserId,
          applicantName: this.currentUserName,
          applicantAvatar: this.currentUserAvatar,
          applicantBatch: "2024",
          applicantPhone: this.applyContactPhone,
          skills: ["Data Science", "Python", "Machine Learning", "FastAPI"],
          pitchMessage: this.applyPitchMessage.trim(),
          portfolioItems: pickedProjects,
          appliedDate: new Date().toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" }),
          status: "PENDING"
        };

        const updatedGigs = this.gigs.map((g) => {
          if (g.id === this.targetApplyGig.id) {
            return { ...g, applicants: [newApplicant, ...(g.applicants || [])] };
          }
          return g;
        });
        if (typeof saveGigs === "function") saveGigs(updatedGigs);
        this.gigs = updatedGigs;

        const myAppEntry = {
          id: newApplicant.id,
          gigId: this.targetApplyGig.id,
          gigTitle: this.targetApplyGig.title,
          ownerName: this.targetApplyGig.ownerName,
          ownerPhone: this.targetApplyGig.ownerPhone,
          message: this.applyPitchMessage.trim(),
          portfolioItems: pickedProjects,
          appliedDate: newApplicant.appliedDate,
          budgetRange: this.targetApplyGig.budgetRange,
          status: "PENDING"
        };
        const nextApps = [myAppEntry, ...this.myApplications];
        if (typeof saveMyApplications === "function") saveMyApplications(nextApps);
        this.myApplications = nextApps;

        this.quickApplyModalOpen = false;
        this.setToast("Minat berhasil diajukan! Owner proyek akan segera meninjau pitching Anda.");
      },

      openEndorseModal(gig) {
        this.targetEndorseGig = gig;
        this.endorsementText = "Kerja sama luar biasa. Deliverables selesai tepat waktu dengan kualitas arsitektur kode yang solid.";
        this.autoPublishFeed = true;
        this.endorseModalOpen = true;
      },

      submitCompleteGig() {
        if (!this.targetEndorseGig || !this.endorsementText.trim()) return;

        const updated = this.gigs.map((g) => {
          if (g.id === this.targetEndorseGig.id) {
            return {
              ...g,
              status: "Selesai",
              endorsement: this.endorsementText.trim(),
              completedDate: new Date().toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" })
            };
          }
          return g;
        });

        if (typeof saveGigs === "function") saveGigs(updated);
        this.gigs = updated;

        if (this.autoPublishFeed && typeof publishGigCompletionToFeed === "function") {
          publishGigCompletionToFeed(this.targetEndorseGig, this.endorsementText.trim());
        }

        this.endorseModalOpen = false;
        this.setToast("Proyek resmi diselesaikan & endorsement telah diterbitkan!");
      },

      openEditGigModal(gig) {
        if (!gig) return;
        this.editingGigId = gig.id;
        this.editGigForm = {
          title: gig.title || "",
          category: gig.category || "Mobile App",
          budgetRange: gig.budgetRange || "Rp 1.000.000 - Rp 3.000.000",
          quota: gig.quota || 1,
          deadline: gig.deadline || "",
          rolesNeeded: Array.isArray(gig.rolesNeeded) ? gig.rolesNeeded.join(", ") : (gig.rolesNeeded || ""),
          techStack: Array.isArray(gig.techStack) ? gig.techStack.join(", ") : (gig.techStack || ""),
          description: gig.description || "",
        };
        this.editGigModalOpen = true;
      },

      submitEditGig() {
        if (!this.editingGigId || !this.editGigForm.title.trim()) return;
        const id = this.editingGigId;
        const f = this.editGigForm;
        this.gigs = this.gigs.map((g) => {
          if (g.id === id) {
            return {
              ...g,
              title: f.title.trim(),
              category: f.category,
              budgetRange: f.budgetRange,
              quota: Number(f.quota) || 1,
              deadline: f.deadline,
              rolesNeeded: typeof f.rolesNeeded === "string" ? f.rolesNeeded.split(",").map((s) => s.trim()).filter(Boolean) : (f.rolesNeeded || []),
              techStack: typeof f.techStack === "string" ? f.techStack.split(",").map((s) => s.trim()).filter(Boolean) : (f.techStack || []),
              description: f.description.trim(),
            };
          }
          return g;
        });
        if (typeof saveGigs === "function") saveGigs(this.gigs);
        this.editGigModalOpen = false;
        this.setToast("Rincian proyek berhasil diperbarui.");
      },

      deleteGig(id) {
        if (!confirm("Hapus proyek ini dari daftar proyek Anda?")) return;
        this.gigs = this.gigs.filter((g) => g.id !== id);
        if (typeof saveGigs === "function") saveGigs(this.gigs);
        this.editGigModalOpen = false;
        if (this.selectedGigId === id) {
          const first = this.gigs[0] || null;
          this.selectedGigId = first ? first.id : null;
        }
        this.setToast("Proyek berhasil dihapus.");
      },

      cancelGig(gigId) {
        if (!confirm("Apakah Anda yakin ingin membatalkan proyek ini?")) return;
        this.gigs = this.gigs.map((g) => (g.id === gigId ? { ...g, status: "Batal" } : g));
        if (typeof saveGigs === "function") saveGigs(this.gigs);
        this.setToast("Proyek telah dibatalkan.");
      },

      reopenGig(gigId) {
        this.gigs = this.gigs.map((g) => (g.id === gigId ? { ...g, status: "Terbuka" } : g));
        if (typeof saveGigs === "function") saveGigs(this.gigs);
        this.setToast("Proyek dibuka kembali di Papan Gigs.");
      },

      rejectApplicant(gigId, applicantId) {
        this.gigs = this.gigs.map((g) => {
          if (g.id === gigId) {
            return {
              ...g,
              applicants: (g.applicants || []).map((a) => (a.id === applicantId ? { ...a, status: "REJECTED" } : a)),
            };
          }
          return g;
        });
        if (typeof saveGigs === "function") saveGigs(this.gigs);

        if (this.activeGigReview && this.activeGigReview.id === gigId) {
          this.activeGigReview = this.gigs.find((g) => g.id === gigId);
        }

        this.myApplications = this.myApplications.map((app) => {
          if (app.gigId === gigId && app.id === applicantId) {
            return { ...app, status: "REJECTED" };
          }
          return app;
        });
        if (typeof saveMyApplications === "function") saveMyApplications(this.myApplications);
        this.setToast("Pelamar telah ditandai belum sesuai.");
      },

      withdrawApplication(appId, gigId) {
        if (!confirm("Tarik kembali pengajuan minat Anda untuk proyek ini?")) return;
        this.myApplications = this.myApplications.filter((a) => a.id !== appId);
        if (typeof saveMyApplications === "function") saveMyApplications(this.myApplications);

        this.gigs = this.gigs.map((g) => {
          if (g.id === gigId) {
            return {
              ...g,
              applicants: (g.applicants || []).filter((a) => a.id !== appId && a.applicantId !== this.currentUserId),
              applicantsCount: Math.max(0, (g.applicantsCount || 1) - 1),
            };
          }
          return g;
        });
        if (typeof saveGigs === "function") saveGigs(this.gigs);
        this.setToast("Pengajuan minat berhasil ditarik.");
      },

      setToast(msg) {
        this.toast = msg;
        setTimeout(() => {
          if (this.toast === msg) this.toast = "";
        }, 3500);
      }
    };
  }

  window.bengkodGigsExchange = bengkodGigsExchange;
  document.addEventListener("alpine:init", () => {
    Alpine.data("bengkodGigsExchange", bengkodGigsExchange);
  });
</script>
</body>
</html>
