<!DOCTYPE html>
<html lang="id" data-color-mode="light" class="h-full bg-[#EFF2F7]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launch Karya | Karya Alumni Bengkel Koding</title>
  <meta name="description" content="Publikasikan produk, aplikasi, atau proyek software karya Anda ke etalase Karya Alumni Bengkel Koding UDINUS.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/alumni-data.js"></script>
  <script src="assets/js/alumni-profile-data.js"></script>
  <script src="assets/js/alumni-catalog.js"></script>
  <script src="assets/js/portal-layout.js"></script>
  <script src="assets/js/karya-attachments.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    [x-cloak]:not(body) { display: none !important; }
    body { font-family: "Inter", sans-serif; }
  </style>
</head>
<body class="h-full bg-[#EFF2F7] text-[#212224] antialiased selection:bg-[#3A5988] selection:text-white" x-data="launchKaryaPage()">
  <main data-karya-page="Launch Karya" data-route="launch-karya" class="flex-1 p-6 lg:p-8 w-full max-w-[960px] mx-auto space-y-6">
    <div>
      <h1 class="text-[26px] font-semibold text-[#0C1117] tracking-[-0.01em]">Launch Karya Baru</h1>
      <p class="mt-1 text-[14px] text-[#6B7280]">Publikasikan produk atau aplikasi ke etalase alumni Bengkel Koding.</p>
    </div>

    <form @submit.prevent="submitForm()" class="space-y-6 rounded-[16px] border border-[#E3E4E9] bg-white p-6 shadow-sm lg:p-8">
      <!-- Identitas Karya -->
      <div class="space-y-4">
        <h3 class="text-[15px] font-bold text-[#0C1117]">1. Identitas Karya</h3>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="space-y-1.5 sm:col-span-2">
            <label for="karya-title" class="block text-[13.5px] font-medium text-[#212224]">
              Nama Karya / Judul Proyek <span class="text-red-500">*</span>
            </label>
            <input type="text"
                   id="karya-title" x-model="form.title"
                   required
                   placeholder="Contoh: Sentimeter AI - Multi-source Customer Sentiment Analyzer"
                   class="w-full h-11 px-3.5 rounded-[10px] border border-[#E3E4E9] bg-white focus:outline-none focus:border-[#3A5988] text-[14px]">
          </div>

          <div class="space-y-1.5">
            <label for="karya-period" class="block text-[13.5px] font-medium text-[#212224]">
              Periode Pengerjaan <span class="text-red-500">*</span>
            </label>
            <input type="text"
                   id="karya-period" x-model="form.period"
                   required
                   placeholder="Contoh: Jan 2026 – Sekarang"
                   class="w-full h-11 px-3.5 rounded-[10px] border border-[#E3E4E9] bg-white focus:outline-none focus:border-[#3A5988] text-[14px]">
          </div>

          <div class="space-y-1.5">
            <label for="karya-category" class="block text-[13.5px] font-medium text-[#212224]">
              Kategori Software
            </label>
            <select id="karya-category" x-model="form.category"
                    class="w-full h-11 px-3.5 rounded-[10px] border border-[#E3E4E9] bg-white focus:outline-none focus:border-[#3A5988] text-[14px]">
              <option value="Mobile App">Mobile App</option>
              <option value="Web App">Web App</option>
              <option value="AI & Data Science">AI & Data Science</option>
              <option value="Developer Tools">Developer Tools</option>
              <option value="UI/UX Design">UI/UX Design</option>
            </select>
          </div>

          <div class="space-y-1.5 sm:col-span-2">
            <label for="karya-tagline" class="block text-[13.5px] font-medium text-[#212224]">Tagline Ringkas</label>
            <input type="text"
                   id="karya-tagline" x-model="form.tagline"
                   placeholder="Contoh: Engine pemrosesan sentimen teks pelanggan secara real-time"
                   class="w-full h-11 px-3.5 rounded-[10px] border border-[#E3E4E9] bg-white focus:outline-none focus:border-[#3A5988] text-[14px]">
          </div>

          <div class="space-y-1.5 sm:col-span-2">
            <label for="karya-demo" class="block text-[13.5px] font-medium text-[#212224]">
              Tautan Website / Demo Live
            </label>
            <input type="url"
                   id="karya-demo" x-model="form.demoUrl"
                   placeholder="https://aplikasi-anda.com atau https://github.com/..."
                   class="w-full h-11 px-3.5 rounded-[10px] border border-[#E3E4E9] bg-white focus:outline-none focus:border-[#3A5988] text-[14px]">
          </div>
        </div>
      </div>

      <!-- Detail Teknis & Deskripsi -->
      <div class="space-y-4 pt-2">
        <h3 class="text-[15px] font-bold text-[#0C1117]">2. Detail Teknis &amp; Deskripsi</h3>

        <div class="space-y-4">
          <div class="space-y-1.5">
            <label for="karya-desc" class="block text-[13.5px] font-medium text-[#212224]">
              Deskripsi Lengkap <span class="text-red-500">*</span>
            </label>
            <textarea rows="4"
                      id="karya-desc" x-model="form.desc"
                      required
                      placeholder="Uraikan problem yang diselesaikan, arsitektur sistem, serta fitur kunci aplikasi..."
                      class="w-full p-3.5 rounded-[10px] border border-[#E3E4E9] bg-white focus:outline-none focus:border-[#3A5988] text-[14px] leading-relaxed resize-none"></textarea>
          </div>

          <!-- Tech Stack Tags -->
          <div class="relative space-y-1.5" @click.outside="skillSuggestionsOpen = false"
               @focusout="if (!$el.contains($event.relatedTarget)) skillSuggestionsOpen = false">
            <label for="karya-tech-stack" class="block text-[13.5px] font-medium text-[#212224]">Tech Stack yang Digunakan <span class="font-normal text-[#6B7280]">(Opsional)</span></label>
            <div class="flex flex-wrap items-center gap-2 p-3 rounded-[10px] border border-[#E3E4E9] bg-white min-h-[48px]">
              <template x-for="(st, idx) in form.skills" :key="st">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-[6px] bg-[#E2F1F9] text-[#3A5988] text-[12.5px] font-medium">
                  <span x-text="st"></span>
                  <button type="button" @click="removeSkill(idx)" class="text-[#3A5988] hover:text-red-600 font-bold" :aria-label="'Hapus ' + st">&times;</button>
                </span>
              </template>
              <input type="text"
                     id="karya-tech-stack" x-model="skillInput" autocomplete="off"
                     role="combobox" aria-autocomplete="list" aria-controls="karya-tech-suggestions"
                     :aria-expanded="showSkillSuggestions"
                     :aria-activedescendant="showSkillSuggestions && activeSkillIndex >= 0 ? 'karya-tech-option-' + activeSkillIndex : null"
                     @focus="skillSuggestionsOpen = true"
                     @input="skillSuggestionsOpen = true; activeSkillIndex = -1"
                     @keydown.down.prevent="moveSkillSuggestion(1)"
                     @keydown.up.prevent="moveSkillSuggestion(-1)"
                     @keydown.escape.prevent.stop="skillSuggestionsOpen = false; activeSkillIndex = -1"
                     @keydown.enter.prevent="addSkill(showSkillSuggestions ? skillSuggestions[activeSkillIndex] : undefined)"
                     @keydown.comma.prevent="addSkill()"
                     placeholder="Ketik teknologi lalu tekan Enter..."
                     class="flex-1 min-w-[180px] text-[13.5px] text-[#212224] placeholder-[#91969C] outline-none bg-transparent">
            </div>
            <ul id="karya-tech-suggestions" role="listbox" aria-label="Saran tech stack"
                x-show="showSkillSuggestions" x-cloak
                class="absolute inset-x-0 top-full z-10 rounded-[10px] border border-[#E3E4E9] bg-white p-1 text-[13.5px] text-[#212224] shadow-md">
              <template x-for="(skill, index) in skillSuggestions" :key="skill">
                <li :id="'karya-tech-option-' + index" role="option" :aria-selected="index === activeSkillIndex"
                    @mousedown.prevent @click="addSkill(skill)"
                    :class="index === activeSkillIndex ? 'bg-[#E2F1F9] text-[#3A5988]' : 'hover:bg-[#F4F5F7]'"
                    class="cursor-pointer rounded-[6px] px-3 py-2" x-text="skill"></li>
              </template>
            </ul>
          </div>

          <div class="space-y-1.5">
            <label for="karya-contributors" class="block text-[13.5px] font-medium text-[#212224]">Rekan Kontributor (Opsional)</label>
            <input type="text"
                   id="karya-contributors" x-model="contributorsInput"
                   placeholder="Nama rekan alumni (pisahkan koma jika lebih dari satu)"
                   class="w-full h-11 px-3.5 rounded-[10px] border border-[#E3E4E9] bg-white focus:outline-none focus:border-[#3A5988] text-[14px]">
          </div>
        </div>
      </div>

      <!-- Banner / Media Gambar -->
      <div class="space-y-4 pt-2">
        <h3 class="text-[15px] font-bold text-[#0C1117]">3. Media &amp; Banner Proyek</h3>

        <div class="space-y-2">
          <label for="karya-banner" class="block text-[13.5px] font-medium text-[#212224]">Banner Karya (URL Gambar)</label>
          <input type="text"
                 id="karya-banner" x-model="form.bannerUrl"
                 placeholder="assets/banner-dashboard.jpg atau tautan gambar..."
                 class="w-full h-11 px-3.5 rounded-[10px] border border-[#E3E4E9] bg-white focus:outline-none focus:border-[#3A5988] text-[14px]">
        </div>
      </div>

      <section class="space-y-3" aria-labelledby="karya-lampiran-title">
        <h2 id="karya-lampiran-title" class="text-[15px] font-bold text-[#0C1117]">
          4. Lampiran Karya <span class="text-[13.5px] font-normal text-[#6B7280]">(Opsional)</span>
        </h2>
        <p id="karya-lampiran-help" class="text-[13px] text-gray-500">
          Pilih satu atau beberapa file JPG, PNG, atau PDF, maksimal <span x-text="fileLimitMb"></span> MB per file.
        </p>
        <input id="karya-lampiran" type="file" multiple
               accept=".jpg,.jpeg,.png,.pdf,image/jpeg,image/png,application/pdf"
               aria-label="Pilih file lampiran karya" aria-describedby="karya-lampiran-help"
               :disabled="busy" @change="pickAttachments($event)"
               class="block w-full rounded-md border border-[#E3E4E9] p-2 text-[13px] text-gray-600 file:mr-3 file:rounded file:border-0 file:bg-[#E2F1F9] file:px-3 file:py-2 file:font-semibold file:text-[#3A5988]">
        <ul class="space-y-2" aria-label="File yang dilampirkan">
          <template x-for="(attachment, index) in attachments" :key="index">
            <li class="flex items-center justify-between gap-3 rounded-md bg-gray-50 px-3 py-2 text-[13px]">
              <span class="min-w-0 break-words" x-text="attachment.name"></span>
              <button type="button" :disabled="busy" @click="attachments.splice(index, 1)"
                      :aria-label="'Hapus ' + attachment.name" class="shrink-0 font-semibold text-[#3A5988] hover:underline">Hapus</button>
            </li>
          </template>
        </ul>
      </section>
      <p x-cloak x-show="error" x-text="error" role="alert" class="rounded-md bg-red-50 px-3 py-2 text-sm text-red-700"></p>

      <div class="flex flex-wrap items-center justify-end gap-3 border-t border-[#E3E4E9] pt-4">
        <a href="showcase.html"
           class="inline-flex h-10 items-center rounded-[8px] border border-[#E3E4E9] px-5 text-[13.5px] font-medium text-[#212224] transition-colors hover:bg-[#F4F5F7]">
          Batal
        </a>
        <button type="submit" :disabled="!isValid || busy"
                class="h-10 rounded-[8px] bg-[#3A5988] px-6 text-[13.5px] font-medium text-white shadow-sm transition-colors hover:bg-[#496DA8] disabled:cursor-not-allowed disabled:opacity-50"
                x-text="busy ? 'Memproses…' : 'Publikasikan Karya'">Publikasikan Karya</button>
      </div>
    </form>
  </main>

<script>
  function launchKaryaPage() {
    const skillOptions = SKILL_OPTIONS.filter(group => group.group !== "Soft Skills").flatMap(group => group.items);
    return {
      profile: alumniProfileForBoard(),
      skillInput: "",
      skillSuggestionsOpen: false,
      activeSkillIndex: -1,
      contributorsInput: "",
      attachments: [],
      fileLimitMb: KARYA_FILE_LIMIT_MB,
      busy: false,
      error: "",
      form: {
        title: "",
        period: "",
        tagline: "",
        category: "Mobile App",
        demoUrl: "",
        desc: "",
        skills: [],
        bannerUrl: "",
      },

      get isValid() {
        return Boolean(this.form.title.trim() && this.form.period.trim() && this.form.desc.trim());
      },

      get skillSuggestions() {
        const query = this.skillInput.trim().toLowerCase();
        if (!query) return [];
        const selected = new Set(this.form.skills.map(skill => skill.toLowerCase()));
        return skillOptions.filter(skill => {
          const name = skill.toLowerCase();
          return name.includes(query) && !selected.has(name);
        }).slice(0, 5);
      },

      get showSkillSuggestions() {
        return this.skillSuggestionsOpen && this.skillSuggestions.length > 0;
      },

      moveSkillSuggestion(direction) {
        const lastIndex = this.skillSuggestions.length - 1;
        if (lastIndex < 0) return;
        this.skillSuggestionsOpen = true;
        this.activeSkillIndex = this.activeSkillIndex < 0 && direction < 0
          ? lastIndex : Math.max(0, Math.min(lastIndex, this.activeSkillIndex + direction));
      },

      addSkill(value = this.skillInput) {
        const val = value.replace(/,/g, "").trim();
        const normalized = val.toLowerCase();
        if (val && !this.form.skills.some(skill => skill.toLowerCase() === normalized)) {
          this.form.skills.push(skillOptions.find(skill => skill.toLowerCase() === normalized) || val);
        }
        this.skillInput = "";
        this.skillSuggestionsOpen = false;
        this.activeSkillIndex = -1;
      },

      removeSkill(idx) {
        this.form.skills.splice(idx, 1);
      },

      async pickAttachments(event) {
        const files = Array.from(event.target.files);
        event.target.value = "";
        if (!files.length || this.busy) return;
        this.busy = true;
        this.error = "";
        try {
          const selected = await Promise.all(files.map(async file => ({
            file, name: file.name, size: file.size, type: await validateKaryaFile(file)
          })));
          this.attachments.push(...selected);
        } catch (error) {
          this.error = error?.message || "Lampiran gagal dibaca.";
        } finally {
          this.busy = false;
        }
      },

      async submitForm() {
        if (!this.isValid || this.busy) return;
        this.busy = true;
        this.error = "";
        this.addSkill();

        const contributorsList = this.contributorsInput
          .split(",")
          .map((s) => s.trim())
          .filter(Boolean)
          .map((name, idx) => ({ id: "c-" + idx, name }));

        const newProject = {
          id: Date.now(),
          title: this.form.title.trim(),
          tagline: this.form.tagline.trim() || this.form.desc.slice(0, 100),
          category: this.form.category.trim() || "Software",
          categoryTags: [this.form.category.trim() || "Software"],
          period: this.form.period.trim(),
          demoUrl: this.form.demoUrl.trim(),
          linkUrl: this.form.demoUrl.trim(),
          bannerUrl: this.form.bannerUrl.trim(),
          imageUrl: this.form.bannerUrl.trim(),
          desc: this.form.desc.trim(),
          tags: [...this.form.skills],
          attachments: this.attachments.map(({ name, size, type }) => ({ name, size, type })),
          contributors: contributorsList,
          contributor: contributorsList[0] ? contributorsList[0].name : undefined,
          stage: "LIVE",
          date: "Baru saja",
        };

        let filesSaved = false;
        try {
          if (this.attachments.length) {
            const files = this.attachments.map(({ file, size, type }) => file.slice(0, size, type));
            await karyaFileRequest("readwrite", store => store.add(files, newProject.id));
            filesSaved = true;
          }

          const projects = loadStoredProjects();
          if (!saveStoredProjects([newProject, ...projects])) throw new Error();
          if (!syncProjectToFeed(newProject, { ...this.profile, avatarUrl: this.profile.avatar })) {
            saveStoredProjects(projects);
            throw new Error();
          }
        } catch {
          if (filesSaved) {
            try {
              await karyaFileRequest("readwrite", store => store.delete(newProject.id));
            } catch (error) {
              console.error("Gagal membersihkan file karya:", error);
            }
          }
          this.error = "Karya gagal disimpan. Periksa ruang penyimpanan browser atau kurangi ukuran file.";
          this.busy = false;
          return;
        }

        try {
          sessionStorage.setItem("bengkod_toast", `Karya "${newProject.title}" berhasil diluncurkan!`);
        } catch {}
        window.location.href = "showcase.html";
      },
    };
  }

  document.addEventListener("alpine:init", () => {
    Alpine.data("launchKaryaPage", launchKaryaPage);
  });
</script>
  <script>mountAlumniPortal(document.querySelector('main'));</script>
</body>
</html>
