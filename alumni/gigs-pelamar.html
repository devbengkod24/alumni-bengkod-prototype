<!DOCTYPE html>
<html lang="id" data-color-mode="light" class="h-full bg-[#EFF2F7]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pelamar Proyek | Bengkel Koding UDINUS</title>
  <meta name="description" content="Tinjau pengajuan minat dari alumni untuk proyek yang Anda terbitkan.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/alumni-data.js"></script>
  <script src="assets/js/alumni-catalog.js"></script>
  <script src="assets/js/alumni-profile-data.js"></script>
  <script src="assets/js/alumni-cv.js"></script>
  <script src="assets/js/portal-layout.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    [x-cloak] { display: none !important; }
    body { font-family: Inter, sans-serif; }
    #reject-applicant-dialog::backdrop { background: rgb(12 17 23 / 50%); }
    .applicant-workspace { container-type: inline-size; }
    .applicant-review {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: start;
      gap: 0.875rem;
    }
    @container (width < 38rem) {
      .applicant-review[data-detail-open="true"] .applicant-list,
      .applicant-review:not([data-detail-open="true"]) .applicant-detail { display: none; }
    }
    @container (min-width: 38rem) {
      .applicant-review { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); }
      .applicant-review .applicant-list,
      .applicant-review .applicant-detail {
        display: block;
        max-block-size: max(22rem, calc(100dvh - var(--portal-navbar-height, 64px) - 12rem));
        overflow-y: auto;
      }
      .applicant-review .applicant-return { display: none; }
    }
  </style>
</head>
<body class="h-full bg-[#EFF2F7] text-[#212224] antialiased">
<main data-route="gigs-pelamar" x-data="bengkodGigPelamar" class="w-full flex-1 space-y-5 p-4 sm:p-6">
  <a href="gigs.html?tab=my_gigs" class="inline-flex items-center gap-2 text-[13px] font-semibold text-[#3A5988] hover:underline">
    <span aria-hidden="true">←</span> Kembali ke Proyek Dibuat
  </a>

  <section x-show="!gig" x-cloak class="rounded-2xl border border-[#E3E4E9] bg-white p-8 text-center shadow-sm">
    <h1 class="text-lg font-bold text-[#0C1117]">Proyek tidak ditemukan</h1>
    <p class="mt-1 text-sm text-[#6B7280]">Halaman pelamar tersedia untuk proyek yang Anda terbitkan.</p>
  </section>

  <template x-if="gig">
    <div class="applicant-workspace space-y-5">
      <header class="space-y-1.5">
        <h1 class="text-2xl font-bold tracking-tight text-[#0C1117] sm:text-[28px]">Pelamar Proyek</h1>
        <p class="break-words text-[15px] font-medium text-[#3A5988]" x-text="gig.title"></p>
      </header>

      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap gap-2" role="group" aria-label="Filter status pelamar">
          <template x-for="tab in filters" :key="tab.id">
            <button type="button" @click="setFilter(tab.id)" :aria-pressed="filter === tab.id"
                    :class="filter === tab.id ? 'border-[#3A5988] bg-[#3A5988] text-white' : 'border-[#E3E4E9] bg-white text-[#374151] hover:border-[#3A5988]'"
                    class="rounded-full border px-3.5 py-2 text-[12.5px] font-semibold transition-colors">
              <span x-text="tab.label"></span> <span x-text="'(' + applicantCount(tab.id) + ')'"></span>
            </button>
          </template>
        </div>
        <label class="flex items-center gap-2 text-[13px] text-[#4B5563]">
          Urutkan
          <select x-model="sort" class="rounded-[9px] border border-[#E3E4E9] bg-white px-2.5 py-2 font-medium text-[#212224]">
            <option value="newest">Terbaru masuk</option>
            <option value="oldest">Terlama masuk</option>
          </select>
        </label>
      </div>

      <template x-if="!filteredApplicants.length">
        <div class="rounded-2xl border border-[#E3E4E9] bg-white p-8 text-center shadow-sm">
          <p class="text-[15px] font-semibold text-[#0C1117]" x-text="applicants.length ? 'Tidak ada pelamar dengan status ini' : 'Belum ada pelamar'"></p>
          <p x-show="!applicants.length" class="mt-1 text-sm text-[#6B7280]">Pengajuan minat untuk proyek ini akan muncul di sini.</p>
        </div>
      </template>

      <div x-show="filteredApplicants.length" class="applicant-review" :data-detail-open="detailOpen ? 'true' : 'false'">
        <ul x-ref="applicantList" class="applicant-list min-w-0 space-y-2" aria-label="Daftar pelamar">
          <template x-for="app in filteredApplicants" :key="app.id">
            <li>
              <button type="button" :aria-pressed="selectedApplicant?.id === app.id" aria-controls="applicant-detail" @click="selectApplicant(app.id)"
                      :class="selectedApplicant?.id === app.id ? 'border-[#DCE4EF] border-l-[#3A5988] bg-white shadow-sm' : 'border-[#E3E4E9] border-l-transparent bg-[#F4F5F7] hover:bg-white'"
                      class="w-full space-y-2 rounded-[10px] border border-l-[3px] p-3 text-left transition-colors">
                <div class="flex items-start gap-2.5">
                  <img :src="app.applicantAvatar || DEFAULT_AVATAR" alt="" class="h-9 w-9 shrink-0 rounded-[9px] border border-[#E3E4E9] object-cover">
                  <div class="min-w-0 flex-1 space-y-1">
                    <div class="flex flex-wrap items-start gap-x-2 gap-y-1">
                      <span class="break-words text-[14px] font-bold text-[#0C1117]" x-text="app.applicantName"></span>
                      <span class="rounded-full px-2 py-0.5 text-[11px] font-semibold" :class="statusBadge(app).style" x-text="statusBadge(app).label"></span>
                    </div>
                    <p class="text-[12px] text-[#6B7280]" x-text="app.applicantBatch ? 'Angkatan ' + app.applicantBatch : 'Alumni Bengkel Koding'"></p>
                  </div>
                </div>
                <div x-show="app.skills?.length" class="flex flex-wrap gap-1.5">
                  <template x-for="(skill, index) in (app.skills || []).slice(0, 4)" :key="index">
                    <span class="rounded bg-[#EFF2F7] px-2 py-0.5 text-[11px] font-medium text-[#4B5563]" x-text="skill"></span>
                  </template>
                </div>
                <p class="text-[12px] text-[#6B7280]">Masuk <span class="font-medium text-[#4B5563]" x-text="formatDate(app.appliedDate)"></span></p>
              </button>
            </li>
          </template>
        </ul>

        <template x-if="selectedApplicant">
          <article id="applicant-detail" x-ref="applicantDetail" class="applicant-detail min-w-0 overflow-hidden rounded-2xl border border-[#E3E4E9] bg-white shadow-sm" aria-labelledby="applicant-name">
            <button type="button" x-ref="applicantReturn" @click="showApplicantList()"
                    class="applicant-return m-4 inline-flex items-center gap-1.5 text-[13px] font-semibold text-[#3A5988] hover:underline">
              <span aria-hidden="true">←</span> Daftar pelamar
            </button>
            <header class="flex flex-wrap items-start justify-between gap-4 border-b border-[#E3E4E9] bg-[#F8FAFC] p-4 sm:p-5">
              <div class="flex min-w-0 items-start gap-3">
                <img :src="selectedApplicant.applicantAvatar || DEFAULT_AVATAR" alt="" class="h-[52px] w-[52px] shrink-0 rounded-[12px] border border-[#E3E4E9] object-cover">
                <div class="min-w-0 space-y-1">
                  <h2 id="applicant-name" tabindex="-1" class="break-words text-lg font-bold text-[#0C1117]" x-text="selectedApplicant.applicantName"></h2>
                  <div class="flex flex-wrap items-center gap-2">
                    <span class="rounded-full px-2 py-0.5 text-[11px] font-semibold" :class="statusBadge(selectedApplicant).style" x-text="statusBadge(selectedApplicant).label"></span>
                    <span class="text-[12px] text-[#6B7280]" x-text="selectedApplicant.applicantBatch ? 'Angkatan ' + selectedApplicant.applicantBatch : 'Alumni Bengkel Koding'"></span>
                  </div>
                </div>
              </div>
              <div x-show="gig.budgetRange" class="space-y-1">
                <p class="text-[11px] font-medium text-[#6B7280]">Anggaran proyek</p>
                <p class="text-[14px] font-bold text-[#3A5988]" x-text="gig.budgetRange"></p>
              </div>
            </header>

            <div class="space-y-5 p-4 sm:p-5">
              <dl class="grid gap-2.5 sm:grid-cols-2">
                <div class="rounded-[10px] bg-[#F4F5F7] p-3">
                  <dt class="text-[11px] font-semibold text-[#6B7280]">Tanggal pengajuan</dt>
                  <dd class="mt-1 text-[13px] font-semibold" x-text="formatDate(selectedApplicant.appliedDate)"></dd>
                </div>
                <div class="min-w-0 rounded-[10px] bg-[#F4F5F7] p-3">
                  <dt class="text-[11px] font-semibold text-[#6B7280]">Kontak pelamar</dt>
                  <dd class="mt-1 break-all text-[13px] font-semibold" x-text="emailOf(selectedApplicant) || 'Email belum tersedia'"></dd>
                  <dd x-show="selectedApplicant.applicantPhone" class="mt-0.5 text-[12px] text-[#6B7280]" x-text="selectedApplicant.applicantPhone"></dd>
                </div>
              </dl>

              <section class="space-y-2">
                <h3 class="text-[13px] font-semibold text-[#0C1117]">Pesan pengajuan</h3>
                <p class="whitespace-pre-wrap break-words rounded-[10px] bg-[#F4F5F7] p-3.5 text-[13.5px] leading-relaxed"
                   x-text="selectedApplicant.pitchMessage || 'Tidak ada pesan pengajuan.'"></p>
              </section>

              <section class="space-y-2">
                <h3 class="text-[13px] font-semibold text-[#0C1117]">CV dan portofolio</h3>
                <div x-show="canViewCv(selectedApplicant)" class="flex flex-wrap items-center justify-between gap-2 rounded-[10px] border border-[#E3E4E9] p-3">
                  <p class="min-w-0 break-all text-[13px] font-medium" x-text="selectedApplicant.resumeFileName || 'CV dari profil alumni'"></p>
                  <button type="button" @click="openCvViewer(selectedApplicant.applicantId || selectedApplicant.applicantName)" class="text-[13px] font-semibold text-[#3A5988] hover:underline">Lihat CV</button>
                </div>
                <template x-for="link in portfolioLinks(selectedApplicant)" :key="link.url">
                  <a :href="link.url" target="_blank" rel="noopener noreferrer"
                     class="flex items-center justify-between gap-3 rounded-[10px] border border-[#E3E4E9] bg-[#F4F7FB] p-3 text-[#3A5988] transition-colors hover:border-[#3A5988]">
                    <span class="min-w-0">
                      <span class="block break-words text-[13px] font-semibold" x-text="link.title"></span>
                      <span x-show="link.detail" class="mt-0.5 block break-words text-[12px] text-[#6B7280]" x-text="link.detail"></span>
                    </span>
                    <span aria-hidden="true">↗</span>
                  </a>
                </template>
                <p x-show="!portfolioLinks(selectedApplicant).length" class="text-[13px] text-[#6B7280]">Tidak ada tautan portofolio.</p>
              </section>

              <section x-show="selectedApplicant.rejectionReason" class="space-y-1.5 rounded-[10px] bg-red-50 p-3 text-red-800">
                <h3 class="text-[13px] font-semibold">Alasan penolakan</h3>
                <p class="whitespace-pre-wrap break-words text-[13px]" x-text="selectedApplicant.rejectionReason"></p>
              </section>
            </div>

            <footer class="flex flex-wrap items-center justify-end gap-2.5 border-t border-[#E3E4E9] bg-[#F8FAFC] p-4 sm:p-5">
              <template x-if="applicantStatus(selectedApplicant) === 'pending'">
                <div class="flex gap-2">
                  <button type="button" @click="openReject(selectedApplicant)" class="rounded-[9px] bg-red-50 px-4 py-2 text-[13px] font-semibold text-red-700 hover:bg-red-100">Tolak</button>
                  <button type="button" @click="decide(selectedApplicant.id, 'ACCEPTED')" class="rounded-[9px] border border-[#3A5988] px-4 py-2 text-[13px] font-semibold text-[#3A5988] hover:bg-[#EFF2F7]">Terima</button>
                </div>
              </template>
              <template x-if="emailOf(selectedApplicant)">
                <a :href="contactLink(selectedApplicant)" class="inline-flex items-center gap-2 rounded-[9px] bg-[#3A5988] px-4 py-2 text-[13px] font-semibold text-white hover:bg-[#496DA8]">
                  Hubungi <span aria-hidden="true">↗</span>
                </a>
              </template>
            </footer>
          </article>
        </template>
      </div>
    </div>
  </template>

  <dialog id="reject-applicant-dialog" x-ref="rejectDialog" aria-labelledby="reject-title"
          @click.self="$el.close()" @close="rejectTarget = null; rejectReason = ''; rejectError = ''"
          class="m-auto max-h-[calc(100%-2rem)] w-[calc(100%-2rem)] max-w-md overflow-y-auto rounded-2xl border border-[#E3E4E9] bg-white text-[#212224] shadow-xl">
    <form @submit.prevent="submitRejection()" class="space-y-4 p-5 sm:p-6">
      <div class="space-y-1">
        <h2 id="reject-title" class="text-lg font-bold text-[#0C1117]">Tolak Pengajuan</h2>
        <p class="text-[13px] text-[#6B7280]">Tuliskan alasan penolakan untuk <strong x-text="rejectTarget?.applicantName"></strong>.</p>
      </div>
      <div class="space-y-2">
        <label for="reject-reason" class="block text-[13px] font-semibold">Alasan penolakan</label>
        <textarea id="reject-reason" x-model="rejectReason" @input="rejectError = ''" required autofocus rows="4" maxlength="500"
                  placeholder="Jelaskan alasan penolakan pengajuan ini."
                  class="w-full resize-y rounded-[10px] border border-[#E3E4E9] px-3 py-2.5 text-[13.5px] outline-none focus:border-[#3A5988]"></textarea>
        <p x-show="rejectError" x-text="rejectError" role="alert" class="text-[13px] text-red-700"></p>
      </div>
      <div class="flex flex-wrap justify-end gap-2">
        <button type="button" @click="$refs.rejectDialog.close()" class="rounded-[9px] border border-[#E3E4E9] px-4 py-2 text-[13px] font-semibold hover:bg-[#F4F5F7]">Batal</button>
        <button type="submit" class="rounded-[9px] bg-red-700 px-4 py-2 text-[13px] font-semibold text-white hover:bg-red-800">Tolak Pengajuan</button>
      </div>
    </form>
  </dialog>

  <p x-show="toast" x-cloak x-text="toast" role="status"
     class="fixed bottom-5 right-5 z-[90] max-w-[calc(100vw-2.5rem)] rounded-xl bg-[#212224] px-4 py-3 text-[13px] text-white shadow-lg"></p>
</main>
<script src="assets/js/gigs-pelamar.js"></script>
<script>mountAlumniPortal(document.querySelector("main"));</script>
</body>
</html>
