<!DOCTYPE html>
<html lang="id" data-color-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pelamar Proyek | Bengkel Koding UDINUS</title>
  <meta name="description" content="Daftar pelamar untuk proyek gigs yang Anda terbitkan.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/page-skeleton.js"></script>
  <script src="assets/js/alumni.js"></script>
  <script src="assets/js/alumni-data.js"></script>
  <script src="assets/js/alumni-profile-data.js"></script>
  <script src="assets/js/alumni-cv.js"></script>
  <script src="../assets/js/store.js"></script>
</head>
<body>
<!-- Halaman pelamar satu proyek (dibuka dari tab Proyek Dibuat di gigs.html: gigs-pelamar.html?id=<gigId>) -->
<main data-route="gigs-pelamar">
  <div x-data="bengkodGigPelamar" class="w-full flex flex-col gap-6 py-2">

    <!-- Toast -->
    <template x-if="toast">
      <div class="fixed bottom-6 right-6 z-[90] bg-gray-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3.5 animate-fade-in text-[14px] max-w-md">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 shrink-0"></span>
        <span class="flex-1" x-text="toast"></span>
      </div>
    </template>

    <a href="gigs.html?tab=my_gigs" class="inline-flex items-center gap-1.5 text-[14px] font-semibold text-[#1E3A8A] hover:underline w-fit">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      <span>Kembali ke Proyek Dibuat</span>
    </a>

    <!-- Proyek tidak ditemukan / bukan milik sendiri -->
    <template x-if="!gig">
      <div class="bg-white rounded-xl border border-gray-200 p-12 text-center space-y-2">
        <p class="text-[17px] font-semibold text-gray-900">Proyek tidak ditemukan</p>
        <p class="text-[14px] text-gray-500">Proyek ini sudah dihapus atau bukan proyek yang Anda terbitkan.</p>
      </div>
    </template>

    <template x-if="gig">
      <div class="flex flex-col gap-6">
        <!-- Header proyek -->
        <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4 pb-4 border-b border-gray-200">
          <div class="min-w-0">
            <p class="text-[13px] font-semibold uppercase tracking-wide text-gray-500">Pelamar Proyek</p>
            <h1 class="text-2xl sm:text-3xl font-bold text-[#1E3A8A] tracking-tight mt-1" x-text="gig.title"></h1>
            <p class="text-[14px] sm:text-[15px] text-gray-500 mt-1" x-text="gig.category + ' · ' + gig.budgetRange + ' · Tenggat ' + (gig.deadline || '-')"></p>
          </div>
          <div class="shrink-0 flex flex-wrap items-center gap-2.5">
            <a :href="'gigs.html?gig=' + encodeURIComponent(gig.id)"
              class="inline-flex items-center gap-2 px-5 h-9 rounded-full text-[14px] font-semibold text-gray-700 border border-gray-300 hover:border-[#1E3A8A] hover:text-[#1E3A8A] hover:bg-blue-50/40 transition-colors whitespace-nowrap">
              Lihat di Papan Gigs
            </a>
          </div>
        </div>

        <!-- Daftar pelamar -->
        <div class="space-y-4">
          <template x-if="applicants.length === 0">
            <div class="bg-white rounded-xl border border-gray-200 py-16 px-6 text-center">
              <div class="w-12 h-12 rounded-full bg-blue-50 text-[#1E3A8A] flex items-center justify-center mx-auto mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              </div>
              <h3 class="text-[16px] font-normal text-gray-900">Belum ada rekan yang mengajukan minat</h3>
              <p class="text-[14px] text-gray-500 mt-1 max-w-md mx-auto font-normal">Pengajuan kolaborasi dari rekan alumni untuk proyek ini akan otomatis terdata di sini.</p>
            </div>
          </template>

              <template x-for="app in applicants" :key="app.id">
                <div class="p-5 sm:p-6 rounded-xl border border-gray-200 bg-white hover:border-gray-300 transition-all space-y-4 shadow-2xs">
                  <!-- Baris Atas Pelamar: Profil, Status, dan Tombol Aksi -->
                  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div class="flex items-center gap-3.5">
                      <img :src="app.applicantAvatar || DEFAULT_AVATAR" class="w-11 h-11 rounded-full object-cover border border-gray-200 shrink-0" :alt="app.applicantName">
                      <div>
                        <h4 class="text-[14px] font-normal text-gray-900" x-text="app.applicantName"></h4>
                        <p class="text-[14px] text-gray-500 font-normal" x-text="'Alumni ' + (app.applicantBatch || 'Bengkod') + ' · Diajukan ' + (app.appliedDate || '-')"></p>
                      </div>
                    </div>

                    <div class="flex items-center gap-2.5 self-end sm:self-center">
                      <!-- Belum diputuskan: pemilik hanya bisa Terima atau Tolak -->
                      <template x-if="!isDecided(app)">
                        <div class="flex items-center gap-2">
                          <button
                            type="button"
                            @click="rejectApplicant(gig.id, app.id)"
                            class="px-4 py-1.5 rounded-full border border-gray-200 hover:border-red-200 hover:bg-red-50 hover:text-red-600 text-gray-600 text-[13px] font-normal transition-colors cursor-pointer"
                          >
                            Tolak
                          </button>
                          <button
                            type="button"
                            @click="acceptApplicant(gig.id, app)"
                            class="px-4 py-1.5 rounded-full bg-[#1E3A8A] hover:bg-[#1D4ED8] text-white text-[13px] font-normal transition-colors cursor-pointer shadow-2xs"
                          >
                            Terima
                          </button>
                        </div>
                      </template>

                      <!-- Sudah diputuskan: tampilkan hasilnya -->
                      <template x-if="isDecided(app)">
                        <span class="px-3 py-1 rounded-full text-[13px] font-normal border"
                          :class="isAccepted(app) ? 'bg-blue-50 text-[#1E3A8A] border-blue-200' : 'bg-gray-100 text-gray-500 border-gray-200'"
                          x-text="isAccepted(app) ? 'Diterima' : 'Ditolak'"></span>
                      </template>
                      <template x-if="isAccepted(app) && app.applicantPhone">
                        <a
                          :href="'https://wa.me/' + (app.applicantPhone.replace(/\D/g, ''))"
                          target="_blank"
                          class="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full border border-gray-200 hover:border-gray-300 hover:bg-gray-50 text-gray-700 text-[13px] font-normal transition-colors"
                        >
                          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                          <span>Hubungi WA</span>
                        </a>
                      </template>
                    </div>
                  </div>

                  <!-- Detail Pelamar: ATAS BAWAH (Font Normal, Tidak Bold, Semua Font 14px Seragam) -->
                  <div class="space-y-4 pt-4 border-t border-gray-100 text-[14px]">
                    <!-- 1. Nama Lengkap -->
                    <div class="space-y-1">
                      <span class="block text-[14px] font-normal text-gray-500">Nama Lengkap</span>
                      <p class="font-normal text-gray-900 text-[14px]" x-text="app.applicantName"></p>
                    </div>

                    <!-- 2. Nomor WhatsApp / HP Kontak * -->
                    <div class="space-y-1">
                      <span class="block text-[14px] font-normal text-gray-500">Nomor WhatsApp / HP Kontak <span class="text-red-500 font-normal">*</span></span>
                      <p class="font-normal text-gray-900 text-[14px]" x-text="app.applicantPhone || '-'"></p>
                    </div>

                    <!-- 3. CV terlampir (resumeFileName disimpan saat melamar) -->
                    <div class="space-y-1">
                      <span class="block text-[14px] font-normal text-gray-500">CV Terlampir</span>
                      <template x-if="app.resumeFileName">
                        <button type="button" @click="openCvPdf(app.applicantName, { format: app.resumeFormat || (/_MODERN\.pdf$/.test(app.resumeFileName || '') ? 'modern' : 'ats') })" class="inline-flex items-center gap-1.5 text-[#1E3A8A] hover:underline font-normal text-[14px] text-left break-all cursor-pointer">
                          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                          <span x-text="app.resumeFileName"></span>
                          <span class="text-gray-400 text-[12px] shrink-0">(Lihat CV)</span>
                        </button>
                      </template>
                      <template x-if="!app.resumeFileName">
                        <p class="text-gray-400 font-normal text-[14px] italic">Tidak ada CV terlampir</p>
                      </template>
                    </div>

                    <!-- 4. Tautan Portofolio / GitHub Terkait -->
                    <div class="space-y-1">
                      <span class="block text-[14px] font-normal text-gray-500">Tautan Portofolio / GitHub Terkait <span class="text-gray-400">(opsional)</span></span>
                      <div>
                        <template x-if="app.portfolioUrl">
                          <a :href="app.portfolioUrl" target="_blank" class="inline-flex items-center gap-1.5 text-[#1E3A8A] hover:underline font-normal text-[14px] break-all">
                            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                            <span x-text="app.portfolioUrl"></span>
                          </a>
                        </template>
                        <template x-if="!app.portfolioUrl && (app.portfolioItems || []).length > 0">
                          <div class="flex flex-col gap-1.5">
                            <template x-for="p in (app.portfolioItems || [])" :key="p.linkUrl || p.title">
                              <a :href="p.linkUrl || 'https://github.com'" target="_blank" class="inline-flex items-center gap-1.5 text-[#1E3A8A] hover:underline font-normal text-[14px] break-all">
                                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                                <span x-text="(p.linkUrl || p.title) + (p.stack ? ' (' + p.stack + ')' : '')"></span>
                              </a>
                            </template>
                          </div>
                        </template>
                        <template x-if="!app.portfolioUrl && (!app.portfolioItems || app.portfolioItems.length === 0)">
                          <p class="text-gray-400 font-normal text-[14px] italic">Tidak ada tautan terlampir</p>
                        </template>
                      </div>
                    </div>

                    <!-- 5. Pesan Singkat & Pitching Keahlian * -->
                    <div class="space-y-1">
                      <span class="block text-[14px] font-normal text-gray-500">Pesan Singkat &amp; Pitching Keahlian <span class="text-red-500 font-normal">*</span></span>
                      <p class="font-normal text-gray-800 text-[14px] leading-relaxed whitespace-pre-line" x-text="app.pitchMessage || '-'"></p>
                    </div>
                  </div>
                </div>
              </template>
        </div>
      </div>
    </template>
  </div>
</main>

<script>
  function bengkodGigPelamar() {
    const gigId = new URLSearchParams(window.location.search).get("id");

    return {
      DEFAULT_AVATAR: typeof DEFAULT_AVATAR !== "undefined" ? DEFAULT_AVATAR : "",
      currentUserId: "aisha-dwi-rahmawati",
      gigs: typeof loadGigs === "function" ? loadGigs() : (window.INITIAL_GIGS || []),
      myApplications: typeof loadMyApplications === "function" ? loadMyApplications() : [],
      toast: "",

      init() {
        window.addEventListener("bengkod_gigs_updated", () => this.muat());
        if (this.gig) document.title = `Pelamar: ${this.gig.title} | Bengkel Koding UDINUS`;
      },

      muat() {
        this.gigs = typeof loadGigs === "function" ? loadGigs() : this.gigs;
      },

      // Hanya proyek milik sendiri yang pelamarnya boleh dilihat
      get gig() {
        return this.gigs.find((g) => g.id === gigId && g.ownerId === this.currentUserId) || null;
      },

      get applicants() {
        return (this.gig && this.gig.applicants) || [];
      },

      isAccepted(app) {
        return app.status === "ACCEPTED" || app.status === "COMPLETED";
      },

      isDecided(app) {
        return this.isAccepted(app) || app.status === "REJECTED";
      },

      simpanGigs(updated) {
        this.gigs = updated;
        if (typeof saveGigs === "function") saveGigs(updated);
      },

      // Terima pelamar: hanya menandai lamaran diterima (proyek tidak punya status pengerjaan)
      acceptApplicant(gigId, applicant) {
        this.simpanGigs(this.gigs.map((g) => {
          if (g.id !== gigId) return g;
          return { ...g, applicants: (g.applicants || []).map((a) => (a.id === applicant.id ? { ...a, status: "ACCEPTED" } : a)) };
        }));
        this.myApplications = this.myApplications.map((app) => (app.gigId === gigId && app.id === applicant.id ? { ...app, status: "ACCEPTED" } : app));
        if (typeof saveMyApplications === "function") saveMyApplications(this.myApplications);
        this.setToast(`${applicant.applicantName} diterima. Hubungi lewat WhatsApp untuk koordinasi.`);
      },

      rejectApplicant(gigId, applicantId) {
        this.simpanGigs(this.gigs.map((g) => {
          if (g.id !== gigId) return g;
          return { ...g, applicants: (g.applicants || []).map((a) => (a.id === applicantId ? { ...a, status: "REJECTED" } : a)) };
        }));

        this.myApplications = this.myApplications.map((app) => (app.gigId === gigId && app.id === applicantId ? { ...app, status: "REJECTED" } : app));
        if (typeof saveMyApplications === "function") saveMyApplications(this.myApplications);
        this.setToast("Pelamar telah ditandai belum sesuai.");
      },

      setToast(msg) {
        this.toast = msg;
        setTimeout(() => {
          if (this.toast === msg) this.toast = "";
        }, 4000);
      },
    };
  }

  window.bengkodGigPelamar = bengkodGigPelamar;
  document.addEventListener("alpine:init", () => {
    Alpine.data("bengkodGigPelamar", bengkodGigPelamar);
  });
</script>
</body>
</html>
