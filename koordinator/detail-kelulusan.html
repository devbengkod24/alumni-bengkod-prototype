<!DOCTYPE html>
<html lang="id" data-role="admin">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rincian Kelulusan Alumni | Koordinator Bengkel Koding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css?v=5">
  <script src="../alumni/assets/js/data.js?v=9"></script>
  <script src="../alumni/assets/js/app.js?v=6"></script>
  <script src="../assets/js/page-skeleton.js?v=5"></script>
  <script src="../assets/js/main.js?v=5"></script>
</head>
<body class="bg-white text-neutral1 antialiased font-sans">
<main data-title="Rincian Kelulusan" data-nav="tracer.html">
  <div class="w-full space-y-6 py-2 antialiased">
    <!-- Tombol Kembali -->
    <a href="tracer.html?tab=statistik" class="inline-flex items-center gap-1.5 text-sm text-neutral2 hover:text-[#1E3A8A] font-medium transition-colors no-print">
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
      <span>Kembali ke Target &amp; Cakupan Kelulusan</span>
    </a>

    <!-- Header Halaman -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-3 border-b border-gray-200">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold text-[#1E3A8A] tracking-tight">
          Data Asisten &amp; Alumni Kelulusan Tahun <span id="tahun-judul">-</span>
        </h1>
        <p class="text-sm text-gray-500 mt-0.5">
          Monitoring status adopsi portal asisten laboratorium Bengkel Koding kelulusan tahun <span id="tahun-sub">-</span> berbasis sinkronisasi data <code class="px-1.5 py-0.5 rounded bg-gray-100 text-xs font-semibold text-[#1E3A8A]">lms-bengkod-api</code>
        </p>
      </div>
      <div class="flex items-center gap-2 no-print">
        <span id="badge-angkatan" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-blue-50 text-[#1E3A8A] text-xs font-semibold border border-blue-200">
          <i data-lucide="users" class="w-3.5 h-3.5"></i>
          <span id="label-total-asisten">0 Asisten Terdata</span>
        </span>
      </div>
    </div>

    <!-- 3 Kartu Ringkasan KPI -->
    <section id="kartu-kpi" class="grid grid-cols-1 sm:grid-cols-3 gap-4" aria-label="Ringkasan status pendaftaran"></section>

    <!-- Tabel Rincian Data Asisten -->
    <section class="bg-white rounded-xl border border-gray-200/90 shadow-xs overflow-hidden" aria-label="Tabel rincian asisten lab">
      <div class="p-4 sm:p-5 border-b border-gray-200 space-y-3 no-print">
        <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
          <!-- Filter Tabs: Semua / Sudah Mendaftar / Belum Mendaftar -->
          <div id="tab-status" class="flex items-center gap-2 overflow-x-auto no-scrollbar" role="tablist" aria-label="Saring status pendaftaran"></div>
          <!-- Alat Ekspor -->
          <div id="alat" class="flex flex-wrap gap-2 shrink-0"></div>
        </div>

        <!-- Filter Pencarian -->
        <div class="pt-1">
          <div class="relative w-full">
            <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            <input
              id="cari"
              type="search"
              placeholder="Cari nama, NIM, atau email asisten..."
              aria-label="Cari asisten"
              class="w-full h-10 pl-10 pr-4 rounded-full border border-gray-200 bg-white text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-[#1E3A8A]/20 focus:border-[#1E3A8A] transition-all"
            >
          </div>
        </div>
      </div>

      <!-- Tabel -->
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead>
            <tr>
              <th class="th">Asisten Laboratorium</th>
              <th class="th w-36">NIM</th>
              <th class="th w-64">Kontak</th>
              <th class="th w-44">Status Akun Portal</th>
              <th class="th text-right w-44 no-print">Aksi</th>
            </tr>
          </thead>
          <tbody id="baris"></tbody>
        </table>
      </div>

      <!-- Paginasi Seragam -->
      <div id="pager" class="p-4 border-t border-gray-100 empty:hidden no-print"></div>
    </section>
  </div>
</main>

<script>
  const urlParams = new URLSearchParams(location.search);
  const tahunDipilih = Number(urlParams.get('tahun')) || 2026;
  const PER_HALAMAN = 8;

  let tabStatus = 'semua'; // 'semua', 'terdaftar', 'belum'
  let kataKunci = '';
  let halaman = 1;

  document.getElementById('tahun-judul').textContent = tahunDipilih;
  document.getElementById('tahun-sub').textContent = tahunDipilih;

  function ambilData() {
    return DB.statistik.detailAngkatan(tahunDipilih);
  }

  function daftarTersaring() {
    const data = ambilData();
    return data.asisten.filter(a => {
      if (tabStatus === 'terdaftar' && !a.terdaftar) return false;
      if (tabStatus === 'belum' && a.terdaftar) return false;
      if (kataKunci) {
        const q = kataKunci.toLowerCase();
        return `${a.nama} ${a.nim} ${a.email}`.toLowerCase().includes(q);
      }
      return true;
    });
  }

  function renderKPI(data) {
    document.getElementById('label-total-asisten').textContent = `${data.totalLms} Asisten Terdata`;
    document.getElementById('kartu-kpi').innerHTML = [
      {
        label: `Total Asisten LMS (≥ 1 Thn)`,
        nilai: data.totalLms,
        sub: `Basis akun aktif angkatan ${data.tahun}`,
        ikon: 'users',
        warna: 'bg-blue-50 text-[#1E3A8A]',
      },
      {
        label: 'Sudah Terdaftar di Portal',
        nilai: data.totalTerdaftar,
        sub: `${data.cakupan}% rasio adopsi aplikasi`,
        ikon: 'user-check',
        warna: 'bg-emerald-50 text-emerald-700',
      },
      {
        label: 'Belum Mendaftar Portal',
        nilai: data.totalBelum,
        sub: `${100 - data.cakupan}% belum aktivasi akun`,
        ikon: 'clock',
        warna: 'bg-amber-50 text-amber-700',
      },
    ].map(k => `
      <div class="bg-white rounded-xl border border-gray-200/90 shadow-xs p-4 flex items-center gap-3.5">
        <div class="w-11 h-11 rounded-xl ${k.warna} flex items-center justify-center shrink-0"><i data-lucide="${k.ikon}" class="w-5 h-5"></i></div>
        <div class="min-w-0">
          <p class="text-2xl font-bold text-gray-900 leading-tight tabular-nums">${esc(k.nilai)}</p>
          <p class="text-xs font-semibold text-gray-700 mt-0.5">${esc(k.label)}</p>
          <p class="text-[11px] text-gray-400">${esc(k.sub)}</p>
        </div>
      </div>`).join('');
  }

  function renderTabStatus(data) {
    const tabs = [
      ['semua', 'Semua Asisten', data.totalLms],
      ['terdaftar', 'Sudah Mendaftar', data.totalTerdaftar],
      ['belum', 'Belum Mendaftar', data.totalBelum],
    ];

    document.getElementById('tab-status').innerHTML = tabs.map(([val, label, jml]) => {
      const aktif = tabStatus === val;
      return `
        <button
          type="button"
          data-tab="${val}"
          aria-pressed="${aktif}"
          class="shrink-0 whitespace-nowrap inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs sm:text-[13px] font-semibold transition-colors cursor-pointer ${
            aktif ? 'bg-[#1E3A8A] text-white shadow-xs' : 'bg-white border border-gray-200 text-gray-700 hover:bg-gray-50'
          }"
        >
          <span>${label}</span>
          <span class="text-xs opacity-80 tabular-nums">(${jml})</span>
        </button>`;
    }).join('');
  }

  async function salinEmail(email) {
    try {
      await navigator.clipboard.writeText(email);
      showToast('Email asisten berhasil disalin.');
    } catch {
      showToast('Gagal menyalin email.', 'error');
    }
  }

  function barisAsisten(a) {
    const avatarHtml = a.foto
      ? `<img src="${esc(a.foto)}" alt="" onerror="this.onerror=null;this.src='../alumni/assets/img/user.png'" class="w-9 h-9 rounded-full object-cover border border-gray-200 shrink-0">`
      : fotoBulat({ nama: a.nama }, 'w-9 h-9');

    const subjek = encodeURIComponent(`Undangan Aktivasi Portal Alumni Bengkel Koding UDINUS - ${a.nama}`);
    const isiPesan = encodeURIComponent(`Halo rekan ${a.nama},\n\nKami menginformasikan bahwa data Anda terdaftar sebagai asisten purna-tugas di LMS Bengkel Koding. Silakan melakukan aktivasi akun dan verifikasi NIM Anda di Portal Alumni:\nhttps://alumni.bengkelkoding.dinus.ac.id/\n\nTerima kasih,\nKoordinator Laboratorium Bengkel Koding`);

    const statusBadge = a.terdaftar
      ? `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200"><i data-lucide="check-circle" class="w-3.5 h-3.5"></i>Terdaftar</span>`
      : `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200"><i data-lucide="clock" class="w-3.5 h-3.5"></i>Belum Mendaftar</span>`;

    const tombolAksi = a.terdaftar
      ? `<a href="profil-alumni.html?id=${a.id}" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg border border-gray-200 bg-white hover:bg-gray-50 text-xs font-semibold text-[#1E3A8A] shadow-2xs hover:border-gray-300 transition-all cursor-pointer">
          <span>Lihat Profil</span>
          <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
        </a>`
      : `<div class="flex items-center justify-end gap-1.5">
          <a href="mailto:${esc(a.email)}?subject=${subjek}&body=${isiPesan}" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-blue-50 text-[#1E3A8A] hover:bg-blue-100 border border-blue-200 text-xs font-semibold transition-colors shadow-2xs cursor-pointer" title="Kirim email undangan aktivasi">
            <i data-lucide="mail" class="w-3.5 h-3.5"></i>
            <span>Undang Email</span>
          </a>
          <button type="button" onclick="salinEmail('${esc(a.email)}')" class="p-1.5 rounded-lg text-gray-400 hover:text-[#1E3A8A] hover:bg-gray-100 transition-colors cursor-pointer" title="Salin email" aria-label="Salin email">
            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
          </button>
        </div>`;

    return `
      <tr class="tr">
        <td class="td">
          <div class="flex items-center gap-3 min-w-[200px]">
            ${avatarHtml}
            <div class="min-w-0">
              <p class="font-semibold text-gray-900 text-sm leading-snug">${esc(a.nama)}</p>
              ${a.status_karir ? `<p class="text-xs text-gray-500 mt-0.5 line-clamp-1">${esc(a.status_karir)}</p>` : `<p class="text-xs text-gray-400 mt-0.5 italic">Asisten Lab Bengkod</p>`}
            </div>
          </div>
        </td>
        <td class="td font-mono text-xs text-gray-700 font-medium whitespace-nowrap">${esc(a.nim)}</td>
        <td class="td whitespace-nowrap text-xs">
          <a href="mailto:${esc(a.email)}" class="font-medium text-gray-700 hover:text-[#1E3A8A] hover:underline">${esc(a.email)}</a>
          ${a.terdaftar && a.no_hp ? `<a href="${esc(tautanWa(a.no_hp))}" target="_blank" rel="noreferrer" class="block text-[11.5px] text-[#1E3A8A] hover:underline mt-0.5 font-medium">${esc(a.no_hp)}</a>` : ''}
        </td>
        <td class="td whitespace-nowrap">${statusBadge}</td>
        <td class="td text-right whitespace-nowrap no-print">${tombolAksi}</td>
      </tr>`;
  }

  function render() {
    const data = ambilData();
    renderKPI(data);
    renderTabStatus(data);

    const list = daftarTersaring();
    const tbody = document.getElementById('baris');

    if (list.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="5" class="td text-center text-gray-400 py-12">
            <div class="flex flex-col items-center justify-center gap-2">
              <i data-lucide="users" class="w-8 h-8 text-gray-300"></i>
              <p class="font-semibold text-gray-700 text-sm">Tidak ada asisten yang cocok.</p>
              <p class="text-xs text-gray-400">Coba ubah filter status atau kata kunci pencarian.</p>
            </div>
          </td>
        </tr>`;
    } else {
      tbody.innerHTML = potong(list, halaman, PER_HALAMAN).map(barisAsisten).join('');
    }

    renderPager('pager', list.length, PER_HALAMAN, halaman, ke => {
      halaman = ke;
      render();
    });
    refreshIcons();
  }

  // Event Listeners
  document.getElementById('tab-status').addEventListener('click', e => {
    const btn = e.target.closest('[data-tab]');
    if (!btn) return;
    tabStatus = btn.dataset.tab;
    halaman = 1;
    render();
  });

  document.getElementById('cari').addEventListener('input', e => {
    kataKunci = e.target.value.trim();
    halaman = 1;
    render();
  });

  pasangToolsTabel('alat', `data-asisten-kelulusan-${tahunDipilih}.csv`, () => [
    ['Nama Asisten', 'NIM', 'Email LMS', 'No WhatsApp (Tracer)', 'Status Pendaftaran'],
    ...daftarTersaring().map(a => [
      a.nama,
      a.nim,
      a.email,
      a.no_hp || '-',
      a.terdaftar ? 'Terdaftar di Portal' : 'Belum Mendaftar',
    ]),
  ]);

  render();
</script>
</body>
</html>
