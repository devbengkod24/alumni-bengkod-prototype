<!DOCTYPE html>
<html lang="id" data-role="admin">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Alumni | Koordinator Bengkel Koding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css?v=6">
  <link rel="stylesheet" href="../alumni/assets/css/profile-layout.css">
  <script src="../alumni/assets/js/data.js?v=10"></script>
  <script src="../alumni/assets/js/app.js?v=11"></script>
  <script src="../alumni/assets/js/portal-layout.js"></script>
  <script src="../assets/js/page-skeleton.js?v=6"></script>
  <script src="../assets/js/main.js?v=5"></script>
</head>
<body class="bg-white text-neutral1 antialiased font-sans">
<main data-title="Profil Alumni" data-nav="data-alumni.html">
  <div id="profil-root" class="w-full space-y-5 pb-10 antialiased"></div>
</main>

<script>
  const alumni = DB.akun.cari(new URLSearchParams(location.search).get('id'));
  if (!alumni || alumni.role !== 'alumni') location.replace('data-alumni.html');

  const t = DB.tracer.milik(alumni.id);
  const baris = tabel => DB.cv.milik(tabel, alumni.id);
  const rentang = (a, b) => [a, b].filter(Boolean).join(' – ');
  const kota = r => [r.kota, r.negara].filter(Boolean).join(', ');
  const pisah = teks => String(teks || '').split(',').map(x => x.trim()).filter(Boolean);
  const lulus = t ? (t.tahun_lulus || DB.tahunLulusDariNim(t.nim) || (t.tahun_masuk ? Number(t.tahun_masuk) + 4 : '') || '') : '';
  const karir = DB.tracer.karir(t);
  const statusBaku = t ? DB.tracer.kategori(t) : '';
  const lokasi = t?.kota ? `${t.kota}, Indonesia` : '';
  const tentang = t
    ? `Alumni Bengkel Koding${lulus ? ` lulus tahun ${lulus}` : ''}. ${karir.ringkas}.`
    : 'Alumni ini belum mengisi data tracer study.';

  const dlRow = (label, nilai, bold = false) => `
    <div class="grid grid-cols-1 sm:grid-cols-[190px_1fr] gap-1 sm:gap-4 py-2.5 first:pt-0 last:pb-0">
      <dt class="text-[13.5px] text-neutral3">${esc(label)}</dt>
      <dd class="text-[13.5px] ${bold ? 'font-semibold' : 'font-medium'} text-headline">${esc(nilai || '-')}</dd>
    </div>`;

  const avatarHtml = alumni.foto
    ? `<img src="${esc(alumni.foto)}" alt="${esc(alumni.nama)}" onerror="this.onerror=null;this.src='../alumni/assets/img/user.png'" class="h-full w-full object-cover">`
    : `<span class="h-full w-full flex items-center justify-center text-[24px] font-bold text-[#3A5988]">${esc(inisial(alumni.nama))}</span>`;

  const pekerjaanRingkas = [karir.posisi, karir.tempat].filter(Boolean).join(' · ');
  const linkedinAman = tautanAman(t?.linkedin);
  const waAman = t?.no_hp ? tautanWa(t.no_hp) : '';

  const tracerBodyHtml = !t
    ? `<p class="profile-copy py-2 text-center">Alumni ini belum mengisi data tracer study.</p>`
    : `
      <div class="space-y-4">
        ${(t.jabatan_job || t.nama_job) ? `
          <dl class="divide-y divide-[#E3E4E9]/70">
            ${dlRow('Jabatan', t.jabatan_job, true)}
            ${dlRow(statusBaku === 'Wiraswasta' ? 'Nama Usaha' : 'Instansi / Perusahaan', t.nama_job)}
            ${t.jns_job ? dlRow('Kategori Pekerjaan', t.jns_job) : ''}
            ${t.lingkup_job ? dlRow('Tingkat / Lingkup', t.lingkup_job) : ''}
          </dl>` : ''}
        ${t.nama_studi ? `
          <div class="${(t.jabatan_job || t.nama_job) ? 'pt-4 border-t border-[#E3E4E9]' : ''}">
            <p class="profile-subheading mb-2">Studi Lanjut</p>
            <dl class="divide-y divide-[#E3E4E9]/70">
              ${dlRow('Program Studi', t.prodi, true)}
              ${dlRow('Perguruan Tinggi', t.nama_studi)}
              ${t.biaya_studi ? dlRow('Sumber Biaya', t.biaya_studi) : ''}
            </dl>
          </div>` : ''}
        ${t.nama_sampingan ? `
          <div class="${(t.jabatan_job || t.nama_job || t.nama_studi) ? 'pt-4 border-t border-[#E3E4E9]' : ''}">
            <p class="profile-subheading mb-2">Pekerjaan Sampingan / Freelance</p>
            <dl class="divide-y divide-[#E3E4E9]/70">
              ${dlRow('Peran', t.peran_sampingan, true)}
              ${dlRow('Tempat / Klien', t.nama_sampingan)}
            </dl>
          </div>` : ''}
      </div>`;

  const pengalaman = [
    ...baris('jobs').map(r => ({ type: 'Pekerjaan', title: r.jabatan_job, place: [r.nama_job, kota(r)].filter(Boolean).join(' · '), period: rentang(r.periode_masuk_job, r.periode_keluar_job), note: r.catatan })),
    ...baris('internships').map(r => ({ type: 'Magang', title: r.jabatan_intern, place: [r.nama_intern, kota(r)].filter(Boolean).join(' · '), period: rentang(r.periode_masuk_intern, r.periode_keluar_intern), note: r.catatan })),
  ];

  const proyek = baris('projects').map(r => ({
    title: r.nama_proyek,
    period: String(r.tahun_proyek || ''),
    desc: [r.peran_proyek && `Peran: ${r.peran_proyek}.`, r.deskripsi_proyek].filter(Boolean).join(' '),
    tags: pisah(r.stack_proyek),
    link: tautanAman(r.link_proyek),
  }));

  const keahlian = t?.keahlian || [];

  document.title = `${alumni.nama} | Profil Alumni Bengkel Koding`;
  document.getElementById('profil-root').innerHTML = `
    <a href="data-alumni.html" class="inline-flex items-center gap-1.5 text-[13.5px] text-neutral2 hover:text-[#3A5988] font-medium transition-colors no-print">
      <i data-lucide="arrow-left" class="w-4 h-4" aria-hidden="true"></i>
      <span>Kembali ke Data Alumni</span>
    </a>

    <header class="overflow-hidden rounded-[16px] shadow-sm border border-[#E3E4E9] bg-white">
      <div class="profile-cover relative flex items-start justify-end overflow-hidden bg-[#3A5988] px-4 py-4 sm:px-6">
        <span class="relative rounded-full bg-[#E2F1F9] px-3 py-1 text-[11px] font-semibold text-[#3A5988]">
          ${lulus ? `Lulus Tahun ${esc(lulus)}` : 'Alumni Bengkel Koding'}
        </span>
      </div>
      <div class="relative flex flex-wrap items-end gap-x-4 gap-y-3 px-4 pb-4 sm:px-6 lg:flex-nowrap">
        <div class="relative -mt-10 h-24 w-24 shrink-0 overflow-hidden rounded-[12px] border-4 border-white bg-[#E2F1F9] shadow-sm sm:h-28 sm:w-28">
          ${avatarHtml}
        </div>
        <div class="min-w-0 flex-1 pt-3">
          <h1 class="mt-1 break-words text-[24px] font-semibold leading-tight tracking-[-0.01em] text-[#0C1117] sm:text-[26px]">${esc(alumni.nama)}</h1>
          <p class="mt-1 break-words text-[13px] leading-snug text-[#4B5563]">${esc(t ? karir.ringkas : 'Belum mengisi data tracer study')}</p>
        </div>
      </div>
      <div class="space-y-2 border-t border-[#E3E4E9] bg-[#F4F5F7] px-4 py-3 sm:px-6">
        <div class="flex flex-wrap items-center gap-x-4 gap-y-2 text-[13px] text-[#4B5563]">
          ${lokasi ? `<span class="inline-flex items-center gap-1.5"><i data-lucide="map-pin" class="h-4 w-4 shrink-0 text-[#3A5988]" aria-hidden="true"></i><span>${esc(lokasi)}</span></span>` : ''}
          <a href="mailto:${esc(alumni.email)}" class="inline-flex min-w-0 items-center gap-1.5 hover:text-[#3A5988] hover:underline">
            <i data-lucide="mail" class="h-4 w-4 shrink-0 text-[#3A5988]" aria-hidden="true"></i>
            <span class="break-all">${esc(alumni.email)}</span>
          </a>
          ${pekerjaanRingkas ? `<span class="inline-flex items-center gap-1.5"><i data-lucide="briefcase" class="h-4 w-4 shrink-0 text-[#3A5988]" aria-hidden="true"></i><span>${esc(pekerjaanRingkas)}</span></span>` : ''}
        </div>
        ${(waAman || linkedinAman) ? `
          <div class="flex flex-wrap gap-2 pt-0.5">
            ${waAman ? `<a href="${esc(waAman)}" target="_blank" rel="noopener noreferrer" class="profile-action">WhatsApp</a>` : ''}
            ${linkedinAman ? `<a href="${esc(linkedinAman)}" target="_blank" rel="noopener noreferrer" class="profile-action">LinkedIn</a>` : ''}
          </div>` : ''}
      </div>
    </header>

    <div class="grid items-start gap-4 md:grid-cols-[minmax(0,2fr)_minmax(220px,1fr)]">
      <div class="min-w-0 space-y-4">
        <section class="profile-panel" aria-labelledby="judul-tracer">
          <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-[#E3E4E9]">
            <div class="flex items-center gap-2.5 flex-wrap">
              <h2 id="judul-tracer" class="profile-heading">Status Karir &amp; Tracer</h2>
              ${t ? badgeStatus(statusBaku) : badge('Belum mengisi data', 'gray')}
            </div>
            ${t?.updated_at ? `<span class="text-[12.5px] text-neutral3">Diperbarui ${esc(fmtDate(t.updated_at))}</span>` : ''}
          </div>
          ${tracerBodyHtml}
        </section>

        <section class="profile-panel" aria-labelledby="judul-ringkasan">
          <h2 id="judul-ringkasan" class="profile-heading">Ringkasan Eksekutif</h2>
          <p class="profile-copy whitespace-pre-line break-words">${esc(tentang)}</p>
        </section>

        <section class="profile-panel" aria-labelledby="judul-pengalaman">
          <div class="flex items-center justify-between gap-2">
            <h2 id="judul-pengalaman" class="profile-heading">Rekam Jejak Pengalaman Kerja</h2>
            <span class="text-[12px] font-medium text-[#6B7280]">${pengalaman.length} posisi tercatat</span>
          </div>
          ${pengalaman.length ? pengalaman.map(exp => `
            <article class="space-y-2 rounded-[12px] border border-[#E3E4E9] bg-[#F4F5F7] p-4">
              <div class="flex flex-wrap items-start justify-between gap-2">
                <div class="min-w-0">
                  <h3 class="break-words text-[15px] font-bold text-[#0C1117]">${esc(exp.title)}</h3>
                  <p class="text-[13px] font-medium text-[#3A5988]">${esc([exp.place, exp.type].filter(Boolean).join(' · '))}</p>
                </div>
                ${exp.period ? `<span class="rounded-full bg-[#E2F1F9] px-2.5 py-0.5 text-[11.5px] font-semibold text-[#3A5988]">${esc(exp.period)}</span>` : ''}
              </div>
              ${exp.note ? `<p class="profile-copy">${esc(exp.note)}</p>` : ''}
            </article>`).join('') : `<p class="profile-copy">Belum ada pengalaman kerja yang dicantumkan.</p>`}
        </section>

        <section class="profile-panel" aria-labelledby="judul-proyek">
          <h2 id="judul-proyek" class="profile-heading">Proyek &amp; Portofolio</h2>
          ${proyek.length ? proyek.map(pr => `
            <article class="space-y-2 rounded-[12px] border border-[#E3E4E9] bg-[#F4F5F7] p-4">
              <div class="flex flex-wrap items-start justify-between gap-2">
                <h3 class="text-[15px] font-bold text-[#0C1117]">${esc(pr.title)}</h3>
                ${pr.period ? `<span class="text-[12px] text-[#6B7280]">${esc(pr.period)}</span>` : ''}
              </div>
              <p class="profile-copy">${esc(pr.desc)}</p>
              ${pr.tags.length ? `<ul class="profile-tools flex flex-wrap gap-1.5">${pr.tags.map(tag => `<li>${esc(tag)}</li>`).join('')}</ul>` : ''}
              ${pr.link ? `<a href="${esc(pr.link)}" target="_blank" rel="noopener noreferrer" class="profile-action">Lihat Proyek</a>` : ''}
            </article>`).join('') : `<p class="profile-copy">Belum ada proyek yang dicantumkan.</p>`}
        </section>
      </div>

      <aside aria-label="Ringkasan keahlian" class="profile-summary min-w-0 space-y-4">
        <section class="profile-panel" aria-labelledby="judul-keahlian">
          <h2 id="judul-keahlian" class="profile-heading">Daftar Keahlian</h2>
          ${keahlian.length ? `
            <ul class="flex flex-wrap gap-1.5">
              ${keahlian.map(sk => `<li class="max-w-full break-words rounded-full bg-[#E2F1F9] px-2.5 py-1 text-[11.5px] font-medium text-[#3A5988]">${esc(sk)}</li>`).join('')}
            </ul>` : `<p class="profile-copy">Belum ada keahlian yang dicantumkan.</p>`}
        </section>
      </aside>
    </div>
  `;
  refreshIcons();
</script>
</body>
</html>
