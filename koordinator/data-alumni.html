<!DOCTYPE html>
<html lang="id" data-role="admin">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Alumni | Koordinator Bengkel Koding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css?v=6">
  <script src="../alumni/assets/js/data.js?v=10"></script>
  <script src="../alumni/assets/js/app.js?v=11"></script>
  <script src="../alumni/assets/js/portal-layout.js"></script>
  <script src="../assets/js/page-skeleton.js?v=6"></script>
  <script src="../assets/js/main.js?v=5"></script>
</head>
<body class="bg-white text-neutral1 antialiased font-sans">
<main data-title="Data Alumni">
  <div>
    <h1 class="!text-[26px] font-semibold text-headline tracking-[-0.01em]">Data &amp; Direktori Alumni</h1>
    <p class="!text-[13.5px] text-neutral3 mt-1">Kelola dan pantau data profil, kontak, status kuesioner tracer, karier, dan keahlian alumni Bengkel Koding UDINUS.</p>
  </div>

  <!-- Toolbar pencarian & pemicu drawer filter -->
  <div class="bg-white border border-neutral4 rounded-[14px] p-4 shadow-sm space-y-3 no-print">
    <div class="flex items-center gap-2.5">
      <div class="relative flex-1 min-w-0">
        <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#91969C] pointer-events-none"><i data-lucide="search" class="w-4 h-4"></i></span>
        <input id="cari" type="search" aria-label="Cari nama alumni atau tempat kerja" placeholder="Cari nama alumni atau tempat kerja..."
               class="w-full h-10 pl-10 pr-3 rounded-[8px] border border-neutral4 bg-canvas focus:bg-white text-[13.5px] text-neutral1 placeholder-[#91969C] focus:outline-none focus:border-primary1 transition-colors">
      </div>
      <button type="button" id="btn-buka-filter" aria-haspopup="dialog" aria-expanded="false" aria-controls="drawer-filter"
              class="btn-outline h-10 px-3.5 sm:px-4 shrink-0">
        <i data-lucide="sliders-horizontal" class="w-4 h-4 text-primary1" aria-hidden="true"></i>
        <span>Filter</span>
        <span id="badge-filter" class="hidden min-w-[20px] h-5 px-1.5 rounded-full bg-primary5 text-primary1 border border-primary4 text-[11px] font-semibold items-center justify-center tabular-nums"></span>
      </button>
    </div>
    <div id="baris-ringkas-filter" class="hidden flex-wrap items-center justify-between gap-2 pt-0.5">
      <div id="chips-filter-aktif" class="flex flex-wrap items-center gap-1.5"></div>
      <button type="button" id="btn-reset-filter" class="text-[12.5px] text-primary3 hover:underline font-medium cursor-pointer whitespace-nowrap ml-auto">Reset semua</button>
    </div>
  </div>

  <!-- Tabel alumni terpadu -->
  <div class="bg-white border border-neutral4 rounded-[14px] shadow-sm overflow-hidden">
    <div class="px-6 py-4 border-b border-neutral4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <h2 class="!text-[17px] font-bold text-headline tracking-[-0.01em]">Daftar Alumni</h2>
        <span id="jumlah-hasil" class="text-[12px] text-neutral3"></span>
      </div>
      <div id="alat" class="flex flex-wrap gap-2 no-print"></div>
    </div>
    <div class="hidden md:block">
      <table class="w-full table-fixed text-left border-collapse">
        <colgroup>
          <col class="w-[27%]">
          <col class="w-[21%]">
          <col class="w-[17%]">
          <col class="w-[22%]">
          <col class="w-[13%]">
        </colgroup>
        <thead>
          <tr class="border-b border-neutral4 bg-white text-[13px] font-medium text-neutral3">
            <th class="py-3.5 pl-5 pr-3 font-medium">Nama</th>
            <th class="py-3.5 px-3 font-medium">Kontak</th>
            <th class="py-3.5 px-3 font-medium">Status</th>
            <th class="py-3.5 px-3 font-medium">Karier / Studi</th>
            <th class="py-3.5 pr-5 pl-3 font-medium text-right no-print">Aksi</th>
          </tr>
        </thead>
        <tbody id="daftar" class="divide-y divide-neutral4 text-[13.5px]"></tbody>
      </table>
    </div>
    <div id="daftar-mobile" class="md:hidden divide-y divide-neutral4"></div>
    <div class="px-6 py-3.5 border-t border-neutral4 bg-[#FAFBFC] flex items-center justify-between gap-3 text-[12.5px] text-neutral3 no-print">
      <span id="status-hasil"></span>
      <div class="flex items-center gap-1">
        <button type="button" id="hal-sebelum" class="px-2.5 py-1 rounded-[6px] border border-neutral4 bg-white text-neutral1 hover:bg-neutral5 disabled:text-[#91969C] disabled:opacity-60 disabled:cursor-not-allowed cursor-pointer">Sebelumnya</button>
        <span id="hal-posisi" class="px-3 py-1 font-semibold text-headline tabular-nums"></span>
        <button type="button" id="hal-berikut" class="px-2.5 py-1 rounded-[6px] border border-neutral4 bg-white text-neutral1 hover:bg-neutral5 disabled:text-[#91969C] disabled:opacity-60 disabled:cursor-not-allowed cursor-pointer">Berikutnya</button>
      </div>
    </div>
  </div>
</main>

<!-- Slide-over filter drawer dari sisi kanan layar -->
<div id="drawer-filter" role="dialog" aria-modal="true" aria-labelledby="drawer-filter-title"
     class="fixed inset-0 z-[100] hidden bg-headline/40 backdrop-blur-sm justify-end no-print">
  <div id="drawer-filter-panel"
       class="h-full w-full max-w-[460px] bg-white border-l border-neutral4 shadow-xl flex flex-col translate-x-full transition-transform duration-200">
    <!-- Header Drawer -->
    <div class="px-5 py-4 border-b border-neutral4 flex items-center justify-between gap-3 shrink-0">
      <h2 id="drawer-filter-title" class="!text-[16px] font-bold text-headline tracking-[-0.01em]">Filter &amp; Urutkan</h2>
      <button type="button" id="btn-tutup-filter" class="btn-icon" aria-label="Tutup panel filter">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Body 2 Kolom (Rail Kiri + Opsi Chip Kanan) -->
    <div class="flex-1 min-h-0 flex overflow-hidden">
      <nav id="rail-filter" aria-label="Kategori filter"
           class="w-[124px] sm:w-[140px] shrink-0 bg-canvas border-r border-neutral4 py-2 overflow-y-auto custom-scrollbar"></nav>
      <div id="opsi-filter"
           class="flex-1 min-w-0 p-4 sm:p-5 space-y-5 overflow-y-auto custom-scrollbar"></div>
    </div>

    <!-- Sticky Footer -->
    <div class="px-4 py-3.5 border-t border-neutral4 bg-white grid grid-cols-2 gap-3 shrink-0">
      <button type="button" id="btn-atur-ulang" class="btn-outline w-full justify-center">Atur Ulang</button>
      <button type="button" id="btn-terapkan-filter" class="btn-primary w-full justify-center">Terapkan</button>
    </div>
  </div>
</div>

<script>
  const PER_HALAMAN = 10;
  let halaman = 1;
  const $ = id => document.getElementById(id);

  const isS2 = t => Boolean(t && (DB.tracer.kategori(t) === DB.STATUS_STUDI || t.nama_studi));

  const KELOMPOK_STATUS = {
    bekerja: ['Semua yang bekerja', DB.STATUS_BEKERJA],
    'tidak-bekerja': ['Semua yang tidak bekerja', DB.STATUS_TIDAK_BEKERJA],
  };

  const KOLOM_EKSPOR = [
    ['nama_alumni', 'Nama'], ['jns_kelamin', 'Jenis Kelamin'], ['tahun_lulus', 'Tahun Lulus'],
    ['no_hp', 'No WhatsApp'], ['email', 'Email'], ['linkedin', 'LinkedIn'], ['status', 'Status'], ['jns_job', 'Kategori Pekerjaan'],
    ['nama_job', 'Tempat Kerja'], ['jabatan_job', 'Jabatan'], ['lingkup_job', 'Tingkat Pekerjaan'], ['biaya_studi', 'Biaya Studi'],
    ['nama_studi', 'Nama Universitas'], ['prodi', 'Program Studi'], ['tgl_studi', 'Tanggal Studi'],
    ['nama_sampingan', 'Tempat Sampingan'], ['peran_sampingan', 'Peran Sampingan'], ['kota', 'Kota'], ['keahlian', 'Keahlian'],
  ];

  const tahunLulusTracer = t => (t ? (t.tahun_lulus || DB.tahunLulusDariNim(t.nim) || (t.tahun_masuk ? Number(t.tahun_masuk) + 4 : '') || '') : '');

  const DEFAULT_FILTER = () => ({ sort: '', status: '', batch: '', mitra: '' });
  let activeFilter = DEFAULT_FILTER();
  let draftFilter = DEFAULT_FILTER();
  let activeCategory = 'sort';

  function cocokStatus(t, status) {
    if (!status) return true;
    if (!t) return false;
    const k = DB.tracer.kategori(t);
    return KELOMPOK_STATUS[status] ? KELOMPOK_STATUS[status][1].includes(k) : k === status;
  }

  function badgeStatusTabel(t) {
    if (!t) return `<span title="Belum mengisi tracer" aria-label="Belum mengisi tracer">${badge('Belum Tracer', 'gray')}</span>`;
    return badgeStatus(DB.tracer.kategori(t));
  }

  function dataBarisAlumni(a) {
    const t = DB.tracer.milik(a.id);
    const karir = DB.tracer.karir(t);
    const foto = a.foto
      ? `<img src="${esc(a.foto)}" alt="" onerror="this.onerror=null;this.src='../alumni/assets/img/user.png'" class="w-9 h-9 rounded-full object-cover shrink-0 border border-neutral4">`
      : `<span class="w-9 h-9 rounded-full bg-primary5 text-primary1 font-semibold text-[12px] flex items-center justify-center shrink-0">${esc(inisial(a.nama))}</span>`;
    const href = `profil-alumni.html?id=${a.id}`;
    const lulus = tahunLulusTracer(t);
    const metaParts = [
      lulus ? `Lulus Tahun ${esc(lulus)}` : 'Lulus Tahun -',
      isS2(t) ? 'S2' : 'S1',
    ].join(' · ');
    const domisili = t?.kota ? esc(t.kota) : '';
    const waLink = t?.no_hp
      ? `<a href="${esc(tautanWa(t.no_hp))}" target="_blank" rel="noreferrer" class="inline-flex items-center gap-1 text-primary2 hover:underline font-medium">WhatsApp</a>`
      : '';
    const liLink = tautanAman(t?.linkedin)
      ? `<a href="${esc(tautanAman(t.linkedin))}" target="_blank" rel="noreferrer" class="inline-flex items-center gap-1 text-neutral3 hover:text-primary1 hover:underline">LinkedIn</a>`
      : '';
    const extraKontak = [waLink, liLink].filter(Boolean).join('');
    const karierUtama = [karir.posisi, karir.tempat].filter(Boolean).join(' · ') || '-';
    return { t, foto, href, metaParts, domisili, statusHtml: badgeStatusTabel(t), extraKontak, karierUtama };
  }

  function barisAlumni(a) {
    const { t, foto, href, metaParts, domisili, statusHtml, extraKontak, karierUtama } = dataBarisAlumni(a);
    return `
      <tr class="hover:bg-[#F9FAFB] transition-colors group cursor-pointer" data-href="${href}">
        <td class="py-3.5 pl-5 pr-3 align-top">
          <div class="flex items-start gap-2.5 min-w-0">
            ${foto}
            <div class="min-w-0 flex-1">
              <span class="block font-semibold text-headline group-hover:text-primary1 transition-colors break-words">${esc(a.nama)}</span>
              <span class="block text-[12px] text-neutral3 leading-snug break-words mt-0.5">${metaParts}</span>
              ${domisili ? `<span class="inline-flex items-center gap-1 text-[12px] text-neutral3 leading-snug mt-0.5 break-words"><i data-lucide="map-pin" class="w-3 h-3 shrink-0" aria-hidden="true"></i><span>${domisili}</span></span>` : ''}
            </div>
          </div>
        </td>
        <td class="py-3.5 px-3 align-top min-w-0">
          <a href="mailto:${esc(a.email)}" class="block text-[13px] text-neutral1 hover:text-primary1 hover:underline break-all">${esc(a.email)}</a>
          ${extraKontak ? `<div class="mt-1 flex flex-wrap items-center gap-x-2.5 gap-y-0.5 text-[11.5px]">${extraKontak}</div>` : ''}
        </td>
        <td class="py-3.5 px-3 align-top">${statusHtml}</td>
        <td class="py-3.5 px-3 align-top font-medium text-neutral1 min-w-0">
          <span class="block break-words">${esc(karierUtama)}</span>
          ${t?.nama_studi && t?.nama_job ? `<span class="block text-[12px] font-normal text-neutral3 mt-0.5 break-words">S2: ${esc(t.prodi)}, ${esc(t.nama_studi)}</span>` : ''}
          ${t?.nama_sampingan ? `<span class="block text-[12px] font-normal text-neutral3 mt-0.5 break-words">Sampingan: ${esc(t.peran_sampingan)}, ${esc(t.nama_sampingan)}</span>` : ''}
        </td>
        <td class="py-3.5 pr-5 pl-3 align-top text-right whitespace-nowrap no-print"><a href="${href}" class="text-[13px] font-medium text-primary1 hover:underline">Lihat detail</a></td>
      </tr>`;
  }

  function kartuAlumniMobile(a) {
    const { t, foto, href, metaParts, domisili, statusHtml, extraKontak, karierUtama } = dataBarisAlumni(a);
    return `
      <div class="p-4 space-y-2.5 hover:bg-[#F9FAFB] transition-colors cursor-pointer" data-href="${href}">
        <div class="flex items-start justify-between gap-2.5">
          <div class="flex items-start gap-2.5 min-w-0 flex-1">
            ${foto}
            <div class="min-w-0 flex-1">
              <span class="block text-[14px] font-semibold text-headline break-words">${esc(a.nama)}</span>
              <span class="block text-[12px] text-neutral3 leading-snug break-words mt-0.5">${metaParts}</span>
              ${domisili ? `<span class="inline-flex items-center gap-1 text-[12px] text-neutral3 leading-snug mt-0.5 break-words"><i data-lucide="map-pin" class="w-3 h-3 shrink-0" aria-hidden="true"></i><span>${domisili}</span></span>` : ''}
            </div>
          </div>
          <div class="shrink-0">${statusHtml}</div>
        </div>
        <div class="text-[13px] text-neutral1 space-y-1 pl-[46px]">
          <p class="!text-[13px] font-medium text-neutral1 break-words">${esc(karierUtama)}</p>
          ${t?.nama_studi && t?.nama_job ? `<p class="!text-[12px] text-neutral3 break-words">S2: ${esc(t.prodi)}, ${esc(t.nama_studi)}</p>` : ''}
          ${t?.nama_sampingan ? `<p class="!text-[12px] text-neutral3 break-words">Sampingan: ${esc(t.peran_sampingan)}, ${esc(t.nama_sampingan)}</p>` : ''}
          <div class="pt-1 flex flex-wrap items-center justify-between gap-2 text-[12.5px]">
            <div class="min-w-0">
              <a href="mailto:${esc(a.email)}" class="block text-neutral2 hover:text-primary1 hover:underline break-all">${esc(a.email)}</a>
              ${extraKontak ? `<div class="mt-0.5 flex flex-wrap items-center gap-x-2.5 text-[11.5px]">${extraKontak}</div>` : ''}
            </div>
            <a href="${href}" class="text-[12.5px] font-medium text-primary1 hover:underline shrink-0">Lihat detail</a>
          </div>
        </div>
      </div>`;
  }

  const tracerAlumni = DB.akun.alumni().map(a => DB.tracer.milik(a.id)).filter(Boolean);
  const daftarTahunLulus = [...new Set(tracerAlumni.map(t => String(tahunLulusTracer(t))).filter(Boolean))].sort((a, b) => Number(b) - Number(a));
  const daftarMitra = [...new Set(
    tracerAlumni
      .filter(t => DB.STATUS_BEKERJA.includes(DB.tracer.kategori(t)) && t.jns_job !== 'Wirausaha' && t.nama_job)
      .map(t => t.nama_job),
  )].sort((a, b) => a.localeCompare(b, 'id'));

  const FILTER_SECTIONS = [
    {
      key: 'sort',
      railLabel: 'Urutkan',
      title: 'Urutkan',
      options: [
        { value: '', label: 'Default' },
        { value: 'nama-asc', label: 'Nama (A–Z)' },
        { value: 'lulus-desc', label: 'Tahun Lulus Terbaru' },
        { value: 'lulus-asc', label: 'Tahun Lulus Terlama' },
      ],
    },
    {
      key: 'status',
      railLabel: 'Status',
      title: 'Status Alumni',
      options: [
        ...Object.entries(KELOMPOK_STATUS).map(([value, [label]]) => ({ value, label })),
        ...DB.STATUS.map(s => ({ value: s, label: s })),
      ],
    },
    {
      key: 'batch',
      railLabel: 'Tahun Lulus',
      title: 'Tahun Lulus',
      options: daftarTahunLulus.map(v => ({ value: v, label: `Lulus Tahun ${v}` })),
    },
    {
      key: 'mitra',
      railLabel: 'Mitra',
      title: 'Mitra / Instansi',
      options: daftarMitra.map(v => ({ value: v, label: v })),
    },
  ];

  function urutkanAlumni(list, sort) {
    if (!sort) return list;
    const salinan = [...list];
    if (sort === 'nama-asc') return salinan.sort((a, b) => (a.nama || '').localeCompare(b.nama || '', 'id'));
    const tahunLulus = a => Number(tahunLulusTracer(DB.tracer.milik(a.id)) || 0);
    if (sort === 'lulus-desc') return salinan.sort((a, b) => tahunLulus(b) - tahunLulus(a) || (a.nama || '').localeCompare(b.nama || '', 'id'));
    if (sort === 'lulus-asc') return salinan.sort((a, b) => tahunLulus(a) - tahunLulus(b) || (a.nama || '').localeCompare(b.nama || '', 'id'));
    return salinan;
  }

  function filterAlumni(semua) {
    const kata = $('cari').value.trim().toLowerCase();
    const { sort, status, batch, mitra } = activeFilter;

    const tersaring = semua.filter(a => {
      const t = DB.tracer.milik(a.id);
      const karir = DB.tracer.karir(t);
      const teksCari = `${a.nama} ${karir.tempat || ''} ${t?.nama_studi || ''} ${t?.nama_sampingan || ''}`.toLowerCase();
      if (kata && !teksCari.includes(kata)) return false;
      if (!cocokStatus(t, status)) return false;
      if (batch && String(tahunLulusTracer(t)) !== batch) return false;
      if (mitra && (!DB.STATUS_BEKERJA.includes(DB.tracer.kategori(t)) || t?.jns_job === 'Wirausaha' || t?.nama_job !== mitra)) return false;
      return true;
    });

    return urutkanAlumni(tersaring, sort);
  }

  function renderDrawerContent() {
    $('rail-filter').innerHTML = FILTER_SECTIONS.map(sec => {
      const dipilih = Boolean(draftFilter[sec.key]);
      const aktif = activeCategory === sec.key;
      return `
        <button type="button" data-rail-key="${sec.key}"
                class="w-full px-3 py-2.5 text-left text-[12.5px] leading-snug flex items-center justify-between gap-1.5 border-l-[3px] transition-colors cursor-pointer ${
                  aktif
                    ? 'bg-white text-primary1 font-semibold border-primary1'
                    : 'text-neutral2 hover:text-headline hover:bg-neutral5/70 font-medium border-transparent'
                }">
          <span class="truncate">${sec.railLabel}</span>
          ${dipilih ? '<span class="w-1.5 h-1.5 rounded-full bg-primary1 shrink-0" aria-hidden="true"></span>' : ''}
        </button>`;
    }).join('');

    $('opsi-filter').innerHTML = FILTER_SECTIONS.map(sec => `
      <section id="sec-filter-${sec.key}" data-sec-key="${sec.key}" class="scroll-mt-3">
        <h3 class="!text-[13.5px] font-semibold text-headline mb-2.5">${sec.title}</h3>
        <div class="flex flex-wrap gap-2">
          ${sec.options.map(opt => {
            const dipilih = draftFilter[sec.key] === opt.value;
            return `
              <button type="button" data-filter-key="${sec.key}" data-filter-val="${esc(opt.value)}" aria-pressed="${dipilih}"
                      class="px-3 py-2 rounded-[8px] text-[12.5px] leading-snug text-left transition-colors cursor-pointer border ${
                        dipilih
                          ? 'bg-primary5 text-primary1 border-primary4 font-semibold'
                          : 'bg-neutral5 text-neutral1 border-transparent hover:border-neutral4 font-normal'
                      }">${esc(opt.label)}</button>`;
          }).join('')}
        </div>
      </section>`).join('');
    refreshIcons();
  }

  function renderToolbarStatus() {
    const entries = FILTER_SECTIONS
      .filter(sec => activeFilter[sec.key])
      .map(sec => {
        const opt = sec.options.find(o => o.value === activeFilter[sec.key]);
        return { key: sec.key, prefix: sec.railLabel, label: opt ? opt.label : activeFilter[sec.key] };
      });
    const badgeEl = $('badge-filter');
    badgeEl.textContent = entries.length;
    badgeEl.classList.toggle('hidden', entries.length === 0);
    badgeEl.classList.toggle('inline-flex', entries.length > 0);

    const kata = $('cari').value.trim();
    const adaSesuatu = entries.length > 0 || Boolean(kata);
    const barisRingkas = $('baris-ringkas-filter');
    barisRingkas.classList.toggle('hidden', !adaSesuatu);
    barisRingkas.classList.toggle('flex', adaSesuatu);

    $('chips-filter-aktif').innerHTML = entries.map(e => `
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-[8px] bg-primary5 text-primary1 border border-primary4 text-[12px] font-medium">
        <span>${esc(e.prefix)}: ${esc(e.label)}</span>
        <button type="button" data-hapus-chip="${e.key}" aria-label="Hapus filter ${esc(e.prefix)}" class="hover:text-headline cursor-pointer">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </span>`).join('');
  }

  function render() {
    const semua = DB.akun.alumni();
    const hasil = filterAlumni(semua);
    const jumlahHal = Math.max(1, Math.ceil(hasil.length / PER_HALAMAN));
    halaman = Math.min(halaman, jumlahHal);

    renderToolbarStatus();

    $('jumlah-hasil').textContent = hasil.length === semua.length
      ? `(${semua.length} alumni)`
      : `(${hasil.length} dari ${semua.length} alumni)`;
    const halamanIni = potong(hasil, halaman, PER_HALAMAN);
    const kosongHtml = `<p class="!text-[15px] font-semibold text-headline">Tidak ada alumni yang sesuai</p>
          <p class="!text-[13px] mt-1">Coba ubah kata kunci pencarian atau atur ulang filter.</p>`;
    $('daftar').innerHTML = hasil.length
      ? halamanIni.map(barisAlumni).join('')
      : `<tr><td colspan="5" class="py-12 text-center text-neutral3">${kosongHtml}</td></tr>`;
    $('daftar-mobile').innerHTML = hasil.length
      ? halamanIni.map(kartuAlumniMobile).join('')
      : `<div class="py-12 px-4 text-center text-neutral3">${kosongHtml}</div>`;

    const awal = hasil.length ? (halaman - 1) * PER_HALAMAN + 1 : 0;
    const akhir = Math.min(halaman * PER_HALAMAN, hasil.length);
    $('status-hasil').innerHTML = `Menampilkan <strong class="text-headline">${awal}–${akhir}</strong> dari ${hasil.length} alumni`;
    $('hal-posisi').textContent = `${halaman} / ${jumlahHal}`;
    $('hal-sebelum').disabled = halaman <= 1;
    $('hal-berikut').disabled = halaman >= jumlahHal;
    refreshIcons();
  }

  function bukaDrawer() {
    draftFilter = { ...activeFilter };
    renderDrawerContent();
    const drawer = $('drawer-filter');
    const panel = $('drawer-filter-panel');
    drawer.classList.remove('hidden');
    drawer.classList.add('flex');
    document.body.style.overflow = 'hidden';
    $('btn-buka-filter').setAttribute('aria-expanded', 'true');
    requestAnimationFrame(() => panel.classList.remove('translate-x-full'));
    $('btn-tutup-filter').focus();
  }

  function tutupDrawer() {
    const drawer = $('drawer-filter');
    const panel = $('drawer-filter-panel');
    if (drawer.classList.contains('hidden')) return;
    panel.classList.add('translate-x-full');
    document.body.style.overflow = '';
    $('btn-buka-filter').setAttribute('aria-expanded', 'false');
    setTimeout(() => {
      drawer.classList.add('hidden');
      drawer.classList.remove('flex');
    }, 180);
    $('btn-buka-filter').focus();
  }

  const ulang = () => { halaman = 1; render(); };
  $('cari').addEventListener('input', ulang);
  $('btn-buka-filter').addEventListener('click', bukaDrawer);
  $('btn-tutup-filter').addEventListener('click', tutupDrawer);
  $('drawer-filter').addEventListener('click', e => {
    if (e.target === $('drawer-filter')) tutupDrawer();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$('drawer-filter').classList.contains('hidden')) tutupDrawer();
  });

  $('rail-filter').addEventListener('click', e => {
    const btn = e.target.closest('[data-rail-key]');
    if (!btn) return;
    activeCategory = btn.dataset.railKey;
    renderDrawerContent();
    $('sec-filter-' + activeCategory)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  $('opsi-filter').addEventListener('click', e => {
    const chip = e.target.closest('[data-filter-key]');
    if (!chip) return;
    const { filterKey, filterVal } = chip.dataset;
    activeCategory = filterKey;
    draftFilter[filterKey] = draftFilter[filterKey] === filterVal ? '' : filterVal;
    renderDrawerContent();
  });

  $('btn-atur-ulang').addEventListener('click', () => {
    draftFilter = DEFAULT_FILTER();
    activeCategory = 'sort';
    renderDrawerContent();
  });

  $('btn-terapkan-filter').addEventListener('click', () => {
    activeFilter = { ...draftFilter };
    ulang();
    tutupDrawer();
  });

  $('chips-filter-aktif').addEventListener('click', e => {
    const btn = e.target.closest('[data-hapus-chip]');
    if (!btn) return;
    activeFilter[btn.dataset.hapusChip] = '';
    ulang();
  });

  $('btn-reset-filter').addEventListener('click', () => {
    $('cari').value = '';
    activeFilter = DEFAULT_FILTER();
    draftFilter = DEFAULT_FILTER();
    ulang();
  });

  $('hal-sebelum').addEventListener('click', () => { halaman--; render(); });
  $('hal-berikut').addEventListener('click', () => { halaman++; render(); });
  [$('daftar'), $('daftar-mobile')].forEach(el => el.addEventListener('click', e => {
    const baris = e.target.closest('[data-href]');
    if (baris && !e.target.closest('a')) location.href = baris.dataset.href;
  }));

  // Terapkan filter awal bila datang dari Dashboard (?status=..., ?tahun=...) atau Mitra (?mitra=...)
  const paramAwal = new URLSearchParams(location.search);
  if (paramAwal.get('status')) activeFilter.status = paramAwal.get('status');
  if (paramAwal.get('tahun')) activeFilter.batch = paramAwal.get('tahun');
  if (paramAwal.get('mitra')) activeFilter.mitra = paramAwal.get('mitra');
  draftFilter = { ...activeFilter };

  pasangToolsTabel('alat', 'data-alumni.csv', () => [
    KOLOM_EKSPOR.map(([, label]) => label),
    ...filterAlumni(DB.akun.alumni()).map(a => {
      const t = DB.tracer.milik(a.id) || { nama_alumni: a.nama, email: a.email };
      return KOLOM_EKSPOR.map(([k]) => {
        const val = k === 'angkatan' ? angkatanNim(t) : (t[k] ?? '');
        return [val].flat().join(', ');
      });
    }),
  ], { salin: false });

  render();
</script>
</body>
</html>
