<!DOCTYPE html>
<html lang="id" data-role="admin">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Alumni | Koordinator Bengkel Koding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css?v=6">
  <script src="../alumni/assets/js/data.js?v=10"></script>
  <script src="../alumni/assets/js/app.js?v=11"></script>
  <script src="../alumni/assets/js/portal-layout.js"></script>
  <script src="../assets/js/page-skeleton.js?v=6"></script>
  <script src="../assets/js/main.js?v=5"></script>
</head>
<body class="bg-white text-neutral1 antialiased font-sans">
<main data-title="Data Alumni">
  <div>
    <h1 class="!text-[26px] font-semibold text-headline tracking-[-0.01em]">Data &amp; Direktori Alumni</h1>
    <p class="!text-[13.5px] text-neutral3 mt-1">Kelola dan pantau data profil, status karier, dan keahlian alumni Bengkel Koding UDINUS.</p>
  </div>

  <!-- Toolbar filter (pola direktori alumni v3) -->
  <div class="bg-white border border-neutral4 rounded-[14px] p-4 sm:p-5 shadow-sm space-y-4">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div class="relative">
        <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#91969C] pointer-events-none"><i data-lucide="search" class="w-4 h-4"></i></span>
        <input id="cari" type="search" aria-label="Cari alumni" placeholder="Cari nama, email, jabatan, atau keahlian..."
               class="w-full h-10 pl-10 pr-3 rounded-[8px] border border-neutral4 bg-[#F8FAFC] focus:bg-white text-[13.5px] text-neutral1 placeholder-[#91969C] focus:outline-none focus:border-primary1 transition-colors">
      </div>
      <div class="relative">
        <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#91969C] pointer-events-none"><i data-lucide="building-2" class="w-4 h-4"></i></span>
        <input id="cari-tempat" type="search" aria-label="Cari tempat kerja" placeholder="Kerja di mana? (Cari perusahaan...)"
               class="w-full h-10 pl-10 pr-3 rounded-[8px] border border-neutral4 bg-[#F8FAFC] focus:bg-white text-[13.5px] text-neutral1 placeholder-[#91969C] focus:outline-none focus:border-primary1 transition-colors">
      </div>
    </div>

    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
      <div class="grid grid-cols-2 sm:flex sm:flex-wrap sm:items-center gap-2">
        <div class="relative">
          <label for="filter-batch" class="sr-only">Angkatan</label>
          <select id="filter-batch" class="appearance-none w-full h-10 pl-3.5 pr-9 rounded-[8px] border border-neutral4 bg-white text-[13.5px] text-neutral1 focus:outline-none focus:border-primary1 cursor-pointer">
            <option value="">Semua angkatan</option>
          </select>
          <span class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-[#91969C]"><i data-lucide="chevron-down" class="w-4 h-4"></i></span>
        </div>
        <div class="relative">
          <label for="filter-skill" class="sr-only">Keahlian utama</label>
          <select id="filter-skill" class="appearance-none w-full h-10 pl-3.5 pr-9 rounded-[8px] border border-neutral4 bg-white text-[13.5px] text-neutral1 focus:outline-none focus:border-primary1 cursor-pointer">
            <option value="">Semua keahlian</option>
            <option value="Laravel">Laravel / PHP</option>
            <option value="React">React / Frontend</option>
            <option value="Python">Python / ML</option>
            <option value="Flutter">Flutter / Mobile</option>
            <option value="Go">Golang / Cloud</option>
            <option value="Docker">Docker / DevOps</option>
            <option value="UI/UX">UI/UX Design</option>
          </select>
          <span class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-[#91969C]"><i data-lucide="chevron-down" class="w-4 h-4"></i></span>
        </div>
        <div class="relative">
          <label for="filter-kota" class="sr-only">Kota domisili</label>
          <select id="filter-kota" class="appearance-none w-full h-10 pl-3.5 pr-9 rounded-[8px] border border-neutral4 bg-white text-[13.5px] text-neutral1 focus:outline-none focus:border-primary1 cursor-pointer">
            <option value="">Semua kota</option>
          </select>
          <span class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-[#91969C]"><i data-lucide="chevron-down" class="w-4 h-4"></i></span>
        </div>
        <div class="relative">
          <label for="filter-jenjang" class="sr-only">Jenjang pendidikan</label>
          <select id="filter-jenjang" class="appearance-none w-full h-10 pl-3.5 pr-9 rounded-[8px] border border-neutral4 bg-white text-[13.5px] text-neutral1 focus:outline-none focus:border-primary1 cursor-pointer">
            <option value="">Semua jenjang</option>
            <option value="s1">S1</option>
            <option value="s2">Studi Lanjut</option>
          </select>
          <span class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-[#91969C]"><i data-lucide="chevron-down" class="w-4 h-4"></i></span>
        </div>
      </div>

      <div class="flex items-center justify-end">
        <button type="button" id="btn-reset-filter" class="hidden text-[13px] text-primary3 hover:underline font-medium cursor-pointer whitespace-nowrap">Reset</button>
      </div>
    </div>
  </div>

  <!-- Tabel alumni -->
  <div class="bg-white border border-neutral4 rounded-[14px] shadow-sm overflow-hidden">
    <div class="px-6 py-4 border-b border-neutral4 flex items-center gap-2.5">
      <h2 class="!text-[17px] font-bold text-headline tracking-[-0.01em]">Daftar Alumni</h2>
      <span id="jumlah-hasil" class="text-[12px] text-neutral3"></span>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="border-b border-neutral4 bg-white text-[13px] font-medium text-neutral3">
            <th class="py-3.5 pl-6 pr-4 font-medium min-w-[240px]">Nama</th>
            <th class="py-3.5 px-4 font-medium min-w-[140px]">Domisili</th>
            <th class="py-3.5 px-4 font-medium min-w-[160px]">Posisi</th>
            <th class="py-3.5 px-4 font-medium min-w-[170px]">Tempat Kerja</th>
            <th class="py-3.5 pr-6 pl-4 font-medium text-right min-w-[110px]">Aksi</th>
          </tr>
        </thead>
        <tbody id="daftar" class="divide-y divide-neutral4 text-[13.5px]"></tbody>
      </table>
    </div>
    <div class="px-6 py-3.5 border-t border-neutral4 bg-[#FAFBFC] flex items-center justify-between gap-3 text-[12.5px] text-neutral3">
      <span id="status-hasil"></span>
      <div class="flex items-center gap-1">
        <button type="button" id="hal-sebelum" class="px-2.5 py-1 rounded-[6px] border border-neutral4 bg-white text-neutral1 hover:bg-neutral5 disabled:text-[#91969C] disabled:opacity-60 disabled:cursor-not-allowed cursor-pointer">Sebelumnya</button>
        <span id="hal-posisi" class="px-3 py-1 font-semibold text-headline tabular-nums"></span>
        <button type="button" id="hal-berikut" class="px-2.5 py-1 rounded-[6px] border border-neutral4 bg-white text-neutral1 hover:bg-neutral5 disabled:text-[#91969C] disabled:opacity-60 disabled:cursor-not-allowed cursor-pointer">Berikutnya</button>
      </div>
    </div>
  </div>
</main>

<script>
  const PER_HALAMAN = 10;
  let halaman = 1;
  const $ = id => document.getElementById(id);

  const isS2 = t => Boolean(t && (t.status === DB.STATUS_STUDI || t.nama_studi));

  // Badge posisi berwarna lembut seperti direktori alumni v3
  const WARNA_POSISI = {
    bekerja: 'bg-[#E2F1F9] text-[#3A5A86]',
    studi: 'bg-[#FDF0DD] text-[#B26A12]',
    lain: 'bg-[#F4F5F7] text-[#4B5563]',
  };
  const kelompok = t => !t ? 'lain' : DB.STATUS_BEKERJA.includes(t.status) ? 'bekerja' : isS2(t) ? 'studi' : 'lain';

  function barisAlumni(a) {
    const t = DB.tracer.milik(a.id);
    const karir = DB.tracer.karir(t);
    const foto = a.foto
      ? `<img src="${esc(a.foto)}" alt="" onerror="this.onerror=null;this.src='../alumni/assets/img/user.png'" class="w-9 h-9 rounded-full object-cover shrink-0 border border-neutral4">`
      : `<span class="w-9 h-9 rounded-full bg-primary5 text-primary1 font-semibold text-[12px] flex items-center justify-center shrink-0">${esc(inisial(a.nama))}</span>`;
    const href = `profil-alumni.html?id=${a.id}`;
    return `
      <tr class="hover:bg-[#F9FAFB] transition-colors group cursor-pointer" data-href="${href}">
        <td class="py-4 pl-6 pr-4">
          <div class="flex items-center gap-3">
            ${foto}
            <div class="min-w-0">
              <span class="block font-semibold text-headline group-hover:text-primary1 transition-colors truncate">${esc(a.nama)}</span>
              <span class="block text-[12px] text-neutral3 truncate">Angkatan ${esc(t?.tahun_lulus || '-')} · ${isS2(t) ? 'S2' : 'S1'} · ${esc(a.email)}</span>
            </div>
          </div>
        </td>
        <td class="py-4 px-4 text-[#374151]">${esc(t?.kota || '-')}</td>
        <td class="py-4 px-4"><span class="inline-block px-2.5 py-1 rounded-[6px] text-[12px] font-medium ${WARNA_POSISI[kelompok(t)]}">${esc(karir.posisi || t?.status || 'Belum mengisi tracer')}</span></td>
        <td class="py-4 px-4 font-medium text-neutral1">${esc(karir.tempat || '-')}</td>
        <td class="py-4 pr-6 pl-4 text-right"><a href="${href}" class="text-[13px] font-medium text-primary1 hover:underline">Lihat detail</a></td>
      </tr>`;
  }

  function filterAlumni(semua) {
    const kata = $('cari').value.trim().toLowerCase();
    const tempat = $('cari-tempat').value.trim().toLowerCase();
    const batch = $('filter-batch').value;
    const kota = $('filter-kota').value;
    const skill = $('filter-skill').value.toLowerCase();
    const jenjang = $('filter-jenjang').value;

    return semua.filter(a => {
      const t = DB.tracer.milik(a.id);
      const karir = DB.tracer.karir(t);
      const keahlian = (t?.keahlian || []).join(' ').toLowerCase();
      if (kata && !`${a.nama} ${a.email} ${karir.ringkas} ${keahlian}`.toLowerCase().includes(kata)) return false;
      if (tempat && !karir.tempat.toLowerCase().includes(tempat)) return false;
      if (batch && String(t?.tahun_lulus) !== batch) return false;
      if (kota && t?.kota !== kota) return false;
      if (skill && !keahlian.includes(skill)) return false;
      if (jenjang === 's2' && !isS2(t)) return false;
      if (jenjang === 's1' && isS2(t)) return false;
      return true;
    });
  }

  function render() {
    const semua = DB.akun.alumni();
    const hasil = filterAlumni(semua);
    const jumlahHal = Math.max(1, Math.ceil(hasil.length / PER_HALAMAN));
    halaman = Math.min(halaman, jumlahHal);

    const filterAktif = Boolean($('cari').value.trim() || $('cari-tempat').value.trim() || $('filter-batch').value || $('filter-skill').value || $('filter-kota').value || $('filter-jenjang').value);
    $('btn-reset-filter').classList.toggle('hidden', !filterAktif);

    $('jumlah-hasil').textContent = `(${hasil.length} rekan)`;
    $('daftar').innerHTML = hasil.length
      ? potong(hasil, halaman, PER_HALAMAN).map(barisAlumni).join('')
      : `<tr><td colspan="5" class="py-12 text-center text-neutral3">
          <p class="!text-[15px] font-semibold text-headline">Tidak ada alumni yang sesuai</p>
          <p class="!text-[13px] mt-1">Coba ubah kata kunci pencarian atau reset filter.</p>
        </td></tr>`;

    const awal = hasil.length ? (halaman - 1) * PER_HALAMAN + 1 : 0;
    const akhir = Math.min(halaman * PER_HALAMAN, hasil.length);
    $('status-hasil').innerHTML = `Menampilkan <strong class="text-headline">${awal}–${akhir}</strong> dari ${hasil.length} alumni`;
    $('hal-posisi').textContent = `${halaman} / ${jumlahHal}`;
    $('hal-sebelum').disabled = halaman <= 1;
    $('hal-berikut').disabled = halaman >= jumlahHal;
    refreshIcons();
  }

  const ulang = () => { halaman = 1; render(); };
  ['cari', 'cari-tempat'].forEach(id => $(id).addEventListener('input', ulang));
  ['filter-batch', 'filter-skill', 'filter-kota', 'filter-jenjang'].forEach(id => $(id).addEventListener('change', ulang));
  $('btn-reset-filter').addEventListener('click', () => {
    ['cari', 'cari-tempat', 'filter-batch', 'filter-skill', 'filter-kota', 'filter-jenjang'].forEach(id => { $(id).value = ''; });
    ulang();
  });
  $('hal-sebelum').addEventListener('click', () => { halaman--; render(); });
  $('hal-berikut').addEventListener('click', () => { halaman++; render(); });
  // Klik di mana saja pada baris membuka profil
  $('daftar').addEventListener('click', e => {
    const tr = e.target.closest('tr[data-href]');
    if (tr && !e.target.closest('a')) location.href = tr.dataset.href;
  });

  // Pilihan angkatan dan kota diambil dari data, jadi selalu cocok dengan isi tabel
  const tracerAlumni = DB.akun.alumni().map(a => DB.tracer.milik(a.id)).filter(Boolean);
  const isiOpsi = (id, nilai, label) => $(id).insertAdjacentHTML('beforeend',
    nilai.map(v => `<option value="${esc(v)}">${esc(label(v))}</option>`).join(''));
  isiOpsi('filter-batch', [...new Set(tracerAlumni.map(t => String(t.tahun_lulus)))].sort(), v => `Angkatan ${v}`);
  isiOpsi('filter-kota', [...new Set(tracerAlumni.map(t => t.kota).filter(Boolean))].sort(), v => v);

  render();
</script>
</body>
</html>
