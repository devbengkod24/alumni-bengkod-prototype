<!DOCTYPE html>
<html lang="id" data-role="admin">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Alumni | Koordinator Bengkel Koding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css?v=6">
  <script src="../alumni/assets/js/data.js?v=10"></script>
  <script src="../alumni/assets/js/app.js?v=11"></script>
  <script src="../alumni/assets/js/portal-layout.js"></script>
  <script src="../assets/js/page-skeleton.js?v=6"></script>
  <script src="../assets/js/main.js?v=5"></script>
</head>
<body class="bg-white text-neutral1 antialiased font-sans">
<main data-title="Data Alumni">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
    <div>
      <h1 class="!text-[26px] font-semibold text-headline">Data &amp; Direktori Alumni</h1>
      <p class="!text-[13.5px] text-neutral3 mt-1">Pantau profil, status karier, dan sebaran keahlian alumni Bengkel Koding UDINUS.</p>
    </div>
    <span class="self-start sm:self-auto shrink-0 inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-[#E2F1F9] text-[#3A5988] text-[13px] font-semibold tabular-nums">
      <i data-lucide="users" class="w-4 h-4" aria-hidden="true"></i>
      <span id="total-terdaftar">0 Alumni Terdaftar</span>
    </span>
  </div>

  <!-- Toolbar filter -->
  <section class="bg-white border border-neutral4 rounded-[16px] p-4 sm:p-5 shadow-sm space-y-3.5" aria-label="Filter direktori alumni">
    <div class="relative">
      <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#91969C] pointer-events-none"><i data-lucide="search" class="w-4 h-4"></i></span>
      <input id="cari" type="search" aria-label="Cari alumni" placeholder="Cari nama, email, posisi, perusahaan, atau keahlian..."
             class="w-full h-10 pl-10 pr-3.5 rounded-[10px] border border-neutral4 bg-[#F8FAFC] focus:bg-white text-[13.5px] text-neutral1 placeholder-[#91969C] focus:outline-none focus:ring-2 focus:ring-primary1/15 focus:border-primary1 transition-colors">
    </div>

    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-2.5">
      <div class="grid grid-cols-2 sm:flex sm:flex-wrap sm:items-center gap-2">
        <div class="relative">
          <label for="filter-batch" class="sr-only">Angkatan</label>
          <select id="filter-batch" class="appearance-none w-full h-10 pl-3.5 pr-9 rounded-[10px] border border-neutral4 bg-white text-[13.5px] font-medium text-neutral1 focus:outline-none focus:ring-2 focus:ring-primary1/15 focus:border-primary1 cursor-pointer transition-colors">
            <option value="">Semua angkatan</option>
          </select>
          <span class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-[#91969C]"><i data-lucide="chevron-down" class="w-4 h-4"></i></span>
        </div>
        <div class="relative">
          <label for="filter-skill" class="sr-only">Keahlian utama</label>
          <select id="filter-skill" class="appearance-none w-full h-10 pl-3.5 pr-9 rounded-[10px] border border-neutral4 bg-white text-[13.5px] font-medium text-neutral1 focus:outline-none focus:ring-2 focus:ring-primary1/15 focus:border-primary1 cursor-pointer transition-colors">
            <option value="">Semua keahlian</option>
            <option value="Laravel">Laravel / PHP</option>
            <option value="React">React / Frontend</option>
            <option value="Python">Python / ML</option>
            <option value="Flutter">Flutter / Mobile</option>
            <option value="Go">Golang / Cloud</option>
            <option value="Docker">Docker / DevOps</option>
            <option value="UI/UX">UI/UX Design</option>
          </select>
          <span class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-[#91969C]"><i data-lucide="chevron-down" class="w-4 h-4"></i></span>
        </div>
        <div class="relative">
          <label for="filter-kota" class="sr-only">Kota domisili</label>
          <select id="filter-kota" class="appearance-none w-full h-10 pl-3.5 pr-9 rounded-[10px] border border-neutral4 bg-white text-[13.5px] font-medium text-neutral1 focus:outline-none focus:ring-2 focus:ring-primary1/15 focus:border-primary1 cursor-pointer transition-colors">
            <option value="">Semua kota</option>
          </select>
          <span class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-[#91969C]"><i data-lucide="chevron-down" class="w-4 h-4"></i></span>
        </div>
        <div class="relative">
          <label for="filter-jenjang" class="sr-only">Jenjang pendidikan</label>
          <select id="filter-jenjang" class="appearance-none w-full h-10 pl-3.5 pr-9 rounded-[10px] border border-neutral4 bg-white text-[13.5px] font-medium text-neutral1 focus:outline-none focus:ring-2 focus:ring-primary1/15 focus:border-primary1 cursor-pointer transition-colors">
            <option value="">Semua jenjang</option>
            <option value="s1">S1</option>
            <option value="s2">Studi Lanjut</option>
          </select>
          <span class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-[#91969C]"><i data-lucide="chevron-down" class="w-4 h-4"></i></span>
        </div>
      </div>

      <button type="button" id="btn-reset-filter" class="hidden self-end lg:self-auto inline-flex items-center gap-1.5 h-10 px-3.5 rounded-[10px] border border-neutral4 bg-white hover:bg-neutral5 text-[13px] font-medium text-neutral2 hover:text-headline transition-colors cursor-pointer whitespace-nowrap">
        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5" aria-hidden="true"></i>
        <span>Reset filter</span>
      </button>
    </div>
  </section>

  <!-- Tabel alumni -->
  <section class="bg-white border border-neutral4 rounded-[16px] shadow-sm overflow-hidden" aria-labelledby="judul-daftar-alumni">
    <div class="px-4 sm:px-6 py-4 border-b border-neutral4 flex items-center justify-between gap-3">
      <div class="flex items-baseline gap-2">
        <h2 id="judul-daftar-alumni" class="!text-[16px] font-semibold text-headline">Daftar Alumni</h2>
        <span id="jumlah-hasil" class="text-[13px] text-neutral3 tabular-nums"></span>
      </div>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="border-b border-neutral4 bg-[#F8FAFC] text-[12.5px] font-semibold text-neutral3">
            <th class="py-3 pl-4 sm:pl-6 pr-2 font-semibold w-14 text-center">No</th>
            <th class="py-3 px-4 font-semibold min-w-[230px]">Nama</th>
            <th class="py-3 px-4 font-semibold min-w-[100px] whitespace-nowrap">Angkatan</th>
            <th class="py-3 px-4 font-semibold min-w-[120px] whitespace-nowrap">Domisili</th>
            <th class="py-3 px-4 font-semibold min-w-[160px]">Posisi</th>
            <th class="py-3 px-4 font-semibold min-w-[160px]">Tempat Kerja</th>
            <th class="py-3 pr-4 sm:pr-6 pl-4 font-semibold text-right min-w-[110px]">Aksi</th>
          </tr>
        </thead>
        <tbody id="daftar" class="divide-y divide-neutral4 text-[13.5px]"></tbody>
      </table>
    </div>
    <div class="px-4 sm:px-6 py-3.5 border-t border-neutral4 bg-[#F8FAFC] flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-[13px] text-neutral3">
      <span id="status-hasil" class="tabular-nums"></span>
      <div class="flex items-center justify-end gap-1.5">
        <button type="button" id="hal-sebelum" class="inline-flex items-center gap-1 h-9 px-3 rounded-[8px] border border-neutral4 bg-white text-[12.5px] font-medium text-neutral1 hover:bg-neutral5 disabled:text-[#91969C] disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer transition-colors">
          <i data-lucide="chevron-left" class="w-3.5 h-3.5" aria-hidden="true"></i>
          <span>Sebelumnya</span>
        </button>
        <span id="hal-posisi" class="px-3 py-1.5 text-[12.5px] font-semibold text-headline tabular-nums"></span>
        <button type="button" id="hal-berikut" class="inline-flex items-center gap-1 h-9 px-3 rounded-[8px] border border-neutral4 bg-white text-[12.5px] font-medium text-neutral1 hover:bg-neutral5 disabled:text-[#91969C] disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer transition-colors">
          <span>Berikutnya</span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </section>
</main>

<script>
  const PER_HALAMAN = 10;
  let halaman = 1;
  const $ = id => document.getElementById(id);

  const isS2 = t => Boolean(t && (t.status === DB.STATUS_STUDI || t.nama_studi));

  // Badge posisi berwarna lembut
  const WARNA_POSISI = {
    bekerja: 'bg-[#E2F1F9] text-[#3A5988]',
    studi: 'bg-[#FDF0DD] text-[#B26A12]',
    lain: 'bg-[#F4F5F7] text-[#4B5563]',
  };
  const kelompok = t => !t ? 'lain' : DB.STATUS_BEKERJA.includes(t.status) ? 'bekerja' : isS2(t) ? 'studi' : 'lain';

  function barisAlumni(a, nomor) {
    const t = DB.tracer.milik(a.id);
    const karir = DB.tracer.karir(t);
    const foto = a.foto
      ? `<img src="${esc(a.foto)}" alt="" onerror="this.onerror=null;this.src='../alumni/assets/img/user.png'" class="w-10 h-10 rounded-full object-cover shrink-0 border border-neutral4">`
      : `<span class="w-10 h-10 rounded-full bg-primary5 text-primary1 font-semibold text-[12.5px] flex items-center justify-center shrink-0">${esc(inisial(a.nama))}</span>`;
    const href = `profil-alumni.html?id=${a.id}`;
    const jenjangBadge = isS2(t)
      ? '<span class="px-1.5 py-0.5 rounded bg-[#FDF0DD] text-[#B26A12] text-[10.5px] font-semibold">S2</span>'
      : '<span class="px-1.5 py-0.5 rounded bg-[#F4F5F7] text-[#4B5563] text-[10.5px] font-medium">S1</span>';
    return `
      <tr class="hover:bg-[#F8FAFC] transition-colors group cursor-pointer" data-href="${href}">
        <td class="py-3.5 pl-4 sm:pl-6 pr-2 text-center text-[13px] font-medium text-neutral3 tabular-nums">${nomor}</td>
        <td class="py-3.5 px-4">
          <div class="flex items-center gap-3">
            ${foto}
            <div class="min-w-0">
              <div class="flex items-center gap-1.5 min-w-0">
                <span class="font-semibold text-headline group-hover:text-primary1 transition-colors truncate">${esc(a.nama)}</span>
                ${jenjangBadge}
              </div>
              <span class="block text-[12px] text-neutral3 truncate mt-0.5">${esc(a.email)}</span>
            </div>
          </div>
        </td>
        <td class="py-3.5 px-4 text-neutral2 font-medium tabular-nums whitespace-nowrap">${esc(t?.tahun_lulus || '-')}</td>
        <td class="py-3.5 px-4 text-neutral2 whitespace-nowrap">${esc(t?.kota || '-')}</td>
        <td class="py-3.5 px-4"><span class="inline-block px-2.5 py-1 rounded-[6px] text-[12px] font-medium ${WARNA_POSISI[kelompok(t)]}">${esc(karir.posisi || t?.status || 'Belum mengisi tracer')}</span></td>
        <td class="py-3.5 px-4 font-medium text-neutral1">${esc(karir.tempat || '-')}</td>
        <td class="py-3.5 pr-4 sm:pr-6 pl-4 text-right whitespace-nowrap">
          <a href="${href}" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-[8px] border border-neutral4 bg-white text-[12.5px] font-medium text-neutral1 group-hover:border-primary4 group-hover:text-primary1 transition-colors">
            <span>Detail</span>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5" aria-hidden="true"></i>
          </a>
        </td>
      </tr>`;
  }

  function filterAlumni(semua) {
    const kata = $('cari').value.trim().toLowerCase();
    const batch = $('filter-batch').value;
    const kota = $('filter-kota').value;
    const skill = $('filter-skill').value.toLowerCase();
    const jenjang = $('filter-jenjang').value;

    return semua.filter(a => {
      const t = DB.tracer.milik(a.id);
      const karir = DB.tracer.karir(t);
      const keahlian = (t?.keahlian || []).join(' ').toLowerCase();
      if (kata && !`${a.nama} ${a.email} ${karir.ringkas} ${karir.tempat} ${keahlian}`.toLowerCase().includes(kata)) return false;
      if (batch && String(t?.tahun_lulus) !== batch) return false;
      if (kota && t?.kota !== kota) return false;
      if (skill && !keahlian.includes(skill)) return false;
      if (jenjang === 's2' && !isS2(t)) return false;
      if (jenjang === 's1' && isS2(t)) return false;
      return true;
    });
  }

  const FILTER_SELECTS = ['filter-batch', 'filter-skill', 'filter-kota', 'filter-jenjang'];

  function perbaruiStatusSelect() {
    FILTER_SELECTS.forEach(id => {
      const el = $(id);
      const aktif = Boolean(el.value);
      el.classList.toggle('border-primary4', aktif);
      el.classList.toggle('bg-[#EBF2FC]', aktif);
      el.classList.toggle('text-primary1', aktif);
      el.classList.toggle('border-neutral4', !aktif);
      el.classList.toggle('bg-white', !aktif);
      el.classList.toggle('text-neutral1', !aktif);
    });
  }

  function resetSemuaFilter() {
    ['cari', ...FILTER_SELECTS].forEach(id => { $(id).value = ''; });
    ulang();
  }

  function render() {
    const semua = DB.akun.alumni();
    const hasil = filterAlumni(semua);
    const jumlahHal = Math.max(1, Math.ceil(hasil.length / PER_HALAMAN));
    halaman = Math.min(halaman, jumlahHal);

    perbaruiStatusSelect();
    $('total-terdaftar').textContent = `${semua.length} Alumni Terdaftar`;

    const filterAktif = Boolean($('cari').value.trim() || FILTER_SELECTS.some(id => $(id).value));
    $('btn-reset-filter').classList.toggle('hidden', !filterAktif);

    const awal = hasil.length ? (halaman - 1) * PER_HALAMAN + 1 : 0;
    const akhir = Math.min(halaman * PER_HALAMAN, hasil.length);
    const mulaiNomor = (halaman - 1) * PER_HALAMAN;
    $('jumlah-hasil').textContent = `(${hasil.length} alumni)`;
    $('daftar').innerHTML = hasil.length
      ? potong(hasil, halaman, PER_HALAMAN).map((a, idx) => barisAlumni(a, mulaiNomor + idx + 1)).join('')
      : `<tr><td colspan="7" class="py-12 px-4 text-center text-neutral3">
          <i data-lucide="users" class="w-9 h-9 mx-auto mb-3 text-[#CBD5E1]" aria-hidden="true"></i>
          <p class="!text-[15px] font-semibold text-headline">Tidak ada alumni yang sesuai</p>
          <p class="!text-[13px] text-neutral3 mt-1">Ubah kata kunci pencarian atau reset filter untuk melihat semua alumni.</p>
          ${filterAktif ? '<button type="button" onclick="resetSemuaFilter()" class="mt-4 inline-flex items-center gap-1.5 px-3.5 py-2 rounded-[8px] border border-neutral4 bg-white hover:bg-neutral5 text-[13px] font-medium text-neutral1 cursor-pointer transition-colors"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i><span>Reset semua filter</span></button>' : ''}
        </td></tr>`;

    $('status-hasil').innerHTML = `Menampilkan <strong class="text-headline">${awal}–${akhir}</strong> dari ${hasil.length} alumni`;
    $('hal-posisi').textContent = `${halaman} / ${jumlahHal}`;
    $('hal-sebelum').disabled = halaman <= 1;
    $('hal-berikut').disabled = halaman >= jumlahHal;
    refreshIcons();
  }

  const ulang = () => { halaman = 1; render(); };
  $('cari').addEventListener('input', ulang);
  FILTER_SELECTS.forEach(id => $(id).addEventListener('change', ulang));
  $('btn-reset-filter').addEventListener('click', resetSemuaFilter);
  $('hal-sebelum').addEventListener('click', () => { halaman--; render(); });
  $('hal-berikut').addEventListener('click', () => { halaman++; render(); });
  // Klik di mana saja pada baris membuka profil
  $('daftar').addEventListener('click', e => {
    const tr = e.target.closest('tr[data-href]');
    if (tr && !e.target.closest('a')) location.href = tr.dataset.href;
  });

  // Pilihan angkatan dan kota diambil dari data, jadi selalu cocok dengan isi tabel
  const tracerAlumni = DB.akun.alumni().map(a => DB.tracer.milik(a.id)).filter(Boolean);
  const isiOpsi = (id, nilai, label) => $(id).insertAdjacentHTML('beforeend',
    nilai.map(v => `<option value="${esc(v)}">${esc(label(v))}</option>`).join(''));
  isiOpsi('filter-batch', [...new Set(tracerAlumni.map(t => String(t.tahun_lulus)))].sort(), v => `Angkatan ${v}`);
  isiOpsi('filter-kota', [...new Set(tracerAlumni.map(t => t.kota).filter(Boolean))].sort(), v => v);

  render();
</script>
</body>
</html>
