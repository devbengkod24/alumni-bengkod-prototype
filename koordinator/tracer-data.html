<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracer Data | Koordinator Bengkel Koding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="assets/js/koordinator.js"></script>
  <script src="../assets/js/main.js"></script>
</head>
<body class="bg-neutral5 text-neutral1 antialiased font-sans">
<main data-title="Tracer Data">

  <div>
    <h2 class="text-2xl font-semibold text-neutral1">Tracer Data Alumni & Mitra</h2>
    <p class="text-sm text-neutral2 mt-1">Lihat dan verifikasi data tracer study yang diisi alumni serta profil mitra perusahaan.</p>
  </div>

  <section class="bg-white rounded-xl border border-neutral4 elevation2 overflow-hidden">
    <div class="flex border-b border-neutral4 px-2 overflow-x-auto" role="tablist">
      <button data-tab="alumni" role="tab">Data Alumni</button>
      <button data-tab="mitra" role="tab">Data Mitra</button>
    </div>

    <div id="tab-alumni" role="tabpanel">
      <div class="p-4 flex flex-col sm:flex-row gap-3 border-b border-neutral4">
        <select id="f-tahun" class="input sm:w-48" aria-label="Filter tahun lulus"><option value="">Semua tahun lulus</option></select>
        <select id="f-verif" class="input sm:w-48" aria-label="Filter status verifikasi">
          <option value="">Semua status</option><option>Belum Verifikasi</option><option>Terverifikasi</option><option>Ditolak</option>
        </select>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead><tr><th class="th">Alumni</th><th class="th">Lulus</th><th class="th">Status Karir</th><th class="th">Instansi / Jabatan</th><th class="th">Masa Tunggu</th><th class="th">Verifikasi</th><th class="th text-right">Aksi</th></tr></thead>
          <tbody id="alumni"></tbody>
        </table>
      </div>
    </div>

    <div id="tab-mitra" role="tabpanel" class="overflow-x-auto">
      <table class="w-full">
        <thead><tr><th class="th">Perusahaan</th><th class="th">Bidang Usaha</th><th class="th">Kota</th><th class="th">PIC</th><th class="th text-right">Alumni</th><th class="th">Verifikasi</th><th class="th text-right">Aksi</th></tr></thead>
        <tbody id="mitra"></tbody>
      </table>
    </div>
  </section>

</main>

<script>
  const tahunSel = document.getElementById('f-tahun');
  [...new Set(KOOR.alumni.map(a => a.tahun_lulus))].sort().forEach(t => tahunSel.add(new Option(t, t)));

  const aksi = (type, item) => item.verifikasi === 'Belum Verifikasi' ? `<div class="flex justify-end gap-1">
      <button class="btn-icon hover:!bg-green3 hover:!text-green1" onclick="verif('${type}', ${item.id}, true)" aria-label="Verifikasi" title="Verifikasi"><i data-lucide="check" class="w-4 h-4"></i></button>
      <button class="btn-icon hover:!bg-red3 hover:!text-red1" onclick="verif('${type}', ${item.id}, false)" aria-label="Tolak" title="Tolak"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>` : '';

  function render() {
    const t = tahunSel.value, v = document.getElementById('f-verif').value;
    const list = KOOR.alumni.filter(a => (!t || a.tahun_lulus == t) && (!v || a.verifikasi === v));
    document.getElementById('alumni').innerHTML = list.map(a => `
      <tr class="tr">
        <td class="td"><div class="font-medium">${esc(a.nama)}</div><div class="text-xs text-neutral3">${a.nim}</div></td>
        <td class="td">${a.tahun_lulus}</td>
        <td class="td">${badge(a.status)}</td>
        <td class="td"><div>${esc(a.nama_perusahaan)}</div><div class="text-xs text-neutral3">${esc(a.jabatan)}</div></td>
        <td class="td whitespace-nowrap">${a.masa_tunggu} bln</td>
        <td class="td">${badge(a.verifikasi)}</td>
        <td class="td">${aksi('alumni', a)}</td>
      </tr>`).join('') || '<tr><td colspan="7" class="td text-center text-neutral3 py-8">Tidak ada data.</td></tr>';

    document.getElementById('mitra').innerHTML = KOOR.mitra.map(m => `
      <tr class="tr">
        <td class="td font-medium">${esc(m.nama_perusahaan)}</td>
        <td class="td">${esc(m.bidang_usaha)}</td>
        <td class="td">${esc(m.kota)}</td>
        <td class="td">${esc(m.pic)}</td>
        <td class="td text-right">${m.alumni}</td>
        <td class="td">${badge(m.verifikasi)}</td>
        <td class="td">${aksi('mitra', m)}</td>
      </tr>`).join('');
    refreshIcons();
  }

  function verif(type, id, ok) {
    const item = KOOR[type].find(x => x.id === id);
    const nama = item.nama || item.nama_perusahaan;
    confirmAction({
      title: ok ? 'Verifikasi data?' : 'Tolak data?',
      message: ok ? `Data tracer ${nama} akan ditandai terverifikasi dan masuk ke rekap.` : `Data ${nama} ditolak dan diminta untuk diperbaiki.`,
      okLabel: ok ? 'Verifikasi' : 'Tolak', danger: !ok,
    }, () => {
      item.verifikasi = ok ? 'Terverifikasi' : 'Ditolak';
      audit(ok ? `Verifikasi data ${type}` : `Tolak data ${type}`, nama);
      render();
      showToast(ok ? 'Data terverifikasi.' : 'Data ditolak.');
    });
  }

  tahunSel.addEventListener('change', render);
  document.getElementById('f-verif').addEventListener('change', render);
  render();
  initTabs();
</script>
</body>
</html>
