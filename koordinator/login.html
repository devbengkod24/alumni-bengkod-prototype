<!DOCTYPE html>
<html lang="id" data-color-mode="light" class="h-full overflow-hidden bg-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk | Portal Koordinator Bengkel Koding UDINUS</title>
  <meta name="description" content="Masuk ke Portal Koordinator Bengkel Koding Universitas Dian Nuswantoro.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            poppins: ['Poppins', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <script src="../alumni/assets/js/data.js?v=10"></script>
  <script src="../alumni/assets/js/auth-panel.js?v=5"></script>
</head>
<body class="h-screen h-dvh overflow-hidden bg-white text-[#0F172A] antialiased font-sans">

  <div class="h-full w-full flex flex-col lg:flex-row overflow-hidden bg-white">

    <!-- Form Masuk (Kiri di desktop, Bawah di mobile, pas 1 layar tanpa scroll) -->
    <main class="order-2 lg:order-1 flex-1 min-h-0 w-full lg:w-[45.14%] lg:flex-none bg-white flex flex-col justify-center px-6 py-3 sm:px-12 lg:px-14 min-[1420px]:px-[94px] lg:py-6 overflow-hidden">
      <div class="w-full max-w-[462px] mx-auto">

        <a href="../index.html" class="inline-flex items-center gap-[10px] lg:gap-[12px] w-fit rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1E3A8A]/30">
          <div class="w-[30px] h-[30px] lg:w-[38px] lg:h-[38px] rounded-[9px] lg:rounded-[12px] bg-[#1E3A8A] flex items-center justify-center shrink-0">
            <span class="font-bold text-[12px] lg:text-[15px] leading-none text-white">BK</span>
          </div>
          <div class="flex flex-col gap-[1.5px] lg:gap-[2px] leading-none">
            <span class="font-bold text-[15px] lg:text-[18px] text-[#1E3A8A]">bengkod</span>
            <span class="font-semibold text-[7.5px] lg:text-[9px] text-[#2563EB]">PORTAL KOORDINATOR</span>
          </div>
        </a>

        <h1 class="mt-[clamp(12px,2.2vh,24px)] lg:mt-[clamp(20px,3.6vh,38px)] font-bold text-[24px] sm:text-[28px] lg:text-[35px] min-[1420px]:text-[39px] leading-[1.11] text-[#0F172A]">
          Masuk ke Portal Koordinator
        </h1>
        <p class="mt-1.5 lg:mt-2.5 font-normal text-[13px] lg:text-[15px] leading-[1.4] lg:leading-[1.45] text-[#475569]">
          Gunakan email dan kata sandi akun koordinator Bengkel Koding.
        </p>

        <form id="login-form" novalidate class="mt-3.5 lg:mt-[clamp(16px,2.6vh,28px)]">
          <div>
            <label for="email" class="block font-semibold text-[12.5px] lg:text-[13px] leading-[1.4] text-[#0F172A] mb-0.5 lg:mb-1">
              Email
            </label>
            <input id="email" name="email" type="email" autocomplete="email" required
                   placeholder="nama@example.com"
                   class="w-full h-[38px] lg:h-[clamp(42px,5.2vh,48px)] px-3 rounded-[9px] lg:rounded-[10px] border border-[#8798B2] bg-white text-[13.5px] lg:text-[14px] text-[#0F172A] placeholder:text-[#475569] focus:outline-none focus:border-[#1E3A8A] focus:ring-2 focus:ring-[#1E3A8A]/15 transition-colors">
            <p id="error-email" class="hidden text-[11px] leading-tight text-red-600 mt-0.5" role="alert"></p>
          </div>

          <div class="mt-1.5 lg:mt-2">
            <label for="password" class="block font-semibold text-[12.5px] lg:text-[13px] leading-[1.4] text-[#0F172A] mb-0.5 lg:mb-1">
              Kata sandi
            </label>
            <input id="password" name="password" type="password" autocomplete="current-password" required
                   placeholder="Masukkan kata sandi"
                   class="w-full h-[38px] lg:h-[clamp(42px,5.2vh,48px)] px-3 rounded-[9px] lg:rounded-[10px] border border-[#8798B2] bg-white text-[13.5px] lg:text-[14px] text-[#0F172A] placeholder:text-[#475569] focus:outline-none focus:border-[#1E3A8A] focus:ring-2 focus:ring-[#1E3A8A]/15 transition-colors">
            <p id="error-password" class="hidden text-[11px] leading-tight text-red-600 mt-0.5" role="alert"></p>
          </div>

          <button type="submit"
                  class="mt-3 lg:mt-4 w-full h-[42px] lg:h-[clamp(44px,5.5vh,50px)] rounded-[10px] lg:rounded-[11px] bg-[#1E3A8A] hover:bg-[#1D4ED8] active:bg-[#172E71] text-white font-semibold text-[14px] lg:text-[15px] leading-[1.45] transition-colors cursor-pointer focus:outline-none focus:ring-4 focus:ring-[#1E3A8A]/20">
            Masuk
          </button>
        </form>

        <div class="mt-2 lg:mt-2.5 flex items-center gap-2 text-[12.5px] lg:text-[13px] leading-[1.4]">
          <span class="font-normal text-[#475569]">Anda alumni?</span>
          <a href="../alumni/login.html" class="inline-flex items-center min-h-[30px] lg:min-h-[36px] font-semibold text-[#1E3A8A] hover:underline focus:outline-none focus:ring-2 focus:ring-[#1E3A8A]/30 rounded">
            Masuk di portal alumni
          </a>
        </div>

        <!-- Khusus prototype: akun contoh koordinator -->
        <div class="mt-2 lg:mt-3 p-2.5 lg:p-3 rounded-[12px] bg-[#EDF3FF]/75 border border-[#D9E3F4]">
          <div class="flex items-center justify-between gap-2 mb-1.5">
            <p class="text-[11px] lg:text-[12px] font-semibold text-[#1E3A8A]">Akun contoh prototype (klik isi cepat)</p>
            <button type="button" onclick="kembalikanData()" class="text-[11px] font-medium text-[#2563EB] hover:text-[#1E3A8A] underline underline-offset-2 cursor-pointer shrink-0">
              Reset data
            </button>
          </div>
          <div class="grid grid-cols-1 gap-1 lg:gap-1.5">
            <button type="button" onclick="isiDemo('koordinator@contoh.id', 'koor12345')"
                    class="w-full flex items-center justify-between gap-2 text-left px-2.5 py-1 lg:py-1.5 rounded-[8px] bg-white border border-[#D9E3F4] hover:border-[#2563EB] text-[11px] lg:text-[12px] text-[#0F172A] transition-colors cursor-pointer">
              <span>Koordinator Alumni</span>
              <span class="text-[10.5px] text-[#475569] font-medium hidden sm:inline">koordinator@contoh.id</span>
            </button>
          </div>
        </div>

      </div>
    </main>

    <!-- Panel fitur (Kanan di desktop, Atas di mobile) -->
    <aside id="auth-feature-panel" class="order-1 lg:order-2 w-full lg:w-[54.86%] lg:h-full shrink-0"></aside>
    <script>
      if (new URLSearchParams(location.search).has('keluar')) {
        try { DB.akun.keluar(); } catch {}
        history.replaceState(null, '', 'login.html');
      }
      renderAuthFeaturePanel({
        mobileHeightClass: 'h-[clamp(140px,19dvh,195px)]',
        base: '../alumni/',
        eyebrow: 'PORTAL KOORDINATOR',
        title: 'Pantau jejak<br>alumni.',
        subtitle: 'Tracer study, data alumni, forum, dan karya dalam satu tempat.',
        mobileTitle: 'Pantau jejak alumni',
      });
    </script>

  </div>

  <script>
    // Login ini khusus koordinator; alumni memakai alumni/login.html
    if (DB.akun.aktif()?.role === 'admin') location.replace('dashboard.html');
    const form = document.getElementById('login-form');

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'fixed bottom-5 right-5 z-50 bg-[#1C6A1A] text-white px-4 py-2.5 rounded-xl shadow-lg text-xs sm:text-sm font-medium';
      toast.setAttribute('role', 'alert');
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2200);
    }

    function isiDemo(email, password) {
      ['email', 'password'].forEach(f => {
        document.getElementById(`error-${f}`)?.classList.add('hidden');
        form.elements[f]?.classList.remove('!border-red-600');
      });
      form.elements.email.value = email;
      form.elements.password.value = password;
    }

    function kembalikanData() {
      DB.reset();
      showToast('Data contoh dikembalikan ke awal.');
    }

    function tampilError(field, pesan) {
      ['email', 'password'].forEach(f => {
        document.getElementById(`error-${f}`)?.classList.add('hidden');
        form.elements[f]?.classList.remove('!border-red-600');
      });
      const el = document.getElementById(`error-${field}`);
      if (el) {
        el.textContent = pesan;
        el.classList.remove('hidden');
      }
      const input = form.elements[field];
      if (input) {
        input.classList.add('!border-red-600');
        input.focus();
      }
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      const email = form.elements.email.value;
      const password = form.elements.password.value;
      if (!email.trim()) return tampilError('email', 'Email wajib diisi');
      if (!password) return tampilError('password', 'Password wajib diisi');

      const hasil = DB.akun.masuk(email, password);
      if (hasil.perluOtp) return tampilError('email', 'Akun belum diverifikasi. Hubungi admin portal.');
      if (!hasil.ok) return tampilError(hasil.field, hasil.error);
      if (hasil.user.role !== 'admin') {
        DB.akun.keluar();
        return tampilError('email', 'Akun ini bukan akun koordinator. Alumni silakan masuk lewat portal alumni.');
      }
      location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
