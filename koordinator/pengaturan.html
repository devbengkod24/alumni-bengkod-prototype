<!DOCTYPE html>
<html lang="id" data-role="admin">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengaturan Akun | Koordinator Bengkel Koding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css?v=5">
  <script src="../alumni/assets/js/data.js?v=9"></script>
  <script src="../alumni/assets/js/app.js?v=6"></script>
  <script src="../assets/js/page-skeleton.js?v=5"></script>
  <script src="../assets/js/main.js?v=5"></script>
</head>
<body class="bg-white text-neutral1 antialiased font-sans">
<main data-title="Pengaturan Akun" class="flex flex-col gap-6">
  <div>
    <h1 class="text-2xl sm:text-3xl font-bold text-primary1 tracking-tight">Pengaturan Akun</h1>
    <p class="text-sm text-neutral2 mt-1">Kelola informasi login dan keamanan akun Anda.</p>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_minmax(0,2fr)] gap-6">

    <!-- Kartu akun (read-only); tinggi ikut kartu password, tombol menempel di bawah -->
    <section class="bg-white rounded-xl border border-neutral4 shadow-sm overflow-hidden flex flex-col">
      <div class="h-20 bg-gradient-to-br from-primary1 via-primary2 to-primary3"></div>
      <div class="px-5 sm:px-6 pb-6 -mt-10 flex-1 flex flex-col">
        <div id="akun-foto" class="w-20 h-20 rounded-full border-4 border-white bg-primary5 text-primary1 font-bold text-xl flex items-center justify-center overflow-hidden shadow-sm"></div>
        <h2 id="akun-nama" class="mt-3 text-lg font-bold text-neutral1 break-words"></h2>
        <span class="self-start mt-2 px-2.5 py-0.5 rounded-full bg-primary5 text-primary1 text-xs font-semibold">Koordinator Alumni</span>

        <dl class="mt-4 pt-4 border-t border-neutral4 space-y-2.5 text-sm">
          <div class="flex items-center gap-2.5 min-w-0">
            <dt class="text-neutral3 shrink-0" title="Email">
              <span class="sr-only">Email</span>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            </dt>
            <dd id="akun-email" class="font-medium text-neutral1 break-all"></dd>
          </div>
          <div class="flex items-center gap-2.5 min-w-0">
            <dt class="text-green2 shrink-0" title="Status akun">
              <span class="sr-only">Status akun</span>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
            </dt>
            <dd class="font-medium text-neutral1">Akun aktif &amp; terverifikasi</dd>
          </div>
          <div class="flex items-center gap-2.5 min-w-0">
            <dt class="text-neutral3 shrink-0" title="Hak akses">
              <span class="sr-only">Hak akses</span>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </dt>
            <dd class="font-medium text-neutral1">Kelola data &amp; tracer alumni</dd>
          </div>
        </dl>

        <div class="mt-auto pt-5">
          <a href="profil.html" class="btn-outline w-full min-h-[44px]">Ubah Data di Profil</a>
        </div>
      </div>
    </section>

    <!-- Ganti password -->
    <section class="bg-white rounded-xl border border-neutral4 shadow-sm p-5 sm:p-6 flex flex-col">
      <div class="flex items-start gap-3">
        <span class="w-10 h-10 rounded-lg bg-primary5 text-primary1 flex items-center justify-center shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <div>
          <h2 class="text-base font-bold text-neutral1">Ganti Password</h2>
          <p class="text-sm text-neutral2 mt-0.5">Gunakan password yang tidak dipakai di akun lain.</p>
        </div>
      </div>

      <form id="form-password" novalidate class="mt-8 flex-1 flex flex-col">
        <div id="field-password" class="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-5 mb-8"></div>
        <!-- Footer menempel di dasar kartu, sejajar tombol kartu akun -->
        <div class="mt-auto pt-5 border-t border-neutral4 flex sm:justify-end">
          <button type="submit" class="btn-primary w-full sm:w-auto min-h-[44px] px-6">Simpan Password</button>
        </div>
      </form>
    </section>
  </div>
</main>

<script>
  document.getElementById('akun-foto').innerHTML = avatar(SAYA);
  document.getElementById('akun-nama').textContent = SAYA.nama;
  document.getElementById('akun-email').textContent = SAYA.email;

  const FIELDS = [
    { key: 'lama', label: 'Password lama', placeholder: 'Masukkan password saat ini', lebar: true },
    { key: 'baru', label: 'Password baru', placeholder: 'Minimal 8 karakter' },
    { key: 'konfirmasi', label: 'Konfirmasi password baru', placeholder: 'Sama dengan password baru' },
  ];
  const IKON_MATA = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
  const IKON_MATA_TUTUP = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>';

  document.getElementById('field-password').innerHTML = FIELDS.map(f => `
    <div class="${f.lebar ? 'sm:col-span-2' : ''}">
      <label for="pwd-${f.key}" class="label">${f.label}</label>
      <div class="relative">
        <input id="pwd-${f.key}" name="${f.key}" type="password" placeholder="${f.placeholder}" aria-describedby="err-${f.key}"
          autocomplete="${f.key === 'lama' ? 'current-password' : 'new-password'}" class="input !pr-12 min-h-[44px]">
        <button type="button" data-lihat="${f.key}" aria-pressed="false" aria-label="Tampilkan ${f.label.toLowerCase()}"
          class="absolute inset-y-0 right-0 w-11 flex items-center justify-center text-neutral3 hover:text-primary1">${IKON_MATA}</button>
      </div>
      <p id="err-${f.key}" class="hidden text-xs text-red2 mt-1.5" role="alert"></p>
    </div>`).join('');

  const form = document.getElementById('form-password');

  function setError(key, pesan) {
    const input = form.elements[key];
    const el = document.getElementById('err-' + key);
    el.textContent = pesan;
    el.classList.toggle('hidden', !pesan);
    input.classList.toggle('!border-red2', Boolean(pesan));
    input.setAttribute('aria-invalid', String(Boolean(pesan)));
  }

  form.addEventListener('click', e => {
    const tombol = e.target.closest('[data-lihat]');
    if (!tombol) return;
    const input = form.elements[tombol.dataset.lihat];
    const lihat = input.type === 'password';
    const label = FIELDS.find(f => f.key === tombol.dataset.lihat).label.toLowerCase();
    input.type = lihat ? 'text' : 'password';
    tombol.innerHTML = lihat ? IKON_MATA_TUTUP : IKON_MATA;
    tombol.setAttribute('aria-pressed', String(lihat));
    tombol.setAttribute('aria-label', (lihat ? 'Sembunyikan ' : 'Tampilkan ') + label);
  });

  form.addEventListener('input', e => setError(e.target.name, ''));

  form.addEventListener('submit', e => {
    e.preventDefault();
    const { lama, baru, konfirmasi } = Object.fromEntries(new FormData(form));
    const errors = {
      lama: lama ? '' : 'Password lama wajib diisi.',
      baru: baru.length < 8 ? 'Password baru minimal 8 karakter.' : '',
      konfirmasi: baru !== konfirmasi ? 'Konfirmasi password tidak sama.' : '',
    };
    Object.entries(errors).forEach(([k, v]) => setError(k, v));
    if (Object.values(errors).some(Boolean)) return;

    const hasil = DB.akun.gantiPassword(SAYA.id, lama, baru);
    if (!hasil.ok) return setError(hasil.field || 'lama', hasil.error);
    form.reset();
    form.querySelectorAll('[data-lihat]').forEach(t => {
      form.elements[t.dataset.lihat].type = 'password';
      t.innerHTML = IKON_MATA;
      t.setAttribute('aria-pressed', 'false');
    });
    showToast('Password berhasil diubah.');
  });
</script>
</body>
</html>
