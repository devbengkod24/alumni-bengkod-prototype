<!DOCTYPE html>
<html lang="id" data-role="admin">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengumuman | Koordinator Bengkel Koding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css?v=5">
  <script src="../alumni/assets/js/data.js?v=9"></script>
  <script src="../alumni/assets/js/app.js?v=6"></script>
  <script src="../assets/js/page-skeleton.js?v=5"></script>
  <script src="../assets/js/main.js?v=5"></script>
</head>
<body class="bg-white text-neutral1 antialiased font-sans">
<main data-title="Pengumuman">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-3 border-b border-gray-200">
    <div>
      <h1 class="text-2xl sm:text-3xl font-bold text-[#1E3A8A] tracking-tight">Kelola Pengumuman</h1>
      <p class="text-sm text-gray-500 mt-0.5">Pengumuman langsung terbit dan tampil di Beranda seluruh alumni.</p>
    </div>
    <button type="button" onclick="bukaForm()" class="inline-flex items-center gap-1.5 px-5 py-2.5 rounded-full bg-[#1E3A8A] hover:bg-[#1D4ED8] text-white text-sm font-semibold shadow-sm transition-colors cursor-pointer no-print">
      <i data-lucide="plus" class="w-4 h-4"></i>
      <span>Tambah Pengumuman</span>
    </button>
  </div>

  <section class="bg-white rounded-xl border border-gray-200/90 shadow-xs overflow-hidden">
    <div class="p-4 sm:p-5 border-b border-gray-200 flex flex-col lg:flex-row lg:items-center justify-between gap-3 no-print">
      <div id="alat" class="flex flex-wrap gap-2"></div>
      <div class="relative lg:w-72">
        <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
        <input id="cari" type="search" class="w-full h-10 pl-10 pr-4 rounded-full border border-gray-200 bg-white text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-[#1E3A8A]/20 focus:border-[#1E3A8A]" placeholder="Cari judul atau isi..." aria-label="Cari pengumuman">
      </div>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full">
        <thead><tr><th class="th w-14">No</th><th class="th">Judul</th><th class="th">Isi Pengumuman</th><th class="th">Tanggal</th><th class="th text-right no-print">Aksi</th></tr></thead>
        <tbody id="baris"></tbody>
      </table>
    </div>
    <div id="pager" class="p-4 border-t border-gray-100 empty:hidden no-print"></div>
  </section>
</main>

<div id="form-modal" data-modal-backdrop class="modal-backdrop">
  <form id="form" class="modal max-w-lg" role="dialog" aria-modal="true" aria-labelledby="form-title">
    <h3 id="form-title" class="font-semibold text-base text-neutral1 mb-4"></h3>
    <input type="hidden" name="id">
    <div class="space-y-4">
      <div>
        <label for="f-judul" class="label">Judul Pengumuman <span class="text-red2">*</span></label>
        <input id="f-judul" name="judul" class="input" required maxlength="255">
      </div>
      <div>
        <label for="f-isi" class="label">Isi Pengumuman <span class="text-red2">*</span></label>
        <textarea id="f-isi" name="isi" rows="6" class="input" required></textarea>
      </div>
    </div>
    <div class="mt-6 flex justify-end gap-2">
      <button type="button" onclick="closeModal('form-modal')" class="btn-outline">Batal</button>
      <button type="submit" class="btn-primary">Simpan</button>
    </div>
  </form>
</div>

<script>
  const PER_HALAMAN = 5;
  const form = document.getElementById('form');
  let halaman = 1;

  function daftar() {
    const kata = document.getElementById('cari').value.trim().toLowerCase();
    return DB.pengumuman.semua().filter(p => `${p.judul} ${p.isi}`.toLowerCase().includes(kata));
  }

  function render() {
    const list = daftar();
    document.getElementById('baris').innerHTML = potong(list, halaman, PER_HALAMAN).map((p, i) => `
      <tr class="tr">
        <td class="td">${(halaman - 1) * PER_HALAMAN + i + 1}</td>
        <td class="td font-medium min-w-48">${esc(p.judul)}</td>
        <td class="td min-w-64">${esc(p.isi)}</td>
        <td class="td whitespace-nowrap">${fmtDate(p.published_at)}</td>
        <td class="td text-right whitespace-nowrap no-print">
          <button type="button" class="btn-icon" onclick="bukaForm(${p.id})" aria-label="Edit" title="Edit"><i data-lucide="pencil" class="w-4 h-4"></i></button>
          <button type="button" class="btn-icon hover:!bg-red3 hover:!text-red1" onclick="hapus(${p.id})" aria-label="Hapus" title="Hapus"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        </td>
      </tr>`).join('') || '<tr><td colspan="5" class="td text-center text-neutral3 py-8">Tidak ada pengumuman.</td></tr>';
    renderPager('pager', list.length, PER_HALAMAN, halaman, ke => { halaman = ke; render(); });
    refreshIcons();
  }

  function bukaForm(id) {
    const p = id ? DB.pengumuman.cari(id) : null;
    form.reset();
    document.getElementById('form-title').textContent = p ? 'Edit Pengumuman' : 'Tambah Pengumuman';
    form.elements.id.value = p ? p.id : '';
    if (p) {
      form.elements.judul.value = p.judul;
      form.elements.isi.value = p.isi;
    }
    openModal('form-modal');
  }

  function hapus(id) {
    const p = DB.pengumuman.cari(id);
    confirmAction({ title: 'Hapus pengumuman?', message: `"${p.judul}" akan dihapus permanen.`, okLabel: 'Hapus', danger: true }, () => {
      DB.pengumuman.hapus(id);
      halaman = 1;
      render();
      showToast('Pengumuman berhasil dihapus.');
    });
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    DB.pengumuman.simpan(Object.fromEntries(new FormData(form)));
    closeModal('form-modal');
    render();
    showToast('Pengumuman berhasil disimpan.');
  });

  document.getElementById('cari').addEventListener('input', () => { halaman = 1; render(); });
  pasangToolsTabel('alat', 'pengumuman.csv', () => [
    ['Judul', 'Isi Pengumuman', 'Tanggal'],
    ...DB.pengumuman.semua().map(p => [p.judul, p.isi, p.published_at]),
  ]);
  render();
</script>
</body>
</html>
