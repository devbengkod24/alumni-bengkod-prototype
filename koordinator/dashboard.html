<!DOCTYPE html>
<html lang="id" data-role="admin">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Koordinator Bengkel Koding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <link rel="stylesheet" href="../assets/css/style.css?v=6">
  <script src="../alumni/assets/js/data.js?v=10"></script>
  <script src="../alumni/assets/js/app.js?v=11"></script>
  <script src="../alumni/assets/js/portal-layout.js"></script>
  <!-- Laporan dari Beranda alumni disimpan di BengkodStore, dibutuhkan untuk menghitung laporan masuk -->
  <script src="../assets/js/store.js?v=2"></script>
  <script src="../alumni/assets/js/alumni-data.js"></script>
  <script src="../alumni/assets/js/alumni-catalog.js"></script>
  <script src="../assets/js/page-skeleton.js?v=6"></script>
  <script src="../assets/js/main.js?v=5"></script>
</head>
<body class="bg-white text-neutral1 antialiased font-sans">
<main data-title="Dashboard" class="space-y-4">
  <div id="banner"></div>
  <!-- Ringkasan: satu panel, lima sel sama tinggi. Ponsel 2 kolom (sel terakhir melebar), layar lebar 5 kolom. -->
  <section class="bg-white border border-neutral4 rounded-[16px] shadow-sm overflow-hidden" aria-label="Ringkasan portal">
    <div id="pintasan" class="grid grid-cols-2 lg:grid-cols-5 gap-px bg-neutral4 [&>:last-child]:col-span-2 lg:[&>:last-child]:col-span-1"></div>
  </section>

  <h2 class="!text-xl font-semibold text-neutral1 pt-2">Tracer Study</h2>
  <div class="grid grid-cols-1 xl:grid-cols-3 gap-4">
    <section class="card xl:col-span-2 flex flex-col" aria-labelledby="judul-status">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <h3 id="judul-status" class="!text-base font-semibold text-neutral1">Jumlah Alumni per Status</h3>
          <p id="ket-status" class="!text-xs text-neutral3 mt-0.5"></p>
        </div>
        <a href="tracer.html" class="shrink-0 text-xs font-semibold text-primary1 hover:underline rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-primary3">Lihat semua jawaban</a>
      </div>
      <ul id="batang-status" class="mt-4 space-y-1 flex-1 flex flex-col justify-center"></ul>
    </section>

    <section class="card flex flex-col" aria-labelledby="judul-kerja">
      <h3 id="judul-kerja" class="!text-base font-semibold text-neutral1">Status Alumni</h3>
      <p class="!text-xs text-neutral3 mt-0.5">Alumni yang melanjutkan pendidikan tidak dihitung</p>
      <div class="flex-1 flex items-center justify-center py-4">
        <div class="h-44 w-full"><canvas id="grafik-kerja" role="img" aria-label="Grafik lingkaran alumni bekerja dan tidak bekerja. Angkanya ada di daftar bawah grafik."></canvas></div>
      </div>
      <ul id="legenda-kerja" class="space-y-1"></ul>
    </section>
  </div>

  <h2 class="!text-xl font-semibold text-neutral1 pt-2">Alumni Terdeteksi</h2>
  <section class="card">
    <h3 class="!text-base font-semibold text-neutral1">Tiga Tahun Terakhir</h3>
    <p class="!text-xs text-neutral3 mt-0.5">Terdeteksi berarti alumni sudah mengisi tracer study. Arahkan kursor ke batang untuk melihat angkanya.</p>
    <div class="h-64 mt-4"><canvas id="grafik-terdeteksi" role="img" aria-label="Grafik batang total, terdeteksi, dan tidak terdeteksi per angkatan tiga tahun terakhir."></canvas></div>
  </section>
</main>

<script>
  Chart.defaults.font.family = 'Inter, sans-serif';
  Chart.defaults.font.size = 12;
  Chart.defaults.color = '#6B7280';

  const jumlah = (list, ambil) => list.reduce((n, x) => n + ambil(x), 0);
  const tiga = DB.statistik.tigaTahun();
  const perStatus = DB.tracer.jumlahPerStatus();
  const totalJawaban = DB.tracer.semua().length;
  const keAnalitik = status => `tracer.html?status=${encodeURIComponent(status)}`;

  // Warna mengikuti kelompok kerja, sama di grafik batang dan grafik lingkaran:
  // navy = bekerja, emas = tidak bekerja, biru muda = melanjutkan pendidikan.
  const WARNA_KELOMPOK = { bekerja: '#3A5988', tidak: '#FFC150', studi: '#93C5FD' };
  const warnaStatus = s => DB.STATUS_BEKERJA.includes(s) ? WARNA_KELOMPOK.bekerja : s === DB.STATUS_STUDI ? WARNA_KELOMPOK.studi : WARNA_KELOMPOK.tidak;

  document.getElementById('banner').innerHTML = bannerSapaan(SAYA.nama, 'Pantau kondisi lulusan, laporan forum yang masuk, serta tempat kerja alumni.');

  const laporanMenunggu = hitungLaporanMenunggu();
  document.getElementById('pintasan').innerHTML = [
    kartuPintasan({ href: 'tracer.html', ikon: 'clipboard-list', label: 'Statistik & Tracer', nilai: totalJawaban, sub: 'Jawaban masuk', warna: 'biru' }),
    kartuPintasan({ href: 'data-alumni.html', ikon: 'id-card', label: 'Data Alumni', nilai: DB.akun.alumni().length, sub: 'Akun alumni', warna: 'hijau' }),
    kartuPintasan({ href: 'karya.html', ikon: 'trophy', label: 'Karya Alumni', nilai: loadShowcaseWorks().length, sub: `${loadSpotlightWorks().length} tampil di Spotlight`, warna: 'oranye' }),
    kartuPintasan({ href: 'pengumuman.html', ikon: 'megaphone', label: 'Pengumuman', nilai: DB.pengumuman.semua().length, sub: 'Sudah terbit', warna: 'ungu' }),
    kartuPintasan({ href: 'laporan-forum.html', ikon: 'flag', label: 'Laporan Masuk', nilai: laporanMenunggu, sub: laporanMenunggu ? 'Menunggu ditinjau' : 'Tidak ada yang menunggu', warna: 'merah' }),
  ].join('');

  // Batang horizontal dari HTML: tiap baris adalah tautan, jadi bisa diklik dan dijangkau keyboard
  const terbanyak = Math.max(1, ...DB.STATUS.map(s => perStatus[s]));
  document.getElementById('ket-status').textContent = `Dari ${totalJawaban} jawaban kuesioner. Pilih status untuk membuka daftar alumninya.`;
  document.getElementById('batang-status').innerHTML = DB.STATUS.map(s => {
    const n = perStatus[s];
    const persen = totalJawaban ? Math.round((n / totalJawaban) * 100) : 0;
    return `
      <li>
        <a href="${keAnalitik(s)}" class="group grid grid-cols-[minmax(0,1fr)_auto] sm:grid-cols-[15rem_minmax(0,1fr)_4.5rem] items-center gap-x-4 gap-y-1.5 -mx-2 px-2 py-2 rounded-lg hover:bg-primary5/60 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary3 transition-colors">
          <span class="text-sm text-neutral1 leading-snug group-hover:text-primary1">${esc(s)}</span>
          <span class="col-span-2 sm:col-span-1 row-start-2 sm:row-start-auto h-2.5 rounded-full bg-neutral5 overflow-hidden" aria-hidden="true">
            <span class="block h-full rounded-full" style="width:${(n / terbanyak) * 100}%;background:${warnaStatus(s)}"></span>
          </span>
          <span class="text-right whitespace-nowrap"><span class="text-sm font-semibold text-neutral1 tabular-nums">${n}</span> <span class="text-xs text-neutral3 tabular-nums">${persen}%</span></span>
        </a>
      </li>`;
  }).join('');

  // Status Alumni: klik potongan grafik atau baris daftar membuka Analitik Tracer dengan filter kelompoknya
  const kelompokKerja = [
    { label: 'Bekerja', filter: 'bekerja', nilai: jumlah(DB.STATUS_BEKERJA, s => perStatus[s]), warna: WARNA_KELOMPOK.bekerja },
    { label: 'Tidak Bekerja', filter: 'tidak-bekerja', nilai: jumlah(DB.STATUS_TIDAK_BEKERJA, s => perStatus[s]), warna: WARNA_KELOMPOK.tidak },
  ];
  const grafikKerja = grafikDonat('grafik-kerja', kelompokKerja.map(k => k.label), kelompokKerja.map(k => k.nilai), kelompokKerja.map(k => k.warna));
  grafikKerja.options.onClick = (_, el) => { if (el.length) location.href = keAnalitik(kelompokKerja[el[0].index].filter); };
  grafikKerja.options.onHover = (e, el) => { e.native.target.style.cursor = el.length ? 'pointer' : 'default'; };
  document.getElementById('legenda-kerja').innerHTML = kelompokKerja.map(k => `
    <li>
      <a href="${keAnalitik(k.filter)}" class="flex items-center justify-between gap-3 -mx-2 px-2 py-2 rounded-lg text-sm text-neutral2 hover:bg-primary5/60 hover:text-primary1 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary3 transition-colors">
        <span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-sm shrink-0" style="background:${k.warna}"></span>${k.label}</span>
        <span class="font-semibold text-neutral1 tabular-nums">${k.nilai}</span>
      </a>
    </li>`).join('');

  // Grafik alumni terdeteksi
  new Chart(document.getElementById('grafik-terdeteksi'), {
    type: 'bar',
    data: {
      labels: tiga.map(s => String(s.tahun_lulus)),
      datasets: [
        { label: 'Total Alumni', data: tiga.map(s => s.alumni_total), backgroundColor: '#3A5988', borderRadius: 4, maxBarThickness: 40 },
        { label: 'Alumni Terdeteksi', data: tiga.map(s => s.alumni_terlacak), backgroundColor: '#326ECE', borderRadius: 4, maxBarThickness: 40 },
        { label: 'Alumni Tidak Terdeteksi', data: tiga.map(s => Math.max(s.alumni_total - s.alumni_terlacak, 0)), backgroundColor: '#FFC150', borderRadius: 4, maxBarThickness: 40 },
      ],
    },
    options: {
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { grid: { display: false }, border: { display: false } },
        y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#EDEEF0' }, border: { display: false } },
      },
      plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8 } } },
    },
  });
</script>
</body>
</html>
