<!DOCTYPE html>
<html lang="id" data-role="admin">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forum &amp; Linimasa | Koordinator Bengkel Koding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css?v=6">
  <script src="../alumni/assets/js/data.js?v=10"></script>
  <script src="../alumni/assets/js/app.js?v=11"></script>
  <script src="../alumni/assets/js/portal-layout.js"></script>
  <script src="../assets/js/page-skeleton.js?v=6"></script>
  <script src="../assets/js/main.js?v=5"></script>
  <!-- Feed bersama: data yang sama dengan Beranda alumni -->
  <script src="../assets/js/store.js?v=2"></script>
  <script src="../alumni/assets/js/alumni-data.js"></script>
  <script src="../assets/js/feed-bersama.js"></script>
</head>
<body class="bg-white text-neutral1 antialiased font-sans">
<main data-title="Forum">
  <!-- Layout 12-kolom seragam dengan Beranda Alumni -->
  <div class="w-full grid grid-cols-1 lg:grid-cols-12 gap-6 py-2 antialiased">
    <!-- KOLOM UTAMA (FEED) -->
    <div class="lg:col-span-8 flex flex-col gap-5 min-w-0">
      <!-- Header Forum: Judul + Search bar -->
      <div class="space-y-4">
        <div>
          <h1 class="!text-[26px] font-semibold text-headline tracking-[-0.01em]">Forum &amp; Linimasa Alumni</h1>
          <p class="text-sm text-gray-500 mt-0.5">
            Linimasa forum diskusi, karya, dan info loker bersama rekan alumni laboratorium
          </p>
        </div>

        <div class="flex flex-col sm:flex-row sm:items-center gap-3">
          <div class="relative flex-1 min-w-0">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
              <i data-lucide="search" class="w-4 h-4"></i>
            </span>
            <input
              type="search"
              id="forum-cari"
              placeholder="Cari postingan atau topik diskusi…"
              aria-label="Cari postingan"
              autocomplete="off"
              class="w-full pl-11 pr-4 py-2.5 rounded-full bg-white border border-gray-200 text-[14.5px] text-gray-900 placeholder:text-gray-400 shadow-2xs focus:outline-none focus:border-[#3A5988] focus:ring-2 focus:ring-[#3A5988]/15 transition-all"
            >
          </div>

        </div>
      </div>

      <!-- Composer langsung tampil seperti Beranda alumni (alumni/dashboard.html) -->
      <form id="composer" class="bg-white border border-[#E3E4E9] rounded-[16px] p-4 sm:p-5 shadow-sm space-y-3.5" novalidate autocomplete="off">
        <div class="flex items-start gap-3">
          <div id="avatar-composer" class="shrink-0 mt-0.5"></div>
          <div class="flex-1 min-w-0 rounded-[22px] bg-[#F4F5F7] hover:bg-[#EAECEF] focus-within:bg-white border border-[#E3E4E9] focus-within:border-[#3A5988] px-4 py-2.5 transition-colors">
            <textarea name="isi" rows="1" maxlength="3000" aria-label="Isi postingan"
                      placeholder="Bagikan kabar, informasi, materi, atau pengumuman ke rekan alumni..."
                      class="block w-full h-6 min-h-[24px] max-h-[144px] p-0 bg-transparent border-0 resize-none overflow-hidden text-[13.5px] leading-[24px] text-[#212224] placeholder-[#91969C] focus:outline-none"></textarea>
          </div>
        </div>

        <input type="file" name="gambar" accept="image/png,image/jpeg,image/webp" class="hidden">
        <div data-media-ada class="hidden relative w-fit max-w-full">
          <img alt="Pratinjau gambar" class="max-h-48 max-w-full rounded-[12px] border border-[#E3E4E9] object-contain">
          <div class="absolute top-2 right-2 flex gap-1.5">
            <button type="button" data-pilih class="px-3 py-1 rounded-full bg-white/95 text-xs font-semibold text-gray-800 shadow-sm hover:bg-white cursor-pointer">Ganti</button>
            <button type="button" data-hapus class="w-8 h-8 rounded-full bg-white text-[#212224] shadow-sm flex items-center justify-center cursor-pointer" aria-label="Hapus gambar"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
        </div>

        <p data-error class="hidden text-[13px] text-red-600" role="alert"></p>

        <div class="flex items-center justify-between gap-2 pt-1">
          <button type="button" data-pilih title="Tambahkan foto"
                  class="h-9 px-3 rounded-[8px] hover:bg-[#F4F5F7] text-[13px] font-medium text-[#4B5563] flex items-center gap-2 transition-colors cursor-pointer">
            <svg class="w-4 h-4 text-[#326ECE]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            <span>Foto</span>
          </button>
          <div class="flex items-center gap-3 ml-auto">
            <span data-hitung class="hidden text-xs text-gray-500 tabular-nums"></span>
            <button type="submit" disabled
                    class="h-9 px-4 rounded-full bg-[#3A5988] hover:bg-[#496DA8] text-white text-[13px] font-medium transition-colors shadow-sm cursor-pointer disabled:hidden">
              Kirim Post
            </button>
          </div>
        </div>
      </form>

      <!-- Tab Kategori Feed (sama dengan Beranda alumni) -->
      <nav id="saring" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1 text-sm" aria-label="Saring kategori"></nav>

      <!-- Daftar Feed Postingan -->
      <div id="daftar" class="space-y-6"></div>
    </div>

    <!-- KOLOM SAMPING (KANAN): Pengumuman dan Gigs, sama dengan Beranda alumni -->
    <div class="lg:col-span-4 h-full">
      <aside id="kanan" class="sticky top-[80px] space-y-5 max-h-[calc(100vh-95px)] overflow-y-auto no-scrollbar overscroll-contain scroll-smooth pr-0.5 pb-6" aria-label="Pengumuman dan gigs alumni"></aside>
    </div>
  </div>
</main>


<script>
  // Tab kategori sama dengan Beranda alumni: Semua, Karya & Showcase, Referral
  const KATEGORI = {
    karya: 'Karya & Showcase',
    referral: 'Referral',
  };

  const BATAS_RINGKAS = 280;
  const NAMA = SAYA.nama;
  const daftar = document.getElementById('daftar');
  const composer = document.getElementById('composer');
  const isiComposer = composer.elements.isi;
  const terbuka = new Set();
  const diperluas = new Set();
  let kategori = '';
  let pencarianTeks = '';

  const semua = () => FeedBersama.semua(NAMA);
  const cari = id => FeedBersama.cari(id, NAMA);
  const tautkan = teks => esc(teks).replace(/https?:\/\/[^\s<]+/g, url => `<a href="${url}" target="_blank" rel="noreferrer" class="text-primary1 font-medium hover:underline break-all">${url}</a>`);
  const keterangan = p => p.headline || (p.peran === 'Koordinator' ? NAMA_ROLE.admin : p.peran === 'Mitra' ? 'Mitra Bengkel Koding' : 'Alumni Bengkel Koding');

  // Foto penulis 64px seperti Beranda alumni; tanpa foto memakai inisial
  const fotoPenulis = p => (p.foto
    ? `<img src="${esc(p.foto)}" alt="" onerror="this.onerror=null;this.src='../alumni/assets/img/user.png'" class="w-16 h-16 rounded-full object-cover border border-gray-200 shadow-sm shrink-0">`
    : `<div class="w-16 h-16 rounded-full bg-primary5 border border-primary4/50 text-primary1 font-bold text-base flex items-center justify-center shrink-0 shadow-sm" aria-hidden="true">${esc(inisial(p.penulis))}</div>`);

  // ===================== COMPOSER (LANGSUNG DI ATAS LINIMASA) =====================
  document.getElementById('avatar-composer').innerHTML = fotoBulat(SAYA, 'w-10 h-10');

  // Kolom isi ikut memanjang sampai 6 baris, lalu bisa digulir
  function sesuaikanTinggi() {
    isiComposer.style.height = '24px';
    isiComposer.style.height = Math.min(isiComposer.scrollHeight, 144) + 'px';
    isiComposer.style.overflowY = isiComposer.scrollHeight > 144 ? 'auto' : 'hidden';
  }

  function aturComposer() {
    const panjang = isiComposer.value.length;
    const hitung = composer.querySelector('[data-hitung]');
    hitung.textContent = `${panjang}/3000`;
    hitung.classList.toggle('hidden', panjang < 2500);
    composer.querySelector('[type="submit"]').disabled = !isiComposer.value.trim() && !composer.elements.gambar.files.length;
  }

  function pasangMedia(form, ubah) {
    const input = form.elements.gambar;
    const img = form.querySelector('[data-media-ada] img');
    const tampil = file => {
      if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
      if (file) img.src = URL.createObjectURL(file);
      else img.removeAttribute('src');
      form.querySelector('[data-media-ada]').classList.toggle('hidden', !file);
      ubah();
    };
    form.addEventListener('click', e => {
      if (e.target.closest('[data-pilih]')) input.click();
      if (e.target.closest('[data-hapus]')) {
        input.value = '';
        tampil(null);
      }
    });
    input.addEventListener('change', () => {
      const file = input.files[0];
      if (file && !file.type.startsWith('image/')) {
        input.value = '';
        showToast('File harus berupa gambar.', 'error');
      }
      tampil(input.files[0] || null);
    });
  }

  pasangMedia(composer, aturComposer);
  isiComposer.addEventListener('input', () => { sesuaikanTinggi(); aturComposer(); });

  composer.addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(composer);
    let hasil;
    try {
      const file = fd.get('gambar');
      const gambar = file && file.size ? await bacaGambar(file, 500) : '';
      hasil = FeedBersama.tambah({
        nama: NAMA,
        peran: 'Koordinator',
        kategori: 'umum',
        isi: fd.get('isi'),
        gambar,
        pertanyaan: false,
      });
    } catch (err) {
      hasil = { ok: false, error: err.message };
    }
    const galat = composer.querySelector('[data-error]');
    galat.textContent = hasil.ok ? '' : hasil.error;
    galat.classList.toggle('hidden', hasil.ok);
    if (!hasil.ok) return;
    composer.reset();
    const pratinjau = composer.querySelector('[data-media-ada] img');
    if (pratinjau.src.startsWith('blob:')) URL.revokeObjectURL(pratinjau.src);
    pratinjau.removeAttribute('src');
    composer.querySelector('[data-media-ada]').classList.add('hidden');
    sesuaikanTinggi();
    aturComposer();
    lompat(hasil.id);
    showToast('Postingan dibagikan ke linimasa.');
  });

  // ===================== KARTU POSTINGAN =====================
  // Titik tiga: salin tautan dan hapus. Koordinator moderator forum, jadi bisa menghapus postingan siapa pun.
  // Tidak ada "Laporkan" karena laporan alumni justru masuk ke koordinator (halaman Laporan Forum).
  function menuPost(p) {
    const item = (aksi, ikon, label, kelas = 'text-gray-700 hover:bg-gray-50') => `
      <button type="button" data-aksi="${aksi}" data-id="${p.id}" role="menuitem" class="w-full flex items-center gap-2.5 px-4 py-2 text-left font-medium cursor-pointer focus:outline-none focus-visible:bg-gray-100 ${kelas}"><i data-lucide="${ikon}" class="w-4 h-4" aria-hidden="true"></i>${label}</button>`;
    return `
      <div data-menu class="relative shrink-0">
        <button type="button" data-aksi="menu" data-id="${p.id}" aria-haspopup="menu" aria-expanded="false" aria-label="Opsi postingan ${esc(p.penulis)}" class="w-8 h-8 rounded-full flex items-center justify-center text-gray-500 hover:text-gray-700 hover:bg-gray-100 transition-colors cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-primary3"><i data-lucide="ellipsis" class="w-[18px] h-[18px]" aria-hidden="true"></i></button>
        <div data-panel-menu class="hidden absolute right-0 top-9 z-20 w-48 bg-white border border-gray-200 rounded-xl shadow-lg py-1.5 text-[14px]" role="menu">
          ${item('bagikan', 'link', 'Salin Tautan')}
          <div class="border-t border-gray-100 mt-1 pt-1">${item('hapus', 'trash-2', 'Hapus Postingan', 'text-red-600 hover:bg-red-50')}</div>
        </div>
      </div>`;
  }

  function isiPost(p) {
    if (!p.isi) return '';
    const panjang = p.isi.length > BATAS_RINGKAS && !diperluas.has(p.id);
    const teks = panjang ? `${p.isi.slice(0, BATAS_RINGKAS).trim()}…` : p.isi;
    return `<p class="text-[15px] text-gray-800 leading-relaxed mt-3 whitespace-pre-line break-words">${tautkan(teks)}${panjang ? ` <button type="button" data-aksi="perluas" data-id="${p.id}" class="text-gray-500 font-semibold hover:text-[#3A5988] hover:underline cursor-pointer">selengkapnya</button>` : ''}</p>`;
  }

  function kartuKarya(k, p) {
    return `
      <a href="../alumni/detail-proyek.html?id=${p.id}" class="mt-3 flex items-center gap-3.5 p-3.5 rounded-xl border border-gray-200/90 bg-white hover:bg-gray-50/80 transition-colors group cursor-pointer w-full text-left focus:outline-none focus-visible:ring-2 focus-visible:ring-primary3">
        <div class="w-12 h-12 rounded-xl border border-gray-200 bg-gray-50 flex items-center justify-center shrink-0 overflow-hidden">
          ${k.logo ? `<img src="${esc(k.logo)}" alt="" width="48" height="48" class="w-full h-full object-cover">` : `<span class="text-base font-semibold text-[#3A5988]">${esc((k.nama || 'A').charAt(0).toUpperCase())}</span>`}
        </div>
        <div class="flex-1 min-w-0 space-y-0.5">
          <div class="flex items-center justify-between gap-2">
            <h4 class="text-[15px] font-medium text-gray-900 group-hover:text-[#3A5988] transition-colors truncate">${esc(k.nama)}</h4>
            <span class="text-[13px] font-medium text-[#3A5988] shrink-0">Detail</span>
          </div>
          <p class="text-[13px] text-gray-500 line-clamp-1">${esc(k.tagline || '')}</p>
          ${(k.stack || []).length ? `
            <div class="flex items-center gap-1.5 pt-0.5 flex-wrap">
              ${k.stack.slice(0, 3).map(s => `<span class="px-2 py-0.5 rounded text-[11px] bg-gray-100 text-gray-600">${esc(s)}</span>`).join('')}
              ${k.stack.length > 3 ? `<span class="text-[11px] text-gray-500">+${k.stack.length - 3}</span>` : ''}
            </div>` : ''}
        </div>
      </a>`;
  }

  // Kartu Referral sama dengan Beranda alumni. Koordinator tidak mengajukan, hanya melihat jumlah pengajuan.
  function kartuReferral(p) {
    const r = p.referral;
    const pengajuan = (p.pengajuan || []).length;
    return `
      <div class="mt-3 rounded-xl border border-gray-200 bg-white p-4 space-y-2 shadow-2xs">
        <span class="text-[12px] font-medium uppercase tracking-wider text-[#3A5988]">#Referral</span>
        <div>
          <h4 class="text-[15px] sm:text-[16px] font-medium text-gray-900 leading-snug">${esc(r.posisi || 'Peluang Karier')} · ${esc(r.perusahaan || '')}</h4>
          <p class="text-[13px] text-gray-500 mt-0.5">${[r.level, r.batas ? `Review sampai ${fmtDate(r.batas)}` : ''].filter(Boolean).map(esc).join(' · ')}</p>
        </div>
        <p class="pt-1.5 text-[13px] text-gray-600 flex items-center gap-1.5">
          <i data-lucide="users" class="w-3.5 h-3.5 text-[#3A5988]" aria-hidden="true"></i>
          ${pengajuan ? `${pengajuan} alumni sudah mengajukan referral` : 'Belum ada alumni yang mengajukan'}
        </p>
      </div>`;
  }

  function komentarItem(p, k) {
    return `
      <div class="flex items-start gap-3">
        <img src="../alumni/assets/img/user.png" alt="${esc(k.penulis)}" class="w-9 h-9 rounded-full object-cover flex-shrink-0 border border-gray-200">
        <div class="flex-1 min-w-0">
          <div class="bg-gray-50 rounded-xl px-4 py-3 border border-gray-100">
            <p class="text-[14px] font-semibold text-gray-900 flex items-center gap-1.5 flex-wrap">
              <span>${esc(k.penulis)}</span>
              ${k.peran === 'Koordinator' ? '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold border bg-blue-50 text-[#3A5988] border-blue-200">Koordinator</span>' : ''}
              ${k.penulis === p.penulis && k.peran !== 'Koordinator' ? '<span class="text-gray-500 text-[12px] font-normal">· Penulis</span>' : ''}
            </p>
            <p class="text-[14px] text-gray-700 mt-0.5 leading-relaxed whitespace-pre-line break-words">${tautkan(k.isi)}</p>
          </div>
          <div class="flex items-center gap-4 mt-2 px-1 text-gray-700">
            <button
              type="button"
              data-aksi="suka-komentar"
              data-id="${p.id}"
              data-komentar-id="${k.id}"
              class="flex items-center gap-1.5 text-[13px] font-bold text-gray-800 hover:text-[#3A5988] transition-colors cursor-pointer"
              title="Suka komentar"
            >
              <i data-lucide="thumbs-up" class="w-3.5 h-3.5"></i>
              <span>${(k.disukai || []).length > 0 ? (k.disukai || []).length : ''}</span>
            </button>
            <button
              type="button"
              data-aksi="tampil-balas"
              data-komentar-id="${k.id}"
              class="flex items-center text-gray-800 hover:text-[#3A5988] transition-colors cursor-pointer"
              title="Balas komentar ini"
            >
              <i data-lucide="message-square" class="w-3.5 h-3.5"></i>
            </button>
            <span class="text-[12px] text-gray-500 font-normal">${waktuLalu(k.waktu)}</span>
            <button
              type="button"
              data-aksi="hapus-komentar"
              data-id="${p.id}"
              data-komentar-id="${k.id}"
              class="text-[12px] font-semibold text-gray-500 hover:text-red-600 transition-colors cursor-pointer ml-auto"
            >
              Hapus
            </button>
          </div>

          <!-- Balasan Komentar -->
          ${(k.balasan || []).length ? `
            <div class="space-y-3 mt-3 pl-2 sm:pl-3 relative">
              <div class="absolute -left-2 top-0 bottom-3 w-0.5 bg-gray-200"></div>
              ${k.balasan.map(reply => `
                <div class="flex items-start gap-2.5 relative">
                  <div class="absolute -left-2 top-3 w-2.5 border-b-2 border-gray-200"></div>
                  <img src="../alumni/assets/img/user.png" alt="${esc(reply.penulis)}" class="w-8 h-8 rounded-full object-cover flex-shrink-0 border border-gray-200">
                  <div class="flex-1 min-w-0">
                    <div class="bg-gray-50 rounded-xl px-3.5 py-2.5 border border-gray-100">
                      <p class="text-[13px] font-bold text-gray-900">${esc(reply.penulis)}</p>
                      <p class="text-[13px] text-gray-700 mt-0.5 leading-relaxed">
                        <span class="font-semibold text-[#3A5988] mr-1">@${esc(k.penulis)}</span><span>${tautkan(reply.isi)}</span>
                      </p>
                    </div>
                    <div class="flex items-center gap-3 mt-1 px-1 text-gray-600">
                      <button
                        type="button"
                        data-aksi="suka-balasan"
                        data-id="${p.id}"
                        data-komentar-id="${k.id}"
                        data-balasan-id="${reply.id}"
                        class="flex items-center gap-1 text-[12px] font-bold text-gray-700 hover:text-[#3A5988] transition-colors cursor-pointer"
                      >
                        <i data-lucide="thumbs-up" class="w-3 h-3"></i>
                        <span>${(reply.disukai || []).length > 0 ? (reply.disukai || []).length : ''}</span>
                      </button>
                      <span class="text-[12px] text-gray-500">${waktuLalu(reply.waktu)}</span>
                      <button
                        type="button"
                        data-aksi="hapus-komentar"
                        data-id="${p.id}"
                        data-komentar-id="${reply.id}"
                        class="text-[11px] font-semibold text-gray-500 hover:text-red-600 transition-colors cursor-pointer ml-auto"
                      >
                        Hapus
                      </button>
                    </div>
                  </div>
                </div>`).join('')}
            </div>` : ''}

          <!-- Form Balas Inline -->
          <div id="form-balas-${k.id}" class="hidden flex items-start gap-2.5 mt-3 pl-2 sm:pl-3 relative">
            <div class="absolute -left-2.5 top-0 h-4 w-3 border-l-2 border-b-2 border-gray-200 rounded-bl-xl pointer-events-none"></div>
            <img src="../alumni/assets/img/user.png" alt="${esc(SAYA.nama)}" class="w-8 h-8 rounded-full object-cover flex-shrink-0 border border-gray-200 mt-1 z-10">
            <div class="flex-1 min-w-0">
              <form data-balas="${p.id}" data-induk="${k.id}" class="relative flex items-center bg-white rounded-full border border-gray-300 focus-within:border-[#3A5988] focus-within:ring-2 focus-within:ring-[#3A5988]/10 px-3.5 py-1.5 transition-all shadow-2xs">
                <span class="font-bold text-[13px] text-gray-900 mr-1.5 flex-shrink-0 select-none">@${esc(k.penulis)}</span>
                <input
                  name="isi"
                  required
                  placeholder="Tulis balasan..."
                  class="flex-1 bg-transparent text-[13px] text-gray-900 placeholder:text-gray-400 focus:outline-none min-w-0"
                >
                <button
                  type="submit"
                  class="ml-2 text-[13px] font-semibold text-[#3A5988] hover:text-[#496DA8] transition-colors cursor-pointer flex-shrink-0"
                >
                  Send
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>`;
  }

  function panelKomentar(p) {
    return `
      <div class="border-t border-gray-100 bg-white px-5 py-4">
        <!-- Input komentar baru -->
        <form data-komentar="${p.id}" class="flex items-start gap-3 mb-4">
          <img src="../alumni/assets/img/user.png" alt="${esc(SAYA.nama)}" class="w-9 h-9 rounded-full object-cover flex-shrink-0 border border-gray-200">
          <div class="flex-1 relative">
            <input
              name="isi"
              required
              maxlength="1000"
              placeholder="Tulis komentar..."
              class="w-full px-4 py-2.5 pr-20 rounded-full border border-gray-200 bg-gray-50 text-[14px] text-gray-900 placeholder:text-gray-400 focus:outline-none focus:border-[#3A5988] focus:ring-2 focus:ring-gray-900/10"
            >
            <button
              type="submit"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-[14px] font-semibold text-[#3A5988] hover:text-[#496DA8] transition-colors cursor-pointer"
            >
              Send
            </button>
          </div>
        </form>

        <!-- Daftar komentar -->
        ${p.komentar.length ? `
          <div class="space-y-4">
            ${p.komentar.map(k => komentarItem(p, k)).join('')}
          </div>` : ''}
      </div>`;
  }

  const jumlahKomentar = p => p.komentar.reduce((n, k) => n + 1 + (k.balasan || []).length, 0);

  function kartuPost(p) {
    const buka = terbuka.has(p.id);
    const jumlah = jumlahKomentar(p);
    const tombol = 'flex-1 flex items-center justify-center gap-2 py-2 px-4 rounded-lg transition-colors cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-primary3';

    return `
      <article id="post-${p.id}" class="border border-gray-200/90 rounded-xl relative shadow-xs hover:border-gray-300 transition-colors bg-white scroll-mt-24">
        <div class="p-5">
          <div class="flex items-start justify-between gap-3">
            <div class="flex items-start gap-3.5 min-w-0">
              ${fotoPenulis(p)}
              <div class="flex flex-col min-w-0">
                <p class="text-[17px] font-semibold text-gray-900 leading-tight">${esc(p.penulis)}</p>
                <p class="text-[14px] text-gray-500 leading-snug mt-1">${esc(keterangan(p))}</p>
                <div class="flex items-center gap-1.5 text-[13px] text-gray-500 mt-1 flex-wrap">
                  <span>${waktuLalu(p.waktu)}</span>
                  <span aria-hidden="true">•</span>
                  <span class="inline-flex items-center gap-1 text-[12px] font-medium text-gray-600 bg-gray-100 px-2 py-0.5 rounded-full"><i data-lucide="globe" class="w-3 h-3" aria-hidden="true"></i>Semua orang</span>
                </div>
              </div>
            </div>
            ${menuPost(p)}
          </div>

          ${!p.referral && p.kategori === 'referral' ? `
            <span class="inline-flex items-center gap-1 mt-3.5 px-2 py-0.5 rounded-full text-[11px] font-semibold border bg-blue-50 text-[#3A5988] border-blue-200"><i data-lucide="briefcase" class="w-3 h-3" aria-hidden="true"></i>Loker / Referral</span>` : ''}
          ${isiPost(p)}
          ${p.referral ? kartuReferral(p) : ''}
          ${p.karya ? kartuKarya(p.karya, p) : ''}
        </div>

        ${p.gambar && !p.karya ? `
          <div class="px-5 pb-5">
            <img src="${esc(p.gambar)}" alt="Gambar dari ${esc(p.penulis)}" loading="lazy" class="w-full max-h-[220px] object-cover rounded-xl border border-gray-200/80">
          </div>` : ''}

        <!-- Baris Reaksi & Statistik Interaksi -->
        <div class="px-5 py-2.5 border-t border-gray-100 flex items-center justify-between text-[14px] text-gray-500">
          <div class="flex items-center gap-2">
            <span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-[#3A5988] text-white" aria-hidden="true">
              <i data-lucide="thumbs-up" class="w-[11px] h-[11px] fill-current"></i>
            </span>
            <span class="font-medium text-gray-700">${p.suka} menyukai</span>
          </div>
          <button type="button" data-aksi="buka" data-id="${p.id}" class="hover:text-[#3A5988] hover:underline cursor-pointer rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-primary3">${jumlah} komentar</button>
        </div>

        <!-- Tombol Interaksi (Suka & Komentar) -->
        <div class="px-5 py-1.5 flex items-center justify-around border-t border-gray-100 text-[15px]">
          <button type="button" data-aksi="suka" data-id="${p.id}" aria-pressed="${p.disukaiSaya}" class="${tombol} text-[#3A5988] hover:bg-blue-50 ${p.disukaiSaya ? 'font-bold bg-blue-50/80 shadow-2xs' : 'font-semibold'}">
            <i data-lucide="thumbs-up" class="w-[18px] h-[18px] ${p.disukaiSaya ? 'fill-current' : ''}" aria-hidden="true"></i>
            <span>Suka</span>
          </button>
          <button type="button" data-aksi="buka" data-id="${p.id}" aria-expanded="${buka}" class="${tombol} ${buka ? 'text-[#3A5988] font-bold bg-blue-50/50' : 'text-gray-600 hover:text-[#3A5988] hover:bg-blue-50/50 font-semibold'}">
            <i data-lucide="message-square" class="w-[18px] h-[18px]" aria-hidden="true"></i>
            <span>Komentar</span>
          </button>
        </div>

        ${buka ? panelKomentar(p) : ''}
      </article>`;
  }

  // ===================== SARING KATEGORI =====================
  function renderSaring() {
    document.getElementById('saring').innerHTML = [['', 'Semua'], ...Object.entries(KATEGORI)].map(([k, label]) => {
      const aktif = kategori === k;
      return `<button type="button" data-kategori="${k}" aria-pressed="${aktif}" class="px-4 py-2 rounded-full font-semibold transition-colors shrink-0 cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-primary3 ${aktif ? 'bg-[#3A5988] text-white shadow-xs' : 'bg-white border border-gray-200 text-gray-700 hover:bg-gray-50'}">${label}</button>`;
    }).join('');
  }

  // ===================== KOLOM SAMPING KANAN =====================
  // Isi dan susunan mengikuti Beranda alumni: Pengumuman lalu Gigs Terbaru (sumber gigs sama: loadGigs di alumni-data.js)
  function kepalaWidget(judul, sub, tautan = '') {
    return `
      <div class="flex items-start justify-between gap-3 pb-3 border-b border-gray-100">
        <div>
          <h3 class="text-[17px] font-bold text-gray-900 tracking-tight">${judul}</h3>
          <p class="text-[13px] text-gray-500 font-medium mt-0.5">${sub}</p>
        </div>
        ${tautan}
      </div>`;
  }

  function renderKanan() {
    const pengumuman = DB.pengumuman.semua().slice(0, 3);
    const gigs = (typeof loadGigs === 'function' ? loadGigs() : []).slice(0, 3);

    document.getElementById('kanan').innerHTML = `
      <section class="bg-white rounded-xl border border-gray-200/80 shadow-sm p-5 sm:p-6">
        ${kepalaWidget('Pengumuman', 'Informasi utama Bengkel Koding', '<a href="pengumuman.html" class="shrink-0 text-[12px] font-semibold text-[#3A5988] hover:underline mt-1 rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-primary3">Semua</a>')}
        <div class="space-y-1 mt-2">
          ${pengumuman.map(pg => `
            <a href="pengumuman.html" class="block p-2.5 -mx-1.5 rounded-lg hover:bg-gray-50/90 transition-colors group focus:outline-none focus-visible:ring-2 focus-visible:ring-primary3">
              <h4 class="text-[13.5px] font-semibold text-gray-900 group-hover:text-[#3A5988] transition-colors leading-snug truncate">${esc(pg.judul)}</h4>
              <p class="text-[12px] text-gray-500 leading-snug line-clamp-2 mt-0.5">${esc(pg.isi)}</p>
              <p class="text-[11px] text-gray-500 mt-1 leading-none">${fmtDate(pg.published_at)}</p>
            </a>`).join('') || '<p class="text-[13px] text-gray-500 py-2">Belum ada pengumuman. Terbitkan dari menu Pengumuman.</p>'}
        </div>
      </section>

      <section class="bg-white rounded-xl border border-gray-200/90 shadow-sm p-5 sm:p-6">
        ${kepalaWidget('Gigs Terbaru', 'Tender kolaborasi antar-alumni')}
        <div class="space-y-2.5 mt-3">
          ${gigs.map(g => `
            <div class="p-3 rounded-xl border border-gray-100 shadow-2xs">
              <h4 class="text-[13.5px] font-semibold text-gray-900 leading-snug line-clamp-1">${esc(g.title)}</h4>
              <div class="flex items-center justify-between gap-2 text-[12px] mt-1.5 text-gray-500">
                <span class="font-semibold text-[#3A5988]">${esc(g.budgetRange)}</span>
                <span class="text-[11.5px] truncate">${esc(g.category)}</span>
              </div>
            </div>`).join('') || '<p class="text-[13px] text-gray-500 py-2">Belum ada gigs dari alumni.</p>'}
        </div>
      </section>`;
  }

  // ===================== RENDER FEED =====================
  function render() {
    let list = semua();
    if (kategori) list = list.filter(p => p.kategori === kategori);
    if (pencarianTeks) {
      const q = pencarianTeks.toLowerCase();
      list = list.filter(p => `${p.penulis} ${p.isi || ''} ${p.karya?.nama || ''} ${p.referral?.posisi || ''} ${p.referral?.perusahaan || ''}`.toLowerCase().includes(q));
    }

    renderSaring();
    daftar.innerHTML = list.map(kartuPost).join('')
      || `<div class="bg-white rounded-xl border border-gray-200 p-12 text-center text-gray-500 text-[15px]">
            ${pencarianTeks ? `Tidak ada postingan yang cocok dengan "${esc(pencarianTeks)}". Coba kata kunci lain.` : 'Belum ada postingan untuk kategori ini. Klik tombol "Buat Postingan" untuk membagikan kabar ke rekan alumni.'}
          </div>`;
    refreshIcons();
  }

  function segarkan(id) {
    const el = document.getElementById(`post-${id}`);
    const p = cari(id);
    if (el && p) el.outerHTML = kartuPost(p);
    refreshIcons();
  }

  function lompat(id) {
    const p = cari(id);
    if (!p) return;
    kategori = '';
    pencarianTeks = '';
    document.getElementById('forum-cari').value = '';
    terbuka.add(p.id);
    render();
    const el = document.getElementById(`post-${id}`);
    if (el) {
      el.scrollIntoView({ block: 'start', behavior: 'smooth' });
      el.classList.add('ring-2', 'ring-[#3A5988]');
      setTimeout(() => el.classList.remove('ring-2', 'ring-[#3A5988]'), 1600);
    }
  }

  async function salinTautan(id) {
    try {
      await navigator.clipboard.writeText(new URL(`forum.html#post-${id}`, location.href).href);
      showToast('Tautan postingan berhasil disalin.');
    } catch {
      showToast('Browser menolak izin salin.', 'error');
    }
  }

  function tutupMenu() {
    document.querySelectorAll('[data-panel-menu]').forEach(m => m.classList.add('hidden'));
    document.querySelectorAll('[data-aksi="menu"]').forEach(b => b.setAttribute('aria-expanded', 'false'));
  }

  function hapus(id) {
    const p = cari(id);
    const jumlah = p ? jumlahKomentar(p) : 0;
    confirmAction({
      title: 'Hapus postingan?',
      message: `Postingan ${p?.penulis === NAMA ? 'Anda' : `dari ${p?.penulis}`}${jumlah ? ` beserta ${jumlah} komentar` : ''} akan dihapus dari linimasa.`,
      okLabel: 'Hapus',
      danger: true,
    }, () => {
      FeedBersama.hapus(id);
      render();
      showToast('Postingan berhasil dihapus.');
    });
  }

  // ===================== AKSI EVENT DELEGATION =====================
  daftar.addEventListener('click', e => {
    const tombol = e.target.closest('[data-aksi]');
    if (!tombol) return;
    const id = Number(tombol.dataset.id);
    const aksi = tombol.dataset.aksi;
    if (aksi === 'menu') {
      const panel = tombol.nextElementSibling;
      const sudahBuka = !panel.classList.contains('hidden');
      tutupMenu();
      panel.classList.toggle('hidden', sudahBuka);
      tombol.setAttribute('aria-expanded', String(!sudahBuka));
      return;
    }
    tutupMenu();
    if (aksi === 'hapus') return hapus(id);
    if (aksi === 'bagikan') return salinTautan(id);
    if (aksi === 'tampil-balas') {
      const formBalas = document.getElementById(`form-balas-${tombol.dataset.komentarId}`);
      if (formBalas) {
        formBalas.classList.toggle('hidden');
        if (!formBalas.classList.contains('hidden')) formBalas.querySelector('input')?.focus();
      }
      return;
    }
    if (aksi === 'suka-komentar') {
      FeedBersama.sukaKomentar(id, Number(tombol.dataset.komentarId), NAMA);
      return segarkan(id);
    }
    if (aksi === 'suka-balasan') {
      FeedBersama.sukaBalasan(id, Number(tombol.dataset.komentarId), Number(tombol.dataset.balasanId), NAMA);
      return segarkan(id);
    }
    if (aksi === 'hapus-komentar') {
      FeedBersama.hapusKomentar(id, Number(tombol.dataset.komentarId));
      return segarkan(id);
    }
    if (aksi === 'suka') FeedBersama.suka(id, NAMA);
    if (aksi === 'perluas') diperluas.add(id);
    if (aksi === 'buka' && !terbuka.delete(id)) terbuka.add(id);
    segarkan(id);
    if (aksi === 'buka' && terbuka.has(id)) document.querySelector(`[data-komentar="${id}"] input`)?.focus();
  });

  daftar.addEventListener('submit', e => {
    e.preventDefault();
    if (e.target.dataset.komentar) {
      const id = Number(e.target.dataset.komentar);
      const isi = e.target.elements.isi.value.trim();
      if (!isi) return;
      const hasil = FeedBersama.komentar(id, { nama: NAMA, peran: 'Koordinator', isi });
      if (!hasil.ok) return showToast(hasil.error, 'error');
      segarkan(id);
    } else if (e.target.dataset.balas) {
      const id = Number(e.target.dataset.balas);
      const idInduk = Number(e.target.dataset.induk);
      const isi = e.target.elements.isi.value.trim();
      if (!isi) return;
      const hasil = FeedBersama.balas(id, idInduk, { nama: NAMA, peran: 'Koordinator', isi });
      if (!hasil.ok) return showToast(hasil.error, 'error');
      segarkan(id);
    }
  });

  document.addEventListener('click', e => { if (!e.target.closest('[data-menu]')) tutupMenu(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') tutupMenu(); });

  document.getElementById('saring').addEventListener('click', e => {
    const tombol = e.target.closest('[data-kategori]');
    if (!tombol) return;
    kategori = tombol.dataset.kategori;
    render();
  });

  document.getElementById('forum-cari').addEventListener('input', e => {
    pencarianTeks = e.target.value.trim();
    render();
  });

  window.addEventListener('storage', e => {
    if (['bengkod_alumni_posts_v2', 'bengkod_shared_forum_v2'].includes(e.key)) render();
  });

  render();
  renderKanan();
  window.addEventListener('load', () => {
    const id = Number(location.hash.replace('#post-', ''));
    if (id) lompat(id);
  });
</script>
</body>
</html>
