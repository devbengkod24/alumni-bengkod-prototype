<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forum | Koordinator Bengkel Koding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/store.js"></script>
  <script src="assets/js/koordinator.js"></script>
  <script src="../assets/js/main.js"></script>
</head>
<body class="bg-white text-neutral1 antialiased font-sans">
<main data-title="Forum">

  <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
    <div>
      <h2 class="text-2xl font-semibold text-neutral1">Forum</h2>
      <p class="text-sm text-neutral2 mt-1">Buat diskusi, tinjau laporan pengguna, dan hapus thread atau komentar yang melanggar aturan.</p>
    </div>
    <button onclick="openForm()" class="btn-primary"><i data-lucide="plus" class="w-4 h-4"></i> Buat Diskusi</button>
  </div>

  <section class="bg-white rounded-xl border border-neutral4 elevation2 overflow-hidden">
    <div class="flex border-b border-neutral4 px-2 overflow-x-auto" role="tablist">
      <button data-tab="laporan" role="tab">Laporan Masuk <span id="count" class="ml-1 px-1.5 rounded-full bg-red3 text-red1 text-xs"></span></button>
      <button data-tab="thread" role="tab">Semua Thread</button>
    </div>

    <div id="tab-laporan" role="tabpanel"><ul id="laporan" class="divide-y divide-neutral4"></ul></div>

    <div id="tab-thread" role="tabpanel" class="overflow-x-auto">
      <table class="w-full">
        <thead><tr><th class="th">Thread</th><th class="th text-right">Komentar</th><th class="th">Dibuat</th><th class="th text-right">Aksi</th></tr></thead>
        <tbody id="threads"></tbody>
      </table>
    </div>
  </section>

</main>

<!-- Buat diskusi (field sama dengan forum mitra) -->
<div id="form-modal" data-modal-backdrop class="modal-backdrop">
  <form id="form" class="modal max-w-lg" role="dialog" aria-modal="true" aria-labelledby="form-title">
    <h3 id="form-title" class="font-semibold text-base text-neutral1 mb-4">Buat Diskusi Baru</h3>
    <div class="space-y-4">
      <div><label for="f-judul" class="label">Judul Diskusi <span class="text-red2">*</span></label>
        <input id="f-judul" name="judul" class="input" placeholder="Topik yang ingin didiskusikan..." required maxlength="255"></div>
      <div><label for="f-isi" class="label">Isi Diskusi <span class="text-red2">*</span></label>
        <textarea id="f-isi" name="isi" rows="5" class="input resize-none" placeholder="Jelaskan topik diskusi secara detail..." required></textarea></div>
      <div><label for="f-tags" class="label">Tags</label>
        <input id="f-tags" name="tags" class="input" placeholder="Pisahkan dengan koma, contoh: Karir, Info">
        <p class="text-xs text-neutral3 mt-1">Maksimal 3 tag</p></div>
    </div>
    <div class="mt-6 flex justify-end gap-2">
      <button type="button" onclick="closeModal('form-modal')" class="btn-outline">Batal</button>
      <button type="submit" class="btn-primary"><i data-lucide="send" class="w-4 h-4"></i> Kirim Diskusi</button>
    </div>
  </form>
</div>

<!-- Modal Detail Diskusi & Komentar -->
<div id="modal-detail-thread" data-modal-backdrop class="modal-backdrop">
  <div class="modal max-w-2xl w-full p-6" role="dialog" aria-modal="true">
    <div id="detail-thread-content"></div>
  </div>
</div>

<script>
  const PERAN_COLORS = {
    'Mitra': 'bg-secondary3 text-yellow1 border-yellow2/30',
    'Alumni': 'bg-green3 text-green1 border-green2/30',
    'Koordinator': 'bg-primary5 text-primary1 border-primary4/50',
  };

  function timeAgo(iso) {
    if (!iso) return '-';
    const diff = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 60) return `${mins} menit lalu`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs} jam lalu`;
    return fmtDate(iso);
  }

  function renderCommentsHTML(thread) {
    const comments = Array.isArray(thread.comments) ? thread.comments : [];
    if (comments.length === 0) {
      return `<div class="bg-neutral5 rounded-xl p-5 text-sm text-neutral3 text-center border border-neutral4/60">
        <i data-lucide="message-square" class="w-6 h-6 mx-auto mb-1 text-neutral3 opacity-50"></i>
        Belum ada komentar pada diskusi ini.
      </div>`;
    }
    return `<div class="space-y-3">
      ${comments.map(c => `
        <div class="bg-neutral5/70 border border-neutral4/60 rounded-xl p-3.5 flex items-start gap-3">
          <div class="w-8 h-8 rounded-full bg-gradient-to-br from-primary1 to-primary3 text-white flex items-center justify-center font-semibold text-xs shrink-0 mt-0.5">
            ${(c.penulis || 'U').split(' ').map(w=>w[0]).slice(0,2).join('')}
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex flex-wrap items-center gap-2 mb-1">
              <span class="text-xs font-bold text-neutral1">${esc(c.penulis)}</span>
              <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold border ${PERAN_COLORS[c.peran] || 'bg-neutral5 text-neutral2 border-neutral4'}">${esc(c.peran)}</span>
              <span class="text-[11px] text-neutral3">${timeAgo(c.waktu)}</span>
            </div>
            <p class="text-xs sm:text-sm text-neutral1 leading-relaxed whitespace-pre-line">${esc(c.isi)}</p>
          </div>
        </div>
      `).join('')}
    </div>`;
  }

  function openDetailThread(id) {
    const allThreads = window.BengkodStore ? window.BengkodStore.getForum() : KOOR.threads;
    const t = allThreads.find(x => x.id === id);
    if (!t) return;
    const comments = Array.isArray(t.comments) ? t.comments : [];
    document.getElementById('detail-thread-content').innerHTML = `
      <div class="flex items-start justify-between gap-4 mb-5">
        <div>
          <div class="flex flex-wrap items-center gap-2 mb-2">
            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold border ${PERAN_COLORS[t.peran] || 'bg-neutral5 text-neutral2 border-neutral4'}">${esc(t.peran)}</span>
            <span class="text-xs text-neutral3">${timeAgo(t.waktu || t.tanggal)}</span>
          </div>
          <h3 class="font-bold text-lg text-neutral1">${esc(t.judul)}</h3>
        </div>
        <button onclick="closeModal('modal-detail-thread')" class="btn-icon shrink-0" aria-label="Tutup"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="flex items-center gap-3 mb-4 pb-4 border-b border-neutral4">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-primary1 to-primary3 text-white flex items-center justify-center font-semibold text-sm shrink-0">
          ${(t.penulis || 'U').split(' ').map(w=>w[0]).slice(0,2).join('')}
        </div>
        <div>
          <div class="text-sm font-semibold text-neutral1">${esc(t.penulis)}</div>
          <div class="text-xs text-neutral3">${esc(t.peran)}</div>
        </div>
      </div>
      <p class="text-sm text-neutral2 leading-relaxed mb-4 whitespace-pre-line">${esc(t.isi)}</p>
      <div class="flex flex-wrap gap-1 mb-5">
        ${(t.tags || []).map(tag=>`<span class="px-2.5 py-1 bg-primary5 text-primary1 text-xs rounded-lg font-medium">${esc(tag)}</span>`).join('')}
      </div>
      <div class="border-t border-neutral4 pt-4">
        <div class="flex items-center justify-between mb-3">
          <div class="text-sm font-semibold text-neutral1"><span id="koor-komentar-count-${t.id}">${comments.length}</span> Komentar</div>
        </div>
        <div id="koor-komentar-container-${t.id}" class="space-y-3 mb-4 max-h-[280px] overflow-y-auto pr-1">
          ${renderCommentsHTML(t)}
        </div>
        <div class="pt-3 border-t border-neutral4/60">
          <label for="koor-input-komentar-${t.id}" class="block text-xs font-semibold text-neutral2 mb-1.5">Tulis Komentar sebagai Koordinator</label>
          <textarea id="koor-input-komentar-${t.id}" placeholder="Tulis arahan, tanggapan, atau informasi resmi..." class="input resize-none text-xs sm:text-sm leading-relaxed" rows="3"></textarea>
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mt-2">
            <span class="text-[11px] text-neutral3">Mengirim sebagai: <strong>${esc(KOOR.user.name)}</strong> (Koordinator)</span>
            <button type="button" class="btn-primary text-xs px-4 py-2 font-semibold flex items-center justify-center gap-1.5 shadow-sm" onclick="kirimKomentarKoor(${t.id})">
              <i data-lucide="send" class="w-3.5 h-3.5"></i>
              <span>Kirim Tanggapan</span>
            </button>
          </div>
        </div>
      </div>`;
    openModal('modal-detail-thread');
    refreshIcons();
  }

  function kirimKomentarKoor(threadId) {
    const input = document.getElementById(`koor-input-komentar-${threadId}`);
    if (!input) return;
    const teks = input.value.trim();
    if (!teks) {
      showToast('Tuliskan isi komentar terlebih dahulu!', 'error');
      input.focus();
      return;
    }

    const penulis = KOOR.user.name || 'Dr. Ayu Lestari, M.Kom';
    const peran = 'Koordinator';

    let thread;
    if (window.BengkodStore) {
      window.BengkodStore.addForumComment(threadId, { penulis, peran, isi: teks });
      thread = window.BengkodStore.getForum().find(t => t.id === Number(threadId));
    } else {
      thread = KOOR.threads.find(t => t.id === Number(threadId));
      if (thread) {
        if (!Array.isArray(thread.comments)) thread.comments = [];
        thread.comments.push({ id: Date.now(), penulis, peran, waktu: new Date().toISOString(), isi: teks });
        thread.komentar = thread.comments.length;
      }
    }

    input.value = '';
    showToast('Tanggapan koordinator berhasil dikirim!', 'success');

    if (thread) {
      const container = document.getElementById(`koor-komentar-container-${threadId}`);
      if (container) container.innerHTML = renderCommentsHTML(thread);
      const countEl = document.getElementById(`koor-komentar-count-${threadId}`);
      if (countEl) countEl.textContent = (thread.comments || []).length;
    }

    render();
    refreshIcons();
  }

  function render() {
    const pending = KOOR.laporanForum.filter(l => l.status === 'pending').length;
    document.getElementById('count').textContent = pending;

    document.getElementById('laporan').innerHTML = KOOR.laporanForum.map(l => `
      <li class="p-5 flex flex-col md:flex-row md:items-center gap-4">
        <div class="flex-1 min-w-0">
          <div class="flex flex-wrap items-center gap-2 mb-1">${badge(l.jenis)} ${badge(l.status)}
            <span class="text-xs text-neutral3">${fmtDate(l.tanggal)} · ${l.pelapor} pelapor</span></div>
          <div class="font-medium text-neutral1">${esc(l.judul)}</div>
          <div class="text-sm text-neutral2 mt-0.5">Oleh ${esc(l.penulis)} · Alasan: <span class="text-red1 font-medium">${esc(l.reason)}</span></div>
        </div>
        ${l.status === 'pending' ? `<div class="flex gap-2 shrink-0">
          <button class="btn-outline" onclick="tindak(${l.id}, false)">Abaikan</button>
          <button class="btn-danger" onclick="tindak(${l.id}, true)"><i data-lucide="trash-2" class="w-4 h-4"></i> Hapus ${l.jenis}</button>
        </div>` : ''}
      </li>`).join('');

    document.getElementById('threads').innerHTML = KOOR.threads.map(t => `
      <tr class="tr">
        <td class="td">
          <div class="font-medium cursor-pointer hover:text-primary1 transition-colors" onclick="openDetailThread(${t.id})">${esc(t.judul)}</div>
          <div class="text-xs text-neutral3">oleh ${esc(t.penulis)} · ${esc(t.peran)}</div>
          ${t.tags && t.tags.length ? `<div class="flex flex-wrap gap-1 mt-1.5">${t.tags.map(tag => `<span class="px-2 py-0.5 rounded-full bg-neutral5 text-neutral2 text-xs">${esc(tag)}</span>`).join('')}</div>` : ''}</td>
        <td class="td text-right">${Array.isArray(t.comments) ? t.comments.length : (t.komentar || 0)}</td>
        <td class="td whitespace-nowrap">${fmtDate(t.waktu || t.tanggal)}</td>
        <td class="td text-right">
          <div class="flex items-center justify-end gap-1">
            <button class="btn-icon hover:bg-primary5 hover:text-primary1" onclick="openDetailThread(${t.id})" aria-label="Lihat diskusi" title="Lihat diskusi"><i data-lucide="message-square" class="w-4 h-4"></i></button>
            <button class="btn-icon hover:!bg-red3 hover:!text-red1" onclick="hapusThread(${t.id})" aria-label="Hapus thread" title="Hapus thread"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          </div>
        </td>
      </tr>`).join('') || '<tr><td colspan="4" class="td text-center text-neutral3 py-8">Belum ada thread.</td></tr>';
    refreshIcons();
  }

  function tindak(id, hapus) {
    const l = KOOR.laporanForum.find(x => x.id === id);
    const apply = () => {
      l.status = hapus ? 'approved' : 'rejected';
      audit(hapus ? `Hapus ${l.jenis.toLowerCase()} forum` : 'Abaikan laporan forum', l.judul);
      render();
      showToast(hapus ? `${l.jenis} dihapus dari forum.` : 'Laporan diabaikan.');
    };
    if (!hapus) return apply();
    confirmAction({ title: `Hapus ${l.jenis.toLowerCase()}?`, message: `"${l.judul}" oleh ${l.penulis} akan dihapus dari forum.`, okLabel: 'Hapus', danger: true }, apply);
  }

  function hapusThread(id) {
    const allThreads = window.BengkodStore ? window.BengkodStore.getForum() : KOOR.threads;
    const t = allThreads.find(x => x.id === id);
    if (!t) return;
    confirmAction({ title: 'Hapus thread?', message: `"${t.judul}" beserta ${Array.isArray(t.comments) ? t.comments.length : t.komentar} komentarnya akan dihapus.`, okLabel: 'Hapus', danger: true }, () => {
      if (window.BengkodStore) {
        window.BengkodStore.deleteForumThread(id);
      } else {
        KOOR.threads = KOOR.threads.filter(x => x.id !== id);
      }
      audit('Hapus thread forum', t.judul);
      render();
      showToast('Thread dihapus.');
    });
  }

  const form = document.getElementById('form');
  function openForm() {
    form.reset();
    openModal('form-modal');
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(form));
    const tags = d.tags.split(',').map(t => t.trim()).filter(Boolean).slice(0, 3);
    if (window.BengkodStore) {
      window.BengkodStore.addForumThread({
        judul: d.judul.trim(),
        isi: d.isi.trim(),
        tags,
        penulis: KOOR.user.name,
        peran: 'Koordinator'
      });
    } else {
      KOOR.threads.unshift({ id: Date.now(), judul: d.judul.trim(), isi: d.isi.trim(), tags, penulis: KOOR.user.name, peran: 'Koordinator', komentar: 0, tanggal: new Date().toISOString().slice(0, 10), comments: [] });
    }
    audit('Buat thread forum', d.judul.trim());
    closeModal('form-modal');
    render();
    document.querySelector('[data-tab="thread"]').click();
    showToast('Diskusi dipublikasikan.');
  });

  render();
  initTabs();
</script>
</body>
</html>
