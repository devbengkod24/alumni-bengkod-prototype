<!DOCTYPE html>
<html lang="id" data-role="admin">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karya Alumni | Koordinator Bengkel Koding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css?v=5">
  <script src="../alumni/assets/js/data.js?v=8"></script>
  <script src="../alumni/assets/js/app.js?v=6"></script>
  <script src="../assets/js/page-skeleton.js?v=5"></script>
  <script src="../assets/js/main.js?v=5"></script>
</head>
<body class="bg-white text-neutral1 antialiased font-sans">
<main data-title="Karya Alumni">
  <div>
    <h2 class="!text-2xl font-semibold text-neutral1">Hall of Fame dan Beta Testing</h2>
    <p class="!text-sm text-neutral2 mt-1">Karya yang dipublikasikan alumni di Beranda. Sematkan karya Live unggulan ke Spotlight paling atas Beranda selama 30 hari.</p>
  </div>

  <section class="bg-white rounded-xl border border-neutral4 elevation2 overflow-hidden">
    <div id="tab" class="p-4 border-b border-neutral4 flex gap-2 overflow-x-auto no-scrollbar" role="group" aria-label="Saring tahap karya"></div>
    <div class="overflow-x-auto">
      <table class="w-full">
        <thead><tr><th class="th">Karya</th><th class="th">Pembuat</th><th class="th text-right">Dukungan</th><th class="th">Feedback</th><th class="th">Spotlight</th><th class="th text-right">Aksi</th></tr></thead>
        <tbody id="baris"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
  const TAB = [['live', 'Live Product'], ['beta', 'Beta Testing']];
  let tahap = 'live';

  const disorot = p => p.spotlight_sampai > new Date().toISOString();
  // Karya yang sedang di-spotlight paling atas, sisanya urut dukungan terbanyak
  const daftar = () => DB.feed.semua()
    .filter(p => p.karya?.tahap === tahap)
    .sort((a, b) => disorot(b) - disorot(a) || b.suka.length - a.suka.length);

  function render() {
    document.getElementById('tab').innerHTML = TAB.map(([nilai, label]) => `
      <button type="button" data-tahap="${nilai}" aria-pressed="${tahap === nilai}" class="shrink-0 whitespace-nowrap px-3.5 py-1.5 rounded-full border text-sm font-medium transition-colors ${tahap === nilai ? 'bg-primary1 border-primary1 text-white' : 'bg-white border-neutral4 text-neutral2 hover:bg-primary5 hover:text-primary1'}">${label} <span class="text-xs opacity-70">${DB.feed.semua().filter(p => p.karya?.tahap === nilai).length}</span></button>`).join('');

    document.getElementById('baris').innerHTML = daftar().map(p => {
      const k = p.karya;
      const pembuat = DB.akun.cari(p.id_alumni);
      const aktif = disorot(p);
      const ditanggapi = p.feedback.filter(f => f.status).length;
      return `
        <tr class="tr">
          <td class="td min-w-56">
            <div class="font-medium">${esc(k.nama)}</div>
            <div class="text-xs text-neutral3">${esc(k.tagline)}</div>
            ${tautanAman(k.link) ? `<a href="${esc(tautanAman(k.link))}" target="_blank" rel="noreferrer" class="text-xs text-primary2 hover:underline">Buka aplikasi</a>` : ''}
          </td>
          <td class="td">
            <div class="flex items-center gap-2.5 min-w-40">${fotoBulat(pembuat, 'w-8 h-8')}<span>${esc(pembuat.nama)}</span></div>
          </td>
          <td class="td text-right tabular-nums">${p.suka.length}</td>
          <td class="td whitespace-nowrap">${p.feedback.length} masuk · ${ditanggapi} ditanggapi${tahap === 'beta' ? `<div class="text-xs text-neutral3">Fokus: ${esc(k.fokus.join(', '))}</div>` : ''}</td>
          <td class="td whitespace-nowrap">${aktif ? `${badge('Aktif', 'green')}<div class="text-xs text-neutral3 mt-1">Sampai ${fmtDate(p.spotlight_sampai)}</div>` : '<span class="text-neutral3">-</span>'}</td>
          <td class="td text-right">${tahap === 'live' ? `<button type="button" data-spotlight="${p.id}" class="${aktif ? 'btn-outline' : 'btn-primary'} !px-3 !py-1.5 !text-xs">${aktif ? 'Lepas Spotlight' : 'Sematkan 30 Hari'}</button>` : '<span class="text-xs text-neutral3">Menunggu rilis</span>'}</td>
        </tr>`;
    }).join('') || `<tr><td colspan="6" class="td text-center text-neutral3 py-8">Belum ada karya ${tahap === 'live' ? 'Live' : 'Beta'}.</td></tr>`;
    refreshIcons();
  }

  document.querySelector('main').addEventListener('click', e => {
    const tombol = e.target.closest('[data-tahap], [data-spotlight]');
    if (!tombol) return;
    if (tombol.dataset.tahap) tahap = tombol.dataset.tahap;
    if (tombol.dataset.spotlight) {
      DB.feed.spotlight(tombol.dataset.spotlight, SAYA.id);
      showToast('Spotlight diperbarui. Pembuat karya diberi tahu saat karyanya disematkan.');
    }
    render();
  });
  render();
</script>
</body>
</html>
