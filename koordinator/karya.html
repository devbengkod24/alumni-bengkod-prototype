<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kurasi Spotlight | Koordinator Bengkel Koding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/store.js"></script>
  <script src="assets/js/koordinator.js"></script>
  <script src="../alumni/assets/js/data.js"></script>
  <script src="../assets/js/page-skeleton.js"></script>
  <script src="../assets/js/main.js"></script>
</head>
<body class="bg-white text-neutral1 antialiased font-sans">
<main data-title="Kurasi Spotlight" class="space-y-6">

  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 pb-2 border-b border-neutral4">
    <div>
      <h2 class="text-2xl font-bold text-neutral1 tracking-tight">Kurasi Karya Unggulan</h2>
      <p class="text-sm text-neutral2 mt-1 max-w-2xl">
        Pilih karya alumni yang akan disematkan di halaman Beranda untuk mendapat sorotan dan apresiasi dari seluruh komunitas.
      </p>
    </div>
  </div>

  <!-- Stat Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
    <div class="card !p-4 flex items-center gap-3.5">
      <div class="w-10 h-10 rounded-lg bg-primary5 text-primary1 border border-primary4/50 flex items-center justify-center shrink-0">
        <i data-lucide="folder-git-2" class="w-5 h-5"></i>
      </div>
      <div>
        <p class="text-xs font-semibold text-neutral3 uppercase tracking-wider">Total Karya Rilis</p>
        <p id="stat-total-live" class="text-2xl font-bold text-neutral1 mt-0.5">0</p>
      </div>
    </div>
    <div class="card !p-4 flex items-center gap-3.5">
      <div class="w-10 h-10 rounded-lg bg-secondary3 text-neutral1 border border-secondary2/50 flex items-center justify-center shrink-0">
        <i data-lucide="award" class="w-5 h-5"></i>
      </div>
      <div>
        <p class="text-xs font-semibold text-neutral3 uppercase tracking-wider">Ditampilkan di Beranda</p>
        <p id="stat-spotlight-aktif" class="text-2xl font-bold text-neutral1 mt-0.5">0</p>
      </div>
    </div>
    <div class="card !p-4 flex items-center gap-3.5">
      <div class="w-10 h-10 rounded-lg bg-green3 text-green1 border border-green2/30 flex items-center justify-center shrink-0">
        <i data-lucide="thumbs-up" class="w-5 h-5"></i>
      </div>
      <div>
        <p class="text-xs font-semibold text-neutral3 uppercase tracking-wider">Total Dukungan Alumni</p>
        <p id="stat-total-upvote" class="text-2xl font-bold text-neutral1 mt-0.5">0</p>
      </div>
    </div>
  </div>

  <!-- Grid Produk Live -->
  <section class="space-y-4" aria-label="Daftar Karya Alumni">
    <div class="flex items-center justify-between gap-3">
      <h3 class="text-base font-semibold text-neutral1">Daftar Karya Alumni</h3>
      <span id="label-karya-hitung" class="text-xs text-neutral3 font-medium"></span>
    </div>
    <div id="grid-karya" class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <!-- Diisi melalui JS -->
    </div>
  </section>

</main>

<script>
  function formatTanggal(tglIso) {
    if (!tglIso) return '-';
    try {
      const d = new Date(tglIso);
      return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    } catch {
      return tglIso;
    }
  }

  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
  }

  function render() {
    const semua = window.DB.feed.semua();
    const liveList = semua.filter(p => p.karya?.tahap === 'live');
    const aktifList = window.DB.feed.spotlightAktif();
    const totalUpvote = liveList.reduce((acc, p) => acc + (p.suka?.length || 0), 0);

    document.getElementById('stat-total-live').textContent = liveList.length;
    document.getElementById('stat-spotlight-aktif').textContent = aktifList.length;
    document.getElementById('stat-total-upvote').textContent = totalUpvote;
    document.getElementById('label-karya-hitung').textContent = `${liveList.length} produk terdaftar`;

    const container = document.getElementById('grid-karya');
    if (!liveList.length) {
      container.innerHTML = `
        <div class="lg:col-span-2 card text-center py-12 space-y-3">
          <div class="w-12 h-12 rounded-full bg-neutral5 text-neutral3 flex items-center justify-center mx-auto">
            <i data-lucide="package-open" class="w-6 h-6"></i>
          </div>
          <p class="text-base font-semibold text-neutral1">Belum Ada Karya Alumni</p>
          <p class="text-sm text-neutral3 max-w-md mx-auto">Karya alumni yang telah dipublikasikan akan muncul di sini agar dapat Anda pilih untuk ditampilkan di Beranda.</p>
        </div>`;
      lucide.createIcons();
      return;
    }

    container.innerHTML = liveList.map(p => {
      const k = p.karya;
      const creator = window.DB.akun.cari(p.id_alumni) || { nama: 'Alumni' };
      const tracer = window.DB.tracer.milik(p.id_alumni);
      const isSpotlight = p.spotlight_sampai && new Date(p.spotlight_sampai) > new Date();
      const stackBadges = (k.stack || []).map(s => `<span class="px-2 py-0.5 rounded text-[11px] font-medium bg-neutral5 text-neutral2 border border-neutral4/60">${esc(s)}</span>`).join('');

      return `
        <article id="karya-${p.id}" class="card scroll-mt-24 flex flex-col justify-between gap-4 transition-all hover:border-primary4 ${isSpotlight ? 'border-primary3 ring-1 ring-primary3/40' : ''}">
          <div class="space-y-3">
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">
                <div class="flex flex-wrap items-center gap-2">
                  <h4 class="text-base font-bold text-neutral1 tracking-tight truncate">${esc(k.nama)}</h4>
                  <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium bg-green3 text-green1">
                    Karya Siap Tampil
                  </span>
                  ${isSpotlight ? `
                    <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium bg-secondary3 text-neutral1 border border-secondary2/60">
                      Aktif di Beranda
                    </span>` : ''}
                </div>
                <p class="text-sm text-neutral2 mt-1 leading-snug">${esc(k.tagline)}</p>
              </div>
              <div class="flex items-center gap-1.5 text-xs text-neutral3 bg-neutral5 px-2.5 py-1 rounded-lg shrink-0">
                <i data-lucide="thumbs-up" class="w-3.5 h-3.5 text-primary1"></i>
                <span class="font-semibold text-neutral1">${p.suka?.length || 0}</span>
              </div>
            </div>

            ${p.isi ? `<p class="text-xs text-neutral2 line-clamp-2 bg-neutral5/50 p-2.5 rounded-lg border border-neutral4/60">${esc(p.isi)}</p>` : ''}

            ${stackBadges ? `<div class="flex flex-wrap gap-1.5">${stackBadges}</div>` : ''}

            <div class="flex items-center justify-between text-xs text-neutral3 pt-2 border-t border-neutral4/60">
              <div class="flex items-center gap-2">
                <span>Pembuat:</span>
                <a href="data-alumni.html" class="font-semibold text-primary2 hover:underline">${esc(creator.nama)}</a>
                ${tracer ? `<span class="text-neutral4">·</span><span>Angkatan ${esc(tracer.tahun_masuk)}</span>` : ''}
              </div>
              <a href="${esc(k.link || '#')}" target="_blank" rel="noreferrer" class="inline-flex items-center gap-1 font-semibold text-primary2 hover:underline">
                Lihat Karya <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
              </a>
            </div>
          </div>

          <div class="pt-3 border-t border-neutral4/80 flex items-center justify-between gap-3">
            <div class="text-xs text-neutral3">
              ${isSpotlight ? `Aktif s.d. <span class="font-semibold text-neutral1">${formatTanggal(p.spotlight_sampai)}</span>` : 'Belum ditampilkan di Beranda'}
            </div>
            <button type="button" onclick="toggleSpotlight(${p.id})" class="${isSpotlight ? 'btn-outline !text-red1 !border-red2/40 hover:!bg-red3/30' : 'btn-primary'} !py-1.5 !px-3.5 !text-xs inline-flex items-center gap-1.5">
              <i data-lucide="${isSpotlight ? 'eye-off' : 'pin'}" class="w-3.5 h-3.5"></i>
              ${isSpotlight ? 'Lepas dari Beranda' : 'Tampilkan di Beranda'}
            </button>
          </div>
        </article>`;
    }).join('');

    lucide.createIcons();
  }

  function toggleSpotlight(idPost) {
    const res = window.DB.feed.spotlight(idPost, 1); // 1 = Akun Koordinator
    if (res.ok) {
      if (typeof showToast === 'function') {
        showToast('Status tampilan karya di Beranda berhasil diperbarui.');
      }
      render();
    } else {
      if (typeof showToast === 'function') {
        showToast(res.error || 'Gagal mengubah status.', 'error');
      } else {
        alert(res.error);
      }
    }
  }

  document.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
