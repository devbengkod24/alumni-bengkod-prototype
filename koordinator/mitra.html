<!DOCTYPE html>
<html lang="id" data-role="admin">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mitra | Koordinator Bengkel Koding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css?v=6">
  <script src="../alumni/assets/js/data.js?v=10"></script>
  <script src="../alumni/assets/js/app.js?v=11"></script>
  <script src="../alumni/assets/js/portal-layout.js"></script>
  <script src="../assets/js/page-skeleton.js?v=6"></script>
  <script src="../assets/js/main.js?v=5"></script>
</head>
<body class="bg-white text-neutral1 antialiased font-sans">
<main data-title="Mitra">
  <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
    <div>
      <h1 class="!text-[26px] font-semibold text-headline tracking-[-0.01em]">Mitra</h1>
      <p class="!text-[13.5px] text-neutral3 mt-1">Daftar instansi tempat alumni bekerja dari jawaban tracer study. Edit nama mitra atau lihat daftar alumni yang bekerja di sana.</p>
    </div>
    <span id="ringkasan" class="self-start sm:self-auto shrink-0 inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-[#E2F1F9] text-[#3A5988] text-[13px] font-semibold tabular-nums"></span>
  </div>

  <!-- Toolbar pencarian -->
  <div class="bg-white border border-neutral4 rounded-[14px] p-4 shadow-sm">
    <div class="relative">
      <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#91969C] pointer-events-none"><i data-lucide="search" class="w-4 h-4"></i></span>
      <input id="cari-mitra" type="search" autocomplete="off" aria-label="Cari nama mitra atau kota domisili" placeholder="Cari nama mitra atau kota domisili..."
             class="w-full h-10 pl-10 pr-3 rounded-[8px] border border-neutral4 bg-canvas focus:bg-white text-[13.5px] text-neutral1 placeholder-[#91969C] focus:outline-none focus:border-primary1 transition-colors">
    </div>
  </div>

  <!-- Tabel daftar mitra -->
  <div class="bg-white border border-neutral4 rounded-[14px] shadow-sm overflow-hidden">
    <div class="px-5 sm:px-6 py-4 border-b border-neutral4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <h2 class="!text-[17px] font-bold text-headline tracking-[-0.01em]">Daftar Mitra</h2>
        <span id="jumlah-hasil" class="text-[12px] text-neutral3 tabular-nums"></span>
      </div>
    </div>

    <div class="hidden md:block">
      <table class="w-full table-fixed text-left border-collapse">
        <colgroup>
          <col class="w-[34%]">
          <col class="w-[16%]">
          <col class="w-[24%]">
          <col class="w-[26%]">
        </colgroup>
        <thead>
          <tr class="border-b border-neutral4 bg-white text-[13px] font-medium text-neutral3">
            <th class="py-3.5 pl-6 pr-3 font-medium">Nama Mitra</th>
            <th class="py-3.5 px-3 font-medium">Jumlah Alumni</th>
            <th class="py-3.5 px-3 font-medium">Domisili</th>
            <th class="py-3.5 pr-6 pl-3 font-medium text-right">Aksi</th>
          </tr>
        </thead>
        <tbody id="daftar-mitra" class="divide-y divide-neutral4 text-[13.5px]"></tbody>
      </table>
    </div>

    <div id="daftar-mitra-mobile" class="md:hidden divide-y divide-neutral4"></div>

    <div class="px-5 sm:px-6 py-3.5 border-t border-neutral4 bg-[#FAFBFC] flex items-center justify-between gap-3 text-[12.5px] text-neutral3">
      <span id="status-hasil"></span>
      <div class="flex items-center gap-1">
        <button type="button" id="hal-sebelum" class="px-2.5 py-1 rounded-[6px] border border-neutral4 bg-white text-neutral1 hover:bg-neutral5 disabled:text-[#91969C] disabled:opacity-60 disabled:cursor-not-allowed cursor-pointer">Sebelumnya</button>
        <span id="hal-posisi" class="px-3 py-1 font-semibold text-headline tabular-nums"></span>
        <button type="button" id="hal-berikut" class="px-2.5 py-1 rounded-[6px] border border-neutral4 bg-white text-neutral1 hover:bg-neutral5 disabled:text-[#91969C] disabled:opacity-60 disabled:cursor-not-allowed cursor-pointer">Berikutnya</button>
      </div>
    </div>
  </div>
</main>

<script>
  const PER_HALAMAN = 10;
  let halaman = 1;
  const $ = id => document.getElementById(id);

  const inisialMitra = nama => inisial(nama.replace(/^(PT|CV)\s+/i, ''));
  const logoMitra = nama => `<span class="w-9 h-9 rounded-[10px] bg-primary5 text-primary1 font-semibold text-[12.5px] flex items-center justify-center shrink-0" aria-hidden="true">${esc(inisialMitra(nama))}</span>`;

  // Mitra = instansi tempat alumni bekerja menurut tracer. Usaha milik sendiri (Wirausaha) tidak dihitung sebagai mitra.
  function kumpulkanMitra() {
    const pekerja = DB.tracer.semua().filter(t => DB.STATUS_BEKERJA.includes(DB.tracer.kategori(t)) && t.nama_job && t.jns_job !== 'Wirausaha');
    const grup = pekerja.reduce((acc, t) => {
      (acc[t.nama_job] ||= { nama: t.nama_job, alumni: [] }).alumni.push(t);
      return acc;
    }, {});
    const list = Object.values(grup)
      .map(m => ({
        nama: m.nama,
        jumlah: m.alumni.length,
        kota: [...new Set(m.alumni.map(t => t.kota).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'id')),
      }))
      .sort((a, b) => b.jumlah - a.jumlah || a.nama.localeCompare(b.nama, 'id'));
    return { list, totalAlumni: pekerja.length };
  }

  function saringMitra(list) {
    const kata = $('cari-mitra').value.trim().toLowerCase();
    if (!kata) return list;
    return list.filter(m => m.nama.toLowerCase().includes(kata) || m.kota.some(k => k.toLowerCase().includes(kata)));
  }

  function formatDomisili(kota) {
    return kota.length ? kota.join(', ') : '-';
  }

  function barisMitra(m) {
    const hrefAlumni = `data-alumni.html?mitra=${encodeURIComponent(m.nama)}`;
    return `
      <tr class="hover:bg-[#F9FAFB] transition-colors">
        <td class="py-3.5 pl-6 pr-3 align-middle">
          <div class="flex items-center gap-3 min-w-0">
            ${logoMitra(m.nama)}
            <span class="font-semibold text-headline break-words">${esc(m.nama)}</span>
          </div>
        </td>
        <td class="py-3.5 px-3 align-middle whitespace-nowrap">
          <span class="inline-flex items-center px-2.5 py-1 rounded-full bg-[#E2F1F9] text-[#3A5988] text-[12px] font-semibold tabular-nums">${m.jumlah} alumni</span>
        </td>
        <td class="py-3.5 px-3 align-middle text-neutral2 break-words">${esc(formatDomisili(m.kota))}</td>
        <td class="py-3.5 pr-6 pl-3 align-middle text-right whitespace-nowrap">
          <div class="inline-flex items-center justify-end gap-2">
            <button type="button" data-edit-mitra="${esc(m.nama)}" class="btn-outline h-8 px-3 py-0 text-[12.5px]">
              <i data-lucide="pencil" class="w-3.5 h-3.5" aria-hidden="true"></i>
              <span>Edit</span>
            </button>
            <a href="${hrefAlumni}" class="btn-primary h-8 px-3 py-0 text-[12.5px]">
              <span>Lihat Daftar Alumni</span>
            </a>
          </div>
        </td>
      </tr>`;
  }

  function kartuMitraMobile(m) {
    const hrefAlumni = `data-alumni.html?mitra=${encodeURIComponent(m.nama)}`;
    return `
      <div class="p-4 space-y-3">
        <div class="flex items-start justify-between gap-3">
          <div class="flex items-center gap-3 min-w-0">
            ${logoMitra(m.nama)}
            <div class="min-w-0">
              <p class="!text-[14px] font-semibold text-headline break-words">${esc(m.nama)}</p>
              <p class="!text-[12.5px] text-neutral3 mt-0.5 break-words">${esc(formatDomisili(m.kota))}</p>
            </div>
          </div>
          <span class="shrink-0 inline-flex items-center px-2.5 py-1 rounded-full bg-[#E2F1F9] text-[#3A5988] text-[12px] font-semibold tabular-nums">${m.jumlah} alumni</span>
        </div>
        <div class="flex items-center gap-2 pt-0.5">
          <button type="button" data-edit-mitra="${esc(m.nama)}" class="btn-outline h-9 px-3 py-0 text-[12.5px] flex-1">
            <i data-lucide="pencil" class="w-3.5 h-3.5" aria-hidden="true"></i>
            <span>Edit</span>
          </button>
          <a href="${hrefAlumni}" class="btn-primary h-9 px-3 py-0 text-[12.5px] flex-[2]">
            <span>Lihat Daftar Alumni</span>
          </a>
        </div>
      </div>`;
  }

  function render() {
    const { list, totalAlumni } = kumpulkanMitra();
    const hasil = saringMitra(list);
    const jumlahHal = Math.max(1, Math.ceil(hasil.length / PER_HALAMAN));
    halaman = Math.min(halaman, jumlahHal);

    $('ringkasan').innerHTML = `<i data-lucide="building-2" class="w-4 h-4" aria-hidden="true"></i><span>${list.length} Mitra (${totalAlumni} Alumni)</span>`;
    $('jumlah-hasil').textContent = hasil.length === list.length ? `(${list.length} mitra)` : `(${hasil.length} dari ${list.length} mitra)`;

    const halamanIni = potong(hasil, halaman, PER_HALAMAN);
    const kosongHtml = list.length
      ? '<p class="!text-[15px] font-semibold text-headline">Mitra tidak ditemukan</p><p class="!text-[13px] mt-1">Ubah kata kunci pencarian untuk menampilkan mitra lainnya.</p>'
      : '<p class="!text-[15px] font-semibold text-headline">Belum ada data mitra</p><p class="!text-[13px] mt-1">Belum ada alumni yang mencantumkan tempat kerja di tracer study.</p>';

    $('daftar-mitra').innerHTML = hasil.length
      ? halamanIni.map(barisMitra).join('')
      : `<tr><td colspan="4" class="py-12 text-center text-neutral3">${kosongHtml}</td></tr>`;
    $('daftar-mitra-mobile').innerHTML = hasil.length
      ? halamanIni.map(kartuMitraMobile).join('')
      : `<div class="py-12 px-4 text-center text-neutral3">${kosongHtml}</div>`;

    const awal = hasil.length ? (halaman - 1) * PER_HALAMAN + 1 : 0;
    const akhir = Math.min(halaman * PER_HALAMAN, hasil.length);
    $('status-hasil').innerHTML = `Menampilkan <strong class="text-headline">${awal}–${akhir}</strong> dari ${hasil.length} mitra`;
    $('hal-posisi').textContent = `${halaman} / ${jumlahHal}`;
    $('hal-sebelum').disabled = halaman <= 1;
    $('hal-berikut').disabled = halaman >= jumlahHal;
    refreshIcons();
  }

  document.body.insertAdjacentHTML('beforeend', kerangkaModal(
    'modal-edit-mitra',
    'Edit Nama Mitra',
    `<input type="hidden" name="nama_lama">
     <div>
       <label for="f-nama-mitra" class="label">Nama Mitra <span class="text-red2">*</span></label>
       <input id="f-nama-mitra" name="nama_mitra" class="input" maxlength="150" required autocomplete="off" placeholder="Contoh: PT Tokopedia">
       <p id="info-edit-mitra" class="!text-[12.5px] text-neutral3 mt-2"></p>
     </div>`,
    'Simpan Perubahan',
    'max-w-md',
  ));

  const formEdit = document.querySelector('#modal-edit-mitra form');
  const inputNamaMitra = formEdit.elements.nama_mitra;
  const infoEditMitra = $('info-edit-mitra');

  function perbaruiInfoEdit() {
    const { list } = kumpulkanMitra();
    const lama = formEdit.elements.nama_lama.value;
    const baru = inputNamaMitra.value.trim();
    const sumber = list.find(m => m.nama === lama);
    const tujuan = baru && baru !== lama ? list.find(m => m.nama.toLowerCase() === baru.toLowerCase()) : null;
    if (tujuan) {
      infoEditMitra.innerHTML = `Nama <strong>${esc(tujuan.nama)}</strong> sudah terdaftar (${tujuan.jumlah} alumni). Menyimpan akan menggabungkan ${sumber?.jumlah || 0} alumni ke <strong>${esc(tujuan.nama)}</strong>.`;
    } else {
      infoEditMitra.textContent = `Perubahan ini akan memperbarui nama tempat kerja untuk ${sumber?.jumlah || 0} alumni terkait.`;
    }
  }

  inputNamaMitra.addEventListener('input', perbaruiInfoEdit);

  pasangForm(
    'modal-edit-mitra',
    'Nama mitra berhasil diperbarui.',
    fd => {
      const { list } = kumpulkanMitra();
      const lama = fd.get('nama_lama');
      const baruRaw = String(fd.get('nama_mitra') || '').trim();
      const tujuan = list.find(m => m.nama !== lama && m.nama.toLowerCase() === baruRaw.toLowerCase());
      return DB.tracer.ubahNamaMitra(lama, tujuan ? tujuan.nama : baruRaw);
    },
    () => render(),
  );

  function bukaEditMitra(nama) {
    bukaModalForm('modal-edit-mitra', { nama_lama: nama, nama_mitra: nama });
    perbaruiInfoEdit();
  }

  [$('daftar-mitra'), $('daftar-mitra-mobile')].forEach(el => el.addEventListener('click', e => {
    const btn = e.target.closest('[data-edit-mitra]');
    if (btn) bukaEditMitra(btn.dataset.editMitra);
  }));

  $('cari-mitra').addEventListener('input', () => { halaman = 1; render(); });
  $('hal-sebelum').addEventListener('click', () => { halaman--; render(); });
  $('hal-berikut').addEventListener('click', () => { halaman++; render(); });

  render();
</script>
</body>
</html>
