<!DOCTYPE html>
<html lang="id" data-role="admin">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mitra | Koordinator Bengkel Koding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/style.css?v=6">
  <script src="../alumni/assets/js/data.js?v=10"></script>
  <script src="../alumni/assets/js/app.js?v=11"></script>
  <script src="../alumni/assets/js/portal-layout.js"></script>
  <script src="../assets/js/page-skeleton.js?v=6"></script>
  <script src="../assets/js/main.js?v=5"></script>
  <style>
    @keyframes geser-masuk { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
    .geser-masuk { animation: geser-masuk .25s ease-out; }
    @media (prefers-reduced-motion: reduce) { .geser-masuk { animation: none; } }
  </style>
</head>
<body class="bg-white text-neutral1 antialiased font-sans">
<main data-title="Mitra">
  <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
    <div>
      <h1 class="!text-[26px] font-semibold text-headline tracking-[-0.01em]">Mitra</h1>
      <p class="!text-[13.5px] text-neutral3 mt-1">Instansi tempat alumni bekerja, dikumpulkan dari jawaban tracer study. Pilih mitra untuk melihat alumni yang bekerja di sana.</p>
    </div>
    <p id="ringkasan" class="!text-[13px] text-neutral3 shrink-0"></p>
  </div>

  <div class="relative max-w-xl">
    <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#91969C] pointer-events-none"><i data-lucide="search" class="w-4 h-4"></i></span>
    <input id="cari-mitra" type="search" autocomplete="off" aria-label="Cari mitra atau nama alumni" placeholder="Cari mitra atau nama alumni..."
           class="w-full h-10 pl-10 pr-3 rounded-[8px] border border-neutral4 bg-white text-[13.5px] text-neutral1 placeholder-[#91969C] focus:outline-none focus:border-primary1 focus:ring-2 focus:ring-primary1/15 transition-colors">
  </div>

  <!-- Layar lebar: daftar mitra (kiri) + tabel alumni di mitra terpilih (kanan). HP: daftar dulu, lalu tabel penuh. -->
  <div id="tata-letak">
    <section id="panel-daftar" aria-labelledby="judul-daftar">
      <h2 id="judul-daftar" class="sr-only">Daftar mitra</h2>
      <ul id="daftar-mitra"></ul>
    </section>
    <section id="panel-alumni" class="hidden min-w-0" aria-live="polite"></section>
  </div>
</main>

<script>
  const $ = id => document.getElementById(id);
  const tataLetak = $('tata-letak');
  const panelDaftar = $('panel-daftar');
  const daftarMitra = $('daftar-mitra');
  const panelAlumni = $('panel-alumni');
  const cariMitra = $('cari-mitra');

  // Mitra = instansi tempat alumni bekerja menurut tracer. Usaha milik sendiri (Wirausaha) tidak dihitung sebagai mitra.
  const PEKERJA = DB.tracer.semua().filter(t => DB.STATUS_BEKERJA.includes(DB.tracer.kategori(t)) && t.nama_job && t.jns_job !== 'Wirausaha');
  const MITRA = Object.values(PEKERJA.reduce((kelompok, t) => {
    (kelompok[t.nama_job] ||= { nama: t.nama_job, alumni: [] }).alumni.push(t);
    return kelompok;
  }, {}))
    .map(m => ({
      ...m,
      kota: [...new Set(m.alumni.map(t => t.kota).filter(Boolean))],
      alumni: m.alumni.sort((a, b) => a.nama_alumni.localeCompare(b.nama_alumni)),
    }))
    .sort((a, b) => b.alumni.length - a.alumni.length || a.nama.localeCompare(b.nama));

  // Nama mitra yang sedang dibuka. Layar lebar selalu split dan langsung membuka mitra pertama;
  // layar kecil mulai dari daftar mitra, lalu tabel alumni tampil penuh setelah satu mitra dipilih.
  const layarLebar = window.matchMedia('(min-width: 1024px)');
  let terpilih = '';

  const inisialMitra = nama => inisial(nama.replace(/^(PT|CV)\s+/i, ''));
  const logoMitra = (nama, ukuran = 'w-10 h-10') => `<span class="${ukuran} rounded-[10px] bg-primary5 text-primary1 font-semibold text-[13px] flex items-center justify-center shrink-0" aria-hidden="true">${esc(inisialMitra(nama))}</span>`;

  function mitraTersaring() {
    const kata = cariMitra.value.trim().toLowerCase();
    if (!kata) return MITRA;
    return MITRA.filter(m => m.nama.toLowerCase().includes(kata) || m.alumni.some(t => t.nama_alumni.toLowerCase().includes(kata)));
  }

  // ===================== DAFTAR MITRA =====================
  function barisMitra(m) {
    const aktif = m.nama === terpilih;
    return `
      <li>
        <button type="button" data-mitra="${esc(m.nama)}" ${aktif ? 'aria-current="true"' : ''} class="w-full flex items-center gap-3 px-4 py-3 text-left transition-colors cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-primary1/25 ${aktif ? 'bg-aktif' : 'hover:bg-neutral5'}">
          ${logoMitra(m.nama, 'w-9 h-9')}
          <span class="min-w-0 flex-1">
            <span class="block text-[13.5px] truncate ${aktif ? 'font-semibold text-headline' : 'font-medium text-neutral1'}">${esc(m.nama)}</span>
            <span class="block text-[12px] text-neutral3">${m.alumni.length} alumni</span>
          </span>
          <i data-lucide="chevron-right" class="w-4 h-4 shrink-0 ${aktif ? 'text-primary3' : 'text-[#91969C]'}" aria-hidden="true"></i>
        </button>
      </li>`;
  }

  function renderDaftar() {
    const hasil = mitraTersaring();
    const split = Boolean(terpilih);
    $('ringkasan').textContent = `${MITRA.length} mitra · ${PEKERJA.length} alumni`;

    tataLetak.className = 'grid grid-cols-1 lg:grid-cols-[minmax(0,20rem)_minmax(0,1fr)] gap-5 items-start';
    // HP: saat mitra dibuka, daftar disembunyikan dan tabel alumni tampil penuh
    panelDaftar.className = `${split ? 'hidden lg:flex' : 'flex'} flex-col bg-white border border-neutral4 rounded-[14px] shadow-sm overflow-hidden lg:sticky lg:top-20 lg:max-h-[calc(100vh-6.5rem)]`;
    daftarMitra.className = 'flex-1 overflow-y-auto overscroll-contain divide-y divide-neutral4';

    daftarMitra.innerHTML = !MITRA.length
      ? '<li class="px-4 py-10 text-center text-[13px] text-neutral3">Belum ada alumni yang mencantumkan tempat kerja di tracer study.</li>'
      : hasil.map(barisMitra).join('')
        || `<li class="px-4 py-10 text-center text-[13px] text-neutral3">Tidak ada mitra atau alumni yang cocok dengan "${esc(cariMitra.value.trim())}".</li>`;
    refreshIcons();
  }

  // ===================== ALUMNI DI MITRA TERPILIH =====================
  function kontak(href, ikon, label, luar = false) {
    return `<a href="${esc(href)}" ${luar ? 'target="_blank" rel="noreferrer"' : ''} aria-label="${label}" title="${label}" class="w-8 h-8 rounded-[8px] border border-neutral4 bg-white hover:bg-neutral5 text-neutral2 flex items-center justify-center transition-colors"><i data-lucide="${ikon}" class="w-4 h-4" aria-hidden="true"></i></a>`;
  }

  function barisAlumni(t) {
    const akun = DB.akun.cari(t.id_alumni) || { nama: t.nama_alumni };
    const pekerjaan = DB.cv.milik('jobs', t.id_alumni).find(j => j.nama_job === t.nama_job);
    const linkedin = tautanAman(t.linkedin);
    return `
      <tr class="hover:bg-[#F9FAFB] transition-colors">
        <td class="py-3.5 pl-5 pr-4">
          <div class="flex items-center gap-3">
            ${fotoBulat(akun, 'w-9 h-9')}
            <div class="min-w-0">
              <a href="profil-alumni.html?id=${t.id_alumni}" class="block font-semibold text-headline hover:text-primary1 truncate">${esc(t.nama_alumni)}</a>
              <span class="block text-[12px] text-neutral3">Angkatan ${esc(t.tahun_lulus)}</span>
            </div>
          </div>
        </td>
        <td class="py-3.5 px-4"><span class="inline-block px-2.5 py-1 rounded-[6px] text-[12px] font-medium bg-[#E2F1F9] text-[#3A5A86] whitespace-nowrap">${esc(t.jabatan_job || 'Belum diisi')}</span></td>
        <td class="py-3.5 px-4 text-neutral1 whitespace-nowrap">${esc(pekerjaan?.periode_masuk_job || '-')}</td>
        <td class="py-3.5 px-4 text-neutral1">${esc(t.kota || '-')}</td>
        <td class="py-3.5 px-4">
          <div class="flex gap-1.5">
            ${t.no_hp ? kontak(tautanWa(t.no_hp), 'phone', 'WhatsApp', true) : ''}
            ${t.email ? kontak(`mailto:${t.email}`, 'mail', 'Email') : ''}
            ${linkedin ? kontak(linkedin, 'external-link', 'LinkedIn', true) : ''}
          </div>
        </td>
        <td class="py-3.5 pr-5 pl-4 text-right"><a href="profil-alumni.html?id=${t.id_alumni}" class="text-[13px] font-medium text-primary1 hover:underline whitespace-nowrap">Lihat profil</a></td>
      </tr>`;
  }

  function renderAlumni({ animasi = false } = {}) {
    const m = MITRA.find(x => x.nama === terpilih);
    panelAlumni.classList.toggle('hidden', !m);
    if (!m) { panelAlumni.innerHTML = ''; return; }

    panelAlumni.innerHTML = `
      <h2 id="judul-mitra" tabindex="-1" class="sr-only">Alumni di ${esc(m.nama)}</h2>
      <!-- Nama mitra sudah tersorot di daftar kiri; di HP daftar tersembunyi, jadi cukup tombol kembali beserta namanya -->
      <div class="lg:hidden mb-4 flex items-center gap-3">
        <button type="button" data-tutup class="shrink-0 inline-flex items-center gap-1 h-9 px-3 rounded-[8px] border border-neutral4 bg-white hover:bg-neutral5 text-[13px] font-medium text-neutral1 transition-colors cursor-pointer">
          <i data-lucide="chevron-left" class="w-4 h-4" aria-hidden="true"></i><span>Daftar mitra</span>
        </button>
        <p class="!text-[14px] font-semibold text-headline truncate">${esc(m.nama)}</p>
      </div>
      <div class="bg-white border border-neutral4 rounded-[14px] shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-[13.5px]">
            <caption class="sr-only">Alumni yang bekerja di ${esc(m.nama)}</caption>
            <thead>
              <tr class="border-b border-neutral4 text-[13px] text-neutral3">
                <th class="py-3.5 pl-5 pr-4 font-medium min-w-[220px]">Nama</th>
                <th class="py-3.5 px-4 font-medium">Jabatan</th>
                <th class="py-3.5 px-4 font-medium whitespace-nowrap">Mulai bekerja</th>
                <th class="py-3.5 px-4 font-medium">Kota</th>
                <th class="py-3.5 px-4 font-medium">Kontak</th>
                <th class="py-3.5 pr-5 pl-4 font-medium text-right">Aksi</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-neutral4">${m.alumni.map(barisAlumni).join('')}</tbody>
          </table>
        </div>
        <div class="px-5 py-3 border-t border-neutral4 bg-[#FAFBFC] text-[12.5px] text-neutral3">${m.alumni.length} alumni bekerja di ${esc(m.nama)}</div>
      </div>`;
    if (animasi) {
      void panelAlumni.offsetWidth; // mulai ulang animasi saat pindah mitra
      panelAlumni.classList.add('geser-masuk');
    }
    refreshIcons();
  }

  // ===================== AKSI =====================
  function buka(nama) {
    terpilih = nama;
    history.replaceState(null, '', nama ? `?mitra=${encodeURIComponent(nama)}` : location.pathname);
    panelAlumni.classList.remove('geser-masuk');
    renderDaftar();
    renderAlumni({ animasi: Boolean(nama) });
    if (nama) {
      $('judul-mitra')?.focus({ preventScroll: true });
      if (!layarLebar.matches) window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  daftarMitra.addEventListener('click', e => {
    const b = e.target.closest('[data-mitra]');
    if (b) buka(b.dataset.mitra);
  });
  panelAlumni.addEventListener('click', e => {
    if (!e.target.closest('[data-tutup]')) return;
    const sebelumnya = terpilih;
    buka('');
    daftarMitra.querySelector(`[data-mitra="${CSS.escape(sebelumnya)}"]`)?.focus();
  });
  panelAlumni.addEventListener('animationend', () => panelAlumni.classList.remove('geser-masuk'));
  cariMitra.addEventListener('input', renderDaftar);

  // ?mitra=<nama> membuka mitra itu; ?alumni=<id> (tautan lama) membuka mitra tempat alumni tersebut bekerja
  const param = new URLSearchParams(location.search);
  const dariAlumni = PEKERJA.find(t => t.id_alumni === Number(param.get('alumni')))?.nama_job;
  terpilih = MITRA.some(m => m.nama === param.get('mitra')) ? param.get('mitra') : (dariAlumni || (layarLebar.matches ? MITRA[0]?.nama || '' : ''));
  renderDaftar();
  renderAlumni();

  // HP diputar atau jendela dilebarkan: layar lebar tidak pernah kembali ke kartu penuh
  layarLebar.addEventListener('change', () => {
    if (layarLebar.matches && !terpilih && MITRA.length) buka(MITRA[0].nama);
  });
</script>
</body>
</html>
